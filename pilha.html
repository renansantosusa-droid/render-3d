<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import { iniciar } from "/kit3d.js";
const K = await iniciar("pilha", { fundo: 0xe6e8ee, seed: 2905 });
const { THREE, scene, add, grupo, mat, vidro, brilho, V, sprite, texRuido, texMadeira, grade, prog, lin, entre, frac, clamp, C, F, P, T, rnd } = K;
const PI = Math.PI;

// ---------- mesa: pilha + fio + lâmpada ----------
add(new THREE.PlaneGeometry(20, 20), mat(0xffffff, { map: texMadeira("#a8784a", 6) }), 0, 0, 0).rotation.x = -PI / 2;
const pilha = grupo(0, .16, .2);
const capaM = mat(0x2a2a2e, { metalness: .2, roughness: .4 }); const capa = add(new THREE.CylinderGeometry(.15, .15, .62, 32), capaM, 0, 0, 0, pilha); capa.rotation.z = PI / 2;
const faixa = add(new THREE.CylinderGeometry(.152, .152, .2, 32), mat(0xe0a020), .12, 0, 0, pilha); faixa.rotation.z = PI / 2;
const botao = add(new THREE.CylinderGeometry(.05, .05, .04, 20), mat(0xc0c6cc, { metalness: .5 }), .33, 0, 0, pilha); botao.rotation.z = PI / 2; botao.scale.setScalar(.001);
const pontos = [V(.35, .16, .2), V(.6, .3, .2), V(.5, .8, 0), V(0, 1.0, -.1), V(-.5, .8, 0), V(-.6, .3, .2), V(-.33, .16, .2)];
const curva = new THREE.CatmullRomCurve3(pontos); const fio = add(new THREE.TubeGeometry(curva, 60, .015, 6), mat(0xd04a2a), 0, 0, 0); fio.visible = false;
const lampM = new THREE.MeshStandardMaterial({ color: 0xfff6d8, transparent: true, opacity: .5, emissive: 0xffd060, emissiveIntensity: 0 }); const lamp = add(new THREE.SphereGeometry(.12, 24, 16), lampM, 0, 1.05, -.1); lamp.visible = false;
const brilhoL = sprite(0xffe080); brilhoL.position.set(0, 1.05, -.1);
const eletronsFio = Array.from({ length: 24 }, () => ({ s: sprite(0xffd23a), f: rnd() }));
const controle = grupo(.9, .03, -.2); add(new THREE.BoxGeometry(.25, .05, .7), mat(0x2a2a2e), 0, 0, 0, controle); for (let i = 0; i < 9; i++) add(new THREE.CylinderGeometry(.025, .025, .02, 10), mat(0x5a5e66), -.06 + (i % 3) * .06, .03, -.15 + Math.floor(i / 3) * .1, controle); controle.visible = false;

// ---------- mini set: pilha em corte ----------
const BX = 100;
add(new THREE.PlaneGeometry(10, 10), mat(0x2a3240), BX, 0, -1); { const pl = new THREE.PointLight(0xffffff, 3, 8); pl.position.set(BX + 1, 2, 2.5); scene.add(pl); }
const corte = grupo(BX, 1.0, 0);
add(new THREE.CylinderGeometry(.42, .42, 1.6, 40, 1, true, 0, PI * 1.4), mat(0x2a2a2e, { side: THREE.DoubleSide }), 0, 0, 0, corte).rotation.y = PI * .55;
const manga = add(new THREE.CylinderGeometry(.4, .4, 1.5, 40, 1, false, 0, PI * 1.4), mat(0x1a1a1a, { roughness: 1 }), 0, 0, 0, corte); manga.rotation.y = PI * .55;
const barreira = add(new THREE.CylinderGeometry(.24, .24, 1.45, 40, 1, true, 0, PI * 1.4), mat(0xf4f4f4, { side: THREE.DoubleSide }), 0, 0, 0, corte); barreira.rotation.y = PI * .55;
const zinco = add(new THREE.CylinderGeometry(.22, .22, 1.4, 32), mat(0x9aa0a8, { roughness: .8, map: texRuido("#9aa0a8", 40, 3) }), 0, 0, 0, corte);
const eletronsZ = Array.from({ length: 30 }, () => ({ s: sprite(0xffd23a), f: rnd(), a: rnd() * PI * 2, r: rnd() * .2, y: (rnd() - .5) * 1.3 }));
const ions = Array.from({ length: 16 }, () => ({ s: sprite(0x8ac8ff), f: rnd(), a: rnd() * PI * 2, y: (rnd() - .5) * 1.2 }));
const lb = (txt, cor, x, y) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: K.rotulo(txt, cor, { tam: 64 }), transparent: true })); s.position.set(x, y, .6); s.scale.set(.6, .3, 1); scene.add(s); return s; };
const lZ = lb("ZINCO", "#c0c6cc", BX, 1.95), lM = lb("MANGANÊS", "#ffffff", BX, .05), lB = lb("BARREIRA", "#ffffff", BX + .45, 1.0);

K.camera_({
  geral: [V(1.5, 1.7, 3.7), V(0, .58, 0)],
  corte: [V(BX + .3, 1.3, 3.9), V(BX, 1.0, 0)],
  fim: [V(-1.5, 1.6, 3.6), V(0, .58, 0)],
}, [
  [0, "geral"], [F(1), "geral"], [C(2), "corte"], [F(3), "corte"], [C(4), "geral"], [F(4), "geral"], [C(5), "corte"], [F(6), "corte"], [C(7), "geral"], [T, "fim"],
]);

K.pronto((t) => {
  const em = (a, b) => entre(t, a, b);
  pilha.rotation.y = Math.sin(t * .5) * .1;
  // dentro: zinco cheio de elétrons, manganês quer
  const curto = em(P(3, "encostarem") - .3, P(3, "barreira") - .3);
  barreira.visible = !(t < P(3, "barreira") - .3); barreira.material.emissive = new THREE.Color(0xffffff); barreira.material.emissiveIntensity = em(P(3, "barreira") - .3, F(3)) ? .4 : 0;
  zinco.material.emissive = new THREE.Color(0xff3a10); zinco.material.emissiveIntensity = curto ? .5 + .3 * Math.sin(t * 9) : 0;
  const gasto = prog(t, P(6, "acaba") - .3, P(6, "morre")) * (t < P(6, "recarregavel") - .3 ? 1 : 1 - prog(t, P(6, "recarregavel") - .3, F(6)));
  zinco.scale.set(1 - .55 * gasto, 1, 1 - .55 * gasto);
  eletronsZ.forEach((e) => { const q = frac(t * .4 + e.f); const rr = curto ? e.r + q * .2 : e.r * (1 - .55 * gasto); e.s.position.set(BX + Math.cos(e.a + t) * rr, 1.0 + e.y, Math.sin(e.a + t) * rr + .3); e.s.scale.setScalar(.05); e.s.material.opacity = em(P(2, "eletrons") - .3, F(3)) || em(C(5), F(6)) ? .95 : 0; });
  ions.forEach((i) => { const q = frac(t * .6 + i.f); const r = .4 - q * .18; i.s.position.set(BX + Math.cos(i.a) * r, 1.0 + i.y, Math.sin(i.a) * r + .3); i.s.scale.setScalar(.045); i.s.material.opacity = em(P(3, "ions") - .3, F(3)) ? .9 : 0; });
  lZ.visible = em(P(2, "zinco") - .3, F(3)); lM.visible = em(P(2, "manganes") - .3, F(3)); lB.visible = em(P(3, "barreira") - .3, F(3));
  // circuito por fora
  const liga = t > P(4, "fio") - .3; fio.visible = lamp.visible = liga;
  const forca = 1 - .8 * (em(P(6, "acaba") - .3, P(6, "recarregavel") - .3) ? gasto : 0);
  lampM.emissiveIntensity = liga ? 1.4 * forca : 0; brilhoL.scale.setScalar(.6 * forca); brilhoL.material.opacity = liga ? .8 * forca : 0;
  const volta = em(P(6, "recarregavel") - .3, F(6));
  eletronsFio.forEach((e) => { const q = frac(t * .45 * (volta ? -1 : 1) + e.f + 10); e.s.position.copy(curva.getPointAt(volta ? 1 - q : q)); e.s.scale.setScalar(.04); e.s.material.color.set(volta ? 0x8ac8ff : 0xffd23a); e.s.material.opacity = liga && t < C(7) ? .95 : 0; });
  controle.visible = em(P(4, "controle") - .3, F(4)) || t > C(7);
  // acabamentos
  botao.scale.setScalar(Math.max(.001, prog(t, P(7, "botaozinho") - .3, P(7, "botaozinho") + .2)));
  capaM.metalness = t > P(7, "capa") - .3 ? .6 : .2; capaM.color.set(t > P(7, "capa") - .3 ? 0x9aa0a8 : 0x2a2a2e);
  K.cartoes(t, [
    [P(1, "pilha") - .3, F(1), "PILHA", "#ffffff"],
    [P(2, "solta") - .3, P(2, "manganes") - .3, "ZINCO: SOLTA ELÉTRONS", "#ffd23a"],
    [P(2, "receber") - .3, F(2), "MANGANÊS: QUER RECEBER", "#ffffff"],
    [P(3, "calor") - .4, P(3, "barreira") - .3, "SE ENCOSTAR: SÓ CALOR", "#ff4a3a"],
    [P(3, "ions") - .3, F(3), "PASSA ÍON, NÃO PASSA ELÉTRON", "#8ac8ff"],
    [P(4, "corrente") - .4, F(4), "CORRENTE ELÉTRICA", "#ffd23a"],
    [P(5, "alcalina") - .3, F(5), "PASTA ALCALINA", "#ffffff"],
    [P(6, "morre") - .3, P(6, "recarregavel") - .3, "ZINCO GASTO = PILHA MORTA", "#ff4a3a"],
    [P(6, "recarregavel") - .3, F(6), "RECARREGÁVEL: EMPURRA DE VOLTA", "#8ac8ff"],
  ]);
});
</script>
</body></html>
