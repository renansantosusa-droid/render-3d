<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:I;src:url(fonts/Inter-SemiBold.ttf);font-weight:600}
@font-face{font-family:I;src:url(fonts/Inter-Bold.otf);font-weight:800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{width:1920px;height:1080px;position:relative;overflow:hidden;font-family:I,sans-serif;font-weight:600}
.av{border-radius:50%;background:url(avatar.png) center/cover;flex:none}
.card{position:absolute;left:70px;bottom:90px;display:flex;align-items:center;gap:22px;background:#fff;border-radius:28px;padding:22px 30px 22px 22px;box-shadow:0 14px 40px rgba(0,0,0,.35);transform-origin:left bottom}
.ring{width:112px;height:112px;border-radius:50%;padding:5px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);flex:none}
.ring .av{width:100%;height:100%;border:4px solid #fff}
.t1{font-size:22px;color:#666;display:flex;align-items:center;gap:10px}
.t2{font-size:46px;font-weight:800;color:#111;letter-spacing:-1px}
.seg{margin-left:18px;min-width:196px;text-align:center;background:linear-gradient(90deg,#d62976,#962fbf);color:#fff;font-weight:800;font-size:28px;padding:16px 30px;border-radius:16px;position:relative;white-space:nowrap}
.seg.on{background:#efefef;color:#111}
.chip{position:absolute;left:70px;bottom:30px;background:rgba(0,0,0,.75);color:#fff;font-size:26px;padding:10px 22px;border-radius:30px;display:flex;gap:12px;align-items:center}
.chip b{color:#ff7ab8}
.cico{width:96px;height:96px;border-radius:50%;background:linear-gradient(45deg,#ff3d8b,#d62976);display:flex;align-items:center;justify-content:center;flex:none}
.cico svg{width:52px;height:52px}
.ct{font-size:40px;font-weight:800;color:#111;letter-spacing:-.5px}
.cs{font-size:28px;color:#d62976;display:flex;align-items:center;gap:8px;margin-top:4px}
.yt{position:absolute;left:50%;bottom:70px;display:flex;align-items:center;gap:18px;background:#fff;border-radius:80px;padding:16px 18px 16px 16px;box-shadow:0 14px 40px rgba(0,0,0,.35);transform-origin:center bottom}
.yt .av{width:92px;height:92px}
.nm{font-size:34px;font-weight:800;color:#0f0f0f;margin-right:6px;line-height:1.1;white-space:nowrap}
.nm small{display:block;font-size:20px;color:#606060;font-weight:600}
.btn{display:flex;align-items:center;gap:12px;height:76px;padding:0 28px;border-radius:40px;background:#f2f2f2;font-size:28px;color:#0f0f0f;position:relative;white-space:nowrap}
.btn svg{width:38px;height:38px}
.btn.sub{background:#cc0000;color:#fff;font-weight:800}
.btn.sub.on{background:#f2f2f2;color:#0f0f0f}
.btn.like.on{background:#0f0f0f;color:#fff}
.btn.like.on path{fill:#fff}
.hi{position:absolute;inset:-10px;border-radius:50px;border:6px solid #ff3d8b}
.burst{position:absolute;inset:-6px;border-radius:50px;border:6px solid #ff3d8b}
#cur{position:absolute;width:86px;height:86px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transform-origin:30% 10%}
</style></head><body><div id="ov"></div><svg id="cur" viewBox="0 0 24 24" style="display:none"><path fill="#fff" stroke="#000" stroke-width="1.2" d="M9 11V4.5a1.5 1.5 0 013 0V10l.1-1.6a1.5 1.5 0 013 .1V11l.1-1a1.4 1.4 0 012.8.2V12l.1-.6a1.3 1.3 0 012.6.2V16c0 3.3-2.7 6-6 6h-1.5a6 6 0 01-4.6-2.2L5 15.5a1.5 1.5 0 012.2-2L9 15z"/></svg>
<script>
const IG='<svg width="30" height="30" viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".4" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="url(#g)" stroke-width="2.4"/><circle cx="12" cy="12" r="4.6" fill="none" stroke="url(#g)" stroke-width="2.4"/><circle cx="17.6" cy="6.4" r="1.5" fill="#d62976"/></svg>';
const LIKE='<svg viewBox="0 0 24 24"><path fill="#0f0f0f" d="M2 21h4V9H2v12zM23 10c0-1.1-.9-2-2-2h-6.3l1-4.6v-.3c0-.4-.2-.8-.4-1.1L14.2 1 7.6 7.6C7.2 8 7 8.5 7 9v10c0 1.1.9 2 2 2h9c.8 0 1.5-.5 1.8-1.2l3-7.1c.1-.2.2-.5.2-.7v-2z"/></svg>';
const SHARE='<svg viewBox="0 0 24 24"><path fill="#0f0f0f" d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>';
const BELL='<svg viewBox="0 0 24 24"><path fill="#0f0f0f" d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.1-1.6-5.6-4.5-6.3V4c0-.8-.7-1.5-1.5-1.5S10.5 3.2 10.5 4v.7C7.6 5.4 6 7.9 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>';
const CMT=c=>`<svg viewBox="0 0 24 24"><path fill="${c}" d="M21 4H3c-.6 0-1 .4-1 1v12c0 .6.4 1 1 1h3v4l5-4h10c.6 0 1-.4 1-1V5c0-.6-.4-1-1-1z"/></svg>`;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const outBack=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const outCub=x=>1-Math.pow(1-x,3);
const ov=document.getElementById('ov'), cur=document.getElementById('cur');
let EV=[];
// clique: estado muda no instante tc; anel cresce e some em 0.45 s; contorno rosa fica 0.9 s
function clickFx(t,tc){if(t<tc)return '';let h='';const k=(t-tc)/0.45;if(k<1)h+=`<div class="burst" style="transform:scale(${1+0.35*k});opacity:${0.9*(1-k)}"></div>`;if(t-tc<0.9)h+='<div class="hi"></div>';return h}
function pop(t,tc){const k=(t-tc)/0.35;return (k>0&&k<1)?1+0.3*Math.sin(Math.PI*k):1}
function center(el){const r=el.getBoundingClientRect();return [r.left+r.width*0.55,r.top+r.height*0.6]}
// cursor: lista de [tempoClique, elemento]; chega 0.12 s antes e viaja 0.4 s
function cursor(t,ini,fim,alvos){
  if(!alvos.length||t<alvos[0][0]-0.6||t>fim){cur.style.display='none';return}
  let p=[1980,1150];const pts=[[alvos[0][0]-0.6,p],...alvos.map(([tc,el])=>[tc-0.12,center(el)])];
  let pos=pts[0][1];
  for(let i=1;i<pts.length;i++){const [tb,b]=pts[i],[ta,a]=pts[i-1];const t0=Math.max(ta,tb-0.42);
    if(t>=tb)pos=b;else if(t>t0){const k=outCub((t-t0)/(tb-t0));pos=[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}}
  let s=1;for(const [tc] of alvos){const d=t-tc;if(d>-0.08&&d<0.14)s=0.82}
  const fade=cl((fim-t)/0.3);
  cur.style.display='block';cur.style.opacity=fade;cur.style.left=(pos[0]-26)+'px';cur.style.top=(pos[1]-8)+'px';cur.style.transform=`scale(${s})`;
}
function setT(t){
  const e=EV.find(e=>t>=e.ini&&t<=e.fim);
  if(!e){ov.innerHTML='';cur.style.display='none';return}
  const a=cl((t-e.ini)/0.45), b=cl((e.fim-t)/0.35);
  const op=Math.min(outCub(cl(a*1.6)),outCub(b)), sc=0.7+0.3*outBack(a), dy=(1-b)*40;
  if(e.tipo==='ig'){
    const tc=e.ini+1.4, on=t>=tc;
    ov.innerHTML=`<div class="card" style="opacity:${op};transform:translateY(${dy}px) scale(${sc})"><div class="ring"><div class="av"></div></div><div><div class="t1">${IG} Me segue no Instagram</div><div class="t2">@veecriativos</div></div><div class="seg ${on?'on':''}" id="seg" style="transform:scale(${pop(t,tc)})">${on?'Seguindo':'Seguir'}${clickFx(t,tc)}</div></div>`
      +(e.chip?`<div class="chip" style="opacity:${op*cl((t-e.ini-0.5)/0.4)};transform:translateY(${(1-outCub(cl((t-e.ini-0.5)/0.4)))*20}px)"><b>&#9660;</b> ${e.chip}</div>`:'');
    cursor(t,e.ini,e.fim,[[tc,document.getElementById('seg')]]);
  }else if(e.tipo==='cmt'){
    const bob=Math.sin((t-e.ini)*7)*6;
    ov.innerHTML=`<div class="card" style="opacity:${op};transform:translateY(${dy}px) scale(${sc})"><div class="cico" style="transform:rotate(${Math.sin((t-e.ini)*5)*6}deg)">${CMT('#fff')}</div><div><div class="ct">${e.titulo}</div><div class="cs">${e.sub} <span style="display:inline-block;transform:translateY(${bob}px)">&#9660;</span></div></div></div>`;
    cur.style.display='none';
  }else{
    const L=t>=e.like,S=t>=e.sub,C=t>=e.cmt;
    const bell=(t>=e.sub&&t<e.sub+1.1)?Math.sin((t-e.sub)*30)*22*(1-(t-e.sub)/1.1):0;
    ov.innerHTML=`<div class="yt" style="opacity:${op};transform:translateX(-50%) translateY(${dy+(1-outCub(a))*30}px) scale(${sc})"><div class="av"></div><div class="nm">Vee Criativos<small>Foto ímã do zero</small></div>
     <div class="btn like ${L?'on':''}" id="bl"><span style="display:flex;transform:scale(${pop(t,e.like)})">${LIKE}</span>${L?'Gostei':'Gostei'}${clickFx(t,e.like)}</div>
     <div class="btn" id="bc"><span style="display:flex;transform:scale(${pop(t,e.cmt)})">${CMT('#0f0f0f')}</span>Comentar${clickFx(t,e.cmt)}</div>
     <div class="btn" id="bs"><span style="display:flex;transform:scale(${pop(t,e.share)})">${SHARE}</span>Compartilhar${clickFx(t,e.share)}</div>
     <div class="btn sub ${S?'on':''}" id="bi" style="transform:scale(${pop(t,e.sub)})">${S?`<span style="display:flex;transform-origin:50% 10%;transform:rotate(${bell}deg)">${BELL}</span>Inscrito`:'Inscrever-se'}${clickFx(t,e.sub)}</div></div>`;
    const g=id=>document.getElementById(id);
    cursor(t,e.ini,e.fim,[[e.like,g('bl')],[e.share,g('bs')],[e.sub,g('bi')],[e.cmt,g('bc')]]);
  }
}
window.setT=setT;window.setEV=v=>{EV=v};
</script></body></html>
