<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import { iniciar } from "/kit3d.js";
const K = await iniciar("fogaogas", { fundo: 0xe8dcc8, seed: 6161 });
const { THREE, scene, add, grupo, mat, vidro, brilho, V, sprite, texRuido, grade, prog, lin, pulse, entre, frac, clamp, C, F, P, T, rnd } = K;
const PI = Math.PI;
add(new THREE.PlaneGeometry(10, 6), mat(0xffffff, { map: grade("#eef2f0", "#cfd8d4", 64, 8) }), 0, 2, -1.2);
add(new THREE.BoxGeometry(6, .1, 3), mat(0xffffff, { map: texRuido("#d8d2c8", 20, 3) }), 0, -.05, 0);
// corpo do fogão (forno) e tampo
const forno = add(new THREE.BoxGeometry(1.4, .9, 1.0), mat(0xe8e8ea), 0, -.4, 0); forno.visible = false;
const portaF = add(new THREE.BoxGeometry(1.1, .55, .02), vidro(.6, 0x2a2a30), 0, -.4, .51); portaF.visible = false;
const tampo = add(new THREE.BoxGeometry(1.4, .02, 1.0), vidro(.55, 0x1a1a1e), 0, .41, 0); tampo.visible = false;
// cano de gás
const cano = add(new THREE.CylinderGeometry(.04, .04, 1.4, 16), mat(0xc8a040, { metalness: .4, roughness: .3 }), -.7, .3, 0); cano.rotation.z = PI / 2;
const valv = add(new THREE.CylinderGeometry(.07, .07, .1, 20), mat(0x8a8e96, { metalness: .4 }), -.9, .3, 0); valv.rotation.z = PI / 2;
const botao = add(new THREE.CylinderGeometry(.09, .09, .06, 24), mat(0x2a2a2a), -.9, .3, .14); botao.rotation.x = PI / 2; const marca = add(new THREE.BoxGeometry(.02, .07, .02), mat(0xffffff), -.9, .33, .18);
const bico = add(new THREE.ConeGeometry(.03, .1, 16), mat(0xc8a040, { metalness: .4 }), -.02, .3, 0); bico.rotation.z = -PI / 2;
const venturi = add(new THREE.CylinderGeometry(.05, .07, .35, 20, 1, true), vidro(.35, 0x9aa0a8), .18, .3, 0); venturi.rotation.z = PI / 2;
const subida = add(new THREE.CylinderGeometry(.06, .06, .12, 20), mat(0x8a8e96, { metalness: .4 }), .38, .37, 0);
// queimador (coroa)
const coroa = add(new THREE.CylinderGeometry(.16, .17, .05, 32), mat(0x3a3a3e, { metalness: .4 }), .38, .45, 0);
const tampaQ = add(new THREE.CylinderGeometry(.13, .13, .02, 32), mat(0x1a1a1e), .38, .485, 0);
const chamas = Array.from({ length: 18 }, (_, i) => { const a = i / 18 * PI * 2; const c = add(new THREE.ConeGeometry(.018, .09, 8), new THREE.MeshBasicMaterial({ color: 0x3a7aff, transparent: true, opacity: .9 }), .38 + Math.cos(a) * .165, .5, Math.sin(a) * .165); c.rotation.z = -Math.cos(a) * .5; c.rotation.x = Math.sin(a) * .5; return c; });
const chamaGrande = add(new THREE.ConeGeometry(.12, .5, 20), new THREE.MeshBasicMaterial({ color: 0xffa02a, transparent: true, opacity: .85 }), .0, .55, 0);
const luzG = new THREE.PointLight(0xffa040, 0, 3); luzG.position.set(.2, .7, .3); scene.add(luzG);
const panela = grupo(.38, .62, 0); add(new THREE.CylinderGeometry(.28, .24, .22, 32, 1, true), mat(0x9aa0a8, { metalness: .4, side: THREE.DoubleSide }), 0, .1, 0, panela); const fundoP = add(new THREE.CylinderGeometry(.24, .24, .015, 32), mat(0x8a9098, { metalness: .4 }), 0, 0, 0, panela);
const grades = [-1, 1].map((s) => add(new THREE.BoxGeometry(.9, .025, .025), mat(0x1a1a1a), .38, .53, s * .12)); grades.forEach((g2) => g2.visible = false);
const termo = add(new THREE.CylinderGeometry(.008, .008, .16, 8), mat(0x9aa0a8, { metalness: .4 }), .55, .5, .05); termo.rotation.z = .5; termo.visible = false; termo.material.emissive = new THREE.Color(0xff3a10);
const vela = add(new THREE.CylinderGeometry(.006, .006, .1, 8), mat(0xeeeeee), .2, .5, .1); vela.rotation.z = -.4; vela.visible = false;
const gas = Array.from({ length: 30 }, () => ({ s: sprite(0x7aff7a), f: rnd() }));
const ar = Array.from({ length: 16 }, () => ({ s: sprite(0xffffff), f: rnd(), y: rnd() }));
const vento = Array.from({ length: 14 }, () => ({ s: sprite(0xcfe8ff), f: rnd(), y: rnd() }));
const faisca = Array.from({ length: 10 }, () => ({ s: sprite(0xffe06a), f: rnd(), a: rnd() * PI * 2 }));

K.camera_({
  geral: [V(1.0, 1.6, 4.2), V(.1, .4, 0)],
  bico: [V(.15, .7, 2.0), V(.1, .32, 0)],
  coroa: [V(.7, 1.5, 2.2), V(.38, .45, 0)],
  botao: [V(-.6, .7, 2.0), V(-.6, .32, 0)],
  fim: [V(-1.8, 1.6, 4.0), V(0, .1, 0)],
}, [
  [0, "geral"], [F(2), "geral"], [C(3), "bico"], [F(3), "bico"], [C(4), "coroa"], [F(4), "coroa"], [C(5), "botao"], [P(5, "faisca") - .3, "coroa"], [F(5), "coroa"], [C(6), "coroa"], [F(6), "coroa"], [C(7), "geral"], [T, "fim"],
]);
K.pronto((t) => {
  const em = (a, b) => entre(t, a, b);
  const antigo = t < C(3);
  bico.visible = venturi.visible = subida.visible = coroa.visible = tampaQ.visible = !antigo;
  // cena 1-2: cano aberto, chama grande
  const apagou = t > P(2, "vento") - .2 && antigo;
  chamaGrande.visible = antigo && t > P(1, "fosforo") - .2 && !apagou; chamaGrande.scale.set(1, 1 + .15 * Math.sin(t * 20), 1); chamaGrande.position.x = 0;
  panela.visible = (t > P(2, "panela") - .4 && t < C(3)) || t > C(7); panela.position.x = antigo ? 0 : .38; fundoP.material.color.set(antigo && t > P(2, "queima") - .3 ? 0x1a1210 : 0x8a9098);
  vento.forEach((v) => { const k = frac(t * .9 + v.f); v.s.position.set(-1 + k * 1.6, .45 + v.y * .3, .2); v.s.scale.setScalar(.06); v.s.material.opacity = em(P(2, "vento") - .5, P(2, "gas") + .3) ? .7 * Math.sin(k * PI) : 0; });
  const vazando = em(P(2, "gas") - .3, C(3)) || em(P(6, "apagar") - .2, P(6, "corta") - .2);
  const fluindo = (em(C(3), F(5)) || em(C(6), P(6, "apagar")) || t > C(7)) && !antigo;
  gas.forEach((g2) => { const k = frac(t * 1.1 + g2.f); if (vazando) { g2.s.position.set(antigo ? k * .3 : .38 + (g2.f - .5) * .3, .45 + k * .5, .05); g2.s.scale.setScalar(.05); g2.s.material.opacity = .6 * (1 - k); } else { g2.s.position.set(-1.1 + k * 1.48, .3, 0); g2.s.scale.setScalar(.03); g2.s.material.opacity = fluindo && em(C(3), F(4)) ? .8 : 0; } });
  ar.forEach((a) => { const k = frac(t * .9 + a.f); a.s.position.set(.02 + k * .34, .3 + (1 - k) * (a.y - .5) * .25, .05); a.s.scale.setScalar(.03); a.s.material.opacity = em(P(3, "ar") - .4, F(4)) ? .8 : 0; });
  // chaminhas
  const acesa = (em(P(4, "coroa") - .3, P(6, "apagar") - .2) || t > C(7)) && !antigo;
  const tam = em(C(5), F(5)) ? (.6 + .6 * (.5 + .5 * Math.sin(t * 1.5))) : 1;
  chamas.forEach((c, i) => { c.visible = acesa; c.scale.set(1, tam * (1 + .2 * Math.sin(t * 25 + i)), 1); });
  luzG.intensity = (chamaGrande.visible ? 2 : 0) + (acesa ? 1.2 : 0);
  botao.rotation.y = 0; marca.position.set(-.9 + Math.sin(em(C(5), F(5)) ? t * 1.5 : 0) * .06, .33, .18);
  faisca.forEach((f) => { const k = frac(t * 3 + f.f); f.s.position.set(.2 + Math.cos(f.a) * k * .08, .52 + Math.sin(f.a) * k * .08, .1); f.s.scale.setScalar(.03); f.s.material.opacity = em(P(5, "tec") - .2, P(5, "faisca") + .5) && frac(t * 3) < .3 ? 1 : 0; });
  vela.visible = em(P(5, "tec") - .3, F(5)) || t > C(7);
  termo.visible = t > C(6) - .1; termo.material.emissiveIntensity = acesa ? .7 : Math.max(0, .7 - lin(t, P(6, "apagar"), P(6, "esfriou") + .3) * .7);
  // fim
  const fim = t > C(7) - .1; grades.forEach((g2) => g2.visible = fim && t > P(7, "grades") - .3); tampo.visible = fim && t > P(7, "vidro") - .3; forno.visible = portaF.visible = fim && t > P(7, "forno") - .3;
  cano.visible = valv.visible = botao.visible = !fim || t < P(7, "forno") - .3;
  K.cartoes(t, [
    [P(1, "fogo") - .3, F(1), "FOGO PRA COZINHAR 🔥", "#ffb04a"],
    [P(2, "forte") - .3, P(2, "vento") - .3, "FORTE DEMAIS", "#ff6a3a"],
    [P(2, "vento") - .3, P(2, "gas") - .3, "O VENTO APAGA…", "#cfe8ff"],
    [P(2, "gas") - .3, F(2), "…E O GÁS VAZA! ⚠️", "#7aff7a"],
    [P(3, "bico") - .3, F(3), "BICO FINO: GÁS + AR", "#ffffff"],
    [P(4, "coroa") - .3, F(4), "CADA FURINHO, UMA CHAMINHA", "#5aa0ff"],
    [P(5, "valvula") - .3, P(5, "tec") - .3, "BOTÃO = VÁLVULA", "#ffffff"],
    [P(5, "tec") - .3, F(5), "TEC TEC = FAÍSCA ⚡", "#ffe06a"],
    [P(6, "sensor") - .3, P(6, "esfriou") - .3, "SENSOR DENTRO DO FOGO", "#ff6a3a"],
    [P(6, "esfriou") - .3, F(6), "ESFRIOU → CORTA O GÁS", "#7ad07a"],
  ]);
});
</script>
</body></html>
