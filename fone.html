<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import { iniciar } from "/kit3d.js";
const K = await iniciar("fone", { fundo: 0x9cc8ea, seed: 1313 });
const { THREE, scene, add, grupo, mat, vidro, brilho, V, sprite, grade, texRuido, texMadeira, prog, lin, pulse, entre, frac, clamp, C, F, P, T, rnd } = K;
const PI = Math.PI;

// ---------- rua + cabeça ----------
add(new THREE.PlaneGeometry(40, 40), mat(0xffffff, { map: texRuido("#7a7f88", 30, 20), roughness: 1 }), 0, 0, 0).rotation.x = -Math.PI / 2;
add(new THREE.PlaneGeometry(40, 1.5), mat(0xffffff, { map: texRuido("#d8d2c4", 20, 10) }), 0, .001, 1.3).rotation.x = -Math.PI / 2;
const pele = mat(0xe8b48a, { roughness: .7 });
const cabeca = grupo(0, 1.5, 0);
add(new THREE.SphereGeometry(.42, 40, 30), pele, 0, 0, 0, cabeca).scale.set(.85, 1.05, 1);
add(new THREE.SphereGeometry(.43, 40, 30, 0, PI * 2, 0, PI * .45), mat(0x3a2414, { roughness: .9 }), 0, .03, -.02, cabeca).scale.set(.87, 1.05, 1.02);
add(new THREE.CylinderGeometry(.13, .15, .4, 20), pele, 0, -.5, 0, cabeca);
add(new THREE.BoxGeometry(.7, .3, .35), mat(0x3a6ac8), 0, -.8, 0, cabeca);
add(new THREE.ConeGeometry(.05, .12, 12), pele, 0, -.02, .42, cabeca).rotation.x = PI / 2;
[-.12, .12].forEach((x) => { add(new THREE.SphereGeometry(.035, 16, 12), mat(0xffffff), x, .08, .36, cabeca); add(new THREE.SphereGeometry(.018, 12, 8), mat(0x2a1a0a), x, .08, .39, cabeca); });
const boca = add(new THREE.TorusGeometry(.05, .012, 8, 20, PI), mat(0xb04a4a), 0, -.17, .37, cabeca); boca.rotation.z = PI;
const orelhas = [-1, 1].map((s) => { const o = add(new THREE.TorusGeometry(.07, .03, 10, 24), pele, s * .37, 0, -.02, cabeca); o.rotation.y = PI / 2; o.scale.set(1, 1.4, 1); return o; });
const mDor = new THREE.MeshBasicMaterial({ color: 0xff2a2a, transparent: true, opacity: 0, depthWrite: false });
const dor = add(new THREE.SphereGeometry(.11, 16, 12), mDor, .38, 0, -.02, cabeca);
const fones = [-1, 1].map((s) => add(new THREE.SphereGeometry(.045, 16, 12), mat(0xf4f4f4, { roughness: .3 }), s * .4, 0, -.02, cabeca));
const pads = [-1, 1].map((s) => { const p = add(new THREE.CapsuleGeometry(.04, .06, 6, 12), mat(0x2a2f38, { roughness: .4 }), s * .38, -.0, .13, cabeca); p.rotation.x = PI / 2; return p; });
const haste = add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(-.38, -.0, .13), V(-.42, -.1, -.1), V(-.3, -.22, -.38), V(0, -.25, -.45), V(.3, -.22, -.38), V(.42, -.1, -.1), V(.38, 0, .13)]), 60, .014, 8), mat(0x6a7078, { metalness: .9, roughness: .25 }), 0, 0, 0, cabeca);
const extras = [["BATERIA", -.42, -.15, -.15], ["BLUETOOTH", .42, -.15, -.15], ["MIC", .4, -.08, .2]].map(([n, x, y, z]) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: K.rotulo(n, "#ffffff", { fundo: "rgba(20,26,36,.85)", tam: 70 }), transparent: true, depthTest: false })); s.position.set([-.2, .2, 0][["BATERIA", "BLUETOOTH", "MIC"].indexOf(n)], [.66, .66, .54][["BATERIA", "BLUETOOTH", "MIC"].indexOf(n)], .2); s.scale.set(.26, .13, 1); cabeca.add(s); s.renderOrder = 9; return s; });
const vib = Array.from({ length: 3 }, (_, i) => { const m = add(new THREE.TorusGeometry(.05, .006, 6, 24), new THREE.MeshBasicMaterial({ color: 0xffd23a, transparent: true, opacity: 0 }), .4, 0, .13, cabeca); m.rotation.y = PI / 2; m.userData.f = i / 3; return m; });
// carro
const carro = grupo(4, 0, 1.3); add(new THREE.BoxGeometry(1.1, .35, .55), mat(0xe03a3a), 0, .3, 0, carro); add(new THREE.BoxGeometry(.6, .25, .5), mat(0xc82a2a), -.05, .58, 0, carro); [[-.35, .28], [.35, .28], [-.35, -.28], [.35, -.28]].forEach(([x, z]) => add(new THREE.CylinderGeometry(.11, .11, .06, 16), mat(0x1a1a1a), x, .11, z, carro).rotation.x = PI / 2);
const buzina = Array.from({ length: 4 }, (_, i) => { const m = add(new THREE.TorusGeometry(.2, .012, 6, 30, PI), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }), 0, .6, 0, carro); m.rotation.z = PI / 2; m.userData.f = i / 4; return m; });
// vizinho (pra vazamento)
const viz = grupo(-.85, 1.35, .35); add(new THREE.SphereGeometry(.2, 24, 18), pele, 0, 0, 0, viz); add(new THREE.SphereGeometry(.205, 24, 18, 0, PI * 2, 0, PI * .45), mat(0x8a5a2a), 0, .02, 0, viz); add(new THREE.BoxGeometry(.4, .5, .25), mat(0x3aaa5a), 0, -.45, 0, viz); viz.visible = false;
const vaza = Array.from({ length: 16 }, () => ({ s: sprite(0xffd23a), f: rnd() }));

// ---------- mini set: o ouvido por dentro ----------
const QX = 100, QY = 1.4;
add(new THREE.PlaneGeometry(10, 10), mat(0x1c232e), QX, 1, -.6);
const osso = add(new THREE.BoxGeometry(1.5, 1.6, .2), mat(0xffffff, { map: texRuido("#e8dcc0", 40, 2) }), QX + .35, QY, -.3);
const canal = add(new THREE.BoxGeometry(.9, .18, .21), mat(0x2a1a14), QX - .2, QY, -.29);
add(new THREE.BoxGeometry(.6, .5, .22), new THREE.MeshStandardMaterial({ color: 0xe8b48a }), QX - .75, QY, -.3);
const timpano = add(new THREE.CylinderGeometry(.12, .12, .015, 24), mat(0xff9a8a), QX + .25, QY, -.18); timpano.rotation.z = PI / 2;
const coclea = add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(Array.from({ length: 60 }, (_, i) => { const a = i * .3, r = .22 - i * .0032; return V(QX + .62 + Math.cos(a) * r, QY - .05 + Math.sin(a) * r, -.15); })), 200, .03, 8), new THREE.MeshStandardMaterial({ color: 0x8ac8ff, emissive: 0x3a8aff, emissiveIntensity: 0 }));
const cerebro = add(new THREE.SphereGeometry(.18, 20, 14), mat(0xf0a0b8), QX + .75, QY + .62, -.15);
const nervo = new THREE.CatmullRomCurve3([V(QX + .62, QY - .05, -.1), V(QX + .85, QY + .25, -.1), V(QX + .75, QY + .5, -.1)]);
add(new THREE.TubeGeometry(nervo, 30, .012, 6), mat(0xffd23a));
const sinalN = K.fluxo(nervo, 8, 0xffe23a);
const fonteDentro = add(new THREE.SphereGeometry(.07, 16, 12), mat(0xf4f4f4), QX - .42, QY, -.18);
const fonteFora = add(new THREE.BoxGeometry(.12, .2, .1), mat(0x2a2f38), QX + .05, QY - .52, -.12);
const ondasAr = Array.from({ length: 12 }, () => ({ s: sprite(0x5aa0ff), f: rnd(), y: (rnd() - .5) * .12 }));
const ondasOsso = Array.from({ length: 24 }, () => ({ s: sprite(0xffd23a), f: rnd(), a: rnd() }));
const lbl = (txt, cor, x, y) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: K.rotulo(txt, cor, { tam: 70 }), transparent: true })); s.position.set(x, y, 0); s.scale.set(.5, .25, 1); scene.add(s); return s; };
const lTimp = lbl("TÍMPANO", "#ff9a8a", QX + .25, QY + .25), lCoc = lbl("CÓCLEA", "#8ac8ff", QX + .62, QY - .38);
// ---------- mini set: o transdutor ----------
const RX = 200, RY = 1.4;
add(new THREE.PlaneGeometry(10, 10), mat(0x1c232e), RX, 1, -.8);
add(new THREE.BoxGeometry(.5, .25, .3), mat(0xe03a3a), RX, RY + .3, 0); add(new THREE.BoxGeometry(.5, .25, .3), mat(0x3a6ac8), RX, RY + .05, 0);
const bob = add(new THREE.TorusGeometry(.2, .05, 12, 32), mat(0xc87a3a, { metalness: .7 }), RX, RY - .15, 0); bob.rotation.x = PI / 2;
const placa = add(new THREE.BoxGeometry(.7, .04, .4), mat(0xc0c6cc, { metalness: .8 }), RX, RY - .3, 0);
const ossoR = add(new THREE.BoxGeometry(1.4, .4, .5), mat(0xffffff, { map: texRuido("#e8dcc0", 40, 2) }), RX, RY - .58, 0);
const lOsso = lbl("OSSO", "#5a4a30", RX + .45, RY - .58); lOsso.position.z = .4;
const anel = Array.from({ length: 4 }, (_, i) => { const m = add(new THREE.TorusGeometry(.1, .01, 6, 30), new THREE.MeshBasicMaterial({ color: 0xffd23a, transparent: true, opacity: 0 }), RX, RY - .4, .26); m.userData.f = i / 4; return m; });

K.camera_({
  cabeca: [V(1.45, 1.7, 2.2), V(.05, 1.4, 0)],
  orelha: [V(1.35, 1.6, .9), V(.3, 1.48, 0)],
  rua: [V(1.6, 1.4, 3.6), V(.6, 1.0, .6)],
  ouvido: [V(QX + .15, QY + .1, 4.9), V(QX + .05, QY + .05, 0)],
  transd: [V(RX + .3, RY + .1, 3.7), V(RX, RY - .15, 0)],
  frente: [V(.2, 1.55, 2.0), V(0, 1.4, 0)],
  vaza: [V(-.2, 1.6, 2.6), V(-.4, 1.4, 0)],
  fim: [V(-1.5, 1.75, 2.5), V(0, 1.4, 0)],
}, [
  [0, "ouvido"], [P(2, "carro") - .5, "ouvido"], [P(2, "carro") - .45, "rua"], [P(2, "horas") - .4, "rua"], [P(2, "horas") - .35, "orelha"], [F(2), "orelha"],
  [C(3), "cabeca"], [F(3), "orelha"], [C(4), "transd"], [F(4), "transd"], [C(5), "ouvido"], [F(6), "ouvido"],
  [C(7), "vaza"], [P(7, "titanio") - .4, "vaza"], [P(7, "titanio"), "cabeca"], [F(7), "cabeca"], [C(8), "cabeca"], [T, "fim"],
]);

K.pronto((t) => {
  const em = (a, b) => entre(t, a, b);
  const dentro = t < C(3);
  fones.forEach((f) => f.visible = dentro); fonteDentro.visible = t < C(3);
  pads.forEach((p) => p.visible = !dentro); fonteFora.visible = t > C(5) - .1 && t < C(6);
  haste.visible = t > P(7, "haste") - .3;
  extras.forEach((s, i) => s.visible = t > P(8, ["bateria", "bluetooth", "microfone"][i]) - .3);
  mDor.opacity = em(P(2, "doi") - .3, C(3)) ? .35 + .2 * Math.sin(t * 8) : 0;
  // carro passando
  carro.position.x = 4 - 5 * lin(t, P(2, "carro") - .5, P(2, "horas"));
  buzina.forEach((b) => { const k = frac(t * 1.5 + b.userData.f); b.scale.setScalar(1 + k * 3); b.material.opacity = em(P(2, "escuta") - .2, P(2, "horas")) ? .7 * (1 - k) : 0; });
  // ouvido: ondas pelo ar (fone dentro) ou pelo osso (fone fora)
  ondasAr.forEach((o) => { const k = frac(t * .9 + o.f); o.s.position.set(QX - .4 + k * .62, QY + o.y, -.15); o.s.scale.setScalar(.04); o.s.material.opacity = (t < C(2) || em(P(6, "gravacao") - .3, F(6))) ? .9 : 0; });
  timpano.scale.y = 1; timpano.position.x = QX + .25 + ((t < C(2) || em(P(6, "gravacao") - .3, F(6))) ? Math.sin(t * 40) * .01 : 0);
  ondasOsso.forEach((o) => { const k = frac(t * .7 + o.f); const ini = em(C(6), P(6, "gravacao") - .3) ? V(QX + .1, QY - .75, -.15) : V(QX + .05, QY - .42, -.15); const fim = V(QX + .62 + (o.a - .5) * .2, QY - .05 + (o.a - .5) * .2, -.12); o.s.position.lerpVectors(ini, fim, k); o.s.scale.setScalar(.045); o.s.material.opacity = em(C(5), P(6, "gravacao") - .3) ? .9 * Math.sin(k * PI) : 0; });
  coclea.material.emissiveIntensity = em(P(5, "coclea") - .3, P(6, "gravacao") - .3) || t < C(2) || em(P(6, "gravacao") - .3, F(6)) ? .5 + .3 * Math.sin(t * 12) : 0;
  sinalN.atualiza(t, em(P(5, "cerebro") - .5, F(6)) || t < C(2), .8, .04);
  lTimp.visible = em(P(5, "timpano") - .3, F(5)) || t < C(2); lCoc.visible = em(P(5, "coclea") - .3, F(5));
  // transdutor vibrando
  const vibra = em(P(4, "vibra") - .2, F(4));
  placa.position.y = RY - .3 + (vibra ? Math.sin(t * 90) * .015 : 0); bob.position.y = RY - .15 + (vibra ? Math.sin(t * 90) * .008 : 0);
  anel.forEach((a) => { const k = frac(t * 1.3 + a.userData.f); a.scale.setScalar(1 + k * 5); a.material.opacity = em(P(4, "osso") - .5, F(4)) ? .8 * (1 - k) : 0; });
  vib.forEach((a) => { const k = frac(t * 1.3 + a.userData.f); a.scale.setScalar(1 + k * 2.5); a.material.opacity = (em(P(3, "osso") - .3, F(3)) || t > C(8)) ? .8 * (1 - k) : 0; });
  // falando (cena 6) -> boca mexe
  boca.scale.y = em(C(6), F(6)) ? 1 + .5 * Math.abs(Math.sin(t * 9)) : 1;
  // vazamento
  viz.visible = em(C(7), P(7, "titanio"));
  const vazando = em(P(7, "escapa") - .3, P(7, "titanio"));
  vaza.forEach((v) => { const k = frac(t * .8 + v.f); v.s.position.set(.38 * (1 - k) - .7 * k, 1.5 + (v.f - .5) * .2, .13 + k * .25); v.s.scale.setScalar(.03); v.s.material.opacity = vazando ? .8 * (1 - k) : 0; });
  K.cartoes(t, [
    [P(1, "altofalante") - .3, F(1), "ALTO-FALANTE NO OUVIDO", "#ffffff"],
    [P(2, "tampa") - .3, P(2, "carro") - .5, "TAMPA O OUVIDO", "#ff9a5a"],
    [P(2, "carro") - .45, P(2, "horas") - .4, "NÃO ESCUTA O CARRO", "#ff4a3a"],
    [P(2, "doi") - .3, F(2), "DÓI!", "#ff4a3a"],
    [P(3, "osso") - .4, F(3), "ENCOSTADO NO OSSO", "#ffd23a"],
    [P(4, "ima") - .3, P(4, "sacodem") - .1, "ÍMÃ + BOBINA", "#c87a3a"],
    [P(4, "milhares") - .3, F(4), "VIBRA MILHARES DE VEZES/S", "#ffd23a"],
    [P(5, "coclea") - .3, P(5, "transforma") - .3, "CÓCLEA", "#8ac8ff"],
    [P(5, "timpano") - .3, F(5), "O TÍMPANO FICA DE FORA", "#ff9a8a"],
    [P(6, "estranha") - .5, P(6, "gravacao") - .3, "VOCÊ SE OUVE PELOS OSSOS", "#ffd23a"],
    [P(6, "gravacao") - .3, F(6), "GRAVAÇÃO: SÓ PELO AR", "#5aa0ff"],
    [P(7, "baixinho") - .4, P(7, "titanio") - .4, "QUEM TÁ DO LADO ESCUTA", "#ff9a5a"],
    [P(7, "titanio") - .3, F(7), "HASTE DE TITÂNIO", "#c0c6cc"],
  ]);
});
</script>
</body></html>
