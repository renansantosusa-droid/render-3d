<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Nunito:wght@600;700;800;900&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// "Os Detetives do Recreio" — Episódio 2: O Sagui (infantil, 2D detalhado)
import { kit2d } from "/cena2d.js";
const TEMPOS = await (await fetch("/detetives2/tempos.json")).json();
const W = 1080, H = 1920, cv = document.getElementById("c"), g = cv.getContext("2d");
const K = kit2d(g, W, H);
const { clamp, rr, rect, circ, elip, txt, glow, vinheta, tinta, camera, pessoa, adesivo, balao } = K;
const prog = (t, a, b) => K.ease(clamp((t - a) / (b - a), 0, 1)), lin = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const CENA = (n) => TEMPOS.cenas[n - 1], C = (n) => CENA(n).ini, F = (n) => CENA(n).fim;
function P(n, w, o = 1) { let k = 0; for (const p of CENA(n).palavras) if (norm(p.w) === norm(w) && ++k === o) return p.t; console.error("palavra nao achada", n, w); return C(n); }
const FALA = TEMPOS.fala;
const piscar = (t, f = 0) => ((t + f) % 3.3) < .12 ? .1 : 1;
const LEO = { sexo: "m", cabelo: "#2a1a10", roupa: "#3a7ac0", calca: "#2e3a52", pele: "#c88a5a", bone: "#e0782a" };
const BIA = { sexo: "f", cabelo: "#3a2414", roupa: "#9a4ad0", calca: "#2e3a52", pele: "#e3a77f", oculos: true, tranca: true };
const MEL = { sexo: "f", cabelo: "#8a4a2a", roupa: "#e04a8a", calca: "#3a4a8a", pele: "#f0c0a0", chiquinhas: true };
const DAVI = { sexo: "m", cabelo: "#1a1410", roupa: "#4ab04a", calca: "#2e3a52", pele: "#a86a44" };
const RAFA = { sexo: "m", cabelo: "#c89a4a", roupa: "#e0c040", calca: "#3a3a5a", pele: "#f0c0a0" };
const CHAO = 1200;
const KID = .78;

// ---------- legenda ----------
const CHAVE = { sagui: "#c8905a", gosta: "#ffb030", macaquinho: "#c8905a", resolvido: "#6ad06a", inocente: "#6ad06a", desculpa: "#6ad06a", prova: "#ffb030", silvestre: "#ff6a5a", apito: "#5ab0ff", interrogacao: "#5ab0ff",  pistas: "#ffb030", pista: "#ffb030", bolo: "#a0603a", chocolate: "#a0603a", davi: "#6ad06a", bia: "#c08af0", leo: "#ff9a40", mel: "#ff7ab0", migalhas: "#ffb030", janela: "#6ab8f0", pelinho: "#c8905a", bicho: "#ff6a5a", pegadas: "#ffb030", rafinha: "#ffd84a", arvore: "#6ad06a", mastigando: "#ff6a5a", vazia: "#ff6a5a", detetives: "#ffb030", recreio: "#ffb030" };
const blocos = []; for (const c of TEMPOS.cenas) { const ws = c.palavras; for (let i = 0; i < ws.length; i += 3) blocos.push({ t: ws[i].t, ws: ws.slice(i, i + 3).map((p) => p.w.replace(/[.,!?;:"]+$/, "")) }); }
function legenda(t, y = 1620) {
  if (t > FALA + .2) return; let b = null; for (const x of blocos) if (t >= x.t) b = x; if (!b) return;
  let fs = 78; g.font = "900 78px Nunito"; const ps = b.ws.map((w) => w.toUpperCase()); let tot = ps.reduce((a, w) => a + g.measureText(w + " ").width, 0); if (tot > W - 80) { fs = Math.floor(78 * (W - 80) / tot); g.font = `900 ${fs}px Nunito`; } const larg = ps.map((w) => g.measureText(w + " ").width); let x = W / 2 - larg.reduce((a, c) => a + c, 0) / 2;
  const k = Math.min(1, (t - b.t) / .1);
  ps.forEach((w, i) => { g.textAlign = "left"; g.textBaseline = "middle"; g.lineWidth = 14; g.strokeStyle = "#2a1a40"; g.lineJoin = "round"; g.strokeText(w, x, y + (1 - k) * 12); g.fillStyle = CHAVE[norm(w)] || "#fff"; g.fillText(w, x, y + (1 - k) * 12); x += larg[i]; });
}
function marca(t) { if (t > FALA + .3) return; g.save(); g.shadowColor = "rgba(0,0,0,.6)"; g.shadowBlur = 8; txt("🔍 Os Detetives do Recreio", 50, 110, 40, "#fff", 900, "left", "Nunito"); txt("EPISÓDIO 2", 104, 158, 26, "#ffb030", 800, "left", "Nunito"); g.restore(); }
function pista(n, s, a) { if (a <= 0) return; g.save(); g.globalAlpha = Math.min(1, a * 1.4); g.translate(W / 2, 360); g.rotate(-.04); g.scale(.82 + .18 * a, .82 + .18 * a); g.shadowColor = "rgba(0,0,0,.35)"; g.shadowBlur = 18; g.font = "900 64px Nunito"; const w = g.measureText(s).width + 80; rr(-w / 2, -52, w, 104, 22, "#fffaf0"); g.shadowColor = "transparent"; rr(-120, -100, 240, 50, 16, "#ff9a30"); txt(`🔎 PISTA #${n}`, 0, -75, 30, "#fff", 900, "center", "Nunito"); txt(s, 0, 4, 64, "#2a1a40", 900, "center", "Nunito"); g.restore(); }
function nome(s, sub, x, y, cor, a) { if (a <= 0) return; g.save(); g.globalAlpha = a; g.font = "900 46px Nunito"; const w = Math.max(g.measureText(s).width, g.measureText(sub).width * .6) + 60; rr(x - w / 2, y - 44, w, 88, 24, cor); txt(s, x, y - 8, 46, "#fff", 900, "center", "Nunito"); txt(sub, x, y + 26, 22, "#fff", 800, "center", "Nunito"); g.restore(); }
function bolo(x, y, s = 1) { g.save(); g.translate(x, y); g.scale(s, s); elip(0, 10, 120, 24, "#e8e8e8"); rr(-100, -80, 200, 90, 16, "#6a3a1a"); rr(-100, -96, 200, 34, 16, "#4a2410"); for (let i = 0; i < 6; i++) elip(-80 + i * 32, -66, 10, 16, "#4a2410"); for (let i = 0; i < 8; i++) circ(-80 + i * 23, -98, 6, ["#e04a4a", "#ffd84a", "#4ab0e0", "#e04a8a"][i % 4]); g.restore(); }
function vasilha(x, y, s = 1) { g.save(); g.translate(x, y); g.scale(s, s); rr(-110, -70, 220, 80, 16, "rgba(200,230,255,.6)"); g.strokeStyle = "#8ab0d0"; g.lineWidth = 6; g.strokeRect(-110, -70, 220, 80); for (let i = 0; i < 10; i++) circ(-80 + (i * 37) % 160, -10 - (i * 13) % 30, 5, "#4a2410"); g.restore(); }
function lupa(x, y, s, a = -.6) { g.save(); g.translate(x, y); g.rotate(a); g.scale(s, s); rr(-12, 40, 24, 120, 10, "#8a4a2a"); g.strokeStyle = "#ffb030"; g.lineWidth = 16; g.beginPath(); g.arc(0, 0, 60, 0, 6.283); g.stroke(); g.fillStyle = "rgba(200,235,255,.35)"; g.fill(); g.restore(); }
function close(o, s, cy, x = W / 2) { g.save(); g.translate(x, cy + 330 * s - 400); g.scale(s, s); pessoa(0, 0, 1, o); g.restore(); }

const PROF = { sexo: "f", cabelo: "#5a3a2a", roupa: "#e07a5a", calca: "#3a3a5a", pele: "#d39a72" };
const AMB = { sexo: "m", cabelo: "#2a1a10", roupa: "#4a8a4a", calca: "#3a4a3a", pele: "#c88a5a", bone: "#3a6a3a" };
function zoomArvore(t, z) { g.save(); g.translate(W / 2, 800); g.scale(z, z); g.translate(-Math.min(904, 1080 - 540 / z), -Math.max(520, 800 / z)); K.salaDeAula(CHAO, t, { janelaX: 760 }); g.restore(); }
function mata(t) { g.fillStyle = "#bfe4f6"; g.fillRect(0, 0, W, H); for (let i = 0; i < 7; i++) K.arvore(80 + i * 160, 1300 + (i % 2) * 40, 1.1 + (i % 3) * .2, t); rect(0, 1300, W, 620, "#6aa84a"); }
window.renderFrame = (t) => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.filter = "none";
  const em = (a, b) => t >= a && t < b;
  if (t < C(2)) { // CENA 1
    zoomArvore(t, 2.6); g.save(); g.filter = "brightness(0.15)"; K.sagui(560, 820, 2.6, t); g.restore(); circ(539, 737, 11, "#ffe85a"); circ(581, 737, 11, "#ffe85a"); vinheta(.5);
    pista("", "DESCUBRA DO QUE ELE GOSTA", prog(t, P(1, "descubra") - .3, P(1, "descubra")));
  } else if (t < C(3)) { // CENA 2: é um sagui!
    if (t < P(2, "bia") - .2) { zoomArvore(t, 2.6); g.filter = "brightness(0.15)"; K.sagui(560, 820, 2.6, t); g.filter = "none"; circ(539, 737, 11, "#ffe85a"); circ(581, 737, 11, "#ffe85a"); }
    else if (t < P(2, "sagui") - .3) { K.salaDeAula(CHAO, t); close({ ...BIA, expr: "desconfiada", olhar: 1, braco: 2.6 }, 1.9, 1520); }
    else { zoomArvore(t, 2.6); K.sagui(560, 820, 2.6, t); nome("É UM SAGUI! 🐒", "UM MACAQUINHO DA CIDADE", W / 2, 380, "#8a5a2a", prog(t, P(2, "sagui") - .3, P(2, "sagui"))); }
    vinheta(.35);
  } else if (t < C(4)) { // CENA 3: do que ele gosta
    zoomArvore(t, 2.2); K.sagui(540, 900, 3.2, t, { comendo: true }); vinheta(.35);
    const tags = [["frutas", "FRUTAS 🍌", "#e0a020"], ["insetos", "INSETOS 🐛", "#4ab04a"], ["bolo", "BOLO DE CHOCOLATE 🍫", "#a0603a"]];
    tags.forEach(([w, s, c], i) => { const a = prog(t, P(3, w) - .3, P(3, w)); if (a > 0) nome(s, "", W / 2, 360 + i * 110, c, a); });
  } else if (t < C(5)) { // CENA 4: mistério resolvido
    g.fillStyle = "#fff6e6"; g.fillRect(0, 0, W, H);
    g.save(); g.translate(300, 760); g.rotate(-.3); K.elip(0, 0, 40, 48, "#4a2410"); for (let d = 0; d < 5; d++) { g.save(); g.rotate(-.9 + d * .45); rr(-7, -110, 14, 66, 7, "#4a2410"); circ(0, -112, 11, "#4a2410"); g.restore(); } g.restore();
    txt("=", W / 2, 760, 120, "#2a1a40", 900, "center", "Nunito");
    g.save(); g.translate(780, 760); K.elip(0, 0, 50, 60, "#7a6a58"); for (let d = 0; d < 5; d++) { g.save(); g.rotate(-.9 + d * .45); rr(-8, -120, 16, 72, 8, "#6a5a4a"); g.restore(); } g.restore();
    if (t > P(4, "pelinho") - .3) { g.strokeStyle = "#8a5a2a"; g.lineWidth = 6; for (let i = 0; i < 7; i++) { g.beginPath(); g.moveTo(200 + i * 8, 1150); g.bezierCurveTo(260, 1100 - i * 6, 320, 1180, 380, 1120 + i * 4); g.stroke(); } txt("=", W / 2, 1150, 120, "#2a1a40", 900, "center", "Nunito"); for (let i = 0; i < 8; i++) { g.strokeStyle = i % 2 ? "#d8d0c0" : "#6a5a4a"; g.lineWidth = 22; g.beginPath(); g.moveTo(640 + i * 40, 1180 - i * 14); g.lineTo(670 + i * 40, 1170 - i * 14); g.stroke(); } }
    nome("✅ MISTÉRIO RESOLVIDO", "PEGADAS = MÃOZINHAS · PELO = RABO", W / 2, 400, "#4ab04a", prog(t, P(4, "misterio") - .3, P(4, "misterio")));
  } else if (t < C(6)) { // CENA 5: Rafinha inocente
    K.salaDeAula(CHAO, t);
    pessoa(360, CHAO + 360, KID * 1.7, { ...DAVI, expr: t > P(5, "desculpa") - .3 ? "sorriso" : "triste", olhar: 1, braco: .6 });
    pessoa(720, CHAO + 360, KID * 1.7, { ...RAFA, expr: "sorriso", olhar: -1, braco: .6 });
    if (t > P(5, "pipoca") - .3) { K.elip(540, CHAO + 40, 90, 30, "#e04a4a"); for (let i = 0; i < 14; i++) circ(470 + (i * 37) % 140, CHAO + 20 - (i * 13) % 50, 14, "#fff6d0"); }
    vinheta(.3);
    nome("INOCENTE! 😇", "O RAFINHA NÃO TINHA CULPA", W / 2, 380, "#e0a020", prog(t, P(5, "inocente") - .3, P(5, "inocente")));
  } else if (t < C(7)) { // CENA 6: regra
    g.fillStyle = "#2a1a40"; g.fillRect(0, 0, W, H); glow(W / 2, 800, 600, "rgba(255,176,48,A)", .25); lupa(W / 2, 640, 2.2, -.5);
    const a = prog(t, P(6, "nunca") - .4, P(6, "nunca")); g.globalAlpha = a; txt("NUNCA ACUSE", W / 2, 1000, 96, "#fff", 900, "center", "Nunito"); txt("SEM PROVA!", W / 2, 1110, 96, "#ffb030", 900, "center", "Nunito"); g.globalAlpha = 1;
    txt("REGRA DOS DETETIVES", W / 2, 880, 40, "#ffb030", 800, "center", "Nunito");
  } else if (t < C(8)) { // CENA 7: de volta pra mata
    mata(t); const k = prog(t, P(7, "leva") - .3, P(7, "mata") + .5);
    pessoa(360, 1600, 1.15, { ...AMB, expr: "sorriso", olhar: 1, braco: .4 });
    rr(420, 1300, 160, 120, 14, "#8a6a44"); for (let i = 0; i < 5; i++) rect(430 + i * 30, 1310, 8, 100, "#5a4a3a");
    K.sagui(560 + 260 * k, 1360 - 360 * k, 1.4, t, { comendo: false });
    pessoa(800, 1640, KID * 1.6, { ...MEL, expr: "sorriso", olhar: -1 });
    vinheta(.3);
    if (t > P(7, "ensina") - .3) nome("🚫 NÃO DÊ COMIDA", "PRA BICHO SILVESTRE", W / 2, 380, "#e04a4a", 1); else nome("DE VOLTA PRA MATA 🌳", "COM O PESSOAL DO MEIO AMBIENTE", W / 2, 380, "#4ab04a", prog(t, P(7, "ambiente") - .3, P(7, "ambiente")));
  } else if (t < FALA + .3) { // CENA 8: o apito sumiu
    K.salaDeAula(CHAO, t);
    rr(560, CHAO - 120, 420, 40, 8, "#a07a50"); rect(590, CHAO - 80, 20, 200, "#7a5a3a"); rect(930, CHAO - 80, 20, 200, "#7a5a3a");
    if (t > P(8, "interrogacao") - .3) { g.save(); g.font = "900 260px Nunito"; g.fillStyle = "#5ab0ff"; g.textAlign = "center"; g.textBaseline = "middle"; g.globalAlpha = prog(t, P(8, "interrogacao") - .3, P(8, "interrogacao")); g.fillText("?", 350, 420); g.restore(); }
    pessoa(300, CHAO + 360, KID * 1.6, { ...LEO, expr: "choque", olhar: 1 });
    pessoa(560, CHAO + 380, KID * 1.4, { ...MEL, expr: "choque", olhar: 1 });
    pessoa(820, CHAO + 300, 1.1, { ...PROF, expr: "choque", olhar: -1 });
    vinheta(.3);
    if (t > P(8, "sumiu") - .3) nome("O APITO SUMIU! 📯", "DA MESA DA PROFESSORA", W / 2, 640, "#e04a4a", 1);
  } else { // CARD FINAL
    g.fillStyle = "#2a1a40"; g.fillRect(0, 0, W, H); glow(W / 2, 700, 600, "rgba(255,176,48,A)", .25);
    const a = prog(t, FALA + .3, FALA + .8); g.globalAlpha = a;
    txt("PRÓXIMO MISTÉRIO:", W / 2, 620, 64, "#fff", 900, "center", "Nunito"); txt("O APITO SUMIDO 📯", W / 2, 730, 88, "#ffb030", 900, "center", "Nunito");
    txt("Quem você acha que pegou?", W / 2, 880, 50, "#fff", 800, "center", "Nunito"); txt("COMENTA SEU PALPITE 👇", W / 2, 980, 46, "#ffb030", 900, "center", "Nunito");
    txt("OS DETETIVES DO RECREIO · EP. 2", W / 2, 1500, 26, "#8a7aa0", 700, "center", "Nunito"); g.globalAlpha = 1;
  }
  marca(t);
  legenda(t);
};
await document.fonts.load("900 40px Nunito"); await document.fonts.load("800 40px Nunito"); await document.fonts.load("700 40px Oswald"); await document.fonts.ready;
window.renderFrame(0); window.pronto = true;
</script>
</body></html>
