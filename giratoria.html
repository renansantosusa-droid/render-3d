<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import { iniciar } from "/kit3d.js";
const K = await iniciar("giratoria", { fundo: 0x9cc8ea, seed: 7171 });
const { THREE, scene, add, grupo, mat, vidro, brilho, V, sprite, fluxo, grade, texRuido, rotulo, prog, pulse, entre, frac, C, F, P, T, rnd } = K;

// ---------- rua e prédio ----------
add(new THREE.PlaneGeometry(80, 80), mat(0xffffff, { map: grade("#cfcac0", "#b0aaa0", 64, 30), roughness: .9 }), 0, 0, 10).rotation.x = -Math.PI / 2;
add(new THREE.PlaneGeometry(80, 40), mat(0xffffff, { map: grade("#d8d2c6", "#c0b8aa", 32, 20), roughness: .4 }), 0, .002, -20).rotation.x = -Math.PI / 2;
const mFach = mat(0xffffff, { map: grade("#5a7a9a", "#2a3a4a", 32, 6), transparent: true, opacity: 1, roughness: .2 });
const fachada = grupo(0, 0, 0);
for (const x of [-3.6, 3.6]) add(new THREE.BoxGeometry(5.2, 24, .3), mFach, x, 12, 0, fachada);
add(new THREE.BoxGeometry(2, 21.4, .3), mFach, 0, 13.3, 0, fachada);
const lados = [-6.1, 6.1].map((x) => add(new THREE.BoxGeometry(.2, 24, 10), mat(0x4a6a8a, { transparent: true, opacity: .25, depthWrite: false }), x, 12, -5));
// porta comum
const portaC = grupo(-.6, 0, 0);
add(new THREE.BoxGeometry(1.2, 2.5, .06), vidro(.4, 0x9fd0f0), .6, 1.25, 0, portaC);
add(new THREE.BoxGeometry(.06, .4, .1), mat(0x999999, { metalness: .8 }), 1.05, 1.1, .06, portaC);
const portaV = grupo(-.6, 0, -2.0); add(new THREE.BoxGeometry(1.2, 2.5, .06), vidro(.4, 0x9fd0f0), .6, 1.25, 0, portaV);
const vest = [-.62, .62].map((x) => add(new THREE.BoxGeometry(.06, 2.5, 2), vidro(.25, 0x9fd0f0), x, 1.25, -1));
// porta giratória
const gir = grupo(0, 0, 0);
for (const s of [0, Math.PI]) add(new THREE.CylinderGeometry(1.2, 1.2, 2.5, 40, 1, true, s - .9, 1.8), vidro(.3, 0x9fd0f0), 0, 1.25, 0, gir).rotation.y = Math.PI / 2;
const copa = add(new THREE.CylinderGeometry(1.25, 1.25, .25, 40), mat(0x8a9099, { metalness: .6 }), 0, 2.62, 0, gir);
add(new THREE.CylinderGeometry(1.22, 1.22, .02, 40), mat(0x6a6a6a), 0, .01, 0, gir);
const rotor = grupo(0, 0, 0, gir);
add(new THREE.CylinderGeometry(.06, .06, 2.5, 12), mat(0x9aa3ad, { metalness: .8 }), 0, 1.25, 0, rotor);
const asas = [0, 1, 2, 3].map((i) => { const piv = grupo(0, 0, 0, rotor); piv.rotation.y = i * Math.PI / 2; const a = add(new THREE.BoxGeometry(1.15, 2.4, .04), vidro(.45, 0xbfe6ff), .6, 1.25, 0, piv); add(new THREE.BoxGeometry(1.15, .06, .06), mat(0x9aa3ad, { metalness: .8 }), .6, 2.4, 0, piv); return { piv, a }; });
const sensorG = add(new THREE.BoxGeometry(.3, .08, .1), mat(0x333333, { emissive: 0xff2a2a, emissiveIntensity: 0 }), 0, 2.45, 1.2, gir);
const caminhoX = add(new THREE.BoxGeometry(.05, .03, 4), brilho(0xff3a3a), 0, .05, 0);
const xis = add(new THREE.PlaneGeometry(.6, .6), new THREE.MeshBasicMaterial({ map: rotulo("✕", "#ff3a3a", { w: 256, h: 256, tam: 220 }), transparent: true }), 0, .1, .2); xis.rotation.x = -Math.PI / 2;
const tapete = add(new THREE.BoxGeometry(2, .02, 1.2), mat(0x7a2a2a, { roughness: 1 }), 0, .01, 2);
const lateral = grupo(1.5, 0, .01); add(new THREE.BoxGeometry(.9, 2.3, .05), vidro(.4, 0x9fd0f0), 0, 1.15, 0, lateral);
// ar
const arFrio = Array.from({ length: 26 }, () => ({ s: sprite(0x5ab8ff), f: rnd(), x: (rnd() - .5) * 1, y: .2 + rnd() * 2 }));
const arSobe = Array.from({ length: 30 }, () => ({ s: sprite(0xff6a4a), f: rnd(), x: (rnd() - .5) * 8, z: -2 - rnd() * 6 }));
const arEntra = Array.from({ length: 26 }, () => ({ s: sprite(0xffffff), f: rnd(), x: (rnd() - .5) * 1, y: .2 + rnd() * 2 }));
// pessoa
const pessoa = (cor) => { const g = grupo(); add(new THREE.CapsuleGeometry(.2, .9, 8, 16), mat(cor), 0, .7, 0, g); add(new THREE.SphereGeometry(.14, 16, 12), mat(0xe0a07a), 0, 1.42, 0, g); return g; };
const p1 = pessoa(0x2e6fd0), p2 = pessoa(0xe0405a);
const comp = [0, 1].map((i) => { const b = add(new THREE.CylinderGeometry(.3, .3, 1.2, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }), 0, 0, 0); return b; });

// ---------- câmera ----------
K.camera_({
  rua: [V(2.6, 1.9, 7.5), V(0, 1.5, 0)], predio: [V(10, 6, 30), V(0, 10.5, -3)], vest: [V(3.2, 2.4, 3.2), V(0, 1.3, -1)],
  gir: [V(2.6, 2.6, 5.2), V(0, 1.4, 0)], cima: [V(0.01, 7.2, 1.0), V(0, 0, -.1)], final: [V(3, 2.2, 7), V(.4, 1.5, 0)],
}, [
  [0, "rua"], [F(1), "rua"],
  [C(2), "rua"], [P(2, "alto") - .3, "predio"], [F(2), "predio"],
  [C(3), "vest"], [F(3), "vest"],
  [C(4), "gir"], [P(4, "repare") - .3, "cima"], [F(4), "cima"],
  [C(5), "cima"], [F(5), "gir"],
  [C(6), "gir"], [F(6), "gir"],
  [C(7), "cima"], [F(7), "cima"],
  [C(8), "gir"], [C(8) + 1, "final"], [T, "final"],
]);

K.pronto((t) => {
  const em = (a, b) => entre(t, a, b);
  const comum = t < C(4) - .05;
  portaC.visible = comum; gir.visible = !comum;
  portaV.visible = vest[0].visible = vest[1].visible = em(C(3), C(4));
  lados.forEach((l) => l.visible = em(P(2, "alto") - .5, F(2)));
  mFach.opacity = em(P(2, "alto") - .2, F(2)) ? .35 : 1; mFach.transparent = mFach.opacity < 1; mFach.depthWrite = mFach.opacity === 1;
  // porta comum abrindo
  const abre = Math.max(pulse(t, P(1, "porta") - .2, 2.2), pulse(t, P(2, "abre") - .3, 4.5), pulse(t, P(2, "puxa") - .3, 3), em(C(3), C(4)) ? pulse(t, C(3) + .5, 3) : 0);
  portaC.rotation.y = -1.3 * abre;
  portaV.rotation.y = em(C(3), C(4)) ? -1.3 * pulse(t, P(3, "fechar") + .2, 2) : 0;
  arFrio.forEach((a) => { const k = frac(t * .7 + a.f); a.s.position.set(a.x * (1 + k), a.y, -.2 + k * 3.5); a.s.scale.setScalar(.12 + k * .2); a.s.material.opacity = em(P(2, "arcondicionado") - .5, P(2, "alto") - .3) && abre > .3 ? .8 * (1 - k) : 0; });
  arSobe.forEach((a) => { const k = frac(t * .3 + a.f); a.s.position.set(a.x * .5, 1 + k * 20, a.z); a.s.scale.setScalar(.5); a.s.material.opacity = em(P(2, "sobe") - .5, F(2)) ? .8 * Math.sin(k * Math.PI) : 0; });
  arEntra.forEach((a) => { const k = frac(t * 1.1 + a.f); a.s.position.set(a.x * (1 - k), a.y * .6, 4 - k * 5); a.s.scale.setScalar(.15); a.s.material.opacity = em(P(2, "puxa") - .3, F(2)) ? .9 : 0; });
  // pessoa no vestíbulo / pela giratória
  p1.visible = em(C(3), C(5)) || em(C(6), C(7)) || t > C(8) - .1;
  p2.visible = em(C(8) + 1.5, T);
  if (em(C(3), C(4))) { const k = prog(t, C(3), P(3, "meio")); p1.position.set(0, 0, 3 - 4 * k); p1.rotation.z = 0; }
  // rotor
  let vel = 0;
  if (em(C(4), C(6))) vel = .9;
  if (em(C(6), C(7))) vel = t < P(6, "freio") - .2 ? 4.5 : t < P(6, "preso") - .2 ? .9 : 0;
  if (t > C(8)) vel = .9;
  if (!window.__ang) window.__ang = { t: 0, a: 0 };
  // ângulo integrado (determinístico: soma de trechos)
  const trechos = [[C(4), C(6), .9], [C(6), P(6, "freio") - .2, 4.5], [P(6, "freio") - .2, P(6, "preso") - .2, .9], [C(8), T, .9]];
  let ang = 0; for (const [a, b, v] of trechos) ang += v * Math.max(0, Math.min(t, b) - a);
  const dobra = prog(t, P(7, "dobram") - .3, P(7, "livro") + .3) * (t < C(8) ? 1 : 0);
  rotor.rotation.y = -ang * (1 - dobra) + dobra * 0;
  asas.forEach((s, i) => { s.piv.rotation.y = i * Math.PI / 2 + dobra * ([0, -Math.PI / 2, 0, Math.PI / 2][i]) ; });
  if (em(C(4), C(5)) || em(C(6), C(7))) { const a = -ang + Math.PI / 4; const k = prog(t, C(4), F(4)); p1.position.set(Math.sin(a) * .6 * 0 + 0, 0, em(C(4), C(5)) ? 2.8 - 5.6 * k : .55); if (em(C(6), C(7))) p1.position.set(Math.cos(a) * .6, 0, -Math.sin(a) * .6); }
  if (t > C(8) - .1) { const k = prog(t, C(8), F(8)); p1.position.set(0, 0, 3 - 6 * k); p2.position.set(1.5, 0, 3 - 6 * prog(t, C(8) + 1.5, T)); }
  copa.visible = fachada.visible = !(em(P(4, "repare") - .3, F(5) - .6) || em(C(7), F(7)));
  sensorG.material.emissiveIntensity = em(P(6, "sensor") - .4, F(6)) ? 1.5 : 0;
  caminhoX.visible = em(P(4, "caminho") - .3, P(5, "comum") + .3); xis.visible = caminhoX.visible && t > P(4, "tampando") - .3;
  tapete.visible = t > P(8, "tapete") - .3; lateral.visible = t > C(8);
  lateral.rotation.y = -1.2 * pulse(t, P(8, "lado") - .2, 2.5);
  K.cartoes(t, [
    [P(2, "arcondicionado") - .3, P(2, "alto") - .3, "O AR FRIO FOGE", "#5ab8ff"],
    [P(2, "chamine") - .3, P(2, "puxa") - .3, "PRÉDIO = CHAMINÉ", "#ff6a4a"],
    [P(2, "puxa") - .3, F(2), "PUXA O AR DA RUA", "#ffffff"],
    [P(3, "meio") - .3, F(3), "ESPERANDO...", "#ffd23a"],
    [P(4, "fechada") - .5, F(4), "SEMPRE FECHADA", "#3aff7a"],
    [P(5, "vezes") - .4, F(5), "VÁRIAS VEZES MENOS AR", "#3aff7a"],
    [P(6, "liquidificador") - .3, P(6, "freio") - .3, "LIQUIDIFICADOR!", "#ff4a3a"],
    [P(6, "freio") - .3, P(6, "preso") - .3, "FREIO", "#ffd23a"],
    [P(6, "sensor") - .3, F(6), "SENSOR PARA TUDO", "#ff4a3a"],
    [P(7, "livro") - .3, F(7), "DOBRA COMO LIVRO", "#3aff7a"],
  ]);
});
</script>
</body></html>
