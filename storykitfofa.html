  <div class="abs rot" id="r0">Lacres <span class="leve">em 3 estampas</span></div>

  <div class="abs rot" id="r3">Stickers fofos</div>
  <div class="abs" id="frase"><b>Lacres, etiquetas, stickers</b> e <b>cartão de agradecimento</b> pros seus pedidos de foto ímã</div>

  <div class="abs" id="caixa">
    <div class="a">Quem entra hoje no</div>
    <div class="b">Renda Magnética</div>
    <div class="c">já leva junto <svg viewBox="0 0 64 64" width="1.1em" height="1.1em" style="vertical-align:-0.18em"><path d="M32 18C25 5 12 7 16 14c2 4 10 4 16 4zm0 0c7-13 20-11 16-4-2 4-10 4-16 4z" fill="#ffb3c9" stroke="#fff" stroke-width="3"/><rect x="9" y="30" width="46" height="28" rx="4" fill="#fff"/><rect x="5" y="18" width="54" height="14" rx="4" fill="#fff"/><rect x="27" y="18" width="10" height="40" fill="#ffb3c9"/></svg></div>
  </div>
</div>
<script>
const $ = (i) => document.getElementById(i);
const lim = (x) => Math.max(0, Math.min(1, x));
const suave = (t, a, d) => { const x = lim((t - a) / d); return x * x * (3 - 2 * x); };
const sai = (t, a, d) => { const x = lim((t - a) / d); return 1 - Math.pow(1 - x, 3); };
const volta = (t, a, d) => { const x = lim((t - a) / d); const c = 1.9; return x === 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const janela = (t, a, b, f) => Math.min(suave(t, a, f), 1 - suave(t, b - f, f));
const PECAS = [["l1",165,330,175,870,-13,1,[-500,120],"voa"],["l2",165,330,330,845,-1,1.18,[0,700],"voa"],["l3",165,330,480,870,11,1.36,[500,300],"voa"],["c1",300,426,815,830,6,2.3,[600,0],"voa"],["a1",185,185,175,1170,-8,3.4,[0,0],"pop"],["a2",185,185,380,1205,5,3.58,[0,0],"pop"],["a3",185,185,585,1170,-4,3.76,[0,0],"pop"],["s1",150,150,800,1150,-10,4.6,[0,0],"pop"],["s2",140,140,965,1095,12,4.78,[0,0],"pop"],["s3",130,130,950,610,14,4.96,[0,0],"pop"],["s4",125,125,95,640,-12,5.14,[0,0],"pop"],["s5",135,135,960,1265,8,5.32,[0,0],"pop"]];
const ROT = [[1.15,2.2],[2.4,3.3],[3.5,4.5],[4.7,5.75]];
window.renderFrame = (t) => {
  // corações do fundo flutuando
  ['h1', 'h2', 'h3', 'h4'].forEach((h, i) => { $(h).style.transform = 'translateY(' + (Math.sin(t * 1.6 + i * 1.7) * 14) + 'px) rotate(' + (Math.sin(t + i) * 10) + 'deg)'; });
  // topo
  const n = volta(t, 0.10, 0.55);
  $('novo').style.opacity = lim((t - 0.10) / 0.15);
  $('novo').style.transform = 'translateX(-50%) scale(' + (n * (1 + 0.035 * Math.sin(t * 6) * suave(t, 0.8, 0.4))) + ')';
  $('t1').style.opacity = sai(t, 0.35, 0.4); $('t1').style.transform = 'translateY(' + (1 - sai(t, 0.35, 0.5)) * 40 + 'px)';
  $('t2').style.opacity = sai(t, 0.55, 0.4); $('t2').style.transform = 'scale(' + (0.6 + 0.4 * volta(t, 0.55, 0.6)) + ') rotate(' + (-3 + 3 * sai(t, 0.55, 0.6)) + 'deg)';
  // peças
  for (const [id, w, h, x, y, r, t0, de, tipo] of PECAS) {
    const el = $(id); const bob = Math.sin(t * 1.8 + x * 0.01) * 6 * suave(t, t0 + 0.6, 0.5);
    let tx = x - w / 2, ty = y - h / 2 + bob, rot = r, esc = 1, op = 0;
    if (tipo === 'voa') {
      const p = volta(t, t0, 0.7); op = lim((t - t0) / 0.12);
      tx += de[0] * (1 - p); ty += de[1] * (1 - p); rot = r + (1 - p) * (de[0] > 0 ? 25 : -25);
    } else {
      const p = volta(t, t0, 0.5); op = lim((t - t0) / 0.08); esc = Math.max(0, p);
      rot = r + (1 - sai(t, t0, 0.6)) * -30;
    }
    el.style.opacity = op;
    el.style.transform = 'translate(' + tx + 'px,' + ty + 'px) rotate(' + rot + 'deg) scale(' + esc + ')';
  }
  // rótulos trocando
  ROT.forEach(([a, b], i) => {
    const o = janela(t, a, b, 0.2); $('r' + i).style.opacity = o;
    $('r' + i).style.transform = 'translateY(' + (1 - sai(t, a, 0.3)) * 26 + 'px) scale(' + (0.9 + 0.1 * volta(t, a, 0.4)) + ')';
  });
  $('frase').style.opacity = sai(t, 5.95, 0.5); $('frase').style.transform = 'translateY(' + (1 - sai(t, 5.95, 0.6)) * 30 + 'px)';
  // caixa do Renda Magnética
  const c = volta(t, 7.2, 0.7);
  $('caixa').style.opacity = lim((t - 7.2) / 0.15);
  $('caixa').style.transform = 'translateX(-50%) rotate(-2deg) scale(' + (c * (1 + 0.025 * Math.sin((t - 8) * 5) * suave(t, 8.0, 0.4))) + ')';
};
Promise.all([document.fonts.load('900 80px Montserrat'), document.fonts.load('700 40px Montserrat'), document.fonts.load('800 40px Montserrat'), document.fonts.load('80px "Kaushan Script"')])
  .then(() => document.fonts.ready).then(() => Promise.all([...document.images].map((i) => i.decode().catch(() => {}))))
  .then(() => { window.renderFrame(0); window.pronto = true; });
</script></body></html>
