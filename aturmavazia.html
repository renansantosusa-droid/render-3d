  if (d < 12) camera.lookAt(alvo.x, alvo.y, alvo.z - 1.1); else camera.lookAt(alvo);
  return { i, dt: t - s.a };
}

// ---------- o lugar vazio: anel vermelho pulsando + nome da cidade + "?" ----------
const anelMat = new THREE.MeshBasicMaterial({ color: 0xff4b3e, transparent: true, depthWrite: false, side: THREE.DoubleSide });
const anel = new THREE.Mesh(new THREE.RingGeometry(.2, .26, 48), anelMat); anel.rotation.x = -Math.PI / 2;
const anel2 = new THREE.Mesh(new THREE.RingGeometry(.2, .23, 48), anelMat.clone()); anel2.rotation.x = -Math.PI / 2;
const chao = new THREE.Mesh(new THREE.CircleGeometry(.2, 48), new THREE.MeshBasicMaterial({ color: 0xff4b3e, transparent: true, opacity: .22, depthWrite: false })); chao.rotation.x = -Math.PI / 2;
scene.add(anel, anel2, chao);
const NOMES = CID.map((c) => etiqueta(c.nome.toUpperCase(), { alt: .3 }));
const placa = etiqueta("?", { bg: "#ff4b3e", fg: "#fff", borda: "#fff", alt: .34 });

// ---------- as +2 mil cidades vazias (pinos vermelhos) ----------
const NV = DADOS.vazias.length;
const VP = DADOS.vazias.map(([lon, lat]) => [X(lon), Z(lat)]);
const pinoGeo = new THREE.CylinderGeometry(.5, .5, .25, 10); pinoGeo.translate(0, .125, 0);
const pinos = new THREE.InstancedMesh(pinoGeo, new THREE.MeshStandardMaterial({ color: 0xff4b3e, emissive: 0xff2010, emissiveIntensity: .35, roughness: .5 }), NV);
scene.add(pinos);
const QV = VP.map((_, i) => T_MAIS + .15 + 1.1 * Math.pow(i / NV, .6));

// ---------- a casa do fundador nasce no vazio (cena 5) + coroa ----------
const [fx, fz] = pc(CID[0]);
const casaF = new THREE.Group();
const cf1 = new THREE.Mesh(corpoGeo, new THREE.MeshStandardMaterial({ color: 0xfffaf0, roughness: .6 })), cf2 = new THREE.Mesh(telGeo, new THREE.MeshStandardMaterial({ color: 0xffb020, roughness: .5 }));
cf1.castShadow = cf2.castShadow = true; casaF.add(cf1, cf2); casaF.position.set(fx, ALT, fz); scene.add(casaF);
const coroa = new THREE.Group(); const ouro = new THREE.MeshStandardMaterial({ color: 0xffd23f, emissive: 0xffa000, emissiveIntensity: .3, metalness: .3, roughness: .35 });
coroa.add(new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, .22, 24, 1, true), ouro));
for (let k = 0; k < 5; k++) { const p = new THREE.Mesh(new THREE.ConeGeometry(.12, .34, 8), ouro); const a = k / 5 * Math.PI * 2; p.position.set(Math.cos(a) * .4, .26, Math.sin(a) * .4); coroa.add(p); }
scene.add(coroa);
const etFund = etiqueta("FUNDADOR?", { bg: "#1d5e2a", fg: "#ffd23f", borda: "#1d5e2a", alt: .3 });

// ---------- textos na tela ----------
const mk = (id, cls = "") => { const el = document.createElement("div"); el.id = id; el.className = "ov " + cls; document.body.appendChild(el); return el; };
const flash = document.createElement("div"); flash.id = "flash"; document.body.appendChild(flash);
const elMarca = mk("marca"); elMarca.innerHTML = "A TURMA DO <b>BRASIL</b>";
const elChip = mk("chip"), elCont = mk("cont");
const elCta = mk("cta"); elCta.innerHTML = '<div class="l1">COMENTA SUA CIDADE<br>+ ESTADO</div><div class="l2">o 1º vira FUNDADOR 👑👇</div>';
const elSeta = mk("seta"); const elLeg = mk("legenda");
const fmt = (n) => n.toLocaleString("pt-BR");
const cab = (c) => c.nome.toUpperCase() + " · " + c.uf;
const CHIPS = [
  [0, C(2), cab(CID[0])],
  [C(2), C(3), cab(CID[1])],
  [C(3), C(4), cab(CID[2])],
  [C(4), T_CAB, "E AINDA TEM... 👀"],
  [T_CAB, T_PES, cab(CID[3]) + "<small>" + fmt(CID[3].pop) + " hab · 0 casas</small>"],
  [T_PES, T_AND, cab(CID[4]) + "<small>" + fmt(CID[4].pop) + " hab · 0 casas</small>"],
  [T_AND, T_MAIS, cab(CID[5]) + "<small>" + fmt(CID[5].pop) + " hab · 0 casas</small>"],
  [T_MAIS, C(5), fmt(DADOS.nVazias) + " CIDADES<small>sem nenhuma casa 😱</small>"],
  [C(5), P(5, "Manda") - .05, "CONHECE ALGUÉM<br>DE LÁ? 👀"],
  [P(5, "Manda") - .05, T_PRI, "MANDA NO GRUPO<small>da tua cidade 📲</small>"],
  [T_PRI, C(6), "O 1º QUE COMENTAR<small>vira o FUNDADOR 👑</small>"],
];
const PALAVRAS = TEMPOS.cenas.flatMap((c) => c.palavras);
const DESTAQUE = new Set(["para", "minas", "cem", "mil", "habitantes", "nenhuma", "casa", "turma", "brasil", "sao", "joao", "boa", "vista", "paulo", "noventa", "dois", "pessoas", "zero", "nova", "bahia", "setenta", "cabedelo", "pesqueira", "andradina", "duas", "cidades", "ninguem", "conhece", "manda", "grupo", "cidade", "primeiro", "fundador", "segue", "comenta", "estado"]);
const esc = (el, k, centro = true) => el.style.transform = (centro ? "translateX(-50%) " : "") + "scale(" + k + ")";
function textos(t) {
  esc(elMarca, 1 + .06 * pulse(t, P(1, "Turma") - .1, .5));
  // contador: habitantes sobem, depois vira "0 CASAS" em vermelho
  const ci = t < C(2) ? 0 : t < C(3) ? 1 : t < C(4) ? 2 : -1;
  elCont.style.opacity = ci >= 0 ? 1 : 0;
  if (ci >= 0) {
    const ini = ci ? C(ci + 1) : 0, c = CID[ci];
    if (t >= T_ZERO[ci]) { elCont.className = "ov zero"; elCont.innerHTML = "0 CASAS<small>nenhuma ainda 😱</small>"; elCont.style.transform = "translateX(-50%) translateY(190px) scale(" + (.7 + .3 * pop(t, T_ZERO[ci], .3)) + ")"; }
    else { const k = prog(t, ini + .15, T_HAB[ci]); elCont.className = "ov"; elCont.innerHTML = fmt(Math.round(c.pop * k)) + "<small>HABITANTES</small>"; elCont.style.transform = "translateX(-50%) translateY(190px)"; }
  }
  const c = CHIPS.find(([a, b]) => entre(t, a, b));
  if (c) { elChip.innerHTML = c[2]; elChip.className = "ov amarelo"; elChip.style.opacity = 1; elChip.style.fontSize = !c[2].includes("<") && c[2].length > 20 ? "58px" : "70px"; esc(elChip, .55 + .45 * prog(t, c[0], c[0] + .16) + .12 * pulse(t, c[0] + .08, .3)); }
  else elChip.style.opacity = 0;
  const tc = P(6, "comenta") - .05, kc = prog(t, tc, tc + .25);
  elCta.style.opacity = kc; esc(elCta, .6 + .4 * kc + .04 * Math.sin(t * 9) * kc, false);
  elSeta.style.opacity = kc; elSeta.style.transform = "translateY(" + (18 * Math.abs(Math.sin(t * 5))) + "px)";
  let atual = null; for (const p of PALAVRAS) if (t >= p.t) atual = p;
  if (!atual || t > tc) { elLeg.textContent = ""; return; }
  elLeg.textContent = atual.w.toUpperCase(); elLeg.className = "ov" + (DESTAQUE.has(norm(atual.w)) ? " am" : "");
  esc(elLeg, .8 + .2 * prog(t, atual.t, atual.t + .09), false);
}

function quadro(t) {
  const cam = moverCamera(t);
  texMar.offset.set(t * .01, t * .006);
  const fd = clamp(camera.position.distanceTo(alvo) / 8, 1, 3);
  for (let i = 0; i < N; i++) {
    const [x, z, e] = POS[i];
    m4.compose(v3.set(x, ALT, z), q.setFromAxisAngle(eixoY, ROT[i]), s3.setScalar(e * fd)); corpos.setMatrixAt(i, m4); telhados.setMatrixAt(i, m4);
  }
  corpos.instanceMatrix.needsUpdate = telhados.instanceMatrix.needsUpdate = true;
  // pinos das cidades vazias
  const vp = entre(t, T_MAIS, C(5));
  for (let i = 0; i < NV; i++) { const k = vp ? clamp(pop(t, QV[i], .3), 0, 1.3) : 0, r = .11 * k * fd; m4.compose(v3.set(VP[i][0], ALT, VP[i][1]), q.identity(), s3.set(Math.max(1e-4, r), Math.max(1e-4, r * (1 + .4 * Math.sin(t * 6 + i))), Math.max(1e-4, r))); pinos.setMatrixAt(i, m4); }
  pinos.instanceMatrix.needsUpdate = true;
  // anel + nome da cidade em foco
  const f = FOCO.find(([a, b]) => entre(t, a, b));
  const temF = f && !(f[2] === 0 && t >= T_PRI);
  anel.visible = anel2.visible = chao.visible = !!f;
  NOMES.forEach((n, i) => escalaSprite(n, f && f[2] === i ? pop(t, f[0] + .1) : 0));
  if (f) {
    const [cx, cz] = pc(CID[f[2]]), k = pop(t, f[0] + .05, .4), sc = Math.max(.001, k);
    anel.position.set(cx, ALT + .01, cz); anel.scale.setScalar(sc * (1 + .08 * Math.sin(t * 7)));
    const w = ((t - f[0]) * 1.2) % 1; anel2.position.set(cx, ALT + .012, cz); anel2.scale.setScalar(sc * (1 + w * 1.6)); anel2.material.opacity = .9 * (1 - w);
    chao.position.set(cx, ALT + .008, cz); chao.scale.setScalar(sc);
    NOMES[f[2]].position.set(cx, ALT + (f[2] === 0 && t >= T_FUN ? .85 : .62), cz);
    placa.position.set(cx, ALT + .3 + .03 * Math.sin(t * 5), cz);
  }
  escalaSprite(placa, temF ? pop(t, f[0] + .2) : 0);
  // casa do fundador nasce no vazio de Pará de Minas
  const kf = t >= T_PRI ? clamp(pop(t, T_PRI, .4), 0, 1.3) : 0;
  casaF.visible = kf > .001; casaF.scale.setScalar(Math.max(.001, kf * .2)); casaF.rotation.y = .3;
  const kc = t >= T_FUN ? clamp(pop(t, T_FUN, .35), 0, 1.3) : 0;
  coroa.visible = kc > .001; coroa.scale.setScalar(Math.max(.001, kc * .2)); coroa.rotation.y = t * 1.8; coroa.position.set(fx, ALT + .38 + .015 * Math.sin(t * 4), fz);
  etFund.position.set(fx, ALT + .62, fz); escalaSprite(etFund, t >= T_FUN && t < C(6) ? pop(t, T_FUN + .1) : 0);
  flash.style.opacity = cam.i > 0 ? .35 * clamp(1 - cam.dt / .12, 0, 1) : 0;
  renderer.render(scene, camera);
  textos(t);
}
window.renderFrame = quadro;
quadro(0);
window.pronto = true;

</script>
</body></html>
