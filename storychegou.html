<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;position:relative;font-family:'Nunito',sans-serif;font-weight:900}
body{background:radial-gradient(circle at 50% 30%,#2a7a3c 0%,#15502a 45%,#0b2f18 100%)}
#bolinhas{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 3px,transparent 3.5px);background-size:46px 46px}
.ov{position:absolute;pointer-events:none}
#marca{top:120px;left:50%;background:#fff;color:#1d5e2a;font-size:40px;padding:12px 32px;border-radius:99px;border:6px solid #ffd23f;white-space:nowrap}
#marca b{color:#2fa34a}
#titulo{top:560px;left:0;right:0;text-align:center;color:#ffd23f;font-size:128px;line-height:1.02;-webkit-text-stroke:7px #0b2f18;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.35)}
#seguinte{top:1010px;left:50%;white-space:nowrap;background:#fff;color:#14204a;font-size:70px;padding:16px 46px;border-radius:99px;box-shadow:0 12px 0 rgba(0,0,0,.3)}
#passo{top:225px;left:50%;display:flex;align-items:center;gap:22px;white-space:nowrap;background:#fff;color:#14204a;font-size:50px;padding:10px 38px 10px 12px;border-radius:99px;box-shadow:0 10px 0 rgba(0,0,0,.3)}

#cel{left:50%;top:345px;width:580px;height:1120px;margin-left:-290px;border-radius:70px;background:#10151c;box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 0 0 4px #39414d}

#anel{position:absolute;border:7px solid #ffd23f;border-radius:30px;box-shadow:0 0 0 6px rgba(255,210,63,.35)}
#dedo{font-size:120px;line-height:1;filter:drop-shadow(0 8px 8px rgba(0,0,0,.4))}
#toque{width:90px;height:90px;border-radius:50%;border:8px solid #fff;margin:-45px 0 0 -45px}
#link{top:1482px;left:50%;white-space:nowrap;background:#ffd23f;color:#14204a;font-size:46px;padding:12px 34px;border-radius:99px;border:6px solid #14204a}
#legenda{top:1590px;left:0;right:0;text-align:center;font-size:92px;color:#fff;-webkit-text-stroke:4px #0b2f18;paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.45)}
#legenda.am{color:#ffd23f}
/* sem resposta no comentário */
#aviso6{top:290px;left:0;right:0;text-align:center;color:#ffd23f;font-size:88px;line-height:1.06;-webkit-text-stroke:6px #0b2f18;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.35)}
#coment{left:90px;right:90px;top:690px;background:#fff;color:#14204a;border-radius:44px;border:8px solid #14204a;box-shadow:0 14px 0 #14204a;padding:34px 40px;font-size:54px;line-height:1.15;transform-origin:center}
#coment small{display:block;font-size:38px;color:#5a6680;margin-top:8px}
#confere{left:90px;right:90px;top:1010px;background:#2fa34a;color:#fff;border-radius:44px;border:8px solid #14204a;box-shadow:0 14px 0 #14204a;padding:36px 40px;font-size:74px;line-height:1.08;text-align:center;transform-origin:center}
#confere small{display:block;font-size:46px;margin-top:10px;color:#fff}
/* pontos */
.card{left:90px;right:90px;height:250px;display:flex;align-items:center;gap:34px;background:#fff;border-radius:44px;border:8px solid #14204a;box-shadow:0 14px 0 #14204a;padding:0 40px;color:#14204a;transform-origin:center}
.card .n{flex:none;width:210px;height:170px;border-radius:34px;background:#2fa34a;color:#fff;font-size:100px;display:flex;align-items:center;justify-content:center}
.card .t{font-size:56px;line-height:1.08}
#c1{top:400px}#c2{top:720px}#c3{top:1040px}
#c2 .n{background:#ffb020;color:#14204a}
/* domingo */
#coroa{top:300px;left:0;right:0;text-align:center;font-size:270px;line-height:1;filter:drop-shadow(0 14px 0 rgba(0,0,0,.3))}
#dom{top:625px;left:50%;white-space:nowrap;background:#fff;color:#14204a;font-size:76px;padding:14px 44px;border-radius:40px;border:8px solid #14204a;box-shadow:0 12px 0 #14204a}
#pref{top:820px;left:0;right:0;text-align:center;color:#fff;font-size:80px;line-height:1.1;-webkit-text-stroke:5px #0b2f18;paint-order:stroke fill}
#pref b{color:#ffd23f}
#leva{top:1085px;left:0;right:0;text-align:center;color:#fff;font-size:62px;line-height:1.12;-webkit-text-stroke:4px #0b2f18;paint-order:stroke fill}
#corre{top:1290px;left:50%;white-space:nowrap;background:#ffd23f;color:#14204a;font-size:70px;padding:24px 50px;border-radius:40px;border:8px solid #14204a;box-shadow:0 12px 0 #14204a}
</style>

  seguinte.style.opacity = entre(t, P(1, "seguinte") - .2, C(2)) ? 1 : 0; esc(seguinte, pop(t, P(1, "seguinte") - .2));
  // selo do passo
  const ps = PASSOS.find(([a, b]) => entre(t, a, b));
  if (ps) { passo.innerHTML = `<i>${ps[2]}</i>${ps[3]}`; passo.style.opacity = 1; esc(passo, .6 + .4 * pop(t, ps[0], .3)); } else passo.style.opacity = 0;
  // celular: cenas 2 a 5
  const ke = prog(t, C(2) - .1, C(2) + .35), ks = prog(t, C(6) - .1, C(6) + .25);
  cel.style.opacity = ke * (1 - ks); cel.style.transform = `translateY(${(1 - ke) * 700 + ks * 900}px)`;
  for (const [a, b, nome] of TELAS_T) IMGS[nome].style.opacity = entre(t, a, b) ? 1 : 0;
  // anel nos pontos da casa (cena 4)
  if (entre(t, P(4, "pontos") - .1, C(5))) Object.assign(anel.style, { left: "44px", top: "458px", width: "330px", height: "92px", opacity: 1, transform: `scale(${1.2 - .2 * pop(t, P(4, "pontos") - .1, .3)})` }); else anel.style.opacity = 0;
  // dedo tocando
  const tq = TOQUES.find(([a]) => entre(t, a - .5, a + .7));
  if (tq) {
    const [a, x, y] = tq, px = 270 + x, py = 365 + y, ch = prog(t, a - .5, a - .1);
    dedo.style.opacity = 1; dedo.style.left = (px - 42) + "px"; dedo.style.top = (py + 260 * (1 - ch) - 8 + (entre(t, a - .1, a + .1) ? 10 : 0)) + "px";
    const kq = clamp((t - a) / .45, 0, 1); toque.style.opacity = t >= a ? 1 - kq : 0; toque.style.left = px + "px"; toque.style.top = py + "px"; toque.style.transform = `scale(${.4 + 1.2 * kq})`;
  } else { dedo.style.opacity = 0; toque.style.opacity = 0; }
  // link do site (cena 2)
  link.style.opacity = entre(t, P(2, "site") - .1, C(3)) ? 1 : 0; esc(link, pop(t, P(2, "site") - .1));
  // cena 6: sem resposta -> confere no site
  const n6 = entre(t, C(6), C(7));
  aviso6.style.opacity = n6 ? 1 : 0; aviso6.style.transform = `scale(${pop(t, C(6), .35)})`;
  coment.style.opacity = n6 ? 1 : 0; coment.style.transform = `scale(${pop(t, C(6) + .15, .35)})`;
  const kc = n6 && t >= P(6, "Confere") - .1 ? pop(t, P(6, "Confere") - .1, .35) : 0; confere.style.opacity = kc > 0 ? 1 : 0; confere.style.transform = `scale(${kc})`;
  // cena 7: pontos
  for (const c of CARDS) { const k = entre(t, c.a - .05, C(8)) ? pop(t, c.a - .05, .35) : 0; c.el.style.opacity = k > 0 ? 1 : 0; c.el.style.transform = `scale(${k})`; }
  // cena 8: domingo
  const n8 = t >= C(8);
  coroa.style.opacity = n8 ? 1 : 0; coroa.style.transform = `scale(${pop(t, C(8), .45)}) rotate(${6 * Math.sin(t * 3)}deg)`;
  dom.style.opacity = n8 && t >= P(8, "domingo") - .05 ? 1 : 0; esc(dom, pop(t, P(8, "domingo") - .05));
  pref.style.opacity = t >= P(8, "muda") - .05 ? 1 : 0; pref.style.transform = `scale(${pop(t, P(8, "muda") - .05)})`;
  leva.style.opacity = t >= P(8, "Quem") - .05 ? 1 : 0; leva.style.transform = `scale(${pop(t, P(8, "Quem") - .05)})`;
  corre.style.opacity = t >= P(8, "Corre") - .1 ? 1 : 0; esc(corre, pop(t, P(8, "Corre") - .1) + .04 * Math.sin(t * 9));
  // legenda palavra por palavra (cenas 1 a 5)
  let atual = null; for (const p of PALAVRAS) if (t >= p.t) atual = p;
  if (!atual || t >= C(6)) leg.textContent = "";
  else { leg.textContent = atual.w.toUpperCase(); leg.className = "ov" + (DESTAQUE.has(norm(atual.w)) ? " am" : ""); leg.style.transform = `scale(${.8 + .2 * prog(t, atual.t, atual.t + .09)})`; }
}
window.renderFrame = quadro;
quadro(0);
window.pronto = true;
</script>
