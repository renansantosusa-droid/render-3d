const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fd3ef); scene.fog = new THREE.Fog(0x9fd3ef, 40, 110);
const camera = new THREE.PerspectiveCamera(40, W / H, .05, 400);
scene.add(new THREE.HemisphereLight(0xf2fbff, 0x5d8f6a, 1.5));
const sol = new THREE.DirectionalLight(0xfff4dc, 2.3); sol.position.set(-14, 26, 18); sol.castShadow = true;
sol.shadow.mapSize.set(4096, 4096); Object.assign(sol.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 80 }); sol.shadow.bias = -.0005; scene.add(sol);
const mar = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x86c9ec, roughness: .85 })); mar.rotation.x = -Math.PI / 2; mar.position.y = -.02; mar.receiveShadow = true; scene.add(mar);
const VERDES = [0x6cc24a, 0x5cb83f, 0x79cc55, 0x63bd45, 0x86d35f, 0x57b03b];
const ladoMat = new THREE.MeshStandardMaterial({ color: 0x3c8a30, roughness: .9 }), praiaMat = new THREE.MeshStandardMaterial({ color: 0xf1e3b5, roughness: 1 });
const bordaMat = new THREE.LineBasicMaterial({ color: 0xe9f7df, transparent: true, opacity: .85 });
Object.keys(GEO).forEach((uf, i) => {
  const topo = new THREE.MeshStandardMaterial({ color: VERDES[i % VERDES.length], roughness: .85 });
  for (const poly of GEO[uf]) {
    const forma = new THREE.Shape(poly[0].map(([lon, lat]) => new THREE.Vector2(X(lon), -Z(lat))));
    const g = new THREE.ExtrudeGeometry(forma, { depth: ALT, bevelEnabled: false }); g.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(g, [topo, ladoMat]); m.castShadow = m.receiveShadow = true; scene.add(m);
    const pg = new THREE.ExtrudeGeometry(forma, { depth: .08, bevelEnabled: true, bevelThickness: .02, bevelSize: .12, bevelSegments: 1 }); pg.rotateX(-Math.PI / 2);
    const p = new THREE.Mesh(pg, praiaMat); p.position.y = -.04; scene.add(p);
    scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(poly[0].map(([lon, lat]) => new THREE.Vector3(X(lon), ALT + .006, Z(lat)))), bordaMat));
  }
});
// as casas reais (instanciadas), aparecem em onda enquanto o número sobe
const corpoGeo = new THREE.BoxGeometry(1, .82, .9); corpoGeo.translate(0, .41, 0);
const telGeo = new THREE.ConeGeometry(.84, .6, 4); telGeo.rotateY(Math.PI / 4); telGeo.translate(0, 1.12, 0);
const N = DADOS.pts.length;
const corpos = new THREE.InstancedMesh(corpoGeo, new THREE.MeshStandardMaterial({ color: 0xfffaf0, roughness: .7 }), N);
const telhados = new THREE.InstancedMesh(telGeo, new THREE.MeshStandardMaterial({ roughness: .6 }), N);
corpos.castShadow = telhados.castShadow = true;
const CORES = [0xe4573a, 0x2b59c3, 0xffb020, 0x8e5cd9, 0xff6fa8, 0x18a39a, 0xff7a45].map((c) => new THREE.Color(c));
const ordem = DADOS.pts.map((p, i) => i).sort((a, b) => ((Math.imul(a, 2654435761) >>> 0) % 100003) - ((Math.imul(b, 2654435761) >>> 0) % 100003));
const quando = new Float32Array(N); ordem.forEach((i, k) => quando[i] = .05 + 2.3 * k / N);
DADOS.pts.forEach((p, i) => telhados.setColorAt(i, CORES[i % CORES.length]));
scene.add(corpos, telhados);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v3 = new THREE.Vector3(), s3 = new THREE.Vector3();
// ---- a casa nova em destaque ----
const tTit = P(2, "Casa") - .05, tBal = P(2, "nova") , tPres = P(2, "presente") - .1, tBot = P(3, "Toca") - .05, tCont = .15;
const HX = X(-47.85), HZ = Z(-23.35);
const heroi = new THREE.Group(); heroi.position.set(HX, ALT, HZ); scene.add(heroi);
const corpoH = new THREE.Mesh(corpoGeo, new THREE.MeshStandardMaterial({ color: 0xfffaf0, roughness: .7 })); corpoH.castShadow = true;
const telH = new THREE.Mesh(telGeo, new THREE.MeshStandardMaterial({ color: 0xe4573a, roughness: .6 })); telH.castShadow = true;
const jan = new THREE.Mesh(new THREE.PlaneGeometry(.26, .24), new THREE.MeshStandardMaterial({ color: 0x8fd3ff, emissive: 0x3a8fd0, emissiveIntensity: .3 })); jan.position.set(-.22, .5, .452);
const porta = new THREE.Mesh(new THREE.PlaneGeometry(.24, .46), new THREE.MeshStandardMaterial({ color: 0x7a4a2a })); porta.position.set(.2, .23, .452);
heroi.add(corpoH, telH, jan, porta); heroi.scale.setScalar(.001);
// presente com laço
const presente = new THREE.Group();
const caixa = new THREE.Mesh(new THREE.BoxGeometry(.5, .42, .5), new THREE.MeshStandardMaterial({ color: 0x2fa34a, roughness: .5 })); caixa.position.y = .21; caixa.castShadow = true;
const fitaMat = new THREE.MeshStandardMaterial({ color: 0xffd23f, roughness: .4 });
const f1 = new THREE.Mesh(new THREE.BoxGeometry(.52, .44, .1), fitaMat); f1.position.y = .21;
const f2 = new THREE.Mesh(new THREE.BoxGeometry(.1, .44, .52), fitaMat); f2.position.y = .21;
const laco1 = new THREE.Mesh(new THREE.TorusGeometry(.1, .035, 8, 16), fitaMat); laco1.position.set(-.09, .5, 0); laco1.rotation.y = Math.PI / 2;
const laco2 = laco1.clone(); laco2.position.x = .09;
presente.add(caixa, f1, f2, laco1, laco2); presente.position.set(.75, 0, .55); heroi.add(presente);
// balões
const baloes = [[0xe4573a, -.45, 2.0], [0xffd23f, .05, 2.3], [0x2b59c3, .5, 2.0], [0xff6fa8, -.1, 1.8]].map(([cor, x, y], i) => {
  const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.SphereGeometry(.22, 20, 16), new THREE.MeshStandardMaterial({ color: cor, roughness: .3 })); b.scale.y = 1.2; b.castShadow = true;
  const fio = new THREE.Mesh(new THREE.CylinderGeometry(.006, .006, y - .9, 4), new THREE.MeshBasicMaterial({ color: 0x555555 })); fio.position.y = -(y - .9) / 2 - .2;
  g.add(b, fio); g.userData = { x, y, f: i * 1.3 }; heroi.add(g); return g;
});
// confete
const confete = Array.from({ length: 70 }, (_, i) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(.06, .1), new THREE.MeshBasicMaterial({ color: [0xe4573a, 0xffd23f, 0x2b59c3, 0x2fa34a, 0xff6fa8][i % 5], side: THREE.DoubleSide })); m.userData = { a: i * 2.399, r: .4 + (i % 7) * .18, v: .6 + (i % 5) * .15, f: i * .37 }; heroi.add(m); return m; });
// textos
const mk = (id, cls = "") => { const d = document.createElement("div"); d.id = id; d.className = "ov " + cls; document.body.appendChild(d); return d; };
const marca = mk("marca"); marca.innerHTML = "A TURMA DO <b>BRASIL</b>";
const contador = mk("contador");
const titulo = mk("titulo"); titulo.innerHTML = "CASA NOVA<br>MERECE<br>PRESENTE 🎁";
const seta = mk("seta"); seta.textContent = "👇";
const botao = mk("botao"); botao.innerHTML = "🎁 TOCA NO LINK";
const esc = (el, s, base = "") => el.style.transform = `${base} scale(${s})`;
function quadro(t) {
  // câmera: passa devagar sobre o Sudeste/Nordeste e abre no fim
  const k = prog(t, 0, 3.2), d = 30 - 26.8 * k, yaw = (20 - 34 * prog(t, 0, FIM)) * Math.PI / 180, el = (58 - 26 * k) * Math.PI / 180;
  const alvo = new THREE.Vector3(HX + .35 * k, ALT + .45 * k, HZ);
  camera.position.set(alvo.x + d * Math.sin(yaw) * Math.cos(el), alvo.y + d * Math.sin(el), alvo.z + d * Math.cos(yaw) * Math.cos(el)); camera.lookAt(alvo);
  const kb = pop(t, tBal, .5), kp = pop(t, tPres, .45); heroi.scale.setScalar(Math.max(.001, .4 * pop(t, .3, .6)));
  baloes.forEach((g) => { const u = g.userData; g.visible = kb > 0; g.scale.setScalar(Math.max(.001, kb)); g.position.set(u.x + .05 * Math.sin(t * 2 + u.f), u.y + .08 * Math.sin(t * 2.4 + u.f), 0); });
  presente.visible = kp > 0; presente.scale.setScalar(Math.max(.001, kp)); presente.rotation.y = .3 * Math.sin(t * 1.5);
  confete.forEach((m) => { const u = m.userData, kk = (t - tPres - .1) * u.v; m.visible = t > tPres + .1; m.position.set(Math.cos(u.a + kk) * u.r, 2.6 - ((kk * 1.2 + u.f) % 2.8), Math.sin(u.a + kk) * u.r * .6); m.rotation.set(t * 3 + u.f, t * 2, 0); });
  for (let i = 0; i < N; i++) { const p = DADOS.pts[i], s = clamp(pop(t, quando[i], .35), 0, 1.3) * .05; m4.compose(v3.set(X(p[0]), ALT, Z(p[1])), q.identity(), s3.setScalar(Math.max(.0001, s))); corpos.setMatrixAt(i, m4); telhados.setMatrixAt(i, m4); }
  corpos.instanceMatrix.needsUpdate = telhados.instanceMatrix.needsUpdate = true;
  const cc = prog(t, tCont, tCont + 2.3);
  contador.style.opacity = prog(t, tCont, tCont + .2); contador.style.transformOrigin = "left center"; esc(contador, .7 + .3 * pop(t, tCont, .3));
  contador.textContent = "+" + Math.round(DADOS.placar.casas * cc).toLocaleString("pt-BR") + " CASAS · " + Math.round(DADOS.placar.cidades * cc).toLocaleString("pt-BR") + " CIDADES";
  titulo.style.opacity = prog(t, tTit, tTit + .25); esc(titulo, .7 + .3 * pop(t, tTit, .35)); titulo.style.transformOrigin = "left center";
  botao.style.opacity = prog(t, tBot, tBot + .25); botao.style.transformOrigin = "center"; esc(botao, .7 + .3 * pop(t, tBot, .35) + .03 * Math.sin(t * 7) * (t > tBot + .5 ? 1 : 0), "translateX(-50%)");
  seta.style.opacity = prog(t, tBot + .2, tBot + .45); seta.style.transform = "translateX(-50%) translateY(" + (t > tBot ? 22 * Math.abs(Math.sin((t - tBot) * 5)) : 0) + "px)";
  renderer.render(scene, camera);
}
window.renderFrame = quadro;
quadro(0);
window.pronto = true;
</script>
