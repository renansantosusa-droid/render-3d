  etiq.forEach((d, i) => { const p = perto[i]; if (!p) { d.style.display = "none"; return; } const [x, y, ok] = tela(p[2], 1.8 + pos.get(p[0])[1], p[3]); if (!ok) { d.style.display = "none"; return; } d.textContent = "@" + p[1]; d.style.display = "block"; d.style.transform = `translate(${x}px,${y}px) translate(-50%,-100%)`; });
  const ativos = BAL.filter((b) => t >= b.a && t < b.b && pos.has(b.id)).slice(-balPool.length);
  balPool.forEach((d, i) => { const b = ativos[i]; if (!b) { d.style.display = "none"; return; } const p = pos.get(b.id), [x, y] = tela(p[0], 2.6 + p[1], p[2]); d.textContent = b.txt; d.className = "ov bal" + (b.gr ? " gr" : ""); d.style.display = "block"; d.style.transform = `translate(${x}px,${y}px) translate(-50%,-100%)`; });
}
window.renderFrame = renderFrame;
renderFrame(0);
