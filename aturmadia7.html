for (let k = 0; k < 5; k++) { const p = new THREE.Mesh(new THREE.ConeGeometry(.12, .34, 8), ouro); const a = k / 5 * Math.PI * 2; p.position.set(Math.cos(a) * .4, .26, Math.sin(a) * .4); coroa.add(p); }
scene.add(coroa);
const etFund = etiqueta("PREFEITO?", { bg: "#1d5e2a", fg: "#ffd23f", borda: "#1d5e2a", alt: .3 });
// ---------- textos na tela ----------
const mk = (id, cls = "") => { const el = document.createElement("div"); el.id = id; el.className = "ov " + cls; document.body.appendChild(el); return el; };
const flash = document.createElement("div"); flash.id = "flash"; document.body.appendChild(flash);
const elMarca = mk("marca"); elMarca.innerHTML = "A TURMA DO <b>BRASIL</b>";
const elChip = mk("chip"), elCont = mk("cont");
const elCta = mk("cta"); elCta.innerHTML = `<div class="l1">COMENTA SUA CIDADE<br>+ ESTADO</div><div class="l2">pra aparecer no Dia 8 👇</div>`;
const elSeta = mk("seta"); const elLeg = mk("legenda");
const fmt = (n) => n.toLocaleString("pt-BR");
const PL = DADOS.placar;
const CHIPS = [
  [0, T_UMA - .05, "DIA 7", true],
  [C(2), TS_[0] + .1, `BRIGA DAS<br>CIDADES ⚔️`, true],
  [TS_[0] + .1, C(3), `SÃO PAULO<small>${DADOS.extra.top[0].casas} casas 🥇</small>`, true],
  [C(3), TS_[2] + .1, `RIO GRANDE (RS)<small>${DADOS.extra.top[1].casas} casas 😮 coladinho!</small>`, true],
  [TS_[2] + .1, C(4), `MANAUS<small>${DADOS.extra.top[2].casas} casas · 3ª do Brasil</small>`, true],
  [C(4), T_DF + .1, `RORAIMA<small>só ${DADOS.extra.rr} casas 😬</small>`, true],
  [T_DF + .1, T_TUA + .1, `DISTRITO FEDERAL<small>${DADOS.extra.df} casas</small>`, true],
  [T_TUA + .1, C(5), `TUA CIDADE<br>VAI DEIXAR? 👀`, true],
  [C(5), TS2[0] + .1, `DOMINGO 21H 🗳️<small>eleição de novo!</small>`, true],
  [TS2[0] + .1, TS2[1] + .1, `SANTA CATARINA<small>@${DADOS.extra.lider[0].u} · ${DADOS.extra.lider[0].pts} pts 🥇</small>`, true],
  [TS2[1] + .1, TS2[2] + .1, `MINAS GERAIS<small>@${DADOS.extra.lider[1].u} · ${DADOS.extra.lider[1].pts} pts</small>`, true],
  [TS2[2] + .1, C(6), `GOIÁS<small>@${DADOS.extra.lider[2].u} · ${DADOS.extra.lider[2].pts} pts</small>`, true],
  [C(6), P(6, "Comenta") - .05, `MAIS PONTOS<small>= PREFEITO E GOVERNADOR 👑</small>`, true],
];
const PALAVRAS = TEMPOS.cenas.flatMap((c) => c.palavras);
const DESTAQUE = new Set(["dia", "sete", "oito", "brasil", "turma", "quinze", "mil", "casas", "casa", "cidades", "briga", "lidera", "paulo", "rio", "grande", "manaus", "roraima", "distrito", "federal", "domingo", "nove", "noite", "eleicao", "prefeito", "governador", "pontos", "santa", "catarina", "minas", "goias", "tua", "deixar", "segue", "comenta", "estado", "cidade"]);
const esc = (el, k, centro = true) => el.style.transform = (centro ? "translateX(-50%) " : "") + `scale(${k})`;
function textos(t) {
  esc(elMarca, 1 + .06 * pulse(t, P(1, "Turma") - .1, .5));
  // contador e data: sobem junto com as casas nascendo, na ordem real
  const kn = clamp((t - T_OLHA) / (T_CASAS - T_OLHA), 0, 1), nv = entre(t, T_UMA - .05, C(2)), idx = Math.min(N - 1, Math.round(kn * (N - 1)));
  elCont.style.opacity = nv ? 1 : 0;
  if (nv) { const dt = new Date((TS[idx] - 3 * 3600) * 1e3), dia = String(dt.getUTCDate()).padStart(2, "0"), hr = String(dt.getUTCHours()).padStart(2, "0"); elCont.innerHTML = `${kn >= 1 ? "+15 MIL" : fmt(t < T_OLHA ? 1 : Math.max(1, Math.round((idx + 1) * DADOS.placar.casas / N)))}<small>${idx + 1 > 1 || t >= T_UMA ? "CASAS · dia " + dia + "/11, " + hr + "h" : ""}</small>`; elCont.style.transform = "translateX(-50%) translateY(" + (t >= C(2) ? 190 : 0) + "px)"; }
  // chip grande
  const c = CHIPS.find(([a, b]) => entre(t, a, b));
  if (c) { elChip.innerHTML = c[2]; elChip.className = "ov" + (c[3] ? " amarelo" : ""); elChip.style.opacity = 1; elChip.style.fontSize = c[2] === "DIA 7" ? "150px" : "70px"; esc(elChip, .55 + .45 * prog(t, c[0], c[0] + .16) + .12 * pulse(t, c[0] + .08, .3)); }
  else elChip.style.opacity = 0;
  // CTA final
  const tc = P(6, "Comenta") - .05, kc = prog(t, tc, tc + .25);
  elCta.style.opacity = kc; esc(elCta, .6 + .4 * kc + .04 * Math.sin(t * 9) * kc, false);
  elSeta.style.opacity = kc; elSeta.style.transform = `translateY(${18 * Math.abs(Math.sin(t * 5))}px)`;
  // legenda palavra por palavra
  let atual = null; for (const p of PALAVRAS) if (t >= p.t) atual = p;
  if (!atual || t > tc || (c && norm(c[2]).startsWith(norm(atual.w)))) { elLeg.textContent = ""; return; }
  elLeg.textContent = atual.w.toUpperCase(); elLeg.className = "ov" + (DESTAQUE.has(norm(atual.w)) ? " am" : "");
  esc(elLeg, .8 + .2 * prog(t, atual.t, atual.t + .09), false);
}

function quadro(t) {
  const cam = moverCamera(t);
  texMar.offset.set(t * .01, t * .006);
  for (let i = 0; i < N; i++) {
    const [x, z, e] = POS[i], k = Math.max(.0001, clamp(pop(t, QUANDO[i], .35), 0, 1.3) * e * clamp(camera.position.distanceTo(alvo) / 8, 1, 3));
    m4.compose(v3.set(x, ALT, z), q.setFromAxisAngle(eixoY, ROT[i]), s3.setScalar(k)); corpos.setMatrixAt(i, m4); telhados.setMatrixAt(i, m4);
  }
  corpos.instanceMatrix.needsUpdate = telhados.instanceMatrix.needsUpdate = true;
  for (const l of LBL) { const v = l.vezes.find(([a, b]) => entre(t, a, b)); escalaSprite(l.s, v ? pop(t, v[0] + .08) : 0); }
  // coroa + "PREFEITO?" na primeira cidade
  const noCargo = false; coroa.visible = etFund.visible = false;
  if (noCargo) { const [cx, cz] = [0, 0], kp = 0; coroa.scale.setScalar(Math.max(.001, kp * .26)); coroa.rotation.y = t * 1.8; coroa.position.set(cx, ALT + .58 + .02 * Math.sin(t * 4), cz); etFund.position.set(cx, ALT + .86, cz); escalaSprite(etFund, kp); }
  flash.style.opacity = cam.i > 0 ? .35 * clamp(1 - cam.dt / .12, 0, 1) : 0;
  renderer.render(scene, camera);
  textos(t);
}
window.renderFrame = quadro;
quadro(0);
window.pronto = true;
</script>
