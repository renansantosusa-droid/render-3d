<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// Série "O Apagão" — Episódio 4 (2D flat, estilo @historiascomkaio)
const TEMPOS = await (await fetch("/apagao4/tempos.json")).json();
const W = 1080, H = 1920, cv = document.getElementById("c"), g = cv.getContext("2d");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const prog = (t, a, b) => ease(clamp((t - a) / (b - a), 0, 1));
const pulse = (t, a, d = .35) => { const k = (t - a) / d; return k < 0 || k > 1 ? 0 : Math.sin(k * Math.PI); };
const frac = (x) => x - Math.floor(x);
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const CENA = (n) => TEMPOS.cenas[n - 1], C = (n) => CENA(n).ini, F = (n) => CENA(n).fim;
function P(n, w, o = 1) { let k = 0; for (const p of CENA(n).palavras) if (norm(p.w) === norm(w) && ++k === o) return p.t; console.error("palavra nao achada", n, w); return C(n); }
const FALA = TEMPOS.fala, T = TEMPOS.total;
let rs = 1; const rnd = () => { rs = (rs * 16807) % 2147483647; return rs / 2147483647; };

// ---------- paleta ----------
const COR = { fundo: "#e9e2d0", fundoNoite: "#1d2129", predio: "#d9d2c0", linha: "#b9b09a", escuro: "#2a2e36", mostarda: "#e0a83a", vermelho: "#d6453a", azul: "#4a9be0", agua: "#6ab8f0", verde: "#4fae5a", pele: "#e8b48a", cabelo: "#3a2a20", camisa: "#3f6f73", calca: "#3a5a8a", txt: "#2a2e36" };

// ---------- primitivas ----------
const rr = (x, y, w, h, r, cor) => { g.fillStyle = cor; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
const rect = (x, y, w, h, cor) => { g.fillStyle = cor; g.fillRect(x, y, w, h); };
function txt(s, x, y, tam, cor, peso = 700, al = "center") { g.font = `${peso} ${tam}px Oswald`; g.textAlign = al; g.textBaseline = "middle"; g.fillStyle = cor; g.fillText(s, x, y); }
function etiqueta(s, x, y, fundo, cor = "#fff", tam = 34, a = 1) { if (a <= 0) return; g.save(); g.globalAlpha = a; g.font = `700 ${tam}px Oswald`; const w = g.measureText(s).width + tam * .9; const sc = .85 + .15 * Math.min(1, a * 1.5); g.translate(x, y); g.scale(sc, sc); rr(-w / 2, -tam * .75, w, tam * 1.5, 6, fundo); txt(s, 0, 2, tam, cor); g.restore(); }
function cartao(l1, l2, x, y, a = 1, cor2 = "#2a2e36") { if (a <= 0) return; g.save(); g.globalAlpha = a; g.translate(x, y); g.font = "700 64px Oswald"; const w = Math.max(g.measureText(l2).width, 260) + 80; rr(-w / 2, -70, w, 150, 10, "#fdf8ec"); rect(-w / 2, -70, w, 34, COR.mostarda); txt(l1, 0, -53, 24, "#2a2e36"); txt(l2, 0, 22, 64, cor2); g.restore(); }
function pessoa(x, y, s = 1, { camisa = COR.camisa, olhar = 0, braco = 0, cabelo = COR.cabelo, bone = null, cabeca = 0 } = {}) {
  g.save(); g.translate(x, y); g.scale(s, s);
  rect(-26, -150, 20, 150, COR.calca); rect(6, -150, 20, 150, COR.calca);
  rr(-30, -6, 30, 12, 4, "#2a2a2a"); rr(4, -6, 30, 12, 4, "#2a2a2a");
  rr(-38, -290, 76, 150, 18, camisa);
  g.save(); g.translate(30, -275); g.rotate(-braco); rr(-8, 0, 20, 120, 10, camisa); rr(-6, 112, 18, 22, 9, COR.pele); g.restore();
  g.save(); g.translate(-30, -275); rr(-12, 0, 20, 120, 10, camisa); rr(-10, 112, 18, 22, 9, COR.pele); g.restore();
  rect(-10, -312, 20, 26, COR.pele);
  g.save(); g.translate(0, -350); g.rotate(cabeca);
  g.fillStyle = COR.pele; g.beginPath(); g.arc(0, 0, 44, 0, 6.283); g.fill();
  g.fillStyle = cabelo; g.beginPath(); g.arc(0, -6, 46, Math.PI * 1.05, Math.PI * 1.95); g.fill();
  if (bone) { g.fillStyle = bone; g.beginPath(); g.arc(0, -10, 47, Math.PI, 0); g.fill(); rect(0, -14, 64, 10, bone); }
  g.fillStyle = "#222"; g.beginPath(); g.arc(-14 + olhar * 8, 4, 5, 0, 6.283); g.arc(14 + olhar * 8, 4, 5, 0, 6.283); g.fill();
  g.strokeStyle = "#222"; g.lineWidth = 4; g.beginPath(); g.moveTo(-22 + olhar * 8, -10); g.lineTo(-6 + olhar * 8, -7); g.moveTo(6 + olhar * 8, -7); g.lineTo(22 + olhar * 8, -10); g.stroke();
  g.beginPath(); g.moveTo(-8, 22); g.lineTo(8, 22); g.stroke();
  g.restore(); g.restore();
}
// cidade ao fundo
const PREDIOS = Array.from({ length: 14 }, (_, i) => ({ x: -40 + i * 82 + rnd() * 30, w: 90 + rnd() * 70, h: 380 + rnd() * 620, c: ["#cfc8b4", "#bdb6a2", "#d8d0bc", "#c4bca6"][i % 4], j: Array.from({ length: 80 }, () => rnd()) }));
function cidade(chao, luz, noite) {
  for (const p of PREDIOS) { rect(p.x, chao - p.h, p.w, p.h, noite ? "#2c313b" : p.c);
    for (let r = 0; r < Math.floor(p.h / 46) - 1; r++) for (let c = 0; c < Math.floor(p.w / 34); c++) { const j = p.j[(r * 7 + c) % 80]; const acesa = j < luz * .75; rect(p.x + 10 + c * 34, chao - p.h + 18 + r * 46, 20, 26, acesa ? "#f2c45a" : (noite ? "#1d2129" : "#a8a090")); } }
  rect(0, chao, W, H - chao, noite ? "#15181e" : "#8a8574");
}
// prédio em corte (diagrama que volta sempre)
const PX = 190, PW = 580, NF = 12, FH = 82, PBASE = 1660;
const yAndar = (n) => PBASE - n * FH;
function predio(t, { luz = 1, noite = false, nivel = 1, bomba = false, fluxoSobe = false, chuveiros = 0, destaque = true, chia = false, aguaDiego = 0 }) {
  // caixa d'água
  const cx = PX + PW - 150, cy = yAndar(NF) - 150;
  rect(cx + 20, cy + 110, 12, 40, "#777"); rect(cx + 108, cy + 110, 12, 40, "#777");
  rr(cx, cy, 140, 110, 6, noite ? "#3a4250" : "#c8d6e0");
  rect(cx + 6, cy + 6 + 98 * (1 - nivel), 128, 98 * nivel, COR.agua);
  txt("CAIXA D'ÁGUA", cx + 70, cy - 22, 24, noite ? "#cfd6e0" : COR.txt);
  // andares
  for (let n = 0; n < NF; n++) { const y = yAndar(n + 1);
    const eh9 = n + 1 === 9 && destaque;
    rect(PX, y, PW, FH - 4, eh9 ? COR.mostarda : (noite ? "#2c313b" : COR.predio));
    rect(PX, y + FH - 4, PW, 4, noite ? "#1d2129" : COR.linha);
    for (let k = 0; k < 4; k++) rect(PX + 40 + k * 130, y + 18, 76, 40, luz > (n * 4 + k) % 7 / 7 ? "#f2c45a" : (noite ? "#1d2129" : "#a8a090"));
    txt(`${n + 1}º`, PX - 36, y + FH / 2, 26, noite ? "#aab" : COR.txt, 500);
    if (chuveiros && (n * 5 + 3) % 4 === 0 && n !== 8) for (let d = 0; d < 6; d++) { const k = frac(t * 1.6 + d / 6); g.fillStyle = COR.agua; g.beginPath(); g.arc(PX + 130 + (d % 3) * 14, y + 10 + k * 40, 4, 0, 6.283); g.fill(); }
    if (chia) { g.globalAlpha = .4 + .4 * Math.sin(t * 20 + n); txt("SSS", PX + 400, y + FH / 2, 22, "#9ab", 500); g.globalAlpha = 1; }
  }
  if (destaque) { txt("◀ DIEGO", PX + PW + 90, yAndar(9) + FH / 2, 30, COR.mostarda === "#e0a83a" && noite ? "#f2c45a" : COR.txt); }
  // cano da bomba até a caixa
  const canoX = PX + PW + 24;
  rect(canoX - 7, cy + 50, 14, PBASE + 40 - cy - 50, noite ? "#4a5260" : "#9aa4ae"); rect(canoX - 7, cy + 50, cx - canoX + 7, 14, noite ? "#4a5260" : "#9aa4ae");
  if (fluxoSobe) for (let d = 0; d < 14; d++) { const k = frac(t * .5 + d / 14); g.fillStyle = COR.azul; g.beginPath(); g.arc(canoX, PBASE + 40 - k * (PBASE + 40 - cy - 57), 6, 0, 6.283); g.fill(); }
  // bomba
  rr(canoX - 46, PBASE + 20, 92, 60, 8, bomba ? "#5a6a7a" : "#8a3a34"); txt("BOMBA", canoX, PBASE + 50, 22, "#fff");
  rect(PX - 60, PBASE, PW + 200, 400, noite ? "#15181e" : "#8a8574");
}
// cômodos
function banheiro(t, k160) {
  rect(0, 0, W, H, "#e6ecef"); for (let y = 0; y < 1500; y += 60) rect(0, y, W, 2, "#cdd8de"); for (let x = 0; x < W; x += 60) rect(x, 0, 2, 1500, "#cdd8de");
  rect(0, 1500, W, 420, "#b9b2a0");
  // banheira
  rr(120, 1300, 520, 200, 30, "#fafafa"); rect(140, 1320 + 160 * (1 - Math.min(1, k160 * 1.6)), 480, 160 * Math.min(1, k160 * 1.6), COR.agua);
  rr(110, 1290, 540, 30, 14, "#f2f2f2");
  return 1500;
}
function cozinha(noite) { rect(0, 0, W, H, noite ? "#262a33" : "#efe6d4"); for (let x = 0; x < W; x += 80) rect(x, 0, 2, 1500, noite ? "#2e333c" : "#e2d8c2"); rect(0, 1500, W, 420, noite ? "#1a1d23" : "#a89a80"); }

// ---------- legenda (blocos de 3 palavras, palavra-chave colorida) ----------
const CHAVE = { farol: COR.mostarda, problema: COR.vermelho, placas: COR.azul, solares: COR.azul, osvaldo: COR.mostarda, inversor: COR.vermelho, choque: COR.mostarda, bateria: COR.verde, guardada: COR.verde, gerada: COR.mostarda, troca: COR.mostarda, celulares: COR.verde, seguindo: COR.vermelho, mora: COR.vermelho,  agua: COR.azul, erro: COR.vermelho, bomba: COR.mostarda, luz: COR.mostarda, apaga: COR.mostarda, botijao: COR.mostarda, fogo: "#ff8a3a", geladeira: COR.azul, regra: COR.vermelho, papel: COR.mostarda, sindico: COR.vermelho, lista: COR.vermelho, topo: COR.vermelho, diego: COR.mostarda, caixa: COR.azul, chiar: COR.vermelho, litros: COR.azul, comida: COR.mostarda, secado: COR.vermelho, porta: COR.vermelho };
const blocos = []; for (const c of TEMPOS.cenas) { const ws = c.palavras; for (let i = 0; i < ws.length; i += 3) blocos.push({ t: ws[i].t, ws: ws.slice(i, i + 3).map((p) => p.w.replace(/[.,!?;:"]+$/, "")) }); }
function legenda(t, y = 1290) {
  if (t > FALA + .2) return; let b = null; for (const x of blocos) if (t >= x.t) b = x; if (!b) return;
  g.font = "700 78px Oswald"; const ps = b.ws.map((w) => w.toUpperCase()); const larg = ps.map((w) => g.measureText(w + " ").width); let x = W / 2 - larg.reduce((a, c) => a + c, 0) / 2;
  const k = Math.min(1, (t - b.t) / .1);
  ps.forEach((w, i) => { g.textAlign = "left"; g.textBaseline = "middle"; g.lineWidth = 12; g.strokeStyle = "rgba(0,0,0,.75)"; g.lineJoin = "round"; g.strokeText(w, x, y + (1 - k) * 12); g.fillStyle = CHAVE[norm(w)] || "#fff"; g.fillText(w, x, y + (1 - k) * 12); x += larg[i]; });
}

// ---------- quadro ----------
const zoom = (k, fn) => { g.save(); g.translate(W / 2, 1500); g.scale(k, k); g.translate(-W / 2, -1500); fn(); g.restore(); };
const OSVALDO = { camisa: "#8a4a3a", cabelo: "#cfcfcf", olhar: -1 };
function brilho(x, y, r, a) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(255,214,120,${a})`); gr.addColorStop(1, "rgba(255,214,120,0)"); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
function sobrado(x, y, aceso = 1, placas = true) { // y = chão
  rect(x - 220, y - 520, 440, 520, "#3a3a46"); g.fillStyle = "#2a2a34"; g.beginPath(); g.moveTo(x - 260, y - 520); g.lineTo(x, y - 720); g.lineTo(x + 260, y - 520); g.fill();
  if (placas) for (let i = 0; i < 3; i++) { g.save(); g.translate(x - 170 + i * 80, y - 600 + i * -10); g.rotate(-.65); rr(0, 0, 70, 44, 3, "#1a3a8a"); g.strokeStyle = "#5a7ad0"; g.lineWidth = 2; g.strokeRect(4, 4, 62, 36); g.restore(); }
  rr(x - 150, y - 430, 120, 110, 6, aceso ? "#ffd878" : "#1d2129"); rr(x + 30, y - 430, 120, 110, 6, "#1d2129"); rr(x - 50, y - 220, 100, 220, 6, "#5a3a24");
  if (aceso) brilho(x - 90, y - 375, 260, .45 * aceso);
}
function rua(t) { rect(0, 0, W, H, COR.fundoNoite); for (let i = 0; i < 60; i++) { g.fillStyle = "rgba(255,255,255,.5)"; g.fillRect((i * 97) % W, (i * 53) % 500, 3, 3); } cidade(1500, 0, true); }
function seguidor(x, y, s) { g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = "#050608"; g.beginPath(); g.ellipse(0, -350, 46, 52, 0, 0, 6.283); g.fill(); g.fillRect(-42, -300, 84, 150); g.fillRect(-30, -150, 24, 150); g.fillRect(6, -150, 24, 150); g.fillStyle = "#9aff6a"; g.fillRect(-18, -356, 10, 4); g.fillRect(8, -356, 10, 4); g.restore(); }
function bloco(x, y, w, h, cor, titulo, sub) { rr(x - w / 2, y - h / 2, w, h, 14, cor); txt(titulo, x, y - 12, 34, "#fff"); if (sub) txt(sub, x, y + 28, 22, "#fff", 500); }
function seta(x0, y0, x1, y1, cor) { g.strokeStyle = cor; g.lineWidth = 8; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); const a = Math.atan2(y1 - y0, x1 - x0); g.fillStyle = cor; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - 22 * Math.cos(a - .5), y1 - 22 * Math.sin(a - .5)); g.lineTo(x1 - 22 * Math.cos(a + .5), y1 - 22 * Math.sin(a + .5)); g.fill(); }
window.renderFrame = (t) => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
  const em = (a, b) => t >= a && t < b;
  if (t < C(2)) { // CENA 1: o farol
    rua(t); const p = PREDIOS[9]; const jx = p.x + 10 + 34, jy = 1500 - p.h + 18 + 2 * 46; brilho(jx + 10, jy + 13, 120 + 10 * Math.sin(t * 3), .6); rect(jx, jy, 20, 26, "#ffd878");
    cartao("APAGÃO · DIA 3", "23:45", W / 2, 330, prog(t, 0, .4) * (t < P(1, "ajuda") - .3 ? 1 : 0));
    if (t > P(1, "ajuda") - .3) etiqueta(t > P(1, "problema") - .3 ? "…E CHAMA PROBLEMA" : "CHAMA AJUDA…", W / 2, 330, t > P(1, "problema") - .3 ? COR.vermelho : COR.verde, "#fff", 50, 1);
  } else if (t < C(3)) { // CENA 2: atravessando o bairro
    rect(0, 0, W, H, COR.fundoNoite); for (let i = 0; i < 60; i++) { g.fillStyle = "rgba(255,255,255,.5)"; g.fillRect((i * 97) % W, (i * 53) % 500, 3, 3); }
    rect(0, 1500, W, 420, "#15181e"); for (let x = 20; x < W; x += 180) rect(x, 1640, 100, 10, "#3a3d44");
    sobrado(780, 1500, 1, t > P(2, "placas") - .4);
    const k = prog(t, C(2), P(2, "janela"));
    zoom(1, () => pessoa(120 + 360 * k, 1500, .7, { olhar: 1, braco: Math.sin(t * 8) * .3 }));
    etiqueta("4 QUARTEIRÕES NO ESCURO", W / 2, 330, COR.escuro, "#fff", 44, prog(t, P(2, "quatro") - .3, P(2, "quatro")) * (t < P(2, "sobrado") - .3 ? 1 : 0));
    if (t > P(2, "placas") - .3) etiqueta("PLACAS SOLARES", 780, 680, COR.azul, "#fff", 36, 1);
  } else if (t < C(4)) { // CENA 3: Seu Osvaldo
    rect(0, 0, W, H, "#2a2420"); brilho(W / 2, 700, 700, .35); rect(0, 1500, W, 420, "#1a1612");
    rr(560, 700, 320, 800, 6, "#ffe0a0"); zoom(1.3, () => { pessoa(700, 1500, 1, { ...OSVALDO }); pessoa(300, 1500, .95, { olhar: 1 }); });
    cartao("SEU OSVALDO", "ELETRICISTA, 70 ANOS", W / 2, 330, prog(t, P(3, "osvaldo") - .3, P(3, "osvaldo")), COR.mostarda);
  } else if (t < C(5)) { // CENA 4: por que as outras placas apagaram
    rect(0, 0, W, H, COR.fundo); g.save(); g.translate(540, 760); g.scale(1, 1); g.translate(-540, -760);
    const k2 = t > P(4, "diferenca") - .3;
    if (!k2) {
      txt("CASA COM PLACA, SEM BATERIA", W / 2, 480, 40, COR.txt);
      bloco(240, 700, 300, 120, COR.azul, "PLACA", "gera de dia"); seta(390, 700, 470, 700, COR.txt);
      bloco(620, 700, 280, 120, t > P(4, "desliga") - .3 ? COR.vermelho : "#6a7684", "INVERSOR", t > P(4, "desliga") - .3 ? "DESLIGA SOZINHO" : ""); seta(760, 700, 830, 700, COR.txt);
      bloco(940, 700, 200, 120, "#2a2e36", "CASA", "no escuro");
      if (t > P(4, "choque") - .4) { rect(500, 900, 20, 500, "#6a5a4a"); rect(420, 900, 180, 14, "#6a5a4a"); zoom(1, () => pessoa(560, 1380, .6, { camisa: "#e07a2a", bone: "#f2e040" })); etiqueta("⚡ PRA NÃO DAR CHOQUE NO ELETRICISTA", W / 2, 1100, COR.mostarda, "#fff", 34, 1); }
    } else {
      txt("A CASA DO SEU OSVALDO", W / 2, 480, 40, COR.txt);
      bloco(220, 700, 260, 120, COR.azul, "PLACA", "de dia"); seta(350, 700, 420, 700, COR.txt);
      bloco(560, 700, 240, 120, COR.verde, "BATERIA", "guarda"); seta(680, 700, 760, 700, COR.txt);
      bloco(900, 700, 240, 120, "#e0a83a", "LUZ", "de noite 💡"); brilho(900, 700, 220, .4);
      cartao("A DIFERENÇA", "BATERIA 🔋", W / 2, 1000, prog(t, P(4, "bateria") - .3, P(4, "bateria")), COR.verde);
    }
    g.restore();
  } else if (t < C(6)) { // CENA 5: regra 4
    rect(0, 0, W, H, COR.escuro); txt("REGRA Nº 4 DO APAGÃO", W / 2, 760, 44, COR.mostarda, 500);
    g.globalAlpha = prog(t, P(5, "guardada") - .4, P(5, "guardada")); txt("ENERGIA GUARDADA", W / 2, 880, 88, COR.verde);
    g.globalAlpha = prog(t, P(5, "gerada") - .5, P(5, "gerada")); txt("VALE MAIS QUE GERADA.", W / 2, 990, 80, "#fff"); g.globalAlpha = 1;
  } else if (t < C(7)) { // CENA 6: a troca
    rect(0, 0, W, H, "#2a2420"); brilho(W / 2, 800, 700, .3);
    rr(140, 700, 260, 360, 30, "#4a7ab0"); rect(160, 760, 220, 280, COR.agua); txt("ÁGUA", 270, 1100, 44, "#fff");
    seta(440, 820, 640, 820, COR.mostarda); seta(640, 920, 440, 920, COR.mostarda);
    for (let i = 0; i < 6; i++) { const x = 700 + (i % 3) * 110, y = 720 + Math.floor(i / 3) * 220; rr(x, y, 80, 150, 14, "#111"); const nivel = Math.min(1, ((t - P(6, "carrega") + i * .2) % 2) / 2 + .2); rr(x + 10, y + 140 - 120 * nivel, 60, 120 * nivel, 6, COR.verde); }
    txt("CELULARES DO PRÉDIO", 810, 1210, 34, "#fff");
    etiqueta("A TROCA", W / 2, 330, COR.mostarda, "#fff", 56, prog(t, P(6, "troca") - .3, P(6, "troca")));
  } else if (t < C(8)) { // CENA 7: no papel
    rua(t); zoom(1, () => pessoa(560, 1500, 1.15, { olhar: -1 }));
    etiqueta("NO PAPEL… A TROCA PERFEITA", W / 2, 330, "#fdf8ec", COR.txt, 44, prog(t, P(7, "papel") - .3, P(7, "papel")));
  } else if (t < FALA + .3) { // CENA 8: alguém seguindo
    if (t < P(8, "e") - .2) {
      rua(t); const k = prog(t, C(8), P(8, "sobrado") + .5);
      zoom(1, () => pessoa(720, 1500, 1.15, { olhar: t > P(8, "percebe") ? 1 : -1, cabeca: t > P(8, "percebe") ? .1 : 0 }));
      seguidor(140 + 160 * k, 1500, 1.05);
      if (t > P(8, "seguindo") - .3) etiqueta("ALGUÉM TÁ SEGUINDO", W / 2, 330, COR.vermelho, "#fff", 50, 1);
    } else {
      rect(0, 0, W, H, COR.fundoNoite); predio(t, { luz: 0, noite: true, nivel: .25 });
      seguidor(PX - 120, PBASE + 10, .45);
      g.strokeStyle = COR.vermelho; g.lineWidth = 6; g.setLineDash([14, 10]); g.beginPath(); g.moveTo(PX - 80, PBASE - 120); g.lineTo(PX + PW + 40, yAndar(9) + FH / 2); g.stroke(); g.setLineDash([]);
      etiqueta("ELE SABE ONDE O DIEGO MORA", W / 2, 330, COR.vermelho, "#fff", 46, prog(t, P(8, "sabe") - .3, P(8, "sabe")));
    }
  } else { // CARD FINAL
