<script type="module">
// A Volta da Afogada (paródia) — Cap.1 (@avenidabrasiliaa)
import { kit2d } from "/cena2d.js";
const TEMPOS = await (await fetch("/morta5/tempos.json")).json();
const W = 1080, H = 1920, cv = document.getElementById("c"), g = cv.getContext("2d");
const K = kit2d(g, W, H);
const { clamp, rr, rect, circ, txt, glow, vinheta, tinta, camera, pessoa, adesivo, balao } = K;
const prog = (t, a, b) => K.ease(clamp((t - a) / (b - a), 0, 1)), lin = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const CENA = (n) => TEMPOS.cenas[n - 1], C = (n) => CENA(n).ini, F = (n) => CENA(n).fim;
function P(n, w, o = 1) { let k = 0; for (const p of CENA(n).palavras) if (norm(p.w) === norm(w) && ++k === o) return p.t; console.error("palavra nao achada", n, w); return C(n); }
const FALA = TEMPOS.fala;
const piscar = (t, f = 0) => ((t + f) % 3.9) < .12 ? .1 : 1;
const CAMILA = { sexo: "f", cabelo: "#f0c860", roupa: "#c0304a", calca: "#2a2a3a", pele: "#f0c0a0" };
const MEX = { sexo: "m", cabelo: "#5a3a20", roupa: "#2a2a2a", calca: "#1a1a22", pele: "#e0aa86" };
const GENI = { sexo: "m", cabelo: "#9a9a9a", roupa: "#6a8a5a", calca: "#4a4a3a", pele: "#d9a07a", bigode: true };
const TINA = { sexo: "f", cabelo: "#1a1410", roupa: "#e0a83a", calca: "#3a5a8a", pele: "#c88a5a" };
const CICLONE = { sexo: "m", cabelo: "#1a1410", roupa: "#c0302a", calca: "#f2f2f2", pele: "#a86a44" };
const LUCINHA = { sexo: "f", cabelo: "#bbb", roupa: "#6a5a8a", calca: "#4a3a5a", pele: "#a86a4a" };
const NICO = { sexo: "m", cabelo: "#2a1a10", roupa: "#4a7a5a", calca: "#3a3a3a", pele: "#b87a50" };
const LINA = { sexo: "f", cabelo: "#1a1410", roupa: "#f4f4f4", calca: "#2a2a2a", pele: "#c88a5a" };
const CHAO = 1460;

// ---------- legenda ----------
const CHAVE = { barco: "#6ab8f0", colar: "#4fae5a", partida: "#e0a83a", ovo: "#e0a83a", mar: "#6ab8f0", motor: "#e0a83a", navio: "#6ab8f0", afundou: "#d6453a", regra: "#e0a83a", perigosa: "#d6453a", bau: "#e0a83a", acidente: "#d6453a", casco: "#d6453a", branco: "#e0a83a", falsas: "#d6453a", embaixo: "#6ab8f0", papel: "#6ab8f0", holofote: "#e0a83a", costeira: "#6ab8f0", odete: "#d6453a", megafone: "#e0a83a" };
const blocos = []; for (const c of TEMPOS.cenas) { const ws = c.palavras; for (let i = 0; i < ws.length; i += 3) blocos.push({ t: ws[i].t, ws: ws.slice(i, i + 3).map((p) => p.w.replace(/[.,!?;:"]+$/, "")) }); }
function legenda(t, y = 1620) {
  if (t > FALA + .2) return; let b = null; for (const x of blocos) if (t >= x.t) b = x; if (!b) return;
  g.font = "700 80px Oswald"; const ps = b.ws.map((w) => w.toUpperCase()); const larg = ps.map((w) => g.measureText(w + " ").width); let x = W / 2 - larg.reduce((a, c) => a + c, 0) / 2;
  const k = Math.min(1, (t - b.t) / .1);
  ps.forEach((w, i) => { g.textAlign = "left"; g.textBaseline = "middle"; g.lineWidth = 13; g.strokeStyle = "rgba(0,0,0,.8)"; g.lineJoin = "round"; g.strokeText(w, x, y + (1 - k) * 12); g.fillStyle = CHAVE[norm(w)] || "#fff"; g.fillText(w, x, y + (1 - k) * 12); x += larg[i]; });
}
function marca(t) { if (t > FALA + .3) return; g.save(); g.shadowColor = "rgba(0,0,0,.8)"; g.shadowBlur = 10; txt("A Volta da Afogada", 60, 110, 46, "#fff", "italic 700", "left", "Playfair Display"); txt("CAPÍTULO 5 · PARÓDIA", 62, 160, 24, "#f0c860", 500, "left"); g.restore(); }
function cifrao(t, x, y) { for (let i = 0; i < 6; i++) { const k = (t * .6 + i / 6) % 1; g.globalAlpha = 1 - k; txt("$", x + Math.sin(i * 2.1) * 120, y - k * 260, 54 + i * 4, "#4fae5a"); } g.globalAlpha = 1; }
// busto em close
function motorista(cx, cy, o) { g.save(); g.beginPath(); g.rect(cx - 90, cy - 70, 190, 90); g.clip(); circ(cx + 60, cy - 10, 30, o.pele); g.fillStyle = o.cabelo; g.beginPath(); g.arc(cx + 60, cy - 18, 31, Math.PI, 0); g.fill(); g.restore(); }
function close(o, s, cy = 1500, x = W / 2) { g.save(); g.translate(x, cy + 330 * s - 400); g.scale(s, s); pessoa(0, 0, 1, o); g.restore(); }
function etiquetaNome(nome, sub, x, y, a, cor = "#d6453a") { if (a <= 0) return; g.save(); g.globalAlpha = a; g.font = "700 44px Oswald"; const w = Math.max(g.measureText(nome).width, 160) + 50; rr(x - w / 2, y - 40, w, 80, 10, "#fdf8ec"); rr(x - w / 2, y - 64, w, 30, 8, cor); txt(sub, x, y - 49, 20, "#fff"); txt(nome, x, y + 2, 44, "#1d2129"); g.restore(); }

const JORJAO = { sexo: "m", cabelo: "#4a2a14", roupa: "#2a6a9a", calca: "#2a2a3a", pele: "#e0aa86" };
function quintal(t) { g.fillStyle = "#9ad0f0"; g.fillRect(0, 0, W, H); K.circ(880, 260, 70, "#fff2b0"); rect(0, 1100, W, 820, "#6aa84a"); for (let i = 0; i < 40; i++) rect((i * 97) % W, 1120 + (i * 53) % 700, 6, 22, "#5a9a3a"); rect(0, 900, W, 14, "#e8dccb"); for (let x = 0; x < W; x += 60) rect(x, 820, 50, 290, "#efe2c4");
  g.strokeStyle = "#555"; g.lineWidth = 3; g.beginPath(); g.moveTo(40, 560); g.lineTo(1040, 600); g.stroke(); [["#e04a4a", 160], ["#4a8ae0", 360], ["#f2f2f2", 560], ["#e0c040", 760]].forEach(([c, x]) => { rr(x, 570 + (x - 40) * .04, 110, 140, 10, c); });
  rr(760, 200, 260, 300, 8, "#f4ead8"); rr(776, 216, 228, 268, 4, "#8ab0d0"); }
function janelaCamila(t) { g.save(); g.beginPath(); g.rect(776, 216, 228, 268); g.clip(); g.fillStyle = "#e6d6b8"; g.fillRect(776, 216, 228, 268); g.translate(890, 720); g.scale(.9, .9); pessoa(0, 0, 1, { ...CAMILA, roupa: "#1a1a1a", expr: "bravo", olhar: -1 }); g.restore(); }

function caixaFotos(x, y, s) { g.save(); g.translate(x, y); g.scale(s, s); rr(-110, -60, 220, 120, 10, "#8a5a3a"); rr(-120, -80, 240, 34, 8, "#6a4a2a"); rr(-60, -100, 90, 70, 4, "#fbf6ea"); g.restore(); }
function quartinhoQ(t) { K.parede(0, CHAO, "#a8a090", "#8a8274"); K.pisoMadeira(CHAO, "#6a4a30", 1); K.rodape(CHAO, "#c8c0b0"); rr(560, CHAO - 260, 480, 200, 20, "#7a6a8a"); rr(560, CHAO - 300, 160, 70, 24, "#efe8de"); rect(120, 300, 2, 260, "#333"); circ(121, 580, 30, "#ffe8a0"); K.glow(121, 600, 520, "rgba(255,220,150,A)", .45); tinta("#0a1030", .3); }
function dupla(a, b, s = 2.0, xa = 330, xb = 760) { g.save(); g.translate(xa, 1500 + 330 * s - 400); g.scale(s, s); pessoa(0, 0, 1, a); g.restore(); g.save(); g.translate(xb, 1500 + 330 * s - 400); g.scale(s, s); pessoa(0, 0, 1, b); g.restore(); }
function escadaMansao(t) { K.mansao(CHAO, t); for (let i = 0; i < 10; i++) { rr(560 + i * 50, CHAO - 80 - i * 70, 520, 24, 4, "#efe2c4"); rect(560 + i * 50, CHAO - 56 - i * 70, 520, 46, "#e2d2b0"); } g.strokeStyle = "#c8a040"; g.lineWidth = 8; g.beginPath(); g.moveTo(560, CHAO - 200); g.lineTo(1060, CHAO - 900); g.stroke(); }
function fachada(t) {
  g.fillStyle = "#f2b880"; g.fillRect(0, 0, W, 1250); K.glow(180, 300, 400, "rgba(255,230,170,A)", .5);
  g.fillStyle = "#c8a890"; g.beginPath(); g.moveTo(80, 520); g.lineTo(W / 2, 300); g.lineTo(W - 80, 520); g.fill();
  rr(120, 510, 840, 740, 6, "#f4ead8"); for (const x of [150, 400, 640, 890]) rr(x, 560, 40, 690, 4, "#e6d6b8");
  for (const [x, y] of [[200, 620], [200, 900], [460, 900]]) { rr(x, y, 160, 200, 4, "#c8a040"); rr(x + 10, y + 10, 140, 180, 2, "#5a6a7a"); }
  rr(700, 620, 220, 240, 4, "#c8a040"); rr(710, 630, 200, 220, 2, "#e6d6b8");
  g.save(); g.beginPath(); g.rect(710, 630, 200, 220); g.clip(); pessoa(810, 1090, .8, { ...CAMILA, roupa: "#1a1a1a", expr: "sorriso", olhar: -1, celular: true, braco: 2.7, piscaD: (t % 1.1) < .3 ? 1 : 0 }); g.restore();
  rr(700, 900, 220, 350, 4, "#6a4a30");
  rect(0, 1250, W, 670, "#6aa84a"); g.fillStyle = "#d8c8a8"; g.beginPath(); g.moveTo(700, 1250); g.lineTo(920, 1250); g.lineTo(1080, 1920); g.lineTo(520, 1920); g.fill();
  for (let x = 10; x < W; x += 70) rect(x, 1180, 12, 420, "#2a2a2a"); rect(0, 1180, W, 16, "#2a2a2a"); rect(0, 1440, W, 12, "#2a2a2a");
  for (let x = 46; x < W; x += 70) circ(x - 30, 1176, 9, "#c8a040");
}
function mala(x, y, s = 1, rot = 0) { g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s); rr(-60, -150, 120, 150, 14, "#8a4a2a"); rect(-60, -110, 120, 8, "#6a3a1a"); g.strokeStyle = "#3a2010"; g.lineWidth = 10; g.beginPath(); g.arc(0, -150, 26, Math.PI, 0); g.stroke(); g.restore(); }
function avental(x, y, s) { g.save(); g.translate(x, y); g.scale(s, s); rr(-42, -330, 84, 170, 12, "#e0a83a"); rr(-26, -370, 52, 46, 8, "#e0a83a"); rect(-50, -300, 100, 8, "#c08a2a"); g.restore(); }
function vapor(t, x, y, a = 1) { for (let i = 0; i < 4; i++) { const k = (t * .5 + i / 4) % 1; g.globalAlpha = a * (1 - k) * .6; g.strokeStyle = "#fff"; g.lineWidth = 10; g.beginPath(); g.moveTo(x - 40 + i * 26, y); for (let j = 1; j < 8; j++) g.lineTo(x - 40 + i * 26 + Math.sin(j + t * 3 + i) * 16, y - j * 40 * (0.6 + k)); g.stroke(); } g.globalAlpha = 1; }
function jantar(t, cic, cam, raspa = 0) {
  K.parede(0, CHAO, "#e6d6b8", "#d4c2a0"); K.quadro(380, 300, 320, 220, K.fotoFamilia, "#c8a040"); K.pisoMadeira(CHAO, "#7a5236"); K.rodape(CHAO);
  pessoa(300, CHAO + 40, 1.08, { ...CICLONE, roupa: "#5a7ab0", calca: "#5a7ab0", sentado: true, olhar: .6, ...cic });
  pessoa(780, CHAO + 40, 1.08, { ...CAMILA, roupa: "#1a1a1a", sentado: true, olhar: -.6, ...cam });
  K.mesaJantar(120, CHAO + 200, 840, t); K.pendente(540, 380, 1);
  rr(500, CHAO - 250, 110, 70, 30, "#3a2a20"); K.elip(555, CHAO - 250, 55, 14, "#2a1a10"); // panela de feijoada
  rr(840, CHAO - 260, 26, 60, 6, "rgba(160,20,40,.85)"); rect(850, CHAO - 200, 6, 30, "#ddd"); // taça de vinho
}
// ---------- apoio comum dos episódios 2D (entra antes do renderFrame) ----------
const fundo = (c) => { g.fillStyle = c; g.fillRect(0, 0, W, H); };
const um = (o, s = 2.3, x = W / 2, dy = 260) => { g.save(); g.translate(x, 1900 + 330 * s - 400 - dy); g.scale(s, s); pessoa(0, 0, 1, o); g.restore(); };
const par = (a, b, s = 1.9, xa = 330, xb = 760, dy = 280) => { um(a, s, xa, dy); um(b, s, xb, dy); };
const desat = (a = .75) => { g.save(); g.globalCompositeOperation = "saturation"; g.fillStyle = `rgba(128,128,128,${a})`; g.fillRect(0, 0, W, H); g.restore(); };
const congela = (t, a) => { if (t < a) return false; desat(.8); g.fillStyle = `rgba(214,48,74,${.15 * prog(t, a, a + .4)})`; g.fillRect(0, 0, W, H); return true; };
const flash = (rot, txt2, cor = "#555") => { desat(); K.tinta("#3a2a10", .15); K.vinheta(.6); adesivo(rot, txt2, 1, 330, cor); };
function ficha(s, y, a, cor = "#d6453a", x = W / 2) { if (a <= 0) return; g.save(); g.globalAlpha = Math.min(1, a); g.font = "700 46px Oswald"; const w = g.measureText(s).width + 50; rr(x - w / 2, y - 36, w, 72, 10, cor); txt(s, x, y + 2, 46, "#fff"); g.restore(); }
function papel(titulo, linhas, k = 1, y = 900, rot = -.04) { g.save(); g.translate(W / 2, y); g.rotate(rot); g.scale(.85 + .15 * k, .85 + .15 * k); rr(-330, -400, 660, 800, 8, "#fdfbf6"); txt(titulo, 0, -330, 34, "#333", 800, "center", "Nunito"); rect(-290, -290, 580, 3, "#ccc"); linhas.forEach((l, i) => { if (typeof l === "string") txt(l, -280, -220 + i * 90, 34, "#222", 700, "left", "Nunito"); else rect(-280, -230 + i * 90, l, 16, "#c8c8c8"); }); g.restore(); }
function cardFinal(t, perg, a, b, rod, sub, tam = 46, fundoCor = "#0e0f14") { rect(0, 0, W, H, fundoCor); K.glow(W / 2, 700, 600, "rgba(214,69,58,A)", .2); const al = prog(t, FALA + .3, FALA + .8); g.globalAlpha = al; let ts = 92; g.font = `700 ${ts}px Oswald`; while (g.measureText(perg).width > 980) { ts -= 4; g.font = `700 ${ts}px Oswald`; } txt(perg, W / 2, 700, ts, "#fff"); rr(110, 820, 410, 116, 58, "#d6453a"); txt(a, 315, 880, tam, "#fff"); rr(560, 820, 410, 116, 58, "#4fae5a"); txt(b, 765, 880, tam, "#fff"); txt("COMENTA 👇", W / 2, 1040, 46, "#e0a83a"); txt(sub, W / 2, 1110, 34, "#bbb", 500); txt(rod, W / 2, 1500, 26, "#666", 500); g.globalAlpha = 1; }
function hudFases(t, fases) { if (t > FALA + .3) return; let h = fases[0]; for (const x of fases) if (t >= x[0]) h = x; K.hud(t, h[1], h[2], h[3]); }
function chuva(t, a = .5) { g.strokeStyle = `rgba(200,220,240,${a})`; g.lineWidth = 3; for (let i = 0; i < 80; i++) { const x = (i * 137) % W, y = ((i * 251 + t * 1600) % (H + 200)) - 100; g.beginPath(); g.moveTo(x, y); g.lineTo(x - 14, y + 50); g.stroke(); } }
const LEONOR = { sexo: "f", cabelo: "#2a1a10", roupa: "#1a1a1a", calca: "#1a1a1a", pele: "#e8b48a" };
const ODETE = { sexo: "f", cabelo: "#c0302a", roupa: "#e0a83a", calca: "#2a2a3a", pele: "#c88a5a" };
const ADV = { sexo: "m", cabelo: "#5a5a5a", roupa: "#2a2a2a", calca: "#1a1a22", pele: "#d9a07a", bigode: true, oculos: true };
const ZULEICA = { sexo: "f", cabelo: "#3a2a1a", roupa: "#3a3a4a", calca: "#3a3a4a", pele: "#a86a4a" };
function chapeu(x, y, s) { g.save(); g.translate(x, y); g.scale(s, s); K.elip(0, -470, 120, 24, "#2a1a10"); rr(-55, -540, 110, 70, 20, "#2a1a10"); rect(-55, -490, 110, 12, "#c0302a"); g.restore(); }

const pulso = (t, a, d = .35) => { const k = (t - a) / d; return k < 0 || k > 1 ? 0 : Math.sin(k * Math.PI); };
function quintalMansao(t) { // fundos/portão da mansão
  g.fillStyle = "#f2b880"; g.fillRect(0, 0, W, 1250); K.glow(880, 260, 400, "rgba(255,230,170,A)", .5);
