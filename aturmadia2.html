  [P(5, "governador") - .1, P(5, "prefeito") - .1, "1º GOVERNADOR", true],

  [P(5, "Quem") - .05, C(6), "MAIS PONTOS 👑", true],
];
const PALAVRAS = TEMPOS.cenas.flatMap((c) => c.palavras);
const DESTAQUE = new Set(["dia", "dois", "brasil", "turma", "hoje", "casa", "casas", "cidades", "estados", "arroba", "fundador", "titulo", "domingo", "governador", "prefeito", "pontos", "comenta", "cidade", "estado", "tres"]);
const esc = (el, k, centro = true) => el.style.transform = (centro ? "translateX(-50%) " : "") + `scale(${k})`;
function textos(t) {
  esc(elMarca, 1 + .06 * pulse(t, P(1, "Turma") - .1, .5));
  // contador de casas: sobe junto com a onda, em "Mais de duas mil e trezentas casas"
  const tm = P(1, "Mais") - .05, kc0 = prog(t, tm, tm + .2);
  elCont.style.opacity = entre(t, tm, C(2)) ? kc0 : 0;
  elCont.innerHTML = `${fmt(Math.round(PL.casas * prog(t, tm, T_CASAS + .4)))}<small>CASAS</small>`;
  esc(elCont, .6 + .4 * kc0 + .08 * pulse(t, T_CASAS + .35, .35));
  // chip grande
  const c = CHIPS.find(([a, b]) => entre(t, a, b));
  if (c) { elChip.innerHTML = c[2]; elChip.className = "ov" + (c[3] ? " amarelo" : ""); elChip.style.opacity = 1; elChip.style.fontSize = c[2] === "DIA 2" ? "150px" : "88px"; esc(elChip, .55 + .45 * prog(t, c[0], c[0] + .16) + .12 * pulse(t, c[0] + .08, .3)); }
  else elChip.style.opacity = 0;
  // CTA final
  const tc = C(6) + .05, kc = prog(t, tc, tc + .25);
  elCta.style.opacity = kc; esc(elCta, .6 + .4 * kc + .04 * Math.sin(t * 9) * kc, false);
  elSeta.style.opacity = kc; elSeta.style.transform = `translateY(${18 * Math.abs(Math.sin(t * 5))}px)`;
  // legenda palavra por palavra
  let atual = null; for (const p of PALAVRAS) if (t >= p.t) atual = p;
  if (!atual || t > tc || (c && norm(c[2]).startsWith(norm(atual.w)))) { elLeg.textContent = ""; return; }
  elLeg.textContent = atual.w.toUpperCase(); elLeg.className = "ov" + (DESTAQUE.has(norm(atual.w)) ? " am" : "");
  esc(elLeg, .8 + .2 * prog(t, atual.t, atual.t + .09), false);
}

function quadro(t) {
  const cam = moverCamera(t);
  texMar.offset.set(t * .01, t * .006);
  for (let i = 0; i < N; i++) {
    const [x, z, e] = POS[i], k = Math.max(.0001, clamp(pop(t, QUANDO[i], .35), 0, 1.3) * e * clamp(camera.position.distanceTo(alvo) / 8, 1, 4.5));
    m4.compose(v3.set(x, ALT, z), q.setFromAxisAngle(eixoY, ROT[i]), s3.setScalar(k)); corpos.setMatrixAt(i, m4); telhados.setMatrixAt(i, m4);
  }
  corpos.instanceMatrix.needsUpdate = telhados.instanceMatrix.needsUpdate = true;
  for (const l of LBL) { const v = l.vezes.find(([a, b]) => entre(t, a, b)); escalaSprite(l.s, v ? pop(t, v[0] + .08) : 0); }
  // coroa + "PREFEITO?" na primeira cidade
  const noCargo = entre(t, P(5, "prefeito") - .1, C(6)); coroa.visible = etFund.visible = noCargo;
  if (noCargo) { const [cx, cz] = pc(CID[0]), kp = pop(t, P(5, "prefeito"), .3); coroa.scale.setScalar(Math.max(.001, kp * .26)); coroa.rotation.y = t * 1.8; coroa.position.set(cx, ALT + .58 + .02 * Math.sin(t * 4), cz); etFund.position.set(cx, ALT + .86, cz); escalaSprite(etFund, kp); }
  flash.style.opacity = cam.i > 0 ? .35 * clamp(1 - cam.dt / .12, 0, 1) : 0;
  renderer.render(scene, camera);
  textos(t);
}
window.renderFrame = quadro;
quadro(0);
window.pronto = true;
</script>
