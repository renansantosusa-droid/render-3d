<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Oswald:wght@500;700&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}video{display:none}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// MOLDE GTA (GTÁ SABENDO?) — mesmo visual dos vídeos 1-5 (gtasabendo5.html), dirigido por <id>/roteiro.json:
// { "topo": {"grande":"...","sub":"..."} | null,
//   "cenas": [ { "texto":"fala", "midia":["img:arquivo.jpg","take:gtavc-trailer-005"], "card": null |
//                {"tit":"...","la":"","a":"","sa":"","lb":"","b":"","sb":""} | {"tit":"...","solo":["linha 1","linha 2"]} } ],
//   "credito": "Imagens: Rockstar Games" }
// Fotos: <id>/img/<arquivo>  · Takes (webm 720x1280): <id>/takes/<nome>.webm
const ID = location.pathname.split("/").pop().replace(/\.html$/, "");
const NOME = "GTÁ SABENDO?", ARROBA = "@gtasabendo";
const W = 1080, H = 1920, g = document.getElementById("c").getContext("2d");
const T = await (await fetch(`/${ID}/tempos.json`)).json();
const R = await (await fetch(`/${ID}/roteiro.json`)).json();
const CENAS = T.cenas;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (k) => 1 - Math.pow(1 - clamp(k), 3);
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const AM = "#ffd23a", ROSA = "#ff2d78", BR = "#ffffff";

// "Gê Tê Á" -> "GTÁ" na legenda
for (const cn of CENAS) { const o = []; for (let i = 0; i < cn.palavras.length; i++) { const p = cn.palavras[i]; if (norm(p.w) === "ge" && cn.palavras[i + 1] && norm(cn.palavras[i + 1].w) === "te") { o.push({ w: "GTÁ", t: p.t }); i += 2; } else o.push(p); } cn.palavras = o; }

// carrega mídias
const MID = {};
const carregar = (m) => new Promise((ok, no) => {
  const [tipo, nome] = m.split(":");
  if (tipo === "img") { const im = new Image(); im.onload = () => ok(MID[m] = { im, w: im.width, h: im.height }); im.onerror = () => no(new Error("imagem " + nome)); im.src = `/${ID}/img/${nome}`; }
  else { const v = document.createElement("video"); v.muted = true; v.preload = "auto"; v.playsInline = true; document.body.appendChild(v);
    v.onloadeddata = () => ok(MID[m] = { v, w: v.videoWidth, h: v.videoHeight, dur: v.duration }); v.onerror = () => no(new Error("take " + nome)); v.src = `/${ID}/takes/${nome}.webm`; v.load(); }
});
await Promise.all([...new Set(R.cenas.flatMap((c) => c.midia))].map(carregar));

// linha do tempo: cada cena divide o tempo entre as mídias dela; Ken Burns alternado
const SEG = []; let k = 0;
CENAS.forEach((cn, i) => {
  const a = i === 0 ? 0 : cn.ini, b = i + 1 < CENAS.length ? CENAS[i + 1].ini : T.total + .5, ms = R.cenas[i].midia, n = ms.length;
  ms.forEach((m, j) => { k++; SEG.push({ m, a: a + (b - a) * j / n, b: a + (b - a) * (j + 1) / n, z0: 1.0, z1: MID[m].v ? 1.06 : 1.12, fx0: k % 2 ? .42 : .58, fx1: k % 2 ? .58 : .42 }); });
});
async function prepararVideo(s, t) { // posiciona o take no tempo certo (se o trecho for maior que o take, fica em câmera lenta)
  const M = MID[s.m]; if (!M.v) return;
  const alvo = clamp((t - s.a) * Math.min(1, (M.dur - .05) / (s.b - s.a)), 0, M.dur - .05);
  if (Math.abs(M.v.currentTime - alvo) > .001) await new Promise((ok) => { M.v.onseeked = ok; M.v.currentTime = alvo; setTimeout(ok, 3000); });
}
function desenha(s, t, alfa) {
  const M = MID[s.m], src = M.v || M.im, kk = clamp((t - s.a) / (s.b - s.a)), e = kk * kk * (3 - 2 * kk);
  const z = s.z0 + (s.z1 - s.z0) * e, fx = s.fx0 + (s.fx1 - s.fx0) * e, fy = .5;
  const base = Math.max(W / M.w, H / M.h), sc = base * z, sw = W / sc, sh = H / sc;
  const sx = clamp(fx * M.w - sw / 2, 0, M.w - sw), sy = clamp(fy * M.h - sh / 2, 0, M.h - sh);
  g.globalAlpha = alfa; g.imageSmoothingQuality = "high"; g.drawImage(src, sx, sy, sw, sh, 0, 0, W, H); g.globalAlpha = 1;
}
async function fundo(t) {
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  let i = SEG.findIndex((s) => t >= s.a && t < s.b); if (i < 0) i = t < SEG[0].a ? 0 : SEG.length - 1;
  const s = SEG[i], f = .2, n = i + 1 < SEG.length && t > s.b - f ? SEG[i + 1] : null;
  await prepararVideo(s, t); desenha(s, t, 1);
  if (n) { await prepararVideo(n, Math.max(t, n.a)); desenha(n, Math.max(t, n.a), clamp((t - (s.b - f)) / f)); }
  let gr = g.createLinearGradient(0, 0, 0, 640); gr.addColorStop(0, "rgba(0,0,0,.78)"); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(0, 0, W, 640);
  gr = g.createLinearGradient(0, 1150, 0, H); gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(.55, "rgba(0,0,0,.6)"); gr.addColorStop(1, "rgba(0,0,0,.85)"); g.fillStyle = gr; g.fillRect(0, 1150, W, H - 1150);
}
function fit(s, tam, max, fam = "Nunito", peso = 900) { g.font = peso + " " + tam + "px " + fam; const w = g.measureText(s).width; return w > max ? Math.floor(tam * max / w) : tam; }
function contorno(s, x, y, tam, cor, al = "center", lw = 14) { g.font = `900 ${tam}px Nunito`; g.textAlign = al; g.textBaseline = "middle"; g.lineWidth = lw; g.lineJoin = "round"; g.strokeStyle = "#000"; g.strokeText(s, x, y); g.fillStyle = cor; g.fillText(s, x, y); }
function topo() {
  if (!R.topo) return;
  if (R.topo.grande) contorno(R.topo.grande, W / 2, 165, fit(R.topo.grande, 124, 980), AM, "center", 18);
  if (R.topo.sub) contorno(R.topo.sub, W / 2, 290, fit(R.topo.sub, 54, 980), BR);
}
function card(t) {
  const i = CENAS.findIndex((cn, j) => t >= (j === 0 ? 0 : cn.ini) && t < (j + 1 < CENAS.length ? CENAS[j + 1].ini : T.total + 1));
  const c = i >= 0 && R.cenas[i].card; if (!c) return;
  const ini = i === 0 ? 0 : CENAS[i].ini, fim = i + 1 < CENAS.length ? CENAS[i + 1].ini : T.total;
  const kk = ease((t - ini) / .3), cx = 540, cy = 880, pw = 980, ph = c.solo ? 380 : 560;
  g.save(); g.globalAlpha = kk; g.translate(cx, cy + (1 - kk) * 40);
  g.fillStyle = "rgba(0,0,0,.66)"; g.beginPath(); g.roundRect(-pw / 2, -ph / 2, pw, ph, 44); g.fill(); g.lineWidth = 6; g.strokeStyle = ROSA; g.stroke();
  const ts = fit(c.tit || "", 54, 900, "Oswald", 700); g.font = "700 " + ts + "px Oswald"; g.fillStyle = BR; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(c.tit || "", 0, -ph / 2 + 60);
  if (c.solo) { contorno(c.solo[0] || "", 0, -10, fit(c.solo[0] || "", 100, 900), AM, "center", 14); if (c.solo[1]) contorno(c.solo[1], 0, 100, fit(c.solo[1], 64, 900), BR, "center", 12); g.restore(); return; }
  const kb = ease((t - (ini + (fim - ini) * .45)) / .3), side = (x, lab, val, sub, al) => {
    g.globalAlpha = al; g.font = "500 44px Oswald"; g.fillStyle = "rgba(255,255,255,.75)"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(lab || "", x, -90);
    contorno(val || "", x, 20, fit(val || "", 140, 320), AM, "center", 16);
    if (sub) { g.font = "500 40px Oswald"; g.fillStyle = "rgba(255,255,255,.85)"; g.textAlign = "center"; g.fillText(sub, x, 135); } };
  side(-270, c.la, c.a, c.sa, kk); side(270, c.lb, c.b, c.sb, kb * kk);
  g.globalAlpha = kk; g.strokeStyle = ROSA; g.lineWidth = 12; g.lineCap = "round"; g.lineJoin = "round"; g.beginPath(); g.moveTo(-34, 20); g.lineTo(26, 20); g.stroke(); g.beginPath(); g.moveTo(8, -6); g.lineTo(34, 20); g.lineTo(8, 46); g.stroke();
  g.restore();
}
const DISP = { seis: "6" };
const GRUPOS = []; for (const cn of CENAS) for (let i = 0; i < cn.palavras.length; i += 3) GRUPOS.push({ ws: cn.palavras.slice(i, i + 3), fim: (cn.palavras[i + 3] || { t: cn.fim + .15 }).t });
function legenda(t) {
  const gr = GRUPOS.find((x) => t >= x.ws[0].t && t < x.fim); if (!gr) return;
  const ws = gr.ws.map((p) => (DISP[norm(p.w)] || p.w).toUpperCase().replace(/[.,!?;:]+$/, "")); let tam = 88; g.font = `900 ${tam}px Nunito`; let lw = ws.map((w) => g.measureText(w).width), esp = 24;
  const larg = () => lw.reduce((a, b) => a + b, 0) + esp * (ws.length - 1); if (larg() > 960) { tam = Math.floor(tam * 960 / larg()); g.font = `900 ${tam}px Nunito`; lw = ws.map((w) => g.measureText(w).width); esp = 18; }
  let x = W / 2 - larg() / 2; const kk = ease((t - gr.ws[0].t) / .1), y = 1430 + (1 - kk) * 18;
  ws.forEach((w, i) => { const ativa = t >= gr.ws[i].t && (i === ws.length - 1 || t < gr.ws[i + 1].t);
    g.textAlign = "left"; g.textBaseline = "middle"; g.lineWidth = 14; g.lineJoin = "round"; g.strokeStyle = "#000"; g.globalAlpha = kk; g.strokeText(w, x, y); g.fillStyle = ativa ? AM : BR; g.fillText(w, x, y); g.globalAlpha = 1; x += lw[i] + esp; });
}
function selo() {
  g.font = "700 40px Oswald"; const w = g.measureText(NOME).width + 50, h = 66, x = W / 2 - w / 2, y = 1600;
  g.fillStyle = ROSA; g.beginPath(); g.roundRect(x, y - h / 2, w, h, h / 2); g.fill(); g.fillStyle = BR; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(NOME, W / 2, y + 2);
  g.font = "500 38px Oswald"; g.fillStyle = "rgba(255,255,255,.92)"; g.fillText(ARROBA, W / 2, y + 74);
  g.font = "500 26px Oswald"; g.fillStyle = "rgba(255,255,255,.7)"; g.fillText(R.credito || "Imagens: Rockstar Games", W / 2, y + 130);
}
window.renderFrame = async (t) => { await fundo(t); topo(); card(t); legenda(t); selo(); };
await document.fonts.load("900 40px Nunito"); await document.fonts.load("700 40px Oswald"); await document.fonts.load("500 40px Oswald"); await document.fonts.ready;
await window.renderFrame(0); window.pronto = true;
</script>
</body></html>
