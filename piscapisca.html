<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import { iniciar } from "/kit3d.js";
const K = await iniciar("piscapisca", { fundo: 0x1a2030, seed: 1503 });
const { THREE, scene, add, grupo, mat, vidro, sprite, texMadeira, prog, entre, frac, pulse, C, F, P, T, rnd } = K;
const PI = Math.PI, V = (x, y, z) => new THREE.Vector3(x, y, z);
const CORES = [0xff3030, 0x30ff60, 0x3a8aff, 0xffd030, 0xff60d0];
const lampada = (pos, cor, pai = scene) => { const m = new THREE.MeshStandardMaterial({ color: 0x555555, emissive: cor, emissiveIntensity: 0, roughness: .3 });
  const g = grupo(pos.x, pos.y, pos.z, pai); const b = add(new THREE.SphereGeometry(.05, 14, 10), m, 0, 0, 0, g); b.scale.y = 1.6; add(new THREE.CylinderGeometry(.03, .03, .05, 10), mat(0x2a6a2a), 0, -.08, 0, g); return { g, m, cor }; };

// ---------- sala + árvore com o cordão ----------
add(new THREE.PlaneGeometry(20, 20), mat(0xffffff, { map: texMadeira("#6a4a30", 6) }), 0, 0, 0).rotation.x = -PI / 2;
add(new THREE.BoxGeometry(20, 6, .2), mat(0x3a3a4a), 0, 3, -1.5);
const tomada = grupo(-1.3, .4, -1.38); add(new THREE.BoxGeometry(.2, .26, .04), mat(0xf0f0f0), 0, 0, 0, tomada); add(new THREE.BoxGeometry(.03, .06, .05), mat(0x222222), -.04, 0, .01, tomada); add(new THREE.BoxGeometry(.03, .06, .05), mat(0x222222), .04, 0, .01, tomada);
const arvore = grupo(0, 0, 0); add(new THREE.CylinderGeometry(.08, .1, .3, 12), mat(0x5a3418), 0, .15, 0, arvore);
[[.75, .9, .5], [.6, .8, 1.0], [.42, .7, 1.45]].forEach(([r, h, y]) => add(new THREE.ConeGeometry(r, h, 24), mat(0x1f6a3a), 0, y, 0, arvore));
const espiral = new THREE.CatmullRomCurve3(Array.from({ length: 60 }, (_, i) => { const k = i / 59, a = k * PI * 9, r = .72 - k * .58; return V(Math.cos(a) * r, .35 + k * 1.4, Math.sin(a) * r); }));
const fioM = mat(0x9a9a9a); const fioArv = add(new THREE.TubeGeometry(espiral, 300, .008, 6), fioM, 0, 0, 0);
const fioTom = add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(-1.3, .4, -1.33), V(-1.0, .05, -1), V(-.6, .05, -.2), V(.72, .35, 0)]), 60, .008, 6), fioM, 0, 0, 0);
const NA = 50; const arv = Array.from({ length: NA }, (_, i) => lampada(espiral.getPoint((i + .5) / NA), CORES[i % 5]));
const umaSo = lampada(V(-1.1, .75, -1.3), 0xffd030); const caboUma = add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(-1.3, .4, -1.34), V(-1.2, .55, -1.33), V(-1.1, .67, -1.3)]), 20, .008, 6), fioM, 0, 0, 0);
const caixinha = grupo(-1.3, .1, -1.2); add(new THREE.BoxGeometry(.18, .1, .12), mat(0x222222), 0, 0, 0, caixinha); const ledCx = add(new THREE.SphereGeometry(.015, 8, 6), mat(0x111111, { emissive: 0xff2020, emissiveIntensity: 0 }), .05, .05, .06, caixinha);
const fusivel = add(new THREE.CylinderGeometry(.03, .03, .1, 10), mat(0xffd030, { emissive: 0xffd030, emissiveIntensity: 0 }), -1.3, .4, -1.3); fusivel.rotation.x = PI / 2;

// ---------- fileira em série (x=50) ----------
const SX = 50;
add(new THREE.PlaneGeometry(14, 14), mat(0x1a2030), SX, 0, -1.5);
const NS = 7; const fila = Array.from({ length: NS }, (_, i) => lampada(V(SX - 1.2 + i * .4, 1.2, 0), CORES[i % 5]));
fila.forEach((l) => l.g.scale.setScalar(2.2));
const laco = new THREE.CatmullRomCurve3([V(SX - 1.8, .5, 0), V(SX - 1.6, 1.1, 0), ...fila.map((l) => V(l.g.position.x, 1.05, 0)), V(SX + 1.6, 1.1, 0), V(SX + 1.8, .5, 0), V(SX, .3, 0), V(SX - 1.8, .5, 0)]);
add(new THREE.TubeGeometry(laco, 200, .012, 6), fioM, 0, 0, 0);
add(new THREE.BoxGeometry(.3, .4, .1), mat(0xf0f0f0), SX, .3, -.05);
const eletrons = K.fluxo(laco, 40, 0xffe060);
const lbS = (txt, cor, x, y) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: K.rotulo(txt, cor, { tam: 70, w: 1024 }), transparent: true })); s.position.set(x, y, .3); s.scale.set(1.0, .25, 1); scene.add(s); return s; };
const lb127 = lbS("127 V", "#ff7040", SX, .75), lbCada = lbS("~2,5 V EM CADA", "#ffd23a", SX, 1.75);

// ---------- lâmpada gigante com o fio de desvio (x=100) ----------
const BX = 100;
add(new THREE.PlaneGeometry(14, 14), mat(0x1a2030), BX, 0, -1.5);
add(new THREE.SphereGeometry(.55, 32, 24), vidro(.18, 0xfff0c0), BX, 1.3, 0).scale.y = 1.4;
add(new THREE.CylinderGeometry(.3, .3, .4, 24), mat(0x2a6a2a), BX, .45, 0);
const pernaM = mat(0xb0b0b0, { metalness: .7 });
add(new THREE.CylinderGeometry(.012, .012, .9, 8), pernaM, BX - .15, .9, 0); add(new THREE.CylinderGeometry(.012, .012, .9, 8), pernaM, BX + .15, .9, 0);
const filM = mat(0x553322, { emissive: 0xffc040, emissiveIntensity: 0 });
const filA = add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(BX - .15, 1.35, 0), V(BX - .08, 1.45, 0), V(BX - .02, 1.38, 0)]), 20, .01, 6), filM, 0, 0, 0);
const filB = add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(BX + .02, 1.38, 0), V(BX + .08, 1.45, 0), V(BX + .15, 1.35, 0)]), 20, .01, 6), filM, 0, 0, 0);
const shuntM = mat(0x8a8a8a, { emissive: 0x30c0ff, emissiveIntensity: 0 });
add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(BX - .15, .95, 0), V(BX - .05, 1.0, .02), V(BX + .05, .98, -.02), V(BX + .15, .95, 0)]), 30, .012, 6), shuntM, 0, 0, 0);
const caminhoFil = new THREE.CatmullRomCurve3([V(BX - .15, .3, 0), V(BX - .15, 1.35, 0), V(BX, 1.45, 0), V(BX + .15, 1.35, 0), V(BX + .15, .3, 0)]);
const caminhoShunt = new THREE.CatmullRomCurve3([V(BX - .15, .3, 0), V(BX - .15, .95, 0), V(BX, 1.0, 0), V(BX + .15, .95, 0), V(BX + .15, .3, 0)]);
const eFil = K.fluxo(caminhoFil, 20, 0xffe060), eShunt = K.fluxo(caminhoShunt, 20, 0xffe060);
const lbF = lbS("FILAMENTO", "#ffd23a", BX, 2.35), lbSh = lbS("FIO DE DESVIO", "#8ac8ff", BX, .02);

K.camera_({
  sala: [V(.4, 1.4, 4.6), V(-.25, .95, -.3)],
  uma: [V(-.7, .85, .3), V(-1.15, .65, -1.3)],
  serie: [V(SX, 1.6, 7.4), V(SX, 1.55, 0)],
  mini: [V(BX, 1.15, 4.0), V(BX, 1.05, 0)],
  fim: [V(-.6, 1.6, 4.2), V(0, 1.0, 0)],
}, [
  [0, "uma"], [P(1, "cem") - .5, "uma"], [P(1, "cem") + .3, "sala"], [P(2, "lampada") - .3, "uma"], [F(2), "uma"],
  [C(3), "serie"], [F(4), "serie"], [C(5), "mini"], [P(5, "fora") + .4, "mini"], [P(5, "fora") + .4, "serie"], [F(5), "serie"],
  [C(6), "sala"], [F(6), "sala"], [C(7), "sala"], [T, "fim"],
]);

K.pronto((t) => {
  const em = (a, b) => entre(t, a, b);
  const pisca = (i) => { if (t < C(6)) return true; if (t < P(6, "caixinha") - .2) return true; const fase = Math.floor(t * 2.5); return t < C(7) ? (fase + i) % 3 !== 0 : (fase + i) % 2 === 0; };
  // uma lâmpada só, depois queima com 127 V
  const queimaUma = P(2, "queima");
  umaSo.g.visible = caboUma.visible = t < C(3);
  umaSo.m.emissiveIntensity = t > P(1, "luz") - .2 && t < P(1, "cem") - .3 ? 2 : em(P(2, "cento") - .2, queimaUma) ? 4 + 2 * Math.sin(t * 30) : 0;
  umaSo.m.color.set(t > queimaUma ? 0x222222 : 0x555555);
  // árvore
  const acesa = em(P(1, "cem") - .3, F(1)) || t > C(6);
  arv.forEach((l, i) => { l.m.emissiveIntensity = acesa && pisca(i) ? 2.2 : 0; });
  fioM.color.set(t > P(7, "verdes") - .2 ? 0x2a7a3a : 0x9a9a9a);
  caixinha.visible = t > P(6, "caixinha") - .3; ledCx.material.emissiveIntensity = caixinha.visible ? (Math.floor(t * 5) % 2 ? 2 : 0) : 0;
  fusivel.material.emissiveIntensity = t > P(7, "fusivel") - .3 ? 1 + pulse(t, P(7, "fusivel") - .3, .6) * 2 : 0; fusivel.visible = t > P(7, "fusivel") - .3;
  // série: corrente passa por todas; uma queima = tudo apaga
  const queimaFila = P(4, "queima");
  const consertada = t > P(5, "fora") + .4;
  const corre = em(C(3), queimaFila) || consertada;
  eletrons.atualiza(t, corre, .12, .05, .9);
  fila.forEach((l, i) => { const morta = i === 3 && t > queimaFila; l.m.color.set(morta ? 0x222222 : 0x555555); l.m.emissiveIntensity = corre && !morta ? 2.2 : 0; });
  lb127.visible = em(P(3, "divide") - .5, F(3)); lbCada.visible = em(P(3, "pedacinho") - .4, F(3));
  // gigante
  const quebrou = t > P(5, "queima") - .1;
  filA.position.y = quebrou ? -.06 : 0; filA.rotation.z = quebrou ? .3 : 0; filA.position.x = quebrou ? -40 : 0;
  filM.emissiveIntensity = em(C(5), P(5, "queima") - .1) ? 2 : 0;
  eFil.atualiza(t, em(C(5), P(5, "queima") - .1), .5, .04, 1);
  eShunt.atualiza(t, em(P(5, "fecha") - .2, F(5)), .5, .04, 1);
  shuntM.emissiveIntensity = em(P(5, "fiozinho") - .3, F(5)) ? 1 + .5 * Math.sin(t * 9) : 0;
  lbF.visible = em(C(5), F(5)); lbSh.visible = em(P(5, "fiozinho") - .3, F(5));
  K.cartoes(t, [
    [P(1, "cem") - .3, F(1), "100 LÂMPADAS?", "#ffffff"],
    [P(2, "dois") - .3, P(2, "tomada") - .3, "CADA UMA: ~2,5 V", "#ffd23a"],
    [P(2, "tomada") - .3, P(2, "queima") - .2, "TOMADA: 127 V", "#ff7040"],
    [P(2, "queima") - .2, F(2), "QUEIMOU!", "#ff4a3a"],
    [P(3, "serie") - .5, F(3), "LIGAÇÃO EM SÉRIE", "#ffffff"],
    [P(4, "queima") - .3, F(4), "UMA QUEIMA, TUDO APAGA", "#ff4a3a"],
    [P(5, "fiozinho") - .3, F(5), "FIO DE DESVIO (SHUNT)", "#8ac8ff"],
    [P(6, "caixinha") - .3, F(6), "CHIP CONTROLA O PISCA", "#ff60d0"],
  ]);
});
</script>
