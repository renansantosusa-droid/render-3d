<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import { iniciar } from "/kit3d.js";
const K = await iniciar("led", { fundo: 0x1c2230, seed: 8181 });
const { THREE, scene, add, grupo, mat, vidro, brilho, V, sprite, texRuido, prog, lin, pulse, entre, frac, clamp, C, F, P, T, rnd } = K;
const PI = Math.PI;
{ const pl = new THREE.PointLight(0xffffff, 2, 8); pl.position.set(1.5, 2, 2); scene.add(pl); }
// lâmpada incandescente
const inc = grupo(0, 0, 0);
add(new THREE.SphereGeometry(.4, 40, 30), vidro(.18, 0xffffff), 0, .6, 0, inc);
const fio = add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(Array.from({ length: 30 }, (_, i) => V(-.12 + i * .008, .62 + Math.sin(i * 1.2) * .025, 0))), 80, .006, 6), new THREE.MeshBasicMaterial({ color: 0x5a3a1a }), 0, 0, 0, inc);
[-.12, .12].forEach((x) => add(new THREE.CylinderGeometry(.006, .006, .35, 6), mat(0x9aa0a8), x, .45, 0, inc));
add(new THREE.CylinderGeometry(.16, .14, .22, 30), mat(0xc0c6cc, { metalness: .4 }), 0, .1, 0, inc);
const brilhoI = sprite(0xffc060, inc); brilhoI.position.set(0, .62, .02);
const calor = Array.from({ length: 22 }, () => ({ s: sprite(0xff5a2a), f: rnd(), a: rnd() * PI * 2 }));
// LED
const led = grupo(0, 0, 0);
const cupula = add(new THREE.SphereGeometry(.4, 40, 30, 0, PI * 2, 0, PI * .62), new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0, roughness: .6 }), 0, .55, 0, led);
const placa = add(new THREE.CylinderGeometry(.3, .3, .03, 32), mat(0xe8e8ea), 0, .42, 0, led);
const chips = Array.from({ length: 8 }, (_, i) => { const a = i / 8 * PI * 2; const c = add(new THREE.BoxGeometry(.06, .02, .06), new THREE.MeshStandardMaterial({ color: 0xf2e080, emissive: 0x3a6aff, emissiveIntensity: 0 }), Math.cos(a) * .18, .445, Math.sin(a) * .18, led); return c; });
const corpo = add(new THREE.CylinderGeometry(.3, .16, .3, 32), mat(0xf4f4f4), 0, .25, 0, led);
const rosca = add(new THREE.CylinderGeometry(.14, .14, .14, 24), mat(0xc0c6cc, { metalness: .4 }), 0, .04, 0, led); rosca.visible = false;
const circuito = add(new THREE.BoxGeometry(.2, .02, .14), mat(0x2a7a3a), 0, .25, 0, led);
const brilhoL = sprite(0xf4f4ff, led); brilhoL.position.set(0, .65, 0);
// mini set: o chip por dentro
const MX = 100;
add(new THREE.PlaneGeometry(10, 10), mat(0x1c2230), MX, 0, -.8);
const camN = add(new THREE.BoxGeometry(.9, .3, .4), mat(0x4a8ae0), MX - .45, .55, 0), camP = add(new THREE.BoxGeometry(.9, .3, .4), mat(0xe04a6a), MX + .45, .55, 0);
const jun = add(new THREE.BoxGeometry(.04, .32, .42), new THREE.MeshBasicMaterial({ color: 0xffffff }), MX, .55, 0);
const fosforo = add(new THREE.BoxGeometry(1.9, .08, .45), new THREE.MeshStandardMaterial({ color: 0xf2d040, transparent: true, opacity: 0 }), MX, .75, 0);
const eletrons = Array.from({ length: 16 }, () => ({ s: sprite(0x6ab8ff), f: rnd(), z: (rnd() - .5) * .3 }));
const fotons = Array.from({ length: 24 }, () => ({ s: sprite(0x3a6aff), f: rnd(), a: (rnd() - .5) * 1.4 }));
const lbl = (txt, cor, x, y) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: K.rotulo(txt, cor, { tam: 70 }), transparent: true })); s.position.set(x, y, .3); s.scale.set(.6, .3, 1); scene.add(s); return s; };
const lN = lbl("CAMADA 1", "#9ac8ff", MX - .45, .3), lP = lbl("CAMADA 2", "#ff9ab0", MX + .45, .3);

K.camera_({
  geral: [V(.9, .9, 2.4), V(0, .45, 0)],
  dentro: [V(.35, 1.3, 1.7), V(0, .42, 0)],
  chip: [V(MX + .1, .95, 4.0), V(MX, .65, 0)],
  baixo: [V(.7, .25, 1.4), V(0, .25, 0)],
  fim: [V(-1.0, .9, 2.3), V(0, .4, 0)],
}, [
  [0, "geral"], [F(2), "geral"], [C(3), "dentro"], [F(3), "dentro"], [C(4), "chip"], [F(5), "chip"], [C(6), "baixo"], [F(6), "baixo"], [C(7), "geral"], [T, "fim"],
]);
K.pronto((t) => {
  const em = (a, b) => entre(t, a, b);
  const velha = t < C(3); inc.visible = velha; led.visible = !velha;
  fio.material.color.set(t > P(1, "brilha") - .3 ? 0xffd080 : 0x5a3a1a); brilhoI.scale.setScalar(t > P(1, "brilha") - .3 ? 1.1 + .1 * Math.sin(t * 9) : 0); brilhoI.material.opacity = t > P(1, "brilha") - .3 ? .8 : 0;
  calor.forEach((c) => { const k = frac(t * .5 + c.f); c.s.position.set(Math.cos(c.a) * (.4 + k * .6), .6 + Math.sin(c.a) * (.4 + k * .6), 0); c.s.scale.setScalar(.06); c.s.material.opacity = em(P(2, "calor") - .3, F(2)) ? .7 * (1 - k) : 0; });
  const acende = t > P(3, "chip") - .3;
  const branco = t > P(5, "branco") - .3 || t > C(6);
  chips.forEach((c) => { c.material.emissiveIntensity = acende ? 1.2 : 0; c.material.emissive.set(t > P(5, "amarelo") - .3 ? 0xfff0c0 : 0x3a6aff); });
  brilhoL.scale.setScalar(acende && !velha ? 1.3 : 0); brilhoL.material.opacity = acende ? .7 : 0; brilhoL.material.color.set(branco ? 0xf4f4ff : 0x5a8aff);
  circuito.visible = t > C(6) - .1; corpo.material.transparent = true; corpo.material.opacity = em(C(6), F(6)) ? .35 : 1;
  const fim = t > C(7) - .1; cupula.material.opacity = fim && t > P(7, "cupula") - .3 ? .7 : 0; rosca.visible = fim && t > P(7, "rosca") - .3;
  // mini set
  const corre = em(P(4, "atravessa") - .3, F(5));
  eletrons.forEach((e) => { const k = frac(t * .8 + e.f); e.s.position.set(MX - .9 + k * .9, .55, e.z); e.s.scale.setScalar(.05); e.s.material.opacity = corre ? .9 : 0; });
  jun.material.color.set(corre ? (t > P(5, "amarelo") - .3 ? 0xffffe0 : 0x8ab0ff) : 0x5a5a6a);
  fotons.forEach((f) => { const k = frac(t * 1.2 + f.f); f.s.position.set(MX + Math.sin(f.a) * k * .5, .6 + k * .9, 0); f.s.scale.setScalar(.05); f.s.material.color.set(t > P(5, "amarelo") - .3 && f.f > .5 ? 0xffe040 : 0x3a6aff); f.s.material.opacity = em(P(4, "luz") - .3, F(5)) ? 1 - k : 0; });
  fosforo.material.opacity = t > P(5, "po") - .3 && t < F(5) ? .55 : 0;
  lN.visible = lP.visible = em(C(4), F(4));
  led.rotation.y = fim ? (t - C(7)) * .5 : 0;
  K.cartoes(t, [
    [P(1, "incandescente") - .4, F(1), "INCANDESCENTE", "#ffd080"],
    [P(2, "calor") - .3, F(2), "QUASE TUDO VIRA CALOR 🔥", "#ff6a3a"],
    [P(3, "chip") - .3, F(3), "UM CHIP MINÚSCULO", "#9ac8ff"],
    [P(4, "luz") - .3, F(4), "ENERGIA VIRA LUZ", "#5a8aff"],
    [P(5, "azul") - .3, P(5, "po") - .3, "O CHIP SÓ FAZ AZUL", "#5a8aff"],
    [P(5, "po") - .3, F(5), "PÓ AMARELO → BRANCO", "#ffe040"],
    [P(6, "circuito") - .3, F(6), "O CIRCUITO ESQUENTA", "#7ad07a"],
  ]);
});
</script>
</body></html>
