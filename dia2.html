const scene = new THREE.Scene();

Object.keys(GEO).forEach((uf, i) => {

    for (const buraco of poly.slice(1)) forma.holes.push(new THREE.Path(buraco.map(([lon, lat]) => new THREE.Vector2(X(lon), -Z(lat)))));

// ---------- terra firme ----------
const dentro = (lon, lat, anel) => { let d = false; for (let i = 0, j = anel.length - 1; i < anel.length; j = i++) { const [xi, yi] = anel[i], [xj, yj] = anel[j]; if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) d = !d; } return d; };
const terra = (lon, lat) => Object.values(GEO).some((ps) => ps.some((p) => dentro(lon, lat, p[0]) && !p.slice(1).some((b) => dentro(lon, lat, b))));
const firme = (lon, lat, m) => [[0, 0], [m, 0], [-m, 0], [0, m], [0, -m]].every(([a, b]) => terra(lon + a, lat + b));
function emTerra(lon, lat, m) { const [cl, ca] = [-50, -12]; for (let i = 0; i < 60 && !firme(lon, lat, m); i++) { const dl = cl - lon, da = ca - lat, n = Math.hypot(dl, da) || 1; lon += .06 * dl / n; lat += .06 * da / n; } return [lon, lat]; }

const rrc = (g, x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };

const CID = DADOS.cidades;
const LBL = DADOS.labels;
const SEM = [0, 1, 2].map((s) => LBL.find((l) => l.sem === s));
const pc = (c) => [X(c.lon), Z(c.lat)], pcasa = (i) => [POS[i][0], POS[i][1]], pll = (lon, lat) => [X(lon), Z(lat)];
const S = (a, alvo, de, ate) => ({ a, alvo, de, ate });
const T_CID = [P(2, "Sao") - .15, P(2, "Rio") - .1, P(2, "Fortaleza") - .1, P(2, "Salvador") - .1, P(2, "Curitiba") - .1];
const T_SEM = [C(3), P(3, "Se") - .1, P(3, "comenta") - .1];
const SHOTS = [
  S(0, pll(-53, -15.5), [60, -8, 62], [56, 2, 60]),
  S(T_OLHA - .1, pll(-47, -17), [36, 14, 50], [44, -4, 56]),
  S(C(2), pll(-53, -15), [58, -4, 60], [54, 6, 58]),
  ...CID.map((c, i) => S(T_CID[i], pc(c), [5.2, -14 + 6 * i, 40], [4.4, -2 + 6 * i, 38])),
  ...SEM.map((l, i) => S(T_SEM[i], pcasa(l.i), [2.6, 14 - 12 * i, 30], [2.2, 4 - 12 * i, 30])),
  S(C(4), pll(-44, -15), [34, -10, 56], [30, 8, 54]),
  S(C(5), pll(CID[0].lon, CID[0].lat + .5), [5.6, -16, 40], [4.6, 4, 36]),
  S(P(5, "Quem") - .1, pll(CID[0].lon, CID[0].lat + .4), [7, 10, 46], [11, -8, 50]),
  S(C(6), pll(-53, -18.5), [58, -4, 60], [55, 4, 58]),
];
SHOTS.forEach((s, i) => s.b = i + 1 < SHOTS.length ? SHOTS[i + 1].a : FIM);
const alvo = new THREE.Vector3();
function moverCamera(t) {
  const i = SHOTS.findLastIndex((s) => t >= s.a), s = SHOTS[Math.max(0, i)];
  const k = ease(clamp((t - s.a) / (s.b - s.a), 0, 1)), [d, yaw, el] = s.de.map((x, j) => x + (s.ate[j] - x) * k);
  const yr = yaw * Math.PI / 180, er = el * Math.PI / 180;
  alvo.set(s.alvo[0], ALT, s.alvo[1]);
  camera.position.set(alvo.x + d * Math.sin(yr) * Math.cos(er), alvo.y + d * Math.sin(er), alvo.z + d * Math.cos(yr) * Math.cos(er));
  camera.lookAt(alvo);
  return { i, dt: t - s.a };
}

// ---------- etiquetas com os @ reais ----------
for (const l of LBL) {
  const [x, z, e] = POS[l.i];
  l.s = l.sem !== undefined ? etiqueta(l.u, { bg: "#ffd23f", alt: .46 }) : l.fund ? etiqueta(l.u, { bg: "#ffd23f", alt: .36 }) : etiqueta(l.u, { alt: .3 });
  l.s.position.set(x, ALT + e * 1.75 + .1, z);
  // quando aparece: na tomada da cidade dela (cena 2), na da pessoa (cena 3) e SP de novo na cena 5
  l.vezes = l.sem !== undefined ? [[T_SEM[l.sem], T_SEM[l.sem] + 1.2]] : [[T_CID[l.g], (T_CID[l.g + 1] ?? C(3))]];
}
// prefeito? coroa girando em cima de São Paulo (cena 5)
const coroa = new THREE.Group(); const ouro = new THREE.MeshStandardMaterial({ color: 0xffd23f, emissive: 0xffa000, emissiveIntensity: .3, metalness: .3, roughness: .35 });
coroa.add(new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, .22, 24, 1, true), ouro));
for (let k = 0; k < 5; k++) { const p = new THREE.Mesh(new THREE.ConeGeometry(.12, .34, 8), ouro); const a = k / 5 * Math.PI * 2; p.position.set(Math.cos(a) * .4, .26, Math.sin(a) * .4); coroa.add(p); }
scene.add(coroa);
const [SPX, SPZ] = pc(CID[0]);
const etPref = etiqueta("PREFEITO?", { bg: "#1d5e2a", fg: "#ffd23f", borda: "#1d5e2a", alt: .3 });

// ---------- textos na tela ----------
const mk = (id, cls = "") => { const el = document.createElement("div"); el.id = id; el.className = "ov " + cls; document.body.appendChild(el); return el; };
const flash = document.createElement("div"); flash.id = "flash"; document.body.appendChild(flash);
const elMarca = mk("marca"); elMarca.innerHTML = "BRASIL DA <b>TURMA</b>";
const elChip = mk("chip"), elCont = mk("cont");
const elRank = mk("rank"); const MAX = CID[0].casas;
elRank.innerHTML = `<h3>🏆 QUEM TEM MAIS CASAS</h3>` + CID.map((c, i) => `<div class="lin"><div class="p">${i + 1}</div><div class="nm">${c.nome === "Rio de Janeiro" ? "Rio" : c.nome}</div><div class="bar"><i></i></div><div class="n">0</div></div>`).join("");
const LINS = [...elRank.querySelectorAll(".lin")];
const elCta = mk("cta"); elCta.innerHTML = `<div class="l1">COMENTA TUA CIDADE<br>+ ESTADO</div><div class="l2">e aparece no DIA 3 👇</div>`;
const elSeta = mk("seta"); const elLeg = mk("legenda");
const fmt = (n) => n.toLocaleString("pt-BR");
const PL = DADOS.placar;
const CHIPS = [
  [0, P(1, "e"), "ONTEM...", false],
  [P(1, "hoje"), P(1, "Mais") - .05, "HOJE!", true],
  [P(2, "estados") - .1, T_CID[0], `27 ESTADOS<small>${fmt(PL.cidades)} cidades</small>`, true],
  ...CID.map((c, i) => [T_CID[i], T_CID[i + 1] ?? C(3), `${c.nome.toUpperCase()}<small>${c.casas} casas</small>`, true]),
  ...SEM.map((l, i) => [T_SEM[i], T_SEM[i + 1] ?? C(4), `${l.cid}`, false]),
  [P(5, "nove") - .05, P(5, "Quem") - .1, "⏰ HOJE · 21H", true],
  [P(5, "Quem"), C(6), "MAIS PONTOS<br>LEVA 👑", true],
  [P(6, "dia"), FIM + 1, "DIA 3", true],
];
const PALAVRAS = TEMPOS.cenas.flatMap((c) => c.palavras);
const DESTAQUE = new Set(["brasil", "turma", "vazio", "hoje", "casas", "estados", "arroba", "comenta", "disputa", "frente", "colado", "nove", "prefeito", "pontos", "cidade", "estado", "tres"]);
const esc = (el, k, centro = true) => el.style.transform = (centro ? "translateX(-50%) " : "") + `scale(${k})`;
function textos(t) {
  esc(elMarca, 1 + .06 * pulse(t, P(1, "Turma") - .1, .5));
  // contador de casas (cena 1)
  const tm = P(1, "Mais"), kc0 = prog(t, tm - .05, tm + .2);
  elCont.style.opacity = entre(t, tm - .05, C(2)) ? kc0 : 0;
  elCont.innerHTML = `+${fmt(Math.round(PL.casas * prog(t, tm, T_CASAS + .4)))}<small>CASAS</small>`;
  esc(elCont, .6 + .4 * kc0 + .08 * pulse(t, T_CASAS + .35, .35));
  // ranking (cena 4)
  const kr = prog(t, C(4) - .05, C(4) + .25), fora = lin(t, C(5) - .2, C(5));
  elRank.style.opacity = entre(t, C(4) - .05, C(5)) ? kr * (1 - fora) : 0; esc(elRank, .7 + .3 * kr, false);
  LINS.forEach((d, i) => {
    const a = P(4, "disputa") + i * .18, k = prog(t, a, a + .6);
    d.querySelector("i").style.width = `${100 * k * CID[i].casas / MAX}%`; d.querySelector(".n").textContent = Math.round(CID[i].casas * k);
    const hl = i === 0 ? pulse(t, P(4, "Paulo") - .1, .45) : i === 1 ? pulse(t, P(4, "Rio") - .1, .45) : 0;
    d.style.transform = `scale(${1 + .04 * hl})`; d.style.transformOrigin = "center";
  });
  // chip grande
  const c = CHIPS.find(([a, b]) => entre(t, a, b));
  if (c) { elChip.innerHTML = c[2]; elChip.className = "ov" + (c[3] ? " amarelo" : ""); elChip.style.opacity = 1; elChip.style.fontSize = c[2].includes("<br>") ? "72px" : "88px"; esc(elChip, .55 + .45 * prog(t, c[0], c[0] + .16) + .12 * pulse(t, c[0] + .08, .3)); }
  else elChip.style.opacity = 0;
  // CTA final
  const tc = C(6) + .05, kc = prog(t, tc, tc + .25);
  elCta.style.opacity = kc; esc(elCta, .6 + .4 * kc + .04 * Math.sin(t * 9) * kc, false);
  elSeta.style.opacity = kc; elSeta.style.transform = `translateY(${18 * Math.abs(Math.sin(t * 5))}px)`;
  // legenda palavra por palavra
  let atual = null; for (const p of PALAVRAS) if (t >= p.t) atual = p;
  if (!atual || t > tc || entre(t, C(4), C(5)) || (c && norm(c[2]).startsWith(norm(atual.w)))) { elLeg.textContent = ""; return; }
  elLeg.textContent = atual.w.toUpperCase(); elLeg.className = "ov" + (DESTAQUE.has(norm(atual.w)) ? " am" : "");
  esc(elLeg, .8 + .2 * prog(t, atual.t, atual.t + .09), false);
}

function quadro(t) {
  const cam = moverCamera(t);
  texMar.offset.set(t * .01, t * .006);
  for (let i = 0; i < N; i++) {
    const [x, z, e] = POS[i], k = Math.max(.0001, clamp(pop(t, QUANDO[i], .35), 0, 1.3) * e);
    m4.compose(v3.set(x, ALT, z), q.setFromAxisAngle(eixoY, ROT[i]), s3.setScalar(k)); corpos.setMatrixAt(i, m4); telhados.setMatrixAt(i, m4);
  }
  corpos.instanceMatrix.needsUpdate = telhados.instanceMatrix.needsUpdate = true;
  for (const l of LBL) { const v = l.vezes.find(([a, b]) => entre(t, a, b)); escalaSprite(l.s, v ? pop(t, v[0] + .08) : 0); }
  // coroa + "PREFEITO?" em São Paulo
  const kp = entre(t, C(5), C(6)) ? pop(t, P(5, "prefeito") - .1, .4) : 0;
  coroa.visible = kp > 0; coroa.scale.setScalar(Math.max(.001, kp * .55)); coroa.rotation.y = t * 1.8;
  coroa.position.set(SPX, ALT + .75 + .04 * Math.sin(t * 4), SPZ);
  etPref.position.set(SPX, ALT + 1.2, SPZ); escalaSprite(etPref, kp > 0 ? pop(t, P(5, "prefeito")) : 0);
  // o fundador de SP sai da frente enquanto a coroa está lá
  const fsp = LBL.find((l) => l.fund && l.g === 0); if (kp > 0) fsp.s.visible = false;
  flash.style.opacity = cam.i > 0 ? .35 * clamp(1 - cam.dt / .12, 0, 1) : 0;
  renderer.render(scene, camera);
  textos(t);
}
window.renderFrame = quadro;
quadro(0);
window.pronto = true;
</script>
</body></html>
