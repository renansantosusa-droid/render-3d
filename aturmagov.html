const TEMPOS = await (await fetch(`/${ID}/tempos.json`)).json();
const W = 1080, H = 1920, FIM = TEMPOS.total;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const prog = (t, a, b) => ease(clamp((t - a) / (b - a), 0, 1));
const lin = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const pulse = (t, a, d = .35) => { const k = (t - a) / d; return k < 0 || k > 1 ? 0 : Math.sin(k * Math.PI); };
const pop = (t, a, d = .3) => { const k = clamp((t - a) / d, 0, 1); return k <= 0 ? 0 : k >= 1 ? 1 : (1 - Math.pow(1 - k, 3)) + .3 * Math.sin(k * Math.PI); };
const entre = (t, a, b) => t >= a && t < b;
const CENA = (n) => TEMPOS.cenas[n - 1], C = (n) => CENA(n).ini;
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
function P(n, w, o = 1) { let k = 0; for (const p of CENA(n).palavras) if (norm(p.w) === norm(w) && ++k === o) return p.t; console.error("palavra nao achada", n, w); return C(n); }
await document.fonts.load("900 64px Nunito"); await document.fonts.ready;

// ---------- projeção (lon/lat -> mundo) ----------
const K = .5, LON0 = -52, LAT0 = -14;
const X = (lon) => (lon - LON0) * K, Z = (lat) => -(lat - LAT0) * K, ALT = .35;

// ---------- three ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ef); scene.fog = new THREE.Fog(0x9fd3ef, 70, 150);
const camera = new THREE.PerspectiveCamera(40, W / H, .05, 400);
scene.add(new THREE.HemisphereLight(0xf2fbff, 0x5d8f6a, 1.5));
const sol = new THREE.DirectionalLight(0xfff4dc, 2.3); sol.position.set(-14, 26, 18); sol.castShadow = true;
sol.shadow.mapSize.set(4096, 4096); Object.assign(sol.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 80 }); sol.shadow.bias = -.0005; sol.shadow.radius = 3;
scene.add(sol);
function canvasTex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
const texMar = canvasTex(512, 512, (g) => { g.fillStyle = "#86c9ec"; g.fillRect(0, 0, 512, 512); g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 4; for (let i = 0; i < 40; i++) { const x = (i * 197) % 512, y = (i * 311) % 512; g.beginPath(); g.arc(x, y, 18, Math.PI * 1.15, Math.PI * 1.85); g.stroke(); } });
texMar.wrapS = texMar.wrapT = THREE.RepeatWrapping; texMar.repeat.set(30, 30);

// ---------- estados ----------
const VERDES = [0x6cc24a, 0x5cb83f, 0x79cc55, 0x63bd45, 0x86d35f, 0x57b03b];
const ladoMat = new THREE.MeshStandardMaterial({ color: 0x3c8a30, roughness: .9 });
const bordaMat = new THREE.LineBasicMaterial({ color: 0xe9f7df, transparent: true, opacity: .85 });
const praiaMat = new THREE.MeshStandardMaterial({ color: 0xf1e3b5, roughness: 1 });
Object.keys(GEO).forEach((uf, i) => {
  const topo = new THREE.MeshStandardMaterial({ color: VERDES[i % VERDES.length], roughness: .85 });
  for (const poly of GEO[uf]) {
    const forma = new THREE.Shape(poly[0].map(([lon, lat]) => new THREE.Vector2(X(lon), -Z(lat))));
    for (const buraco of poly.slice(1)) forma.holes.push(new THREE.Path(buraco.map(([lon, lat]) => new THREE.Vector2(X(lon), -Z(lat)))));
    const geo = new THREE.ExtrudeGeometry(forma, { depth: ALT, bevelEnabled: false }); geo.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(geo, [topo, ladoMat]); m.castShadow = true; m.receiveShadow = true; scene.add(m);
    const pg = new THREE.ExtrudeGeometry(forma, { depth: .08, bevelEnabled: true, bevelThickness: .02, bevelSize: .12, bevelSegments: 1 }); pg.rotateX(-Math.PI / 2);
    const praia = new THREE.Mesh(pg, praiaMat); praia.position.y = -.04; praia.receiveShadow = true; scene.add(praia);
    scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(poly[0].map(([lon, lat]) => new THREE.Vector3(X(lon), ALT + .006, Z(lat)))), bordaMat));
  }
});

// ---------- terra firme ----------
const dentro = (lon, lat, anel) => { let d = false; for (let i = 0, j = anel.length - 1; i < anel.length; j = i++) { const [xi, yi] = anel[i], [xj, yj] = anel[j]; if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) d = !d; } return d; };
const terra = (lon, lat) => Object.values(GEO).some((ps) => ps.some((p) => dentro(lon, lat, p[0]) && !p.slice(1).some((b) => dentro(lon, lat, b))));
const firme = (lon, lat, m) => [[0, 0], [m, 0], [-m, 0], [0, m], [0, -m]].every(([a, b]) => terra(lon + a, lat + b));
function emTerra(lon, lat, m) { const [cl, ca] = [-50, -12]; for (let i = 0; i < 60 && !firme(lon, lat, m); i++) { const dl = cl - lon, da = ca - lat, n = Math.hypot(dl, da) || 1; lon += .06 * dl / n; lat += .06 * da / n; } return [lon, lat]; }

const rrc = (g, x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
function etiqueta(txt, { bg = "#fff", fg = "#14204a", alt = .5, borda = "#14204a" } = {}) {
  const tam = 64, pad = 34; const c0 = document.createElement("canvas").getContext("2d"); c0.font = `900 ${tam}px Nunito`;
  const w = Math.ceil(c0.measureText(txt).width + pad * 2), h = Math.ceil(tam * 1.55);
  const tex = canvasTex(w + 12, h + 12, (g) => { rrc(g, 6, 6, w, h, h / 2); g.fillStyle = bg; g.fill(); g.lineWidth = 9; g.strokeStyle = borda; g.stroke(); g.fillStyle = fg; g.font = `900 ${tam}px Nunito`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(txt, (w + 12) / 2, (h + 12) / 2 + 3); });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  s.scale.set(alt * (w + 12) / (h + 12), alt, 1); s.renderOrder = 10; s.userData.base = s.scale.clone(); scene.add(s); return s;
}
const escalaSprite = (s, k) => { s.visible = k > .001; const f = Math.max(.001, k) * camera.position.distanceTo(s.position) / 9; s.scale.set(s.userData.base.x * f, s.userData.base.y * f, 1); };

// ---------- as casas reais (instanciadas) ----------
const N = DADOS.casas.length;
const POS = DADOS.casas.map(([lon, lat, dest]) => { const [a, b] = emTerra(lon, lat, dest ? .14 : .08); return [X(a), Z(b), dest ? .17 : .12]; });
const corpoGeo = new THREE.BoxGeometry(1, .82, .9); corpoGeo.translate(0, .41, 0);
const telGeo = new THREE.ConeGeometry(.84, .6, 4); telGeo.rotateY(Math.PI / 4); telGeo.translate(0, 1.12, 0);
const corpos = new THREE.InstancedMesh(corpoGeo, new THREE.MeshStandardMaterial({ color: 0xfffaf0, roughness: .7 }), N);
const telhados = new THREE.InstancedMesh(telGeo, new THREE.MeshStandardMaterial({ roughness: .6 }), N);
corpos.castShadow = telhados.castShadow = true;
const CORES = [0xe4573a, 0x2b59c3, 0xffb020, 0x8e5cd9, 0xff6fa8, 0x18a39a, 0xff7a45].map((c) => new THREE.Color(c));
for (let i = 0; i < N; i++) telhados.setColorAt(i, CORES[i % CORES.length]);
scene.add(corpos, telhados);
// as casas nascem em onda no começo da cena 1, na ordem real
const T_GOV = P(1, "governadores"), T_ONDA = .12, T_FIM_ONDA = 2.3;
const ordem = [...Array(N).keys()].sort((a, b) => DADOS.casas[a][3] - DADOS.casas[b][3]);
const QUANDO = new Float32Array(N); ordem.forEach((i, k) => QUANDO[i] = T_ONDA + (T_FIM_ONDA - T_ONDA) * (k / N));
const ROT = DADOS.casas.map((_, i) => (i * 2.399) % (Math.PI / 2) - Math.PI / 4);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v3 = new THREE.Vector3(), s3 = new THREE.Vector3(), eixoY = new THREE.Vector3(0, 1, 0);
const LBL = DADOS.labels, REGS = DADOS.extra.regioes;
const kCasa = (e, d) => e * clamp(d / 8, 1, 3);

// ---------- coroas nas casas dos 27 governadores ----------
const ouro = new THREE.MeshStandardMaterial({ color: 0xffd23f, emissive: 0xffa000, emissiveIntensity: .35, metalness: .3, roughness: .35 });
function fazCoroa() { const g = new THREE.Group(); g.add(new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, .22, 24, 1, true), ouro)); for (let k = 0; k < 5; k++) { const p = new THREE.Mesh(new THREE.ConeGeometry(.12, .34, 8), ouro); const a = k / 5 * Math.PI * 2; p.position.set(Math.cos(a) * .4, .26, Math.sin(a) * .4); g.add(p); } g.visible = false; scene.add(g); return g; }
LBL.forEach((l, n) => { l.coroa = fazCoroa(); l.n = n; });

// ---------- câmera: geral + 1 tomada por região ----------
const pll = (lon, lat) => [X(lon), Z(lat)];
const S = (a, alvo, de, ate) => ({ a, alvo, de, ate });
const EL = 54;
const tR = [C(2), P(2, "No", 2) - .05, P(2, "No", 3) - .05, P(2, "No", 4) - .05, P(2, "E") - .05];
const tRfim = [tR[1], tR[2], tR[3], tR[4], C(3)];
const topoY = (l, d) => ALT + 2.35 * kCasa(POS[l.i][2], d);
// enquadra: menor distância em que todos os governadores da região cabem na faixa segura da tela (acima da legenda, abaixo do chip)
const camT = new THREE.PerspectiveCamera(40, W / H, .05, 400), pv = new THREE.Vector3();
function enquadra(r) {
  const L = LBL.filter((l) => l.reg === r);
  const xs = L.map((l) => POS[l.i][0]), zs = L.map((l) => POS[l.i][1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cz = (Math.min(...zs) + Math.max(...zs)) / 2;
  for (let d = 6; d < 90; d += .4) {
    const er = EL * Math.PI / 180; camT.position.set(cx, ALT + d * Math.sin(er), cz + d * Math.cos(er)); camT.lookAt(cx, ALT, cz); camT.updateMatrixWorld(); camT.updateProjectionMatrix();
    let ok = true;
    for (const l of L) { pv.set(POS[l.i][0], topoY(l, d), POS[l.i][1]).project(camT); const sx = (pv.x + 1) / 2 * W, sy = (1 - pv.y) / 2 * H; if (sx < 190 || sx > 890 || sy < 640 || sy > 1380) { ok = false; break; } }
    if (ok) return { cx, cz, d: Math.max(d * 1.1, 26) };
  }
  return { cx, cz, d: 60 };
}
const ENQ = REGS.map((_, r) => enquadra(r));
console.log("enquadramento", JSON.stringify(ENQ));
const GERAL = pll(-53, -15.5);
const SHOTS = [
  S(0, GERAL, [52, -8, 62], [45, 2, 58]),
  ...ENQ.map((e, r) => S(tR[r], [e.cx, e.cz], [e.d * 1.1, -5 + r * 2, EL], [e.d, 5 - r * 2, EL])),
  S(C(3), pll(-53, -16), [54, 4, 60], [49, -4, 58]),
  S(C(4), pll(-53, -16), [49, -4, 58], [45, 6, 56]),
  S(C(5), pll(-53, -16), [50, 4, 60], [47, -4, 58]),
];
SHOTS.forEach((s, i) => s.b = i + 1 < SHOTS.length ? SHOTS[i + 1].a : FIM);
const alvo = new THREE.Vector3();
function moverCamera(t) {
  const i = SHOTS.findLastIndex((s) => t >= s.a), s = SHOTS[Math.max(0, i)];
  const k = ease(clamp((t - s.a) / (s.b - s.a), 0, 1)), [d, yaw, el] = s.de.map((x, j) => x + (s.ate[j] - x) * k);
  const yr = yaw * Math.PI / 180, er = el * Math.PI / 180;
  alvo.set(s.alvo[0], ALT, s.alvo[1]);
  camera.position.set(alvo.x + d * Math.sin(yr) * Math.cos(er), alvo.y + d * Math.sin(er), alvo.z + d * Math.cos(yr) * Math.cos(er));
  camera.lookAt(alvo);
  camera.updateMatrixWorld();
  return { i, dt: t - s.a };
}

// ---------- etiquetas "👑 UF · @governador" (camada 2D com layout anti-sobreposição) ----------
const lab = document.createElement("canvas"); lab.width = W; lab.height = H; lab.className = "ov"; lab.id = "lab"; document.body.appendChild(lab);
const g2 = lab.getContext("2d");
const LAB_H = 64, GAP = 72, YMIN = 470, YMAX = 1570, XMIN = 60, XMAX = W - 60;
LBL.forEach((l) => {
  l.txt = `👑 ${l.uf} · ${l.u}`; let fs_ = 40; g2.font = `900 ${fs_}px Nunito`; let w = g2.measureText(l.txt).width + 44;
  if (w > 700) { fs_ = Math.floor(fs_ * 700 / w); g2.font = `900 ${fs_}px Nunito`; w = g2.measureText(l.txt).width + 44; }
  l.fs = fs_; l.w = Math.ceil(w);
});
const REG_L = REGS.map((_, r) => LBL.filter((l) => l.reg === r).sort((a, b) => POS[a.i][0] - POS[b.i][0]));
REG_L.forEach((L, r) => L.forEach((l, k) => { l.t0 = tR[r] + .1 + k * Math.min(.07, .6 / L.length); l.t1 = tRfim[r]; }));
function desenhaLabels(t) {
  g2.clearRect(0, 0, W, H); lab.style.display = (t >= tR[0] && t < C(3)) ? "block" : "none";
  const r = tR.findLastIndex((a) => t >= a); if (r < 0 || t >= C(3)) return;
  const L = REG_L[r].filter((l) => t >= l.t0);
  if (!L.length) return;
  const dist = camera.position.distanceTo(alvo);
  const it = L.map((l) => { pv.set(POS[l.i][0], topoY(l, dist), POS[l.i][1]).project(camera); const ax = (pv.x + 1) / 2 * W, ay = (1 - pv.y) / 2 * H; return { l, ax, ay, x: clamp(ax, XMIN + l.w / 2, XMAX - l.w / 2), y: ay - 74 }; }).sort((a, b) => a.y - b.y || a.ax - b.ax);
  for (const o of it) o.y = clamp(o.y, YMIN + LAB_H / 2, YMAX - LAB_H / 2);
  const choca = (a, b) => Math.abs(a.x - b.x) < (a.l.w + b.l.w) / 2 + 10;
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < it.length; i++) for (let j = 0; j < i; j++) if (choca(it[i], it[j]) && it[i].y - it[j].y < GAP) it[i].y = it[j].y + GAP;
    for (let i = it.length - 1; i >= 0; i--) { if (it[i].y > YMAX - LAB_H / 2) it[i].y = YMAX - LAB_H / 2; for (let j = i + 1; j < it.length; j++) if (choca(it[i], it[j]) && it[j].y - it[i].y < GAP) it[i].y = it[j].y - GAP; }
    for (const o of it) o.y = clamp(o.y, YMIN + LAB_H / 2, YMAX - LAB_H / 2);
  }
  // linhas de ligação e pontos primeiro, etiquetas por cima
  for (const o of it) { const k = clamp(pop(t, o.l.t0, .3), 0, 1.2); g2.save(); g2.globalAlpha = Math.min(1, k); g2.strokeStyle = "#14204a"; g2.lineWidth = 5; g2.beginPath(); g2.moveTo(o.ax, o.ay); g2.lineTo(o.x + clamp(o.ax - o.x, -o.l.w / 2 + 30, o.l.w / 2 - 30), o.y + LAB_H / 2 - 4); g2.stroke(); g2.fillStyle = "#e4573a"; g2.strokeStyle = "#fff"; g2.lineWidth = 4; g2.beginPath(); g2.arc(o.ax, o.ay, 9, 0, 7); g2.fill(); g2.stroke(); g2.restore(); }
  for (const o of it) {
    const k = clamp(pop(t, o.l.t0, .3), 0, 1.2); if (k <= .01) continue;
    g2.save(); g2.translate(o.x, o.y); g2.scale(k, k);
    rrc(g2, -o.l.w / 2, -LAB_H / 2, o.l.w, LAB_H, LAB_H / 2); g2.fillStyle = "#ffd23f"; g2.fill(); g2.lineWidth = 6; g2.strokeStyle = "#14204a"; g2.stroke();
    g2.fillStyle = "#14204a"; g2.font = `900 ${o.l.fs}px Nunito`; g2.textAlign = "center"; g2.textBaseline = "middle"; g2.fillText(o.l.txt, 0, 3);
    g2.restore();
  }
}

// ---------- textos na tela ----------
const mk = (id, cls = "") => { const el = document.createElement("div"); el.id = id; el.className = "ov " + cls; document.body.appendChild(el); return el; };
const flash = document.createElement("div"); flash.id = "flash"; document.body.appendChild(flash);
const elMarca = mk("marca"); elMarca.innerHTML = "A TURMA DO <b>BRASIL</b>";
const elChip = mk("chip");
const elCta = mk("cta"); elCta.innerHTML = `<div class="l1">💬 COMENTA TUA CIDADE</div><div class="l2">ex: Recife PE</div>`;
const elSeta = mk("seta"); const elLeg = mk("legenda");
// cartão com a lista dos 27 (2 colunas, por região)
const COR_REG = ["#2fa34a", "#e4573a", "#d98a00", "#2b59c3", "#8e5cd9"];
const GOVS = [...DADOS.extra.gov].sort((a, b) => a.regiao - b.regiao || a.uf.localeCompare(b.uf));
const elLista = mk("lista");
const meio = Math.ceil(GOVS.length / 2);
elLista.innerHTML = [GOVS.slice(0, meio), GOVS.slice(meio)].map((col) => `<div class="col">${col.map((g) => `<div class="li"><b style="background:${COR_REG[g.regiao]}">${g.uf}</b><span>@${g.u}</span></div>`).join("")}</div>`).join("");
elLista.style.opacity = 0;
const LINHAS = [...elLista.querySelectorAll(".li")];
LINHAS.forEach((li) => { const sp = li.querySelector("span"); let f = 36; sp.style.fontSize = f + "px"; while (sp.offsetWidth > 350 && f > 22) { f--; sp.style.fontSize = f + "px"; } });
const CHIPS = [
  [0, C(2), `👑 GOVERNADORES<small>os primeiros da Turma do Brasil</small>`, true],
  ...REGS.map((nome, r) => [tR[r], tRfim[r], `👑 GOVERNADORES · ${nome.toUpperCase()}`, true]),
  [C(3), P(3, "E") - .1, `👑 OS ${DADOS.extra.governadores} GOVERNADORES`, true],
  [P(3, "E") - .1, C(4), `⭐ PONTOS ZERADOS<small>nova semana começou</small>`, true],
  [C(4), C(5), `🔥 AMANHÃ: EVENTOS NOVOS<small>+ jeitos novos de ganhar pontos</small>`, true],
  [C(5), 99, `💬 COMENTA TUA CIDADE + ESTADO`, true],
];
const PALAVRAS = TEMPOS.cenas.flatMap((c) => c.palavras);
const DESTAQUE = new Set(["saiu", "primeiros", "governadores", "governador", "turma", "brasil", "norte", "nordeste", "centrooeste", "sudeste", "sul", "parabens", "pontos", "zeraram", "novo", "novos", "eventos", "amanha", "ganhar", "casa", "mapa", "comenta", "cidade", "estado", "tua", "teu"]);
const esc = (el, k, centro = true) => el.style.transform = (centro ? "translateX(-50%) " : "") + `scale(${k})`;
let chipChave = "";
function textos(t) {
  esc(elMarca, 1 + .06 * pulse(t, P(1, "Turma") - .1, .5));
  const c = CHIPS.find(([a, b]) => entre(t, a, b));
  if (c) {
    if (chipChave !== c[2]) { chipChave = c[2]; elChip.innerHTML = c[2]; elChip.style.fontSize = c[2].startsWith("👑 GOVERNADORES<") ? "84px" : "70px"; }
    elChip.className = "ov amarelo"; elChip.style.opacity = 1; esc(elChip, .55 + .45 * prog(t, c[0], c[0] + .16) + .05 * pulse(t, c[0] + .08, .3));
  } else elChip.style.opacity = 0;
  // cartão da lista: aparece com "Parabéns", sai quando a cena 4 começa
  const tl = C(3) + .1, kl = prog(t, tl, tl + .22) * (1 - prog(t, C(4) - .1, C(4)));
  elLista.style.opacity = kl; esc(elLista, .7 + .3 * kl, false);
  LINHAS.forEach((li, i) => { const ki = clamp((t - tl - .15 - (i % meio) * .03) / .12, 0, 1); li.style.opacity = ki; });
  // CTA final
  const tc = P(5, "Comenta") - .05, kc = prog(t, tc, tc + .25);
  elCta.style.opacity = kc; esc(elCta, .6 + .4 * kc + .04 * Math.sin(t * 9) * kc, false);
  elSeta.style.opacity = kc; elSeta.style.transform = `translateY(${18 * Math.abs(Math.sin(t * 5))}px)`;
  // legenda palavra por palavra
  let atual = null; for (const p of PALAVRAS) if (t >= p.t) atual = p;
  if (!atual || t > tc || (c && norm(c[2]).startsWith(norm(atual.w)))) { elLeg.textContent = ""; return; }
  elLeg.textContent = atual.w.toUpperCase(); elLeg.className = "ov" + (DESTAQUE.has(norm(atual.w)) ? " am" : "");
  esc(elLeg, .8 + .2 * prog(t, atual.t, atual.t + .09), false);
}

function quadro(t) {
  const cam = moverCamera(t);
  texMar.offset.set(t * .01, t * .006);
  const dist = camera.position.distanceTo(alvo);
  for (let i = 0; i < N; i++) {
    const [x, z, e] = POS[i], k = Math.max(.0001, clamp(pop(t, QUANDO[i], .35), 0, 1.3) * kCasa(e, dist));
    m4.compose(v3.set(x, ALT, z), q.setFromAxisAngle(eixoY, ROT[i]), s3.setScalar(k)); corpos.setMatrixAt(i, m4); telhados.setMatrixAt(i, m4);
  }
  corpos.instanceMatrix.needsUpdate = telhados.instanceMatrix.needsUpdate = true;
  for (const l of LBL) {
    const kp = clamp(pop(t, T_GOV + l.n * .045, .35), 0, 1.3), kh = Math.max(.0001, clamp(pop(t, QUANDO[l.i], .35), 0, 1.3) * kCasa(POS[l.i][2], dist));
    l.coroa.visible = kp > .01; const cs = Math.max(.001, kp * kh * 1.7);
    l.coroa.scale.setScalar(cs); l.coroa.rotation.y = t * 1.8 + l.n; l.coroa.position.set(POS[l.i][0], ALT + 1.5 * kh + .25 * cs + .06 * kh * Math.sin(t * 4 + l.n), POS[l.i][1]);
  }
  flash.style.opacity = cam.i > 0 ? .35 * clamp(1 - cam.dt / .12, 0, 1) : 0;
  renderer.render(scene, camera);
  desenhaLabels(t);
  textos(t);
}
window.renderFrame = quadro;
quadro(0);
window.pronto = true;
</script>
