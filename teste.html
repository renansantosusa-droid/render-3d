<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";
import { montarLegenda } from "/legenda.js";
const TEMPOS = await (await fetch("/teste/tempos.json")).json();
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1080, 1920); renderer.setPixelRatio(1); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2b3a52);
const camera = new THREE.PerspectiveCamera(36, 1080 / 1920, .1, 100); camera.position.set(0, 0, 5);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));
const cubo = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xffd23a })); scene.add(cubo);
const legenda = montarLegenda(TEMPOS.cenas.flatMap((c) => c.palavras.map((p) => [p.w, p.t])));
function quadro(t) { cubo.rotation.set(t, t * 1.3, 0); legenda(t); renderer.render(scene, camera); }
window.renderFrame = quadro;
await document.fonts.ready; quadro(0); window.pronto = true;
</script>
</body></html>
