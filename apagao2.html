<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// Série "O Apagão" — Episódio 2 (2D flat, estilo @historiascomkaio)
const TEMPOS = await (await fetch("/apagao2/tempos.json")).json();
const W = 1080, H = 1920, cv = document.getElementById("c"), g = cv.getContext("2d");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const prog = (t, a, b) => ease(clamp((t - a) / (b - a), 0, 1));
const pulse = (t, a, d = .35) => { const k = (t - a) / d; return k < 0 || k > 1 ? 0 : Math.sin(k * Math.PI); };
const frac = (x) => x - Math.floor(x);
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const CENA = (n) => TEMPOS.cenas[n - 1], C = (n) => CENA(n).ini, F = (n) => CENA(n).fim;
function P(n, w, o = 1) { let k = 0; for (const p of CENA(n).palavras) if (norm(p.w) === norm(w) && ++k === o) return p.t; console.error("palavra nao achada", n, w); return C(n); }
const FALA = TEMPOS.fala, T = TEMPOS.total;
let rs = 1; const rnd = () => { rs = (rs * 16807) % 2147483647; return rs / 2147483647; };

// ---------- paleta ----------
const COR = { fundo: "#e9e2d0", fundoNoite: "#1d2129", predio: "#d9d2c0", linha: "#b9b09a", escuro: "#2a2e36", mostarda: "#e0a83a", vermelho: "#d6453a", azul: "#4a9be0", agua: "#6ab8f0", verde: "#4fae5a", pele: "#e8b48a", cabelo: "#3a2a20", camisa: "#3f6f73", calca: "#3a5a8a", txt: "#2a2e36" };

// ---------- primitivas ----------
const rr = (x, y, w, h, r, cor) => { g.fillStyle = cor; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
const rect = (x, y, w, h, cor) => { g.fillStyle = cor; g.fillRect(x, y, w, h); };
function txt(s, x, y, tam, cor, peso = 700, al = "center") { g.font = `${peso} ${tam}px Oswald`; g.textAlign = al; g.textBaseline = "middle"; g.fillStyle = cor; g.fillText(s, x, y); }
function etiqueta(s, x, y, fundo, cor = "#fff", tam = 34, a = 1) { if (a <= 0) return; g.save(); g.globalAlpha = a; g.font = `700 ${tam}px Oswald`; const w = g.measureText(s).width + tam * .9; const sc = .85 + .15 * Math.min(1, a * 1.5); g.translate(x, y); g.scale(sc, sc); rr(-w / 2, -tam * .75, w, tam * 1.5, 6, fundo); txt(s, 0, 2, tam, cor); g.restore(); }
function cartao(l1, l2, x, y, a = 1, cor2 = "#2a2e36") { if (a <= 0) return; g.save(); g.globalAlpha = a; g.translate(x, y); g.font = "700 64px Oswald"; const w = Math.max(g.measureText(l2).width, 260) + 80; rr(-w / 2, -70, w, 150, 10, "#fdf8ec"); rect(-w / 2, -70, w, 34, COR.mostarda); txt(l1, 0, -53, 24, "#2a2e36"); txt(l2, 0, 22, 64, cor2); g.restore(); }
function pessoa(x, y, s = 1, { camisa = COR.camisa, olhar = 0, braco = 0, cabelo = COR.cabelo, bone = null, cabeca = 0 } = {}) {
  g.save(); g.translate(x, y); g.scale(s, s);
  rect(-26, -150, 20, 150, COR.calca); rect(6, -150, 20, 150, COR.calca);
  rr(-30, -6, 30, 12, 4, "#2a2a2a"); rr(4, -6, 30, 12, 4, "#2a2a2a");
  rr(-38, -290, 76, 150, 18, camisa);
  g.save(); g.translate(30, -275); g.rotate(-braco); rr(-8, 0, 20, 120, 10, camisa); rr(-6, 112, 18, 22, 9, COR.pele); g.restore();
  g.save(); g.translate(-30, -275); rr(-12, 0, 20, 120, 10, camisa); rr(-10, 112, 18, 22, 9, COR.pele); g.restore();
  rect(-10, -312, 20, 26, COR.pele);
  g.save(); g.translate(0, -350); g.rotate(cabeca);
  g.fillStyle = COR.pele; g.beginPath(); g.arc(0, 0, 44, 0, 6.283); g.fill();
  g.fillStyle = cabelo; g.beginPath(); g.arc(0, -6, 46, Math.PI * 1.05, Math.PI * 1.95); g.fill();
  if (bone) { g.fillStyle = bone; g.beginPath(); g.arc(0, -10, 47, Math.PI, 0); g.fill(); rect(0, -14, 64, 10, bone); }
  g.fillStyle = "#222"; g.beginPath(); g.arc(-14 + olhar * 8, 4, 5, 0, 6.283); g.arc(14 + olhar * 8, 4, 5, 0, 6.283); g.fill();
  g.strokeStyle = "#222"; g.lineWidth = 4; g.beginPath(); g.moveTo(-22 + olhar * 8, -10); g.lineTo(-6 + olhar * 8, -7); g.moveTo(6 + olhar * 8, -7); g.lineTo(22 + olhar * 8, -10); g.stroke();
  g.beginPath(); g.moveTo(-8, 22); g.lineTo(8, 22); g.stroke();
  g.restore(); g.restore();
}
// cidade ao fundo
const PREDIOS = Array.from({ length: 14 }, (_, i) => ({ x: -40 + i * 82 + rnd() * 30, w: 90 + rnd() * 70, h: 380 + rnd() * 620, c: ["#cfc8b4", "#bdb6a2", "#d8d0bc", "#c4bca6"][i % 4], j: Array.from({ length: 80 }, () => rnd()) }));
function cidade(chao, luz, noite) {
  for (const p of PREDIOS) { rect(p.x, chao - p.h, p.w, p.h, noite ? "#2c313b" : p.c);
    for (let r = 0; r < Math.floor(p.h / 46) - 1; r++) for (let c = 0; c < Math.floor(p.w / 34); c++) { const j = p.j[(r * 7 + c) % 80]; const acesa = j < luz * .75; rect(p.x + 10 + c * 34, chao - p.h + 18 + r * 46, 20, 26, acesa ? "#f2c45a" : (noite ? "#1d2129" : "#a8a090")); } }
  rect(0, chao, W, H - chao, noite ? "#15181e" : "#8a8574");
}
// prédio em corte (diagrama que volta sempre)
const PX = 190, PW = 580, NF = 12, FH = 82, PBASE = 1660;
const yAndar = (n) => PBASE - n * FH;
function predio(t, { luz = 1, noite = false, nivel = 1, bomba = false, fluxoSobe = false, chuveiros = 0, destaque = true, chia = false, aguaDiego = 0 }) {
  // caixa d'água
  const cx = PX + PW - 150, cy = yAndar(NF) - 150;
  rect(cx + 20, cy + 110, 12, 40, "#777"); rect(cx + 108, cy + 110, 12, 40, "#777");
  rr(cx, cy, 140, 110, 6, noite ? "#3a4250" : "#c8d6e0");
  rect(cx + 6, cy + 6 + 98 * (1 - nivel), 128, 98 * nivel, COR.agua);
  txt("CAIXA D'ÁGUA", cx + 70, cy - 22, 24, noite ? "#cfd6e0" : COR.txt);
  // andares
  for (let n = 0; n < NF; n++) { const y = yAndar(n + 1);
    const eh9 = n + 1 === 9 && destaque;
    rect(PX, y, PW, FH - 4, eh9 ? COR.mostarda : (noite ? "#2c313b" : COR.predio));
    rect(PX, y + FH - 4, PW, 4, noite ? "#1d2129" : COR.linha);
    for (let k = 0; k < 4; k++) rect(PX + 40 + k * 130, y + 18, 76, 40, luz > (n * 4 + k) % 7 / 7 ? "#f2c45a" : (noite ? "#1d2129" : "#a8a090"));
    txt(`${n + 1}º`, PX - 36, y + FH / 2, 26, noite ? "#aab" : COR.txt, 500);
    if (chuveiros && (n * 5 + 3) % 4 === 0 && n !== 8) for (let d = 0; d < 6; d++) { const k = frac(t * 1.6 + d / 6); g.fillStyle = COR.agua; g.beginPath(); g.arc(PX + 130 + (d % 3) * 14, y + 10 + k * 40, 4, 0, 6.283); g.fill(); }
    if (chia) { g.globalAlpha = .4 + .4 * Math.sin(t * 20 + n); txt("SSS", PX + 400, y + FH / 2, 22, "#9ab", 500); g.globalAlpha = 1; }
  }
  if (destaque) { txt("◀ DIEGO", PX + PW + 90, yAndar(9) + FH / 2, 30, COR.mostarda === "#e0a83a" && noite ? "#f2c45a" : COR.txt); }
  // cano da bomba até a caixa
  const canoX = PX + PW + 24;
  rect(canoX - 7, cy + 50, 14, PBASE + 40 - cy - 50, noite ? "#4a5260" : "#9aa4ae"); rect(canoX - 7, cy + 50, cx - canoX + 7, 14, noite ? "#4a5260" : "#9aa4ae");
  if (fluxoSobe) for (let d = 0; d < 14; d++) { const k = frac(t * .5 + d / 14); g.fillStyle = COR.azul; g.beginPath(); g.arc(canoX, PBASE + 40 - k * (PBASE + 40 - cy - 57), 6, 0, 6.283); g.fill(); }
  // bomba
  rr(canoX - 46, PBASE + 20, 92, 60, 8, bomba ? "#5a6a7a" : "#8a3a34"); txt("BOMBA", canoX, PBASE + 50, 22, "#fff");
  rect(PX - 60, PBASE, PW + 200, 400, noite ? "#15181e" : "#8a8574");
}
// cômodos
function banheiro(t, k160) {
  rect(0, 0, W, H, "#e6ecef"); for (let y = 0; y < 1500; y += 60) rect(0, y, W, 2, "#cdd8de"); for (let x = 0; x < W; x += 60) rect(x, 0, 2, 1500, "#cdd8de");
  rect(0, 1500, W, 420, "#b9b2a0");
  // banheira
  rr(120, 1300, 520, 200, 30, "#fafafa"); rect(140, 1320 + 160 * (1 - Math.min(1, k160 * 1.6)), 480, 160 * Math.min(1, k160 * 1.6), COR.agua);
  rr(110, 1290, 540, 30, 14, "#f2f2f2");
  return 1500;
}
function cozinha(noite) { rect(0, 0, W, H, noite ? "#262a33" : "#efe6d4"); for (let x = 0; x < W; x += 80) rect(x, 0, 2, 1500, noite ? "#2e333c" : "#e2d8c2"); rect(0, 1500, W, 420, noite ? "#1a1d23" : "#a89a80"); }

// ---------- legenda (blocos de 3 palavras, palavra-chave colorida) ----------
const CHAVE = { vizinho: COR.vermelho, valter: COR.vermelho, porteiro: COR.vermelho, salao: COR.mostarda, piscina: COR.azul, vaso: COR.vermelho, sumido: COR.vermelho, aberta: COR.vermelho, esconde: COR.mostarda,  agua: COR.azul, erro: COR.vermelho, bomba: COR.mostarda, luz: COR.mostarda, apaga: COR.mostarda, botijao: COR.mostarda, fogo: "#ff8a3a", geladeira: COR.azul, regra: COR.vermelho, papel: COR.mostarda, sindico: COR.vermelho, lista: COR.vermelho, topo: COR.vermelho, diego: COR.mostarda, caixa: COR.azul, chiar: COR.vermelho, litros: COR.azul, comida: COR.mostarda, secado: COR.vermelho, porta: COR.vermelho };
const blocos = []; for (const c of TEMPOS.cenas) { const ws = c.palavras; for (let i = 0; i < ws.length; i += 3) blocos.push({ t: ws[i].t, ws: ws.slice(i, i + 3).map((p) => p.w.replace(/[.,!?;:"]+$/, "")) }); }
function legenda(t, y = 1290) {
  if (t > FALA + .2) return; let b = null; for (const x of blocos) if (t >= x.t) b = x; if (!b) return;
  g.font = "700 78px Oswald"; const ps = b.ws.map((w) => w.toUpperCase()); const larg = ps.map((w) => g.measureText(w + " ").width); let x = W / 2 - larg.reduce((a, c) => a + c, 0) / 2;
  const k = Math.min(1, (t - b.t) / .1);
  ps.forEach((w, i) => { g.textAlign = "left"; g.textBaseline = "middle"; g.lineWidth = 12; g.strokeStyle = "rgba(0,0,0,.75)"; g.lineJoin = "round"; g.strokeText(w, x, y + (1 - k) * 12); g.fillStyle = CHAVE[norm(w)] || "#fff"; g.fillText(w, x, y + (1 - k) * 12); x += larg[i]; });
}

// ---------- quadro ----------
const zoom = (k, fn) => { g.save(); g.translate(W / 2, 1500); g.scale(k, k); g.translate(-W / 2, -1500); fn(); g.restore(); };
const SINDICO = { camisa: "#6a5a8a", cabelo: "#bbb" };
function salao(cheio, noite = false) {
  rect(0, 0, W, H, noite ? "#2a2e36" : "#efe2c8"); for (let x = 0; x < W; x += 120) rect(x, 0, 3, 1500, noite ? "#30343c" : "#e2d2b2");
  rect(0, 1500, W, 420, noite ? "#1a1d23" : "#b8a684");
  txt("SALÃO DE FESTAS", W / 2, 640, 40, noite ? "#666" : "#9a8a6a", 500);
  rr(170, 1360, 740, 30, 6, noite ? "#3a3a3a" : "#8a6a44"); rect(200, 1390, 20, 110, noite ? "#333" : "#6a4a2a"); rect(860, 1390, 20, 110, noite ? "#333" : "#6a4a2a");
  for (let i = 0; i < Math.round(cheio * 10); i++) { const x = 210 + (i % 5) * 136, y = 1360 - (i >= 5 ? 220 : 110); rr(x, y, 100, 110, 10, "#4a7ab0"); rect(x + 8, y + 20, 84, 82, COR.agua); }
}
function lista(t, riscaTopo = 0) {
  g.save(); g.translate(W / 2, 930); g.rotate(-.04);
  rr(-300, -420, 600, 840, 8, "#fdf8ec"); txt("ÁGUA — QUEM TEM?", 0, -350, 42, COR.txt);
  const nomes = ["DIEGO — 9º", "MARCOS — 4º", "FAMÍLIA SOUZA — 11º", "RITA — 2º"];
  nomes.forEach((n, i) => { const y = -240 + i * 110; const a = prog(t, P(2, "quatro") - .2 + i * .15, P(2, "quatro") + i * .15); g.globalAlpha = a; txt(n, -240, y, 46, i === 0 ? COR.vermelho : "#555", i === 0 ? 700 : 500, "left"); rect(-250, y + 36, 500, 2, "#ccc"); g.globalAlpha = 1; });
  if (t > P(2, "topo") - .2) { g.strokeStyle = COR.vermelho; g.lineWidth = 8; g.beginPath(); g.ellipse(-50, -240, 250, 60, 0, 0, 6.283); g.stroke(); }
  g.restore();
}
function conta(linhas, t, ini) { g.save(); rr(140, 560, 800, 120 + linhas.length * 110, 12, "#fdf8ec"); linhas.forEach(([s, cor, w], i) => { const a = prog(t, P(4, w) - .2, P(4, w) + .1); g.globalAlpha = a; txt(s, W / 2, 640 + i * 110, 64, cor); }); g.restore(); }
window.renderFrame = (t) => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
  const em = (a, b) => t >= a && t < b;
  if (t < C(2)) { // CENA 1: o perigo é o vizinho
    rect(0, 0, W, H, "#d8d0bc"); predio(t, { luz: 0, nivel: 0, bomba: false });
    etiqueta("O PERIGO NÃO É A SEDE", W / 2, 330, COR.escuro, "#fff", 46, prog(t, P(1, "perigo") - .2, P(1, "perigo") + .1) * (t < P(1, "vizinho") - .3 ? 1 : 0));
    if (t > P(1, "vizinho") - .3) { etiqueta("É O VIZINHO", W / 2, 330, COR.vermelho, "#fff", 62, prog(t, P(1, "vizinho") - .3, P(1, "vizinho"))); for (const n of [4, 7, 11]) { const y = yAndar(n) + FH / 2; g.globalAlpha = .6 + .4 * Math.sin(t * 6 + n); g.fillStyle = COR.vermelho; g.beginPath(); g.arc(PX + 60, y, 14, 0, 6.283); g.fill(); g.globalAlpha = 1; } }
    cartao("APAGÃO · DIA 2", "07:00", W / 2, 520, prog(t, .1, .5) * (t < P(1, "perigo") - .2 ? 1 : 0));
  } else if (t < C(3)) { // CENA 2: o síndico e a lista
    if (t < P(2, "lista") - .2) {
      rect(0, 0, W, H, "#262a33"); rect(0, 1500, W, 420, "#1a1d23");
      zoom(1.3, () => { rect(560, 700, 300, 800, "#e8c890"); pessoa(710, 1500, 1, { ...SINDICO, olhar: -1, braco: .9 }); pessoa(330, 1500, .95, { olhar: 1 }); });
      cartao("O SÍNDICO", "SEU VALTER, 62", W / 2, 330, prog(t, P(2, "valter") - .3, P(2, "valter") + .1), COR.vermelho);
    } else if (t < P(2, "porteiro") - .3) { rect(0, 0, W, H, COR.fundoNoite); lista(t); }
    else { // porteiro viu os baldes
      rect(0, 0, W, H, '#d8d0bc'); rect(0, 1500, W, 420, '#9a9078');
      for (let i = 0; i < 9; i++) rect(520 + i * 70, 1500 - i * 70, 600, 70, '#c4baa2');
      pessoa(240, 1500, 1.45, { camisa: '#3a3a5a', olhar: 1, bone: '#2a2a3a' });
      rr(60, 1150, 360, 350, 10, '#8a6a44'); rect(60, 1150, 360, 20, '#6a4a2a'); txt('PORTARIA', 240, 1240, 36, '#fdf8ec');
      const k = prog(t, P(2, 'porteiro') - .3, F(2) + .2); const dx = 600 + k * 300, dy = 1500 - k * 300;
      pessoa(dx, dy, .9, { olhar: 1, braco: .4 }); rr(dx + 30, dy - 190, 70, 80, 8, '#4a7ab0'); rect(dx + 36, dy - 176, 58, 60, COR.agua);
      etiqueta('O PORTEIRO VIU', W / 2, 330, COR.vermelho, '#fff', 50, 1);
    }
  } else if (t < C(4)) { // CENA 3: a proposta
    salao(prog(t, P(3, "entrega") - .3, P(3, "divide") + .3));
    zoom(1.1, () => pessoa(880, 1500, 1, { ...SINDICO, olhar: -1, braco: em(P(3, "divide") - .3, F(3)) ? 1.1 : .2 }));
    etiqueta("A PROPOSTA", W / 2, 330, COR.escuro, "#fff", 46, prog(t, P(3, "proposta") - .2, P(3, "proposta") + .1) * (t < P(3, "dois") - .3 ? 1 : 0));
    if (t > P(3, "dois") - .3) cartao("POR PESSOA, POR DIA", "2 LITROS", W / 2, 330, prog(t, P(3, "dois") - .3, P(3, "dois")), COR.azul);
  } else if (t < C(5)) { // CENA 4: a conta
    rect(0, 0, W, H, COR.fundo);
    conta([["130 MORADORES", COR.txt, "moradores"], ["× 2 L = 260 L/DIA", COR.txt, "duzentos"], ["ESTOQUE: 500 L", COR.azul, "quinhentos"], ["DURA < 2 DIAS", COR.vermelho, "dura"]], t);
    zoom(1.05, () => pessoa(W / 2, 1500, 1, { olhar: 0, braco: .3 }));
  } else if (t < C(6)) { // CENA 5: entrega 30 L e esconde o resto
    if (t < P(5, "esconde") - .2) {
      salao(.6); zoom(1.1, () => { pessoa(260, 1500, .95, { olhar: 1, braco: .8 }); pessoa(880, 1500, 1, { ...SINDICO, olhar: -1 }); });
      cartao("DIEGO ENTREGA", "30 L", W / 2, 330, prog(t, P(5, "trinta") - .3, P(5, "trinta")), COR.azul);
      if (t > P(5, "inimigo") - .3) etiqueta("PRA NÃO VIRAR INIMIGO", W / 2, 470, COR.escuro, "#fff", 40, 1);
    } else {
      rect(0, 0, W, H, "#e6ecef"); for (let y = 0; y < 1500; y += 60) rect(0, y, W, 2, "#cdd8de"); for (let x = 0; x < W; x += 60) rect(x, 0, 2, 1500, "#cdd8de"); rect(0, 1500, W, 420, "#b9b2a0");
      const spots = [["descarga", 260, 1150, 170, 230, "CAIXA DA DESCARGA"], ["maquina", 540, 1130, 260, 370, "MÁQUINA DE LAVAR"], ["forro", 540, 330, 600, 90, "ATRÁS DO FORRO"]];
      rr(200, 1290, 160, 210, 30, "#fafafa"); // vaso
      rr(170, 1130, 220, 170, 10, "#f2f2f2");
      rr(560, 1140, 300, 360, 14, "#f4f4f4"); g.fillStyle = "#3a4a5a"; g.beginPath(); g.arc(710, 1340, 100, 0, 6.283); g.fill();
      rect(0, 290, W, 120, "#d8d2c4");
      spots.forEach(([w, x, y, ww, hh, nome], i) => { const a = prog(t, P(5, w) - .3, P(5, w) + .1); if (a <= 0) return; g.globalAlpha = a; g.strokeStyle = COR.mostarda; g.lineWidth = 8; g.setLineDash([18, 12]); g.strokeRect(x - (i === 2 ? 300 : 30), y - 20, ww + 60, hh + 40); g.setLineDash([]); g.globalAlpha = 1; etiqueta(nome, x - (i === 2 ? 0 : 30) + (i === 2 ? 0 : ww / 2 + 30), y - 60, COR.mostarda, "#fff", 30, a); });
      etiqueta("ONDE NINGUÉM PROCURA", W / 2, 520, COR.escuro, "#fff", 44, prog(t, P(5, "ninguem") - .3, P(5, "ninguem")));
    }
  } else if (t < C(7)) { // CENA 6: a piscina + regra 2
    if (t < P(6, "regra") - .2) {
      rect(0, 0, W, H, "#cfe0c8"); rect(0, 1500, W, 420, "#9ab08a");
      rr(120, 1180, 840, 320, 20, "#e8e2d2"); rect(150, 1200, 780, 280, "#5ab0d8"); for (let i = 0; i < 6; i++) rect(180 + i * 120, 1240 + (i % 2) * 60, 70, 6, "rgba(255,255,255,.5)");
      zoom(1, () => { pessoa(140, 1180, .8, { olhar: 1, braco: em(P(6, "mostra") - .2, P(6, "piscina") + 1) ? 1.3 : 0 }); });
      cartao("PISCINA DO CONDOMÍNIO", "80.000 L", W / 2, 330, prog(t, P(6, "oitenta") - .3, P(6, "oitenta")), COR.azul);
      if (em(P(6, "beber") - .3, P(6, "serve") - .2)) etiqueta("NÃO É PRA BEBER", W / 2, 520, COR.vermelho, "#fff", 48, 1);
      if (t > P(6, "serve") - .2) { etiqueta("SERVE PRA DESCARGA", W / 2, 520, COR.verde, "#fff", 48, 1); if (t > P(6, "seis") - .3) etiqueta("6 L POR DESCARGA", W / 2, 640, COR.escuro, "#fff", 40, 1); }
    } else {
      rect(0, 0, W, H, COR.escuro); txt("REGRA Nº 2 DO APAGÃO", W / 2, 760, 44, COR.mostarda, 500);
      const a = prog(t, P(6, "beber", 2) - .4, P(6, "beber", 2)), b = prog(t, P(6, "vaso") - .4, P(6, "vaso"));
