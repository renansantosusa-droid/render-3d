const sai = (t, a, d) => { const x = lim((t - a) / d); return 1 - Math.pow(1 - x, 3); };
const suave = (t, a, d) => { const x = lim((t - a) / d); return x * x * (3 - 2 * x); };
const mola = (t, a, d) => { const x = lim((t - a) / d); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const janela = (t, a, b, f) => Math.min(sai(t, a, f), 1 - sai(t, b - f, f));
const FUNDO = [[120,300,0.9,"#e57aa8",0],[960,230,0.7,"#d9a84e",1.3],[930,720,1,"#e57aa8",2.1],[100,1080,0.8,"#d9a84e",0.7],[985,1300,0.6,"#e57aa8",2.8],[140,1560,1,"#e57aa8",1.8],[950,1640,0.8,"#d9a84e",0.4],[560,180,0.5,"#d9a84e",2.4]];
const fundo = (t) => FUNDO.forEach((b, i) => {
  const k = 0.55 + 0.45 * Math.sin(t * 2.2 + b[4] * 2);
  $('bf' + i).style.opacity = sai(t, 0.1 + i * 0.08, 0.6) * (0.35 + 0.65 * k);
  $('bf' + i).style.transform = 'scale(' + b[2] * (0.75 + 0.35 * k) + ') rotate(' + (t * 20 + i * 40) + 'deg)';
});
const FONTES = () => Promise.all([document.fonts.load('italic 600 80px "Playfair Display"'), document.fonts.load('800 40px Nunito'), document.fonts.load('700 60px Caveat')]).then(() => document.fonts.ready);

window.renderFrame = (t) => {
  fundo(t);
  $('mc').style.opacity = sai(t, 0.2, 0.5);
  $('mc').style.transform = 'translateY(' + (1 - sai(t, 0.2, 0.6)) * 20 + 'px) rotate(-2deg)';
  $('q').style.opacity = sai(t, 0.6, 0.6);
  $('q').style.transform = 'translateY(' + (1 - sai(t, 0.6, 0.7)) * 26 + 'px)';
  // cartões: entram um por um (alternando lado), depois sobem juntos e somem
  const SOBE = 6.6;
  for (let i = 0; i < 4; i++) {
    const a = 1.6 + i * 0.75, lado = i % 2 ? 1 : -1;
    const e = mola(t, a, 0.6), sobe = suave(t, SOBE + i * 0.08, 0.7);
    const balanco = Math.sin((t - a) * 2.4 + i) * 1.2 * lim((t - a) / 0.6);
    const el = $('c' + i);
    el.style.opacity = Math.min(sai(t, a, 0.25), 1 - sobe);
    el.style.transform = 'translate(' + (1 - e) * lado * 700 + 'px,' + (-sobe * 420) + 'px) rotate(' + ((1 - e) * lado * 8 + balanco) + 'deg) scale(' + (1 - 0.15 * sobe) + ')';
  }
  // pergunta sobe um pouquinho junto, mas fica
  $('vota').style.opacity = sai(t, 7.5, 0.5);
  $('vota').style.transform = 'translateY(' + (Math.sin(t * 4) * 6) + 'px) rotate(-2deg)';
  $('arroba').style.opacity = sai(t, 1.2, 0.6);
};
FONTES().then(() => { window.renderFrame(0); window.pronto = true; });
</script></body></html>
