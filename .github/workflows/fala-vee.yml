name: Fala Vee
on:
  push:
    branches: ["vee-*"]
jobs:
  fala:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: ferramentas/layout-post-instagram
      - name: editar
        run: |
          export FFMPEG="$(cd ferramentas/layout-post-instagram && node -p 'require("ffmpeg-static")')"
          mkdir -p dados/veecriativos/videos-novos
          for r in roteiros-gh/*.json; do node ferramentas/veecriativos-videos/editar-fala.mjs "$r"; done
      - uses: actions/upload-artifact@v4
        with:
          name: vee-black15
          path: dados/veecriativos/videos-novos/*.mp4
          retention-days: 3
