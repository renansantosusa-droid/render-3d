name: Black Magnetica
on:
  push:
    branches: ["vee-black*"]
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund ffmpeg-static@5.2.0
      - name: render
        run: |
          FF="$(node -p 'require("ffmpeg-static")')"
          mkdir -p saida
          "$FF" -hide_banner -y -i bruto.MOV -filter_complex "$(cat filtro.txt),format=yuv420p" -an -c:v libx264 -preset slow -crf 18 -r 30 -movflags +faststart "saida/Vee - Black Magnetica espelhado.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: black-magnetica
          path: saida/*.mp4
          retention-days: 3
