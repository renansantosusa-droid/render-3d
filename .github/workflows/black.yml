name: Black Cronometro
on:
  push:
    branches: ["vee-black*"]
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund ffmpeg-static@5.2.0
      - name: render
        run: |
          FF="$(node -p 'require("ffmpeg-static")')"
          mkdir -p saida
          for V in topo lado; do
            NOME=$( [ "$V" = topo ] && echo "TOPO" || echo "LADO" )
            "$FF" -hide_banner -y -i bruto.MOV -vf "$(cat filtro-$V.txt),format=yuv420p" -c:v libx264 -preset slow -crf 18 -r 30 -c:a aac -b:a 160k -movflags +faststart "saida/Vee - Black Magnetica (cronometro 2h - $NOME).mp4"
          done
          ls -la saida
      - uses: actions/upload-artifact@v4
        with:
          name: black-cronometro
          path: saida/*.mp4
          retention-days: 3
