name: Debug ss takes
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-audit --no-fund ffmpeg-static@5.2.0
          echo "FFMPEG=$(node -p 'require("ffmpeg-static")')" >> "$GITHUB_ENV"
      - run: gh release download gta-takes -p "gtasabendo4v-crop.mp4" -D fontes -R renansantosusa-droid/render-3d
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          mkdir -p dbg
          F=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          "$FFMPEG" -hide_banner -i fontes/gtasabendo4v-crop.mp4 2>&1 | grep -E "Duration|Stream" > dbg/info.txt || true
          "$FFMPEG" -y -v error -i fontes/gtasabendo4v-crop.mp4 -an -vf "select='not(mod(n\,30))',scale=216:384,drawtext=fontfile=$F:text='n=%{n}':x=6:y=40:fontsize=30:fontcolor=yellow:box=1:boxcolor=black@0.7,tile=9x4" -vsync 0 -frames:v 1 dbg/idx.jpg
          "$FFMPEG" -y -v error -i fontes/gtasabendo4v-crop.mp4 -an -vf "fps=1,scale=216:384,drawtext=fontfile=$F:text='%{pts\:flt}':x=6:y=40:fontsize=30:fontcolor=yellow:box=1:boxcolor=black@0.7,tile=9x4" -frames:v 1 dbg/fps.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: dbg
          path: dbg/*
          retention-days: 1
