name: Debug ss takes
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-audit --no-fund ffmpeg-static@5.2.0
          echo "FFMPEG=$(node -p 'require("ffmpeg-static")')" >> "$GITHUB_ENV"
      - run: gh release download gta-takes -p "gtasabendo4v-crop.mp4" -D fontes -R renansantosusa-droid/render-3d
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          mkdir -p dbg
          F=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          "$FFMPEG" -hide_banner -i fontes/gtasabendo4v-crop.mp4 -an -vf "select='between(n\,86\,94)',showinfo" -f null - 2> dbg/showinfo.txt || true
          grep -E "n:|pts_time" dbg/showinfo.txt | sed -E 's/.*(n: *[0-9]+).*(pts_time:[0-9.]+).*/\1 \2/' | head -20 > dbg/frames.txt || true
          "$FFMPEG" -y -v error -i fontes/gtasabendo4v-crop.mp4 -an -vf "select='eq(n\,90)',scale=216:384" -vsync 0 -frames:v 1 dbg/n90.jpg
          "$FFMPEG" -y -v error -ss 3.0 -i fontes/gtasabendo4v-crop.mp4 -an -vf "scale=216:384" -frames:v 1 dbg/t3.jpg
          "$FFMPEG" -y -v error -i fontes/gtasabendo4v-crop.mp4 -an -vf "scale=216:384,tile=2x1" -vf "select='eq(n\,89)+eq(n\,91)',scale=216:384,tile=2x1" -vsync 0 -frames:v 1 dbg/n8991.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: dbg
          path: dbg/*
          retention-days: 1
