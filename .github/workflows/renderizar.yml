name: Renderizar video

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Nome da cena (ex.: geladeira)"
        required: true
        default: geladeira
      segundos:
        description: "Duracao em segundos (total do tempos.json)"
        required: true
        default: "113.33"

jobs:
  plano:
    runs-on: ubuntu-latest
    outputs:
      partes: ${{ steps.p.outputs.partes }}
    steps:
      - id: p
        run: node -e "const n=Math.ceil(Math.round(${{ inputs.segundos }}*30)/300);console.log('partes='+JSON.stringify([...Array(n).keys()]))" >> "$GITHUB_OUTPUT"

  parte:
    needs: plano
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        parte: ${{ fromJSON(needs.plano.outputs.partes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node renderizar.mjs parte "${{ inputs.video }}" "${{ inputs.segundos }}" "${{ matrix.parte }}"
      - uses: actions/upload-artifact@v4
        with:
          name: parte-${{ matrix.parte }}
          path: saida/parte-*.mp4
          retention-days: 2

  juntar:
    needs: parte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: parte-*
          path: saida
          merge-multiple: true
      - run: node renderizar.mjs juntar "${{ inputs.video }}"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.video }}
          path: saida/${{ inputs.video }}.mp4
          retention-days: 1
