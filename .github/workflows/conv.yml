name: Converter grupo
on:
  push:
    branches: ["vee-*"]
jobs:
  conv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p out
          for f in in/p*.mov; do echo "file '$PWD/$f'"; done > lista.txt
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i lista.txt -c copy junto.mov
          ffmpeg -hide_banner -loglevel error -i junto.mov -vf "zscale=t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,tonemap=hable:desat=0,zscale=t=bt709:m=bt709:r=tv,scale=576:1024,format=yuv420p" -c:v libx264 -preset slow -crf 27 -maxrate 700k -bufsize 1400k -profile:v main -c:a aac -b:a 96k -ac 2 -movflags +faststart out/black-grupo-amanha-576.mp4 || ffmpeg -hide_banner -loglevel error -y -i junto.mov -vf "scale=576:1024,format=yuv420p" -c:v libx264 -preset slow -crf 27 -maxrate 700k -bufsize 1400k -profile:v main -c:a aac -b:a 96k -ac 2 -movflags +faststart out/black-grupo-amanha-576.mp4
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: vee-conv-amanha
          path: out/*.mp4
          retention-days: 3
