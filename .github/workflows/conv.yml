name: Converter video grupo
on:
  push:
    branches: ["vee-protocolo-*"]
jobs:
  conv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p out
          ffmpeg -hide_banner -loglevel error -i in/v.mov -vf "scale=1080:1920:flags=lanczos,format=yuv420p" -c:v libx264 -preset slow -crf 20 -maxrate 1050k -bufsize 2100k -profile:v high -c:a aac -b:a 96k -ac 2 -movflags +faststart out/protocolo-1080.mp4
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: vee-protocolo-1080
          path: out/*.mp4
          retention-days: 3
