name: Testar site

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
      - run: node testar-site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fotos-site
          path: fotos-site/
          retention-days: 2
