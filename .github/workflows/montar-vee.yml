name: Montar Vee
on:
  push:
    branches: ["vee-*"]
jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null
      - name: montar
        run: |
          export FFMPEG="$(node -p 'require("ffmpeg-static")')"
          export VC_EMOJI=/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf
          mkdir -p dados/veecriativos/videos-novos
          for r in roteiros-gh/*.json; do node ferramentas/veecriativos-videos/montar.mjs "$r"; done
      - uses: actions/upload-artifact@v4
        with:
          name: vee-radar-0511h
          path: dados/veecriativos/videos-novos/*.mp4
          retention-days: 3
