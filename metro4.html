<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// Série "Apocalipse no Metrô" — Episódio 4 (2D flat, estilo @historiascomkaio)
const TEMPOS = await (await fetch("/metro4/tempos.json")).json();
const W = 1080, H = 1920, cv = document.getElementById("c"), g = cv.getContext("2d");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const prog = (t, a, b) => ease(clamp((t - a) / (b - a), 0, 1));
const pulse = (t, a, d = .35) => { const k = (t - a) / d; return k < 0 || k > 1 ? 0 : Math.sin(k * Math.PI); };
const frac = (x) => x - Math.floor(x);
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const CENA = (n) => TEMPOS.cenas[n - 1], C = (n) => CENA(n).ini, F = (n) => CENA(n).fim;
function P(n, w, o = 1) { let k = 0; for (const p of CENA(n).palavras) if (norm(p.w) === norm(w) && ++k === o) return p.t; console.error("palavra nao achada", n, w); return C(n); }
const FALA = TEMPOS.fala, T = TEMPOS.total;
let rs = 1; const rnd = () => { rs = (rs * 16807) % 2147483647; return rs / 2147483647; };

// ---------- paleta ----------
const COR = { fundo: "#e9e2d0", fundoNoite: "#1d2129", predio: "#d9d2c0", linha: "#b9b09a", escuro: "#2a2e36", mostarda: "#e0a83a", vermelho: "#d6453a", azul: "#4a9be0", agua: "#6ab8f0", verde: "#4fae5a", pele: "#e8b48a", cabelo: "#3a2a20", camisa: "#3f6f73", calca: "#3a5a8a", txt: "#2a2e36" };

// ---------- primitivas ----------
const rr = (x, y, w, h, r, cor) => { g.fillStyle = cor; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
const rect = (x, y, w, h, cor) => { g.fillStyle = cor; g.fillRect(x, y, w, h); };
function txt(s, x, y, tam, cor, peso = 700, al = "center") { g.font = `${peso} ${tam}px Oswald`; g.textAlign = al; g.textBaseline = "middle"; g.fillStyle = cor; g.fillText(s, x, y); }

function cartao(l1, l2, x, y, a = 1, cor2 = "#2a2e36") { if (a <= 0) return; g.save(); g.globalAlpha = a; g.translate(x, y); g.font = "700 64px Oswald"; const w = Math.max(g.measureText(l2).width, 260) + 80; rr(-w / 2, -70, w, 150, 10, "#fdf8ec"); rect(-w / 2, -70, w, 34, COR.mostarda); txt(l1, 0, -53, 24, "#2a2e36"); txt(l2, 0, 22, 64, cor2); g.restore(); }
function pessoa(x, y, s = 1, { camisa = COR.camisa, olhar = 0, braco = 0, cabelo = COR.cabelo, bone = null, cabeca = 0 } = {}) {
  g.save(); g.translate(x, y); g.scale(s, s);
  rect(-26, -150, 20, 150, COR.calca); rect(6, -150, 20, 150, COR.calca);
  rr(-30, -6, 30, 12, 4, "#2a2a2a"); rr(4, -6, 30, 12, 4, "#2a2a2a");
  rr(-38, -290, 76, 150, 18, camisa);
  g.save(); g.translate(30, -275); g.rotate(-braco); rr(-8, 0, 20, 120, 10, camisa); rr(-6, 112, 18, 22, 9, COR.pele); g.restore();
  g.save(); g.translate(-30, -275); rr(-12, 0, 20, 120, 10, camisa); rr(-10, 112, 18, 22, 9, COR.pele); g.restore();
  rect(-10, -312, 20, 26, COR.pele);
  g.save(); g.translate(0, -350); g.rotate(cabeca);
  g.fillStyle = COR.pele; g.beginPath(); g.arc(0, 0, 44, 0, 6.283); g.fill();
  g.fillStyle = cabelo; g.beginPath(); g.arc(0, -6, 46, Math.PI * 1.05, Math.PI * 1.95); g.fill();
  if (bone) { g.fillStyle = bone; g.beginPath(); g.arc(0, -10, 47, Math.PI, 0); g.fill(); rect(0, -14, 64, 10, bone); }
  g.fillStyle = "#222"; g.beginPath(); g.arc(-14 + olhar * 8, 4, 5, 0, 6.283); g.arc(14 + olhar * 8, 4, 5, 0, 6.283); g.fill();
  g.strokeStyle = "#222"; g.lineWidth = 4; g.beginPath(); g.moveTo(-22 + olhar * 8, -10); g.lineTo(-6 + olhar * 8, -7); g.moveTo(6 + olhar * 8, -7); g.lineTo(22 + olhar * 8, -10); g.stroke();
  g.beginPath(); g.moveTo(-8, 22); g.lineTo(8, 22); g.stroke();
  g.restore(); g.restore();
}
// ---------- legenda (blocos de 3 palavras, palavra-chave colorida) ----------
const CHAVE = { alavanca: COR.vermelho, cadeado: COR.mostarda, dobradica: COR.vermelho, ferrugem: COR.vermelho, velho: COR.mostarda, estoura: COR.mostarda, dia: COR.mostarda, onibus: COR.mostarda, silencio: COR.vermelho, tossir: COR.vermelho, padaria: COR.mostarda, socorro: COR.vermelho,  verdade: COR.mostarda, silencio: COR.vermelho, mordido: COR.vermelho, marcos: COR.mostarda, mordida: COR.vermelho, ultimo: COR.vermelho, olhos: "#9aff6a", verdes: "#9aff6a", dezenas: COR.vermelho, escada: COR.verde, degraus: COR.verde, corrente: COR.vermelho, serve: COR.vermelho, correndo: COR.vermelho,  corra: COR.vermelho, barulho: COR.vermelho, lanterna: COR.mostarda, vivo: COR.vermelho, jorge: "#ff9a3a", trancada: COR.vermelho, luz: COR.mostarda, chao: COR.mostarda, terno: COR.vermelho, vermelho: COR.vermelho, tossir: COR.vermelho, ecoou: COR.vermelho,  metro: COR.mostarda, estacao: COR.vermelho, desca: COR.vermelho, freia: COR.vermelho, tunel: COR.mostarda, piscam: COR.mostarda, celular: COR.azul, atacando: COR.vermelho, regra: COR.vermelho, vazio: COR.verde, armadilha: COR.vermelho, energia: COR.mostarda, matar: COR.vermelho, rose: COR.verde, mordido: COR.vermelho, saida: COR.verde, escuro: COR.mostarda, lanterna: COR.mostarda, papel: COR.mostarda, passos: COR.vermelho, trem: COR.vermelho };
const blocos = []; for (const c of TEMPOS.cenas) { const ws = c.palavras; for (let i = 0; i < ws.length; i += 3) blocos.push({ t: ws[i].t, ws: ws.slice(i, i + 3).map((p) => p.w.replace(/[.,!?;:"]+$/, "")) }); }
function legenda(t, y = 1290) {

  const k = Math.min(1, (t - b.t) / .1);
  ps.forEach((w, i) => { g.textAlign = "left"; g.textBaseline = "middle"; g.lineWidth = 12; g.strokeStyle = "rgba(0,0,0,.75)"; g.lineJoin = "round"; g.strokeText(w, x, y + (1 - k) * 12); g.fillStyle = CHAVE[norm(w)] || "#fff"; g.fillText(w, x, y + (1 - k) * 12); x += larg[i]; });
}

    rr(W / 2 - 46, 1500 - 270 * .95, 92, 120, 14, "#c0503a"); // mochila na frente
    g.strokeStyle = "#111"; g.lineWidth = 8; g.beginPath(); g.arc(W / 2, 1500 - 350 * .95, 50, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); rr(W / 2 - 56, 1500 - 355 * .95, 14, 26, 4, "#111"); rr(W / 2 + 42, 1500 - 355 * .95, 14, 26, 4, "#111"); g.restore(); }
  if (luz < 1) { g.fillStyle = `rgba(0,0,0,${1 - luz})`; g.fillRect(0, 0, W, H); }

function tunel(t, { trilhoAlerta = 0, andando = 0, lanterna = 0, passos = 0 } = {}) {

  g.fillStyle = "#24272e"; g.beginPath(); g.moveTo(80, 1700); g.lineTo(80, 700); g.quadraticCurveTo(W / 2, 260, W - 80, 700); g.lineTo(W - 80, 1700); g.fill();

  const trilho = (a, cor, w) => { g.strokeStyle = cor; g.lineWidth = w; g.beginPath(); g.moveTo(vx + a * 30, vy); g.lineTo(vx + a * (W / 2 - 220), 1700); g.stroke(); };
  trilho(-.55, "#8a8f98", 10); trilho(.55, "#8a8f98", 10);
  const brilho = trilhoAlerta ? .6 + .4 * Math.sin(t * 14) : .15;
  g.save(); g.shadowColor = "#ffd23a"; g.shadowBlur = 40 * trilhoAlerta; trilho(1.05, `rgba(255,210,58,${brilho})`, 16); g.restore();
  // passarela lateral
  g.fillStyle = "#30343c"; g.beginPath(); g.moveTo(80, 1100); g.lineTo(vx - 60, vy - 10); g.lineTo(vx - 50, vy + 10); g.lineTo(80, 1250); g.fill();
  if (lanterna) { g.fillStyle = `rgba(255,240,190,${.18 * lanterna})`; g.beginPath(); g.moveTo(260, 1150); g.lineTo(vx - 40, vy - 60); g.lineTo(vx + 80, vy + 40); g.fill(); }
  if (andando) for (let i = 0; i < 4; i++) { const k = frac(t * .05 + i * .1); pessoa(160 + i * 70 + k * 40, 1180 - i * 18, .32 - i * .03, { camisa: ["#2e4a6a", "#f2f2f2", "#7a5a8a", "#8a4a3a"][i], olhar: 1 }); }
  if (passos) for (let i = 0; i < 4; i++) { const a = clamp(passos * 4 - i, 0, 1); g.globalAlpha = a * (.6 + .4 * Math.sin(t * 8 + i)); txt("👣", vx + (i % 2 ? 30 : -30), vy + 80 + i * 70, 40 + i * 10, "#ddd"); g.globalAlpha = 1; }
}
function plataforma(t) {
  rect(0, 0, W, H, "#5a5e66"); rect(0, 300, W, 120, "#c8c2b2"); txt("ESTAÇÃO", W / 2, 360, 54, "#2a2e36");
  rect(0, 1300, W, 620, "#8a8577"); rect(0, 1290, W, 20, "#e0b840");
  for (let i = 0; i < 14; i++) { const x = 40 + i * 76 + Math.sin(i * 3.1) * 20, s = .45 + (i % 3) * .06; const z = i % 3 !== 1; g.save(); g.translate(Math.sin(t * 3 + i) * 6, 0); pessoa(x, 1300 - (i % 2) * 30, s, { camisa: z ? "#4a5a4a" : "#6a5a8a", olhar: i % 2 ? 1 : -1, braco: z ? 1.3 : 0 }); g.restore(); if (z) { g.fillStyle = "rgba(120,200,90,.55)"; g.beginPath(); g.arc(x, 1300 - (i % 2) * 30 - 350 * s, 44 * s, 0, 6.283); g.fill(); } }
}
function celular(t) {
  rect(0, 0, W, H, "#1c1f25");
  g.save(); g.translate(W / 2, 960); g.rotate(-.03);
  rr(-300, -560, 600, 1120, 60, "#0b0c0f"); rr(-270, -520, 540, 1040, 36, "#111");
  // vídeo dentro do celular: plataforma
  g.save(); g.beginPath(); g.roundRect(-270, -420, 540, 560, 10); g.clip(); g.translate(-540 * .5, -420); g.scale(.5, .5); g.translate(0, -420); plataforma(t); g.restore();
  rr(-250, -400, 110, 40, 8, COR.vermelho); txt("AO VIVO", -195, -380, 24, "#fff");
  for (let i = 0; i < 3; i++) { rr(-250, 180 + i * 110, 500, 90, 14, "#24272e"); rr(-235, 195 + i * 110, 60, 60, 30, "#555"); rect(-160, 205 + i * 110, 340, 14, "#555"); rect(-160, 235 + i * 110, 220, 12, "#444"); }
  g.restore();
}
function mapa(t) {
  rect(0, 0, W, H, "#1d2129");
  const y = 900, x0 = 140, x1 = 940;
  rect(x0, y - 6, x1 - x0, 12, "#8a8f98");
  rr(x0 - 20, y - 50, 200, 100, 16, "#c8ccd2"); rect(x0, y - 30, 160, 40, "#7aa0c8"); txt("VOCÊ", x0 + 80, y + 90, 32, "#ddd");
  const k = prog(t, P(7, "quinhentos") - .5, P(7, "quinhentos") + .8);
  g.strokeStyle = COR.vermelho; g.lineWidth = 8; g.setLineDash([20, 14]); g.beginPath(); g.moveTo(x0 + 190, y - 70); g.lineTo(x0 + 190 + (x1 - x0 - 230) * k, y - 70); g.stroke(); g.setLineDash([]);
  rr(x1 - 70, y - 220, 140, 80, 10, COR.verde); txt("SAÍDA", x1, y - 180, 40, "#fff");
  for (let i = 0; i < 5; i++) rect(x1 - 30, y - 140 + i * 24, 60, 8, "#555");
  if (t > P(7, "quinhentos") - .3) etiqueta("500 M", (x0 + x1) / 2 + 60, y - 140, COR.escuro, "#fff", 54, 1);
  if (t > P(7, "escuro") - .3) { g.fillStyle = `rgba(0,0,0,${.75 * prog(t, P(7, "escuro") - .3, P(7, "escuro") + .3)})`; g.fillRect(0, 0, W, H); }
  if (t > P(7, "lanterna") - .3) { const a = prog(t, P(7, "lanterna") - .3, P(7, "lanterna")); g.fillStyle = `rgba(255,240,190,${.5 * a})`; g.beginPath(); g.moveTo(x0 + 180, y); g.lineTo(x0 + 600, y - 160); g.lineTo(x0 + 600, y + 160); g.fill(); }
}
function porta(t, abre) {
  rect(0, 0, W, H, "#3e434c"); rect(0, 1500, W, 420, "#2a2d33");
  rect(240, 420, 600, 1080, "#0b0c0f");
  if (abre > .1) { const k = abre; tunel(t, { passos: 1 }); g.save(); g.globalCompositeOperation = "destination-in"; rect(240, 420, 600, 1080, "#000"); g.restore(); rect(0, 0, 240, H, "#3e434c"); rect(840, 0, 240, H, "#3e434c"); rect(0, 0, W, 420, "#3e434c"); rect(0, 1500, W, 420, "#2a2d33"); }
  const d = 300 * abre;
  rr(240 - d, 420, 300, 1080, 8, "#9aa2ac"); rr(540 + d, 420, 300, 1080, 8, "#9aa2ac");
  rr(270 - d, 520, 240, 380, 14, "#1a1c21"); rr(570 + d, 520, 240, 380, 14, "#1a1c21");
}
const circ = (x, y, r, c) => { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill(); };
// HUD estilo câmera de segurança
function hud(t) {
  if (t > FALA + .3) return;
  const fases = [[0, "07:41", "ESCADA · SAÍDA"], [C(5), "08:00", "SAÍDA · RUA"], [C(7), "08:00", "ESCADA"], [C(8), "08:01", "RUA"]];
  let f = fases[0]; for (const x of fases) if (t >= x[0]) f = x;
  g.fillStyle = frac(t) < .5 ? COR.vermelho : "rgba(214,69,58,.3)"; g.beginPath(); g.arc(70, 92, 9, 0, 6.283); g.fill();
  txt("DIA 1", 90, 92, 26, "#fff", 500, "left");

}
function regra(n, s, a) { if (a <= 0) return; g.save(); g.globalAlpha = Math.min(1, a * 1.4); g.translate(W / 2, 470); g.rotate(-.04); g.scale(.8 + .2 * a, .8 + .2 * a); rr(-90, -95, 180, 40, 6, COR.vermelho); txt(`REGRA #${n}`, 0, -75, 26, "#fff"); g.font = "700 64px Oswald"; const w = g.measureText(s).width + 60; rr(-w / 2, -50, w, 96, 8, "#fdf8ec"); txt(s, 0, 0, 64, COR.txt); g.restore(); }
function operador(x, y, s, o = {}) { pessoa(x, y, s, { camisa: "#e07a2a", cabelo: "#888", olhar: o.olhar ?? 0, braco: o.braco ?? 0 }); g.save(); g.translate(x, y); g.scale(s, s); rect(-38, -290, 76, 16, "#f2e040"); rect(-38, -220, 76, 16, "#f2e040"); rr(24, -170, 26, 50, 6, "#222"); rect(34, -190, 4, 22, "#222"); g.strokeStyle = "#c8a040"; g.lineWidth = 4; g.beginPath(); g.moveTo(-14, -300); g.lineTo(0, -250); g.lineTo(14, -300); g.stroke(); circ(0, -246, 9, "#c8a040"); g.restore(); }
function mapa2(t) {
  rect(0, 0, W, H, "#1d2129");
  const y = 900, x0 = 120, x1 = 960, xm = 480;

function terno(t, k) { // close do homem do terno com o braço enrolado

// ---------- quadro ----------
function olhos(t, n, perto, vx = W / 2, vy = 900) { for (let i = 0; i < n; i++) { const a = (i * 2.399) % 6.283, r = (i * 37 % 120) * (1 + perto * 3); const x = vx + Math.cos(a) * r * 1.6 + Math.sin(t * 2 + i) * 6 * (1 + perto), y = vy + Math.sin(a) * r * .5 + perto * 300 * ((i % 3) / 3); const s = 4 + perto * 10; circ(x - s * 1.4, y, s, "#9aff6a"); circ(x + s * 1.4, y, s, "#9aff6a"); } }
