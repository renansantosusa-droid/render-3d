<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import { iniciar } from "/kit3d.js";
const K = await iniciar("laje", { fundo: 0x9cc8ea, seed: 1502 });
const { THREE, scene, add, grupo, mat, sprite, texRuido, grade, prog, entre, frac, pulse, C, F, P, T, rnd } = K;
const PI = Math.PI, V = (x, y, z) => new THREE.Vector3(x, y, z);

add(new THREE.PlaneGeometry(30, 30), mat(0xffffff, { map: texRuido("#8a7a62", 40, 8) }), 0, 0, 0).rotation.x = -PI / 2;
// 3 paredes (frente aberta)
const blocoM = mat(0xffffff, { map: texRuido("#b8b2a8", 30, 2) });
add(new THREE.BoxGeometry(.15, 1.2, 2.2), blocoM, -1.05, .6, 0);
add(new THREE.BoxGeometry(.15, 1.2, 2.2), blocoM, 1.05, .6, 0);
add(new THREE.BoxGeometry(2.25, 1.2, .15), blocoM, 0, .6, -1.05);
// placa que enverga (geometria deformável)
const concM = mat(0xffffff, { map: texRuido("#a8a8a4", 40, 2), transparent: true, opacity: 1 });
const placaGeo = new THREE.BoxGeometry(2.3, .16, 2.3, 30, 2, 30);
const base0 = placaGeo.attributes.position.array.slice();
const placa = add(placaGeo, concM, 0, 1.28, 0);
let espessura = 1;
const deforma = (sag, esp) => { const a = placaGeo.attributes.position.array; for (let i = 0; i < a.length; i += 3) { const x = base0[i], y = base0[i + 1], z = base0[i + 2]; a[i + 1] = y * esp + (esp - 1) * .08 - sag * (1 - (x / 1.15) ** 2) * (1 - (z / 1.15) ** 2); } placaGeo.attributes.position.needsUpdate = true; placaGeo.computeVertexNormals(); };
// peso que pisa
const pessoa = grupo(0, 0, 0);
add(new THREE.CapsuleGeometry(.12, .4, 6, 12), mat(0x3a6ad0), 0, .38, 0, pessoa); add(new THREE.SphereGeometry(.11, 16, 12), mat(0xe8b890), 0, .74, 0, pessoa);
// setas: aperto em cima, puxão embaixo
const seta = (cor) => { const g = new THREE.Group(); const m = mat(cor, { emissive: cor, emissiveIntensity: .5 }); const c = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, .3, 10), m); c.rotation.z = PI / 2; g.add(c); const p = new THREE.Mesh(new THREE.ConeGeometry(.06, .12, 12), m); p.rotation.z = -PI / 2; p.position.x = .2; g.add(p); scene.add(g); return g; };
const setasCima = [seta(0x3a8aff), seta(0x3a8aff)], setasBaixo = [seta(0xff3a2a), seta(0xff3a2a)];
const trincas = Array.from({ length: 7 }, (_, i) => { const m = add(new THREE.BoxGeometry(.012, .01, .25 + rnd() * .3), mat(0x111111), (i - 3) * .12 + (rnd() - .5) * .05, 1.19, (rnd() - .5) * .4); m.rotation.y = (rnd() - .5) * .6; return m; });
// ferragem
const ferroM = mat(0x7a4a30, { metalness: .6, roughness: .5, emissive: 0xff7030, emissiveIntensity: 0 });
const ferros = []; for (let i = -4; i <= 4; i++) { const a = add(new THREE.CylinderGeometry(.015, .015, 2.2, 8), ferroM, i * .25, 1.23, 0); a.rotation.x = PI / 2; const b = add(new THREE.CylinderGeometry(.015, .015, 2.2, 8), ferroM, 0, 1.235, i * .25); b.rotation.z = PI / 2; ferros.push(a, b); }
// pré-moldada: vigotas + blocos + tela + capa
const vigM = mat(0xffffff, { map: texRuido("#9a9a96", 40, 1) });
const vigotas = [-.9, -.45, 0, .45, .9].map((x) => add(new THREE.BoxGeometry(.12, .1, 2.3), vigM, x, 1.25, 0));
const blocos = []; [-.675, -.225, .225, .675].forEach((x, j) => { for (let k = 0; k < 7; k++) { const b = add(new THREE.BoxGeometry(.32, .14, .3), mat(j % 2 ? 0xf4f4f0 : 0xc8643a), x, 1.27, -1.0 + k * .333); blocos.push(b); } });
const tela = grupo(0, 1.37, 0); for (let i = -5; i <= 5; i++) { const a = add(new THREE.CylinderGeometry(.008, .008, 2.3, 6), ferroM, i * .2, 0, 0, tela); a.rotation.x = PI / 2; const b = add(new THREE.CylinderGeometry(.008, .008, 2.3, 6), ferroM, 0, .01, i * .2, tela); b.rotation.z = PI / 2; }
const capaM = mat(0xffffff, { map: texRuido("#a8a8a4", 40, 2) });
const capa = add(new THREE.BoxGeometry(2.3, .06, 2.3), capaM, 0, 1.39, 0);
const escoras = [[-.6, -.6], [.6, -.6], [-.6, .6], [.6, .6], [0, 0], [0, -.6], [0, .6]].map(([x, z]) => add(new THREE.CylinderGeometry(.04, .04, 1.18, 10), mat(0xb08050), x, .59, z));
// acabamentos
const furo = add(new THREE.CylinderGeometry(.08, .08, .02, 20), mat(0x111111), .3, 1.17, .3);
const caixaLuz = add(new THREE.BoxGeometry(.12, .04, .12), mat(0xf0a020), .3, 1.15, .3);
const mantaM = mat(0x2a2a30, { roughness: .4 });
const manta = add(new THREE.BoxGeometry(2.32, .02, 2.32), mantaM, 0, 1.43, 0);
const piso = add(new THREE.BoxGeometry(2.32, .03, 2.32), mat(0xffffff, { map: grade("#e8dcc8", "#b8a888", 32, 4) }), 0, 1.455, 0);

K.camera_({
  geral: [V(3.4, 3.3, 7.0), V(0, .85, 0)],
  baixo: [V(2.0, .75, 4.6), V(0, 1.05, 0)],
  cima: [V(2.0, 4.2, 4.6), V(0, 1.2, 0)],
  fim: [V(-3.4, 3.3, 6.8), V(0, .9, 0)],
}, [
  [0, "geral"], [P(2, "pisa") - .3, "geral"], [P(2, "baixo") - .2, "baixo"], [F(3), "baixo"], [C(4), "geral"], [P(5, "tela") - .3, "cima"], [F(5), "cima"],
  [C(6), "geral"], [P(7, "caixa") - .4, "baixo"], [P(7, "impermeabilizacao") - .5, "cima"], [P(7, "parabens") - .3, "geral"], [T, "fim"],
]);

const molhado = new THREE.Color(0x9a9a98), seco = new THREE.Color(0xffffff);
K.pronto((t) => {
  const em = (a, b) => entre(t, a, b);
  const pre = t > P(4, "vigotas") - .3; // daqui pra frente: pré-moldada
  // placa maciça
  const sag = em(P(2, "pisa"), C(3) + 1) ? .14 * prog(t, P(2, "pisa"), P(2, "racha")) * (1 - prog(t, P(3, "ferro") - .2, P(3, "ferro") + .8)) : 0;
  const grossa = 1 + 1.6 * prog(t, P(4, "grossa") - .3, P(4, "grossa") + .3);
  deforma(sag, t > C(4) ? grossa : 1);
  placa.visible = !pre;
  concM.opacity = em(P(3, "barras") - .4, F(3)) ? .4 : 1; concM.depthWrite = concM.opacity > .9;
  pessoa.visible = em(P(2, "pisa") - .5, F(3)); pessoa.position.set(0, 1.36 - sag + 1.2 * (1 - prog(t, P(2, "pisa") - .5, P(2, "pisa"))), 0);
  const tensao = em(P(2, "pisa"), F(3));
  setasCima.forEach((s, i) => { s.visible = tensao; s.position.set((i ? 1 : -1) * .5, 1.42 - sag * .6, 1.2); s.rotation.y = i ? PI : 0; });
  setasBaixo.forEach((s, i) => { s.visible = tensao; s.position.set((i ? 1 : -1) * .45, 1.15 - sag * .7, 1.2); s.rotation.y = i ? 0 : PI; s.scale.setScalar(1 + .3 * Math.sin(t * 8)); });
  trincas.forEach((m, i) => { m.visible = em(P(2, "racha") - .2 + i * .05, P(3, "ferro")); m.position.y = 1.19 - sag; });
  ferros.forEach((f) => { f.visible = em(P(3, "barras") - .4, C(4)); });
  ferroM.emissiveIntensity = em(P(3, "puxao") - .3, P(3, "aperto")) ? .6 : 0;
  // pré-moldada
  vigotas.forEach((v, i) => { const a = P(4, "vigotas") - .3 + i * .25; v.visible = t > a; v.position.y = 1.25 + 1.2 * (1 - prog(t, a, a + .4)); });
  blocos.forEach((b, i) => { const a = P(4, "blocos") - .4 + i * .05; b.visible = t > a; b.position.y = 1.27 + 1.0 * (1 - prog(t, a, a + .35)); });
  tela.visible = t > P(5, "tela") - .3; tela.position.y = 1.37 + .8 * (1 - prog(t, P(5, "tela") - .3, P(5, "tela") + .3));
  const cp = prog(t, P(5, "camada") - .3, P(5, "amarra") + .3); capa.visible = cp > .01; capa.scale.y = cp || .001; capa.position.y = 1.36 + .03 * cp;
  capaM.color.copy(molhado).lerp(seco, prog(t, P(6, "tres") - .2, F(6)));
  escoras.forEach((e, i) => { e.visible = em(P(6, "escoras") - .3 + i * .08, C(7)); });
  // acabamentos
  furo.visible = caixaLuz.visible = t > P(7, "caixa") - .3; caixaLuz.position.y = 1.15 + .2 * pulse(t, P(7, "caixa") - .3, .5);
  manta.visible = t > P(7, "impermeabilizacao") - .3;
  piso.visible = t > P(7, "piso") - .3; piso.position.y = 1.455 + .4 * (1 - prog(t, P(7, "piso") - .3, P(7, "piso") + .3));
  K.cartoes(t, [
    [P(1, "laje") - .3, F(1), "PLACA EM CIMA DAS PAREDES?", "#ffffff"],
    [P(2, "apertado") - .4, P(2, "puxado") - .2, "FORTE NO APERTO", "#8ac8ff"],
    [P(2, "puxado") - .2, P(2, "pisa") - .3, "FRACO NO PUXÃO", "#ff4a3a"],
    [P(2, "estica") - .3, P(2, "racha") - .2, "EMBAIXO ESTICA", "#ff7040"],
    [P(2, "racha") - .2, F(2), "RACHA!", "#ff4a3a"],
    [P(3, "barras") - .4, P(3, "armado") - .4, "FERRO ONDE É PUXADO", "#ffb070"],
    [P(3, "armado") - .4, F(3), "CONCRETO ARMADO", "#ffffff"],
    [P(4, "pesada") - .4, P(4, "vigotas") - .3, "PESADA DEMAIS", "#ff4a3a"],
    [P(4, "vigotas") - .3, P(4, "blocos") - .4, "VIGOTAS", "#ffffff"],
    [P(4, "blocos") - .4, F(4), "BLOCOS LEVES NO MEIO", "#ffb070"],
    [P(5, "tela") - .3, P(5, "premoldada") - .4, "TELA + CAPA DE CONCRETO", "#ffffff"],
    [P(5, "premoldada") - .4, F(5), "LAJE PRÉ-MOLDADA", "#ffd23a"],
    [P(6, "escoras") - .3, P(6, "tres") - .3, "ESCORAS", "#ffb070"],
    [P(6, "tres") - .3, F(6), "~3 SEMANAS PRA CURAR", "#8ac8ff"],
  ]);
});
</script>
</body></html>
