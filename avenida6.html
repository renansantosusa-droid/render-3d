<script type="module">
// "Avenida Brasília" (paródia) — Capítulo 6: A vilã riu cedo demais (2D detalhado, cena2d.js)
import { kit2d } from "/cena2d.js";
const TEMPOS = await (await fetch("/avenida6/tempos.json")).json();
const W = 1080, H = 1920, cv = document.getElementById("c"), g = cv.getContext("2d");

const { clamp, rr, rect, circ, txt, glow, vinheta, tinta, camera, pessoa, adesivo, balao } = K;

const CENA = (n) => TEMPOS.cenas[n - 1], C = (n) => CENA(n).ini, F = (n) => CENA(n).fim;
function P(n, w, o = 1) { let k = 0; for (const p of CENA(n).palavras) if (norm(p.w) === norm(w) && ++k === o) return p.t; console.error("palavra nao achada", n, w); return C(n); }
const FALA = TEMPOS.fala;
const piscar = (t, f = 0) => ((t + f) % 3.9) < .12 ? .1 : 1;
const CAMILA = { sexo: "f", cabelo: "#f0c860", roupa: "#c0304a", calca: "#2a2a3a", pele: "#f0c0a0" };

const TINA = { sexo: "f", cabelo: "#1a1410", roupa: "#e0a83a", calca: "#3a5a8a", pele: "#c88a5a" };
const CICLONE = { sexo: "m", cabelo: "#1a1410", roupa: "#c0302a", calca: "#f2f2f2", pele: "#a86a44" };
const LUCINHA = { sexo: "f", cabelo: "#bbb", roupa: "#6a5a8a", calca: "#4a3a5a", pele: "#a86a4a" };
const NICO = { sexo: "m", cabelo: "#2a1a10", roupa: "#4a7a5a", calca: "#3a3a3a", pele: "#b87a50" };
const LINA = { sexo: "f", cabelo: "#1a1410", roupa: "#f4f4f4", calca: "#2a2a2a", pele: "#c88a5a" };
const CHAO = 1460;

// ---------- legenda ----------
const CHAVE = { lina: "#ffd27a", mala: "#c8905a", mansao: "#f0c860", camila: "#f0c860", rindo: "#d6453a", embora: "#d6453a", finalmente: "#d6453a", chao: "#e0a83a", minuto: "#e0a83a", jorjao: "#6ab8f0", cozinha: "#ffd27a", avental: "#e0a83a", fogao: "#e0a83a", nada: "#e0a83a", regra: "#d6453a", demite: "#d6453a", prato: "#e0a83a", preferido: "#e0a83a", patrao: "#ff6a5a", ciclone: "#ff6a5a", cheiro: "#c8905a", feijoada: "#c8905a", mae: "#c89ad0", ninguem: "#4fae5a", casa: "#4fae5a", engasga: "#d6453a", vinho: "#d6453a", papel: "#e0a83a", tempo: "#4fae5a", madrugada: "#6ab8f0", mex: "#e07a7a", copias: "#e0a83a", aterro: "#c8a070", busca: "#d6453a" };
const blocos = []; for (const c of TEMPOS.cenas) { const ws = c.palavras; for (let i = 0; i < ws.length; i += 3) blocos.push({ t: ws[i].t, ws: ws.slice(i, i + 3).map((p) => p.w.replace(/[.,!?;:"]+$/, "")) }); }
function legenda(t, y = 1620) {
  if (t > FALA + .2) return; let b = null; for (const x of blocos) if (t >= x.t) b = x; if (!b) return;
  g.font = "700 80px Oswald"; const ps = b.ws.map((w) => w.toUpperCase()); const larg = ps.map((w) => g.measureText(w + " ").width); let x = W / 2 - larg.reduce((a, c) => a + c, 0) / 2;
  const k = Math.min(1, (t - b.t) / .1);
  ps.forEach((w, i) => { g.textAlign = "left"; g.textBaseline = "middle"; g.lineWidth = 13; g.strokeStyle = "rgba(0,0,0,.8)"; g.lineJoin = "round"; g.strokeText(w, x, y + (1 - k) * 12); g.fillStyle = CHAVE[norm(w)] || "#fff"; g.fillText(w, x, y + (1 - k) * 12); x += larg[i]; });
}
function marca(t) { if (t > FALA + .3) return; g.save(); g.shadowColor = "rgba(0,0,0,.8)"; g.shadowBlur = 10; txt("Avenida Brasília", 60, 110, 46, "#fff", "italic 700", "left", "Playfair Display"); txt("CAPÍTULO 6 · PARÓDIA", 62, 160, 24, "#f0c860", 500, "left"); g.restore(); }
function cifrao(t, x, y) { for (let i = 0; i < 6; i++) { const k = (t * .6 + i / 6) % 1; g.globalAlpha = 1 - k; txt("$", x + Math.sin(i * 2.1) * 120, y - k * 260, 54 + i * 4, "#4fae5a"); } g.globalAlpha = 1; }
// busto em close
function motorista(cx, cy, o) { g.save(); g.beginPath(); g.rect(cx - 90, cy - 70, 190, 90); g.clip(); circ(cx + 60, cy - 10, 30, o.pele); g.fillStyle = o.cabelo; g.beginPath(); g.arc(cx + 60, cy - 18, 31, Math.PI, 0); g.fill(); g.restore(); }
function close(o, s, cy = 1500, x = W / 2) { g.save(); g.translate(x, cy + 330 * s - 400); g.scale(s, s); pessoa(0, 0, 1, o); g.restore(); }
function etiquetaNome(nome, sub, x, y, a, cor = "#d6453a") { if (a <= 0) return; g.save(); g.globalAlpha = a; g.font = "700 44px Oswald"; const w = Math.max(g.measureText(nome).width, 160) + 50; rr(x - w / 2, y - 40, w, 80, 10, "#fdf8ec"); rr(x - w / 2, y - 64, w, 30, 8, cor); txt(sub, x, y - 49, 20, "#fff"); txt(nome, x, y + 2, 44, "#1d2129"); g.restore(); }

const JORJAO = { sexo: "m", cabelo: "#4a2a14", roupa: "#2a6a9a", calca: "#2a2a3a", pele: "#e0aa86" };
function quintal(t) { g.fillStyle = "#9ad0f0"; g.fillRect(0, 0, W, H); K.circ(880, 260, 70, "#fff2b0"); rect(0, 1100, W, 820, "#6aa84a"); for (let i = 0; i < 40; i++) rect((i * 97) % W, 1120 + (i * 53) % 700, 6, 22, "#5a9a3a"); rect(0, 900, W, 14, "#e8dccb"); for (let x = 0; x < W; x += 60) rect(x, 820, 50, 290, "#efe2c4");
  g.strokeStyle = "#555"; g.lineWidth = 3; g.beginPath(); g.moveTo(40, 560); g.lineTo(1040, 600); g.stroke(); [["#e04a4a", 160], ["#4a8ae0", 360], ["#f2f2f2", 560], ["#e0c040", 760]].forEach(([c, x]) => { rr(x, 570 + (x - 40) * .04, 110, 140, 10, c); });
  rr(760, 200, 260, 300, 8, "#f4ead8"); rr(776, 216, 228, 268, 4, "#8ab0d0"); }
function janelaCamila(t) { g.save(); g.beginPath(); g.rect(776, 216, 228, 268); g.clip(); g.fillStyle = "#e6d6b8"; g.fillRect(776, 216, 228, 268); g.translate(890, 720); g.scale(.9, .9); pessoa(0, 0, 1, { ...CAMILA, roupa: "#1a1a1a", expr: "bravo", olhar: -1 }); g.restore(); }
function jornal(x, y, s, foto) { g.save(); g.translate(x, y); g.scale(s, s); rr(-300, -380, 600, 760, 6, "#f2eee2"); txt("O DIÁRIO", 0, -320, 64, "#1d2129", "900", "center", "Playfair Display"); rect(-260, -280, 520, 4, "#1d2129"); for (let i = 0; i < 14; i++) rect(-260, -240 + i * 34, i % 4 === 3 ? 300 : 520, 12, "#bbb"); if (foto > 0) { g.save(); g.translate(60, 120 - 260 * (1 - foto)); g.rotate(.1); rr(-130, -110, 260, 220, 4, "#fbf6ea"); g.fillStyle = "#c8d8c0"; g.fillRect(-115, -95, 230, 170); pessoa(-40, 70, .4, { ...CAMILA, expr: "sorriso" }); pessoa(40, 70, .42, { ...MEX, expr: "sorriso" }); g.restore(); } g.restore(); }
function caixaFotos(x, y, s) { g.save(); g.translate(x, y); g.scale(s, s); rr(-110, -60, 220, 120, 10, "#8a5a3a"); rr(-120, -80, 240, 34, 8, "#6a4a2a"); rr(-60, -100, 90, 70, 4, "#fbf6ea"); g.restore(); }
function quartinhoQ(t) { K.parede(0, CHAO, "#a8a090", "#8a8274"); K.pisoMadeira(CHAO, "#6a4a30", 1); K.rodape(CHAO, "#c8c0b0"); rr(560, CHAO - 260, 480, 200, 20, "#7a6a8a"); rr(560, CHAO - 300, 160, 70, 24, "#efe8de"); rect(120, 300, 2, 260, "#333"); circ(121, 580, 30, "#ffe8a0"); K.glow(121, 600, 520, "rgba(255,220,150,A)", .45); tinta("#0a1030", .3); }
function dupla(a, b, s = 2.0, xa = 330, xb = 760) { g.save(); g.translate(xa, 1500 + 330 * s - 400); g.scale(s, s); pessoa(0, 0, 1, a); g.restore(); g.save(); g.translate(xb, 1500 + 330 * s - 400); g.scale(s, s); pessoa(0, 0, 1, b); g.restore(); }
function escadaMansao(t) { K.mansao(CHAO, t); for (let i = 0; i < 10; i++) { rr(560 + i * 50, CHAO - 80 - i * 70, 520, 24, 4, "#efe2c4"); rect(560 + i * 50, CHAO - 56 - i * 70, 520, 46, "#e2d2b0"); } g.strokeStyle = "#c8a040"; g.lineWidth = 8; g.beginPath(); g.moveTo(560, CHAO - 200); g.lineTo(1060, CHAO - 900); g.stroke(); }
function fachada(t) {
  g.fillStyle = "#f2b880"; g.fillRect(0, 0, W, 1250); K.glow(180, 300, 400, "rgba(255,230,170,A)", .5);
  g.fillStyle = "#c8a890"; g.beginPath(); g.moveTo(80, 520); g.lineTo(W / 2, 300); g.lineTo(W - 80, 520); g.fill();
  rr(120, 510, 840, 740, 6, "#f4ead8"); for (const x of [150, 400, 640, 890]) rr(x, 560, 40, 690, 4, "#e6d6b8");
  for (const [x, y] of [[200, 620], [200, 900], [460, 900]]) { rr(x, y, 160, 200, 4, "#c8a040"); rr(x + 10, y + 10, 140, 180, 2, "#5a6a7a"); }
  rr(700, 620, 220, 240, 4, "#c8a040"); rr(710, 630, 200, 220, 2, "#e6d6b8");
  g.save(); g.beginPath(); g.rect(710, 630, 200, 220); g.clip(); pessoa(810, 1090, .8, { ...CAMILA, roupa: "#1a1a1a", expr: "sorriso", olhar: -1, celular: true, braco: 2.7, piscaD: (t % 1.1) < .3 ? 1 : 0 }); g.restore();
  rr(700, 900, 220, 350, 4, "#6a4a30");
  rect(0, 1250, W, 670, "#6aa84a"); g.fillStyle = "#d8c8a8"; g.beginPath(); g.moveTo(700, 1250); g.lineTo(920, 1250); g.lineTo(1080, 1920); g.lineTo(520, 1920); g.fill();
  for (let x = 10; x < W; x += 70) rect(x, 1180, 12, 420, "#2a2a2a"); rect(0, 1180, W, 16, "#2a2a2a"); rect(0, 1440, W, 12, "#2a2a2a");
  for (let x = 46; x < W; x += 70) circ(x - 30, 1176, 9, "#c8a040");
}
function mala(x, y, s = 1, rot = 0) { g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s); rr(-60, -150, 120, 150, 14, "#8a4a2a"); rect(-60, -110, 120, 8, "#6a3a1a"); g.strokeStyle = "#3a2010"; g.lineWidth = 10; g.beginPath(); g.arc(0, -150, 26, Math.PI, 0); g.stroke(); g.restore(); }
function avental(x, y, s) { g.save(); g.translate(x, y); g.scale(s, s); rr(-42, -330, 84, 170, 12, "#e0a83a"); rr(-26, -370, 52, 46, 8, "#e0a83a"); rect(-50, -300, 100, 8, "#c08a2a"); g.restore(); }
function vapor(t, x, y, a = 1) { for (let i = 0; i < 4; i++) { const k = (t * .5 + i / 4) % 1; g.globalAlpha = a * (1 - k) * .6; g.strokeStyle = "#fff"; g.lineWidth = 10; g.beginPath(); g.moveTo(x - 40 + i * 26, y); for (let j = 1; j < 8; j++) g.lineTo(x - 40 + i * 26 + Math.sin(j + t * 3 + i) * 16, y - j * 40 * (0.6 + k)); g.stroke(); } g.globalAlpha = 1; }
function jantar(t, cic, cam, raspa = 0) {
  K.parede(0, CHAO, "#e6d6b8", "#d4c2a0"); K.quadro(380, 300, 320, 220, K.fotoFamilia, "#c8a040"); K.pisoMadeira(CHAO, "#7a5236"); K.rodape(CHAO);
  pessoa(300, CHAO + 40, 1.08, { ...CICLONE, roupa: "#5a7ab0", calca: "#5a7ab0", sentado: true, olhar: .6, ...cic });
  pessoa(780, CHAO + 40, 1.08, { ...CAMILA, roupa: "#1a1a1a", sentado: true, olhar: -.6, ...cam });
  K.mesaJantar(120, CHAO + 200, 840, t); K.pendente(540, 380, 1);
  rr(500, CHAO - 250, 110, 70, 30, "#3a2a20"); K.elip(555, CHAO - 250, 55, 14, "#2a1a10"); // panela de feijoada
  rr(840, CHAO - 260, 26, 60, 6, "rgba(160,20,40,.85)"); rect(850, CHAO - 200, 6, 30, "#ddd"); // taça de vinho
}
window.renderFrame = (t) => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.filter = "none";
  const CAM = { ...CAMILA, roupa: "#1a1a1a" };
  const CIC = { ...CICLONE, roupa: "#5a7ab0", calca: "#5a7ab0" };
  if (t < C(2)) { // CENA 1: a mala no portão
    fachada(t); pessoa(330, 1900, 1.45, { ...LINA, expr: t > P(1, "rindo") - .2 ? "choque" : "triste", olhar: 1, braco: .25 }); mala(470, 1760, 1.2); vinheta(.5);
    if (t > P(1, "telefone") - .3) balao(W / 2 + 60, 460, "“Ela vai embora hoje. Finalmente.” 😂", 1);
    else adesivo("", "A MALA NA MÃO 🧳", prog(t, P(1, "mala") - .3, P(1, "mala")), 460, "transparent");
  } else if (t < C(3)) { // CENA 2: solta a mala / 1 minuto antes
    if (t < P(2, "minuto") - .3) { fachada(t); const k = prog(t, P(2, "solta") - .2, P(2, "chao") + .1); pessoa(330, 1900, 1.45, { ...LINA, expr: "bravo", olhar: 1 }); mala(470 + 30 * k, 1760 + 90 * k, 1.2, 1.4 * k); vinheta(.55); if (k > .8) txt("TUM!", 560, 1560, 64, "#fff", 900, "center", "Nunito"); adesivo("", "ELA SOLTA A MALA", 1, 460, "transparent"); }
    else { K.mansao(CHAO, t); dupla({ ...LINA, expr: "triste", olhar: 1, braco: 1.2 }, { ...JORJAO, expr: "triste", olhar: -1, braco2: 1.2 }, 2.0, 420, 680);
      g.save(); g.globalCompositeOperation = "saturation"; g.fillStyle = "rgba(128,128,128,.75)"; g.fillRect(0, 0, W, H); g.restore(); tinta("#3a2a10", .15); vinheta(.6);
      adesivo("1 MINUTO ANTES", "O ADEUS PRO JORJÃO", 1, 360, "#555"); }
  } else if (t < C(4)) { // CENA 3: avental e fogão
    K.cozinha(CHAO, 0, t); pessoa(760, CHAO + 70, 1.12, { ...LINA, expr: "bravo", olhar: -1, braco2: .9 }); if (t > P(3, "avental") - .3) avental(760, CHAO + 70, 1.12);
    rr(400, CHAO - 560, 130, 80, 20, "#3a3a40"); if (t > P(3, "fogao") - .3) { for (let i = 0; i < 5; i++) { g.fillStyle = i % 2 ? "#3a8cff" : "#ffb03a"; g.beginPath(); g.ellipse(415 + i * 25, CHAO - 470 - Math.abs(Math.sin(t * 9 + i)) * 10, 9, 18, 0, 0, 6.283); g.fill(); } vapor(t, 465, CHAO - 570, .8); }
    vinheta(.5); adesivo("", t > P(3, "nada") - .3 ? "COMO SE NADA TIVESSE ACONTECIDO" : "ELA VOLTA PRA COZINHA", 1, 330, "transparent");
  } else if (t < C(5)) { // CENA 4: regra 6
    g.fillStyle = "#2a1a14"; g.fillRect(0, 0, W, H); K.glow(W / 2, 1100, 600, "rgba(255,180,90,A)", .35);
    rr(290, 1000, 500, 280, 60, "#3a2a20"); K.elip(540, 1000, 250, 50, "#2a1a10"); K.elip(540, 1006, 220, 36, "#4a2014"); vapor(t, 540, 960, 1); rr(240, 1060, 60, 30, 14, "#2a1a10"); rr(780, 1060, 60, 30, 14, "#2a1a10"); vinheta(.65);
    adesivo("REGRA #6", "O PRATO FALA MAIS ALTO 🍲", prog(t, P(4, "regra") - .3, P(4, "regra")), 330);
  } else if (t < C(6)) { // CENA 5: o cheiro
    jantar(t, { expr: t > P(5, "cheiro") - .3 ? "sorriso" : "neutro", cabeca: t > P(5, "cheiro") - .3 ? -.15 : 0, piscaD: t > P(5, "mae") - .3 ? 1 : 0 }, { expr: "desconfiada" });
    vapor(t, 555, CHAO - 270, 1); vinheta(.5);
    const s = t > P(5, "mae") - .3 ? "DO JEITO DA MÃE DELE 🥹" : t > P(5, "feijoada") - .3 ? "FEIJOADA 🍲" : t > P(5, "cheiro") - .3 ? "O CHEIRO…" : "20:00 · JANTAR";
    adesivo("", s, 1, 330, "transparent");
  } else if (t < C(7)) { // CENA 6: ninguém sai
    const eng = t > P(6, "engasga") - .3;
    jantar(t, { expr: t > P(6, "decide") - .3 ? "bravo" : "sorriso", braco: t > P(6, "decide") - .3 ? 2.6 : .8 }, { expr: eng ? "choque" : "desconfiada", braco: eng ? 2.4 : 0 });
    vinheta(.5);
    if (t > P(6, "decide") - .3 && !eng) balao(W / 2, 380, "“Ninguém sai dessa casa!”", 1);
    if (eng) { balao(W / 2, 380, "“Ninguém sai dessa casa!”", 1); txt("COF! COF!", 820, 980, 60, "#d6453a", 900, "center", "Nunito"); }
    if (t < P(6, "decide") - .3) adesivo("", "ELE RASPA O PRATO", 1, 380, "transparent");
  } else if (t < C(8)) { // CENA 7: no papel
    K.cozinha(CHAO, 0, t); tinta("#000", .2); close({ ...LINA, expr: "sorriso", olhar: 0 }, 2.4, 1500); vinheta(.55);
    adesivo("", "NO PAPEL… A LINA GANHOU TEMPO ⏳", prog(t, P(7, "papel") - .3, P(7, "papel")), 330, "transparent");
  } else if (t < FALA + .3) { // CENA 8: a madrugada
    const freeze = t > P(8, "busca") - .05;
    K.parede(0, CHAO, "#8a8070", "#6a6254"); K.pisoMadeira(CHAO, "#5a3a24", 1); K.rodape(CHAO, "#a8a090");
    rr(560, CHAO - 1000, 420, 1000, 6, "#efe2c4"); rect(560, CHAO - 1000, 30, 1000, "#2a1a10"); g.fillStyle = "rgba(255,226,170,.9)"; g.fillRect(560, CHAO - 1000, 22, 1000); K.glow(570, CHAO - 500, 300, "rgba(255,226,170,A)", .35); circ(620, CHAO - 500, 14, "#c8a040");
    tinta("#0a1030", .45);
    pessoa(400, CHAO + 300, 1.5, { ...LINA, roupa: "#d8d8e8", expr: freeze ? "choque" : "desconfiada", olhar: 1, cabeca: .15 });
    if (freeze) { g.save(); g.globalCompositeOperation = "saturation"; g.fillStyle = "rgba(128,128,128,.8)"; g.fillRect(0, 0, W, H); g.restore(); g.fillStyle = `rgba(214,48,74,${.18 * prog(t, P(8, "busca"), P(8, "busca") + .4)})`; g.fillRect(0, 0, W, H); }
    vinheta(freeze ? .8 : .6);
    if (t < P(8, "mex") - .3) adesivo("", "03:00 · DE MADRUGADA 🌙", 1, 360, "transparent");
    else if (t < P(8, "copias") - .3) etiquetaNome("NO TELEFONE", "A CAMILA E O MEX", W / 2, 360, 1, "#c0304a");
    else if (t < P(8, "amanha") - .3) balao(W / 2, 360, "“As cópias estão com a velha do Aterro.”", 1);
    else balao(W / 2, 360, "“Amanhã cedo a gente busca.”", 1);
  } else { // CARD FINAL
    rect(0, 0, W, H, "#0e0a0c"); K.glow(W / 2, 700, 600, "rgba(240,200,96,A)", .18);
    const a = prog(t, FALA + .3, FALA + .8); g.globalAlpha = a;
    txt("CAPÍTULO 7", W / 2, 600, 110, "#fff");
    txt("A Camila descobriu as cópias.", W / 2, 730, 54, "#f0c860", "italic 700", "center", "Playfair Display"); txt("E a Lina?", W / 2, 805, 58, "#f0c860", "italic 700", "center", "Playfair Display");
    rr(110, 900, 410, 116, 58, "#d6453a"); txt("AVISA A LUCINHA", 315, 960, 42, "#fff");
    rr(560, 900, 410, 116, 58, "#4fae5a"); txt("CORRE PRO ATERRO", 765, 960, 42, "#fff");
    txt("COMENTA 👇 A MAIORIA DECIDE", W / 2, 1110, 40, "#e0a83a");
    txt("AVENIDA BRASÍLIA · PARÓDIA · CAP. 6", W / 2, 1500, 26, "#666", 500); g.globalAlpha = 1;
  }
  marca(t);
  legenda(t);
};
await document.fonts.load("700 40px Oswald"); await document.fonts.load("500 40px Oswald"); await document.fonts.load("italic 700 40px 'Playfair Display'"); await document.fonts.load("700 40px Nunito"); await document.fonts.ready;
window.renderFrame(0); window.pronto = true;
</script>
