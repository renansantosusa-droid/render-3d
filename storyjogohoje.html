<canvas id="tela" width="1080" height="1920"></canvas>
<script type="module">
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pop = (k) => { k = clamp(k, 0, 1); return k <= 0 ? 0 : k >= 1 ? 1 : (1 - Math.pow(1 - k, 3)) + .3 * Math.sin(k * Math.PI); };
await document.fonts.load("900 64px Nunito"); await document.fonts.ready;

let G; const W = 360, H = 500;
// ================= DESENHO =================
const FONTE = "Nunito, system-ui, sans-serif", EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); G.beginPath(); G.moveTo(x + r, y); G.arcTo(x + w, y, x + w, y + h, r); G.arcTo(x + w, y + h, x, y + h, r); G.arcTo(x, y + h, x, y, r); G.arcTo(x, y, x + w, y, r); G.closePath(); }
function caixa(x, y, w, h, r, cor, borda = "#14204a", lw = 2.5) { rr(x, y, w, h, r); G.fillStyle = cor; G.fill(); if (borda) { G.lineWidth = lw; G.strokeStyle = borda; G.stroke(); } }
function txt(s, x, y, tam, cor = "#14204a", al = "center") { G.font = `900 ${tam}px ${FONTE}`; G.textAlign = al; G.textBaseline = "middle"; G.fillStyle = cor; G.fillText(s, x, y); }
function emo(s, x, y, tam) { G.font = `${tam}px ${EMOJI}`; G.textAlign = "center"; G.textBaseline = "middle"; G.fillStyle = "#000"; G.fillText(s, x, y); }
function pilula(s, x, y, al = "left") { G.font = `900 15px ${FONTE}`; const w = G.measureText(s).width + 22, x0 = al === "left" ? x : x - w; caixa(x0, y, w, 28, 14, "rgba(255,255,255,.95)"); txt(s, x0 + w / 2, y + 14.5, 15); }
const vidas = (perdidas, total = 3) => "❤️".repeat(Math.max(0, total - perdidas)) + "🖤".repeat(Math.min(total, perdidas));
function hud(esq, dir) { pilula(esq, 10, 10); if (dir) { G.font = `16px ${EMOJI}`; const w = G.measureText(dir).width + 20; caixa(W - 10 - w, 10, w, 28, 14, "rgba(255,255,255,.95)"); emo(dir, W - 10 - w / 2, 25, 16); } }
function ceu(cima = "#9fd3ef", baixo = "#d8f1ff") { const gr = G.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, cima); gr.addColorStop(1, baixo); G.fillStyle = gr; G.fillRect(0, 0, W, H); }
const sorte = (a) => a[Math.floor(Math.random() * a.length)];
const embaralha = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// efeitos que sobem e somem (+1, 💥…)
function criarFx() {
  const l = [];
  return { add: (s, x, y, cor, tam = 20, emoji = false) => l.push({ s, x, y, cor, tam, emoji, t: 0 }), quadro(dt) {
    for (let i = l.length - 1; i >= 0; i--) { const f = l[i]; f.t += dt; if (f.t > .9) { l.splice(i, 1); continue; } G.globalAlpha = 1 - f.t / .9; const y = f.y - f.t * 40; f.emoji ? emo(f.s, f.x, y, f.tam) : txt(f.s, f.x, y, f.tam, f.cor); G.globalAlpha = 1; }
  } };
}

// ================= 1. CONSERTA O CANO =================
function jogoCano(g) {
  const C = 5, L = 5, S = 62, X0 = (W - C * S) / 2, Y0 = 104;
  const N = 1, E = 2, SU = 4, O = 8, DIR = [[0, -1, N, SU], [1, 0, E, O], [0, 1, SU, N], [-1, 0, O, E]];
  const gira = (m) => ((m << 1) | (m >> 3)) & 15;
  // caminho aleatório da caixa d'água (canto de cima) até a casa (canto de baixo)
  let cam;
  do {
    cam = []; const vis = new Set();
    const dfs = (x, y) => { vis.add(x + "," + y); cam.push([x, y]); if (x === C - 1 && y === L - 1) return true; for (const [dx, dy] of embaralha(DIR.slice())) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= C || ny >= L || vis.has(nx + "," + ny)) continue; if (dfs(nx, ny)) return true; } cam.pop(); return false; };
    dfs(0, 0);
  } while (cam.length < 11);
  const m = Array(C * L).fill(0), noCam = new Set();
  const liga = (a, b) => DIR.find(([dx, dy]) => a[0] + dx === b[0] && a[1] + dy === b[1])[2];
  cam.forEach((p, i) => { const k = p[1] * C + p[0]; noCam.add(k); if (i > 0) m[k] |= liga(p, cam[i - 1]); if (i < cam.length - 1) m[k] |= liga(p, cam[i + 1]); if (i === 0) m[k] |= N; if (i === cam.length - 1) m[k] |= SU; });
  for (let k = 0; k < C * L; k++) if (!noCam.has(k)) m[k] = sorte([5, 3, 5, 3, 7]);
  for (let k = 0; k < C * L; k++) for (let i = Math.floor(Math.random() * 4); i > 0; i--) m[k] = gira(m[k]);
  const ang = Array(C * L).fill(0);
  const encher = () => {
    const v = new Set(); if (!(m[0] & N)) return v; const fila = [0]; v.add(0);
    while (fila.length) { const k = fila.shift(), x = k % C, y = (k / C) | 0; for (const [dx, dy, bit, op] of DIR) { if (!(m[k] & bit)) continue; const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= C || ny >= L) continue; const nk = ny * C + nx; if (!v.has(nk) && (m[nk] & op)) { v.add(nk); fila.push(nk); } } }
    return v;
  };
  const resolvido = (v) => v.has(C * L - 1) && (m[C * L - 1] & SU);
  let cheio = encher();
  while (resolvido(cheio)) { const p = sorte(cam), k = p[1] * C + p[0]; m[k] = gira(m[k]); cheio = encher(); }
  let ganhou = -1;
  const AGUA = "#3fa9f5", SECO = "#a7b1bf";
  function cano(cx, cy, mask, cor, a) {
    G.save(); G.translate(cx, cy); G.rotate(-a); G.lineCap = "round";
    for (const [lw, c] of [[19, "#14204a"], [12, cor]]) { G.lineWidth = lw; G.strokeStyle = c; G.beginPath(); for (const [dx, dy, bit] of DIR) if (mask & bit) { G.moveTo(0, 0); G.lineTo(dx * S / 2, dy * S / 2); } G.stroke(); }
    G.beginPath(); G.arc(0, 0, 8, 0, 7); G.fillStyle = cor; G.fill(); G.restore();
  }
  return { tempo: 45, quadro(dt) {
    ceu("#bfe6ff", "#c9ecc0");
    const cx = X0 + S / 2, hx = X0 + (C - 1) * S + S / 2, hy = Y0 + L * S;
    // caixa d'água
    G.lineCap = "butt"; G.lineWidth = 19; G.strokeStyle = "#14204a"; G.beginPath(); G.moveTo(cx, 70); G.lineTo(cx, Y0 + 4); G.stroke(); G.lineWidth = 12; G.strokeStyle = AGUA; G.stroke();
    caixa(cx - 30, 40, 60, 40, 10, AGUA); txt("ÁGUA", cx, 61, 13, "#fff");
    // casa
    const chegou = ganhou >= 0;
    G.lineWidth = 19; G.strokeStyle = "#14204a"; G.beginPath(); G.moveTo(hx, hy - 4); G.lineTo(hx, hy + 22); G.stroke(); G.lineWidth = 12; G.strokeStyle = chegou ? AGUA : SECO; G.stroke();
    caixa(hx - 34, hy + 20, 68, 50, 6, "#fffaf0"); G.beginPath(); G.moveTo(hx - 42, hy + 22); G.lineTo(hx, hy - 6); G.lineTo(hx + 42, hy + 22); G.closePath(); G.fillStyle = "#e4573a"; G.fill(); G.lineWidth = 2.5; G.strokeStyle = "#14204a"; G.stroke();
    caixa(hx - 8, hy + 44, 16, 26, 3, "#8a5a3a");
    for (let k = 0; k < C * L; k++) {
      const x = k % C, y = (k / C) | 0, px = X0 + x * S, py = Y0 + y * S;
      ang[k] = Math.max(0, ang[k] - dt * 11);
      caixa(px + 2, py + 2, S - 4, S - 4, 11, cheio.has(k) ? "#e3f4ff" : "#fff9e8", "#1d5e2a", 2);
      cano(px + S / 2, py + S / 2, m[k], cheio.has(k) ? AGUA : SECO, ang[k]);
    }
    hud("🚰 Leva a água até a casa");
    if (chegou) { ganhou += dt; emo("💧", hx + 46, hy + 8 - ganhou * 20, 22); if (ganhou > .7) g.vencer(); }
  }, down(p) {
    if (ganhou >= 0) return;
    const x = Math.floor((p.x - X0) / S), y = Math.floor((p.y - Y0) / S); if (x < 0 || y < 0 || x >= C || y >= L) return;
    const k = y * C + x; m[k] = gira(m[k]); ang[k] = Math.PI / 2; cheio = encher();
    if (resolvido(cheio)) ganhou = 0;
  } };
}

// ================= 2. SOBE A CASA =================
function jogoCasa(g) {
  const META = 8, AH = 34, CHAO = 462;
  const CORES = ["#ff8a65", "#ffd23f", "#7ec8f2", "#a5d86e", "#ff9fc4", "#b9a2ff", "#ffb74d", "#80deea", "#f48fb1"];
  const torre = [{ x: 105, w: 150 }], caindo = [], fx = criarFx();
  let mov = { x: 0, w: 150, dir: 1 }, vel = 135, fimT = -1, perdeu = false;
  const yDo = (i) => CHAO - (i + 1) * AH;
  function andar(x, y, w, cor, porta) {
    caixa(x, y, w, AH, 4, cor);
    for (let wx = x + 9; wx + 12 <= x + w - 7; wx += 22) caixa(wx, y + 9, 12, 14, 2, "#e8f6ff", "#14204a", 1.5);
    if (porta) caixa(x + w / 2 - 9, y + 12, 18, AH - 12, 2, "#8a5a3a", "#14204a", 1.5);
  }
  return { tempo: 60, quadro(dt) {
    ceu(); G.fillStyle = "#fff"; for (const [x, y, r] of [[60, 70, 18], [82, 64, 22], [104, 72, 16], [262, 110, 16], [282, 104, 20]]) { G.beginPath(); G.arc(x, y, r, 0, 7); G.fill(); }
    G.fillStyle = "#6cc24a"; G.fillRect(0, CHAO, W, H - CHAO); G.fillStyle = "#d9d4c7"; G.fillRect(0, CHAO, W, 6);
    if (fimT < 0) { mov.x += mov.dir * vel * dt; if (mov.x < 0) { mov.x = 0; mov.dir = 1; } if (mov.x + mov.w > W) { mov.x = W - mov.w; mov.dir = -1; } }
    torre.forEach((a, i) => andar(a.x, yDo(i), a.w, CORES[i % CORES.length], i === 0));
    if (fimT < 0) { const y = yDo(torre.length); G.strokeStyle = "#14204a"; G.lineWidth = 2; G.beginPath(); G.moveTo(mov.x + mov.w / 2, 0); G.lineTo(mov.x + mov.w / 2, y - 6); G.stroke(); caixa(mov.x + mov.w / 2 - 7, y - 8, 14, 8, 2, "#ffd23f"); andar(mov.x, y, mov.w, CORES[torre.length % CORES.length]); }
    for (const d of caindo) { d.vy += 900 * dt; d.y += d.vy * dt; d.r += d.vr * dt; G.save(); G.translate(d.x + d.w / 2, d.y + AH / 2); G.rotate(d.r); andar(-d.w / 2, -AH / 2, d.w, d.cor); G.restore(); }
    if (fimT >= 0 && !perdeu) { const t = torre[torre.length - 1], y = yDo(torre.length - 1); G.beginPath(); G.moveTo(t.x - 10, y); G.lineTo(t.x + t.w / 2, y - 44); G.lineTo(t.x + t.w + 10, y); G.closePath(); G.fillStyle = "#e4573a"; G.fill(); G.lineWidth = 2.5; G.strokeStyle = "#14204a"; G.stroke(); txt("🏠 Casa pronta!", W / 2, 150, 26, "#1d5e2a"); }
    fx.quadro(dt);
    hud(`🏗️ Andar ${Math.min(META, torre.length - 1)}/${META}`);
    if (fimT >= 0) { fimT += dt; if (fimT > (perdeu ? 1 : .9)) perdeu ? g.perder("O andar caiu! A casa desabou.") : g.vencer(); }
  }, down() {
    if (fimT >= 0) return;
    const topo = torre[torre.length - 1], a = Math.max(mov.x, topo.x), b = Math.min(mov.x + mov.w, topo.x + topo.w), w = b - a, y = yDo(torre.length), cor = CORES[torre.length % CORES.length];
    if (w < 10) { caindo.push({ x: mov.x, y, w: mov.w, vy: 0, r: 0, vr: mov.dir * 2, cor }); perdeu = true; fimT = 0; return; }
    if (Math.abs(mov.x - topo.x) < 5) { torre.push({ x: topo.x, w: topo.w }); fx.add("Perfeito!", W / 2, y - 10, "#1d5e2a", 20); }
    else { torre.push({ x: a, w }); caindo.push({ x: mov.x < topo.x ? mov.x : b, y, w: mov.w - w, vy: 0, r: 0, vr: (mov.x < topo.x ? -1 : 1) * 2.5, cor }); }
    if (torre.length - 1 >= META) { fimT = 0; return; }
    const nw = torre[torre.length - 1].w; mov = { x: mov.dir > 0 ? 0 : W - nw, w: nw, dir: mov.dir }; vel += 20;
  } };
}

// ================= 3. ACENDE A RUA =================
function jogoPostes(g) {
  const C = 5, L = 6, S = 60, X0 = 30, Y0 = 92;
  const NIVEIS = [[[0, 0, 3, 3], [4, 0, 4, 5], [1, 2, 3, 4], [2, 2, 1, 4], [0, 5, 3, 5]], [[0, 0, 2, 5], [1, 0, 4, 2], [1, 1, 3, 5], [2, 1, 4, 3], [2, 2, 2, 3]]];
  const CORES = embaralha(["#ff5a5a", "#ffd23f", "#4cd964", "#4aa8ff", "#ff9f40"]);
  const fx = Math.random() < .5, fy = Math.random() < .5, k = (x, y) => y * C + x;
  const pares = sorte(NIVEIS).map(([a, b, c, d], i) => ({ cor: CORES[i], a: k(fx ? C - 1 - a : a, fy ? L - 1 - b : b), b: k(fx ? C - 1 - c : c, fy ? L - 1 - d : d), cam: [], ok: false }));
  const ponta = new Map(); pares.forEach((p, i) => { ponta.set(p.a, { i, poste: true }); ponta.set(p.b, { i, poste: false }); });
  let ativo = -1, fimT = -1, t = 0;
  g.rota = () => { // acha rotas sem cruzar (busca) e devolve caminhos [x,y] por par
    const usado = new Set(); const fins = new Set(pares.flatMap((p) => [p.a, p.b])); const res = [];
    const viz = (c) => { const x = c % C, y = (c / C) | 0, r = []; if (x > 0) r.push(c - 1); if (x < C - 1) r.push(c + 1); if (y > 0) r.push(c - C); if (y < L - 1) r.push(c + C); return r; };
    const dist = (p) => Math.abs(p.a % C - p.b % C) + Math.abs(((p.a / C) | 0) - ((p.b / C) | 0));
    const ord = pares.map((p, i) => i).sort((a, b) => dist(pares[a]) - dist(pares[b]));
    const resolve = (n) => {
      if (n === ord.length) return true; const P = pares[ord[n]];
      for (let max = 3; max <= 14; max++) {
        const cam = [P.a]; usado.add(P.a);
        const dfs = (c) => { if (c === P.b) { res[ord[n]] = cam.slice(); return resolve(n + 1); } if (cam.length > max) return false;
          for (const v of viz(c)) { if (usado.has(v) || (fins.has(v) && v !== P.b)) continue; usado.add(v); cam.push(v); if (dfs(v)) return true; cam.pop(); usado.delete(v); } return false; };
        if (dfs(P.a)) return true; usado.delete(P.a);
      } return false;
    };
    if (!resolve(0)) throw new Error("sem solução");
    return res.map((cam) => cam.map((c) => ({ x: X0 + (c % C) * S + S / 2, y: Y0 + ((c / C) | 0) * S + S / 2 })));
  };
  const celula = (p) => { const x = Math.floor((p.x - X0) / S), y = Math.floor((p.y - Y0) / S); return x < 0 || y < 0 || x >= C || y >= L ? null : [x, y]; };
  const centro = (kk) => [X0 + (kk % C) * S + S / 2, Y0 + ((kk / C) | 0) * S + S / 2];
  const ESTRELAS = Array.from({ length: 26 }, () => [Math.random() * W, Math.random() * 84, Math.random() * 1.4 + .6]);
  function seguir(tx, ty) {
    const P = pares[ativo];
    for (let n = 0; n < 14; n++) {
      const ult = P.cam[P.cam.length - 1], lx = ult % C, ly = (ult / C) | 0; if (lx === tx && ly === ty) return;
      const dx = tx - lx, dy = ty - ly, [sx, sy] = Math.abs(dx) >= Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)], nk = k(lx + sx, ly + sy);
      const idx = P.cam.indexOf(nk);
      if (idx >= 0) { P.cam.length = idx + 1; P.ok = false; continue; }
      if (P.ok) return;
      const pt = ponta.get(nk);
      if (pt) { if (pt.i !== ativo) return; P.cam.push(nk); P.ok = true; g.par?.(); if (pares.every((q) => q.ok)) fimT = 0; return; }
      const outro = pares.findIndex((q, j) => j !== ativo && q.cam.includes(nk));
      if (outro >= 0) { const q = pares[outro]; q.cam.length = q.cam.indexOf(nk); q.ok = false; }
      P.cam.push(nk);
    }
  }
  return { tempo: 75, quadro(dt) {
    t += dt; const aceso = fimT >= 0;
    ceu(aceso ? "#2a3f8f" : "#0a1633", aceso ? "#3b5bb5" : "#1b2a5c");
    for (const [x, y, r] of ESTRELAS) { G.globalAlpha = .5 + .5 * Math.sin(t * 2 + x); G.fillStyle = "#fff"; G.beginPath(); G.arc(x, y + 40, r, 0, 7); G.fill(); } G.globalAlpha = 1;
    caixa(X0 - 8, Y0 - 8, C * S + 16, L * S + 16, 16, "#1b2a5c", "#5a6aa8", 2.5);
    for (let kk = 0; kk < C * L; kk++) { const [cx, cy] = centro(kk); caixa(cx - S / 2 + 3, cy - S / 2 + 3, S - 6, S - 6, 9, "#24357a", null); }
    G.lineCap = "round"; G.lineJoin = "round";
    for (const P of pares) if (P.cam.length > 1) { G.lineWidth = 16; G.strokeStyle = P.cor; G.globalAlpha = P.ok ? 1 : .8; G.beginPath(); P.cam.forEach((kk, i) => { const [x, y] = centro(kk); i ? G.lineTo(x, y) : G.moveTo(x, y); }); G.stroke(); G.globalAlpha = 1; }
    for (const P of pares) {
      const [ax, ay] = centro(P.a), [bx, by] = centro(P.b);
      // poste: luz acende quando liga
      if (P.ok) { G.shadowColor = P.cor; G.shadowBlur = 24; }
      G.beginPath(); G.arc(ax, ay, 18, 0, 7); G.fillStyle = P.ok ? "#fff6c2" : P.cor; G.fill(); G.lineWidth = 4; G.strokeStyle = P.cor; G.stroke(); G.shadowBlur = 0;
      emo("💡", ax, ay + 1, 20);
      caixa(bx - 17, by - 17, 34, 34, 7, P.cor, "#14204a", 2.5); txt("⚡", bx, by + 1, 18, "#14204a");
    }
    hud(`💡 ${pares.filter((p) => p.ok).length}/${pares.length} acesos`);
    if (aceso) { txt("A rua acendeu! 🎉", W / 2, Y0 + L * S + 38, 22, "#ffd23f"); fimT += dt; if (fimT > 1) g.vencer(); }
  }, down(p) {
    if (fimT >= 0) return; const c = celula(p); if (!c) return; const kk = k(...c);
    const pt = ponta.get(kk);
    if (pt) { ativo = pt.i; pares[ativo].cam = [kk]; pares[ativo].ok = false; return; }
    ativo = pares.findIndex((q) => q.cam.includes(kk));
    if (ativo >= 0) { const P = pares[ativo]; P.cam.length = P.cam.indexOf(kk) + 1; P.ok = false; }
  }, move(p) { if (ativo < 0 || fimT >= 0) return; const c = celula(p); if (c) seguir(...c); }, up() { ativo = -1; } };
}

// ================= 4. TAPA-BURACO =================
function jogoBuraco(g) {
