<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Black Magnetica 13/11: os 11 produtos em orbita em volta da Vee (IMG_8975).
     Quadros do bruto: orbitablack/quadros/q-NNNNN.jpg (extraidos no GitHub pelo renderizar.mjs via fonte.json).
     Recorte da Vee por quadro (MediaPipe selfie_multiclass) -> fichas de tras passam atras dela. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  canvas, .camada { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #fundo { z-index: 0; } #tras { z-index: 1; } #pessoa { z-index: 2; } #frente { z-index: 3; }
  #veu { position: absolute; inset: 0; z-index: 0; background: radial-gradient(ellipse 70% 45% at 50% 55%, rgba(11,11,13,0), rgba(11,11,13,.45)); }
  #anel { z-index: 1; }
  .item { position: absolute; left: 0; top: 0; transform-origin: center center; }
  .placa { background: rgba(11,11,13,.82); border: 3px solid #FF2E88; border-radius: 26px; padding: 10px 14px;
    box-shadow: 0 0 28px rgba(255,46,136,.65), 0 10px 30px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
  .placa img { display: block; width: 190px; height: auto; }
  #titulo { position: absolute; left: 0; right: 0; top: 250px; z-index: 5; text-align: center; font-family: Anton, sans-serif; font-size: 96px; color: #fff;
    text-shadow: 0 0 30px rgba(255,46,136,.9), 0 6px 18px rgba(0,0,0,.6); letter-spacing: 1px; line-height: 1.1; transform-origin: center; }
  #titulo b { color: #FF2E88; font-weight: 400; }
  #titulo .cif { display: inline-block; font-size: 1.16em; line-height: 0; vertical-align: -0.02em; }
</style></head><body>
<canvas id="fundo" width="1080" height="1920"></canvas>
<div id="veu"></div>
<svg id="anel" class="camada" width="1080" height="1920"></svg>
<div id="tras" class="camada"></div>
<canvas id="pessoa" width="1080" height="1920"></canvas>
<div id="frente" class="camada"></div>
<div id="titulo">TUDO POR <b>R<span class="cif">$</span>97</b></div>
<script type="module">
import { FilesetResolver, ImageSegmenter } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const FPS = 30, N = 11;
const cx = 540, cy = 1130, rx = 390, ry = 430;
const VEL = 48;                                   // graus por segundo
const ENTRA = (i) => 0.25 + i * 0.13;             // cada ficha entra com "pling"
window.ENTRADAS = Array.from({ length: N }, (_, i) => ENTRA(i));
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const pop = (p) => { p = cl(p); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };

document.getElementById("anel").innerHTML =
  `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#FF7AB6" stroke-width="3" stroke-dasharray="10 14" opacity=".55"/>`;
const tras = document.getElementById("tras"), frente = document.getElementById("frente");
const itens = [];
for (let i = 1; i <= N; i++) {
  const d = document.createElement("div"); d.className = "item";
  d.innerHTML = `<div class="placa"><img src="orbitablack/logos/l${String(i).padStart(2, "0")}.png"></div>`;
  frente.appendChild(d); itens.push(d);
}
const g = document.getElementById("fundo").getContext("2d");
const pc = document.getElementById("pessoa").getContext("2d");
const MASC = document.createElement("canvas"); MASC.width = 1080; MASC.height = 1920;
const mc = MASC.getContext("2d");
const img = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("sem " + src)); i.src = src; });
let SEG;

function recorte(fr) {
  const r = SEG.segment(fr), m = r.confidenceMasks[0], d = m.getAsFloat32Array(), mw = m.width, mh = m.height;
  const tmp = document.createElement("canvas"); tmp.width = mw; tmp.height = mh;
  const tc = tmp.getContext("2d"), id = tc.createImageData(mw, mh);
  for (let i = 0; i < d.length; i++) id.data[i * 4 + 3] = cl((1 - d[i] - .35) / .3) * 255;   // canal 0 = fundo
  tc.putImageData(id, 0, 0); r.confidenceMasks.forEach((k) => k.close());
  mc.clearRect(0, 0, 1080, 1920); mc.filter = "blur(2px)"; mc.drawImage(tmp, 0, 0, 1080, 1920); mc.filter = "none";
  pc.globalCompositeOperation = "source-over"; pc.clearRect(0, 0, 1080, 1920);
  pc.drawImage(MASC, 0, 0); pc.globalCompositeOperation = "source-in"; pc.drawImage(fr, 0, 0, 1080, 1920);
  pc.globalCompositeOperation = "source-over";
}

window.renderFrame = async (t) => {
  const fr = await img(`orbitablack/quadros/q-${String(Math.round(t * FPS)).padStart(5, "0")}.jpg`);
  g.drawImage(fr, 0, 0, 1080, 1920);
  recorte(fr);
  const giro = t * VEL;
  itens.forEach((d, k) => {
    const a = (giro + k * 360 / N) * Math.PI / 180;
    const x = cx + rx * Math.sin(a), y = cy + ry * Math.cos(a);
    const prof = (Math.cos(a) + 1) / 2;                       // 0 atras ... 1 frente
    const lado = prof < 0.5 ? tras : frente;
    if (d.parentNode !== lado) lado.appendChild(d);
    const e = pop((t - ENTRA(k)) / 0.35);
    const esc = (0.6 + 0.45 * prof) * Math.max(0, e);
    d.style.zIndex = Math.round(prof * 100);
    d.style.opacity = t < ENTRA(k) ? 0 : (0.55 + 0.45 * prof).toFixed(2);
    d.style.filter = prof < 0.35 ? `blur(${((0.35 - prof) * 6).toFixed(1)}px)` : "none";
    const w = d.offsetWidth, h = d.offsetHeight;
    d.style.transform = `translate(${x - w / 2}px,${y - h / 2}px) scale(${esc.toFixed(3)})`;
  });
  const tt = document.getElementById("titulo");
  const et = pop(t / 0.4);
  tt.style.opacity = t <= 0 ? 0 : 1;
  tt.style.transform = `scale(${Math.max(0, et).toFixed(3)})`;
};

(async () => {
  await document.fonts.load("96px Anton");
  await Promise.all(itens.map((d) => d.querySelector("img").decode().catch(() => {})));
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  SEG = await ImageSegmenter.createFromOptions(fs, { baseOptions: { modelAssetPath: "orbitablack/selfie_multiclass.tflite", delegate: "CPU" },
    runningMode: "IMAGE", outputConfidenceMasks: true, outputCategoryMask: false });
  window.pronto = true;
})();
</script></body></html>
