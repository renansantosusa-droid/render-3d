<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Oswald:wght@500;700&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}canvas{display:block}video{display:none}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// MOLDE LONGO 16:9 do GTÁ SABENDO? (formato LISTA: "15 coisas..."), mesmo visual dos Shorts (molde-gta.html) deitado.
// <id>/roteiro.json: { titulo, sub, total_itens, credito,
//   cenas: [ { texto, midia:["img:x.jpg","take:nome"], card?, item?:{n,tit}, abertura?:true, fim?:true } ] }
// Fotos: <id>/img/<arquivo> (1920x1080) · Takes deitados: <id>/takes/<nome>.webm (1280x720, banco/takes16)
// Novidades x Shorts: número grande na entrada de cada item, faixa do item no canto + "07/15", tela de título e de inscrição.
const ID = location.pathname.split("/").pop().replace(/\.html$/, "");
const NOME = "GTÁ SABENDO?";
const W = 1920, H = 1080, g = document.getElementById("c").getContext("2d");
const T = await (await fetch(`/${ID}/tempos.json`)).json();
const R = await (await fetch(`/${ID}/roteiro.json`)).json();
const CENAS = T.cenas;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (k) => 1 - Math.pow(1 - clamp(k), 3);
const back = (k) => { k = clamp(k); const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const AM = "#ffd23a", ROSA = "#ff2d78", BR = "#ffffff";
const ini = (i) => (i === 0 ? 0 : CENAS[i].ini), fimC = (i) => (i + 1 < CENAS.length ? CENAS[i + 1].ini : T.total + .5);
const cenaEm = (t) => { for (let i = CENAS.length - 1; i >= 0; i--) if (t >= ini(i)) return i; return 0; };

// "Gê Tê Á" -> "GTÁ" na legenda
for (const cn of CENAS) { const o = []; for (let i = 0; i < cn.palavras.length; i++) { const p = cn.palavras[i]; if (norm(p.w) === "ge" && cn.palavras[i + 1] && norm(cn.palavras[i + 1].w) === "te") { o.push({ w: "GTA", t: p.t }); i += 2; } else o.push(p); } cn.palavras = o; }

// item atual de cada cena (herda do último item marcado)
let atual = null; const ITEM = R.cenas.map((c) => { if (c.item) atual = { ...c.item, desde: null }; if (c.abertura || c.fim) return null; return atual; });
R.cenas.forEach((c, i) => { if (c.item) ITEM[i].desde = ini(i); });

// mídias
const MID = {};
const carregar = (m) => new Promise((ok, no) => {
  const [tipo, nome] = m.split(":");
  if (tipo === "img") { const im = new Image(); im.onload = () => ok(MID[m] = { im, w: im.width, h: im.height }); im.onerror = () => no(new Error("imagem " + nome)); im.src = `/${ID}/img/${nome}`; }
  else { const v = document.createElement("video"); v.muted = true; v.preload = "auto"; v.playsInline = true; document.body.appendChild(v);
    v.onloadeddata = () => ok(MID[m] = { v, w: v.videoWidth, h: v.videoHeight, dur: v.duration }); v.onerror = () => no(new Error("take " + nome)); v.src = `/${ID}/takes/${nome}.webm`; v.load(); }
});
await Promise.all([...new Set(R.cenas.flatMap((c) => c.midia))].map(carregar));

const SEG = []; let k = 0;
CENAS.forEach((cn, i) => {
  const a = ini(i), b = fimC(i), ms = R.cenas[i].midia, n = ms.length;
  ms.forEach((m, j) => { k++; SEG.push({ m, a: a + (b - a) * j / n, b: a + (b - a) * (j + 1) / n, z0: 1.0, z1: MID[m].v ? 1.05 : 1.1, fx0: k % 2 ? .44 : .56, fx1: k % 2 ? .56 : .44 }); });
});
async function prepararVideo(s, t) {
  const M = MID[s.m]; if (!M.v) return;
  const alvo = clamp((t - s.a) * Math.min(1, (M.dur - .05) / (s.b - s.a)), 0, M.dur - .05);
  if (Math.abs(M.v.currentTime - alvo) > .001) await new Promise((ok) => { M.v.onseeked = ok; M.v.currentTime = alvo; setTimeout(ok, 3000); });
}
function desenha(s, t, alfa) {
  const M = MID[s.m], src = M.v || M.im, kk = clamp((t - s.a) / (s.b - s.a)), e = kk * kk * (3 - 2 * kk);
  const z = s.z0 + (s.z1 - s.z0) * e, fx = s.fx0 + (s.fx1 - s.fx0) * e, fy = .5;
  const base = Math.max(W / M.w, H / M.h), sc = base * z, sw = W / sc, sh = H / sc;
  const sx = clamp(fx * M.w - sw / 2, 0, M.w - sw), sy = clamp(fy * M.h - sh / 2, 0, M.h - sh);
  g.globalAlpha = alfa; g.imageSmoothingQuality = "high"; g.drawImage(src, sx, sy, sw, sh, 0, 0, W, H); g.globalAlpha = 1;
}
async function fundo(t) {
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  let i = SEG.findIndex((s) => t >= s.a && t < s.b); if (i < 0) i = t < SEG[0].a ? 0 : SEG.length - 1;
  const s = SEG[i], f = .25, n = i + 1 < SEG.length && t > s.b - f ? SEG[i + 1] : null;
  await prepararVideo(s, t); desenha(s, t, 1);
  if (n) { await prepararVideo(n, Math.max(t, n.a)); desenha(n, Math.max(t, n.a), clamp((t - (s.b - f)) / f)); }
  let gr = g.createLinearGradient(0, 0, 0, 260); gr.addColorStop(0, "rgba(0,0,0,.7)"); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(0, 0, W, 260);
  gr = g.createLinearGradient(0, 700, 0, H); gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(.6, "rgba(0,0,0,.55)"); gr.addColorStop(1, "rgba(0,0,0,.8)"); g.fillStyle = gr; g.fillRect(0, 700, W, H - 700);
}
function fit(s, tam, max, fam = "Nunito", peso = 900) { g.font = peso + " " + tam + "px " + fam; const w = g.measureText(s).width; return w > max ? Math.floor(tam * max / w) : tam; }
function contorno(s, x, y, tam, cor, al = "center", lw = 14, fam = "Nunito", peso = 900) { g.font = `${peso} ${tam}px ${fam}`; g.textAlign = al; g.textBaseline = "middle"; g.lineWidth = lw; g.lineJoin = "round"; g.strokeStyle = "#000"; g.strokeText(s, x, y); g.fillStyle = cor; g.fillText(s, x, y); }

// selo fixo (canto superior direito) + crédito
function selo() {
  g.font = "700 34px Oswald"; const w = g.measureText(NOME).width + 44, h = 58, x = W - 50 - w, y = 70;
  g.fillStyle = ROSA; g.beginPath(); g.roundRect(x, y - h / 2, w, h, h / 2); g.fill(); g.fillStyle = BR; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(NOME, x + w / 2, y + 2);
  g.font = "500 22px Oswald"; g.fillStyle = "rgba(255,255,255,.65)"; g.textAlign = "right"; g.fillText(R.credito || "Imagens: Rockstar Games", W - 40, H - 26);
}

// faixa do item (canto superior esquerdo) + progresso "07/15"
function faixa(t) {
  const i = cenaEm(t), it = ITEM[i]; if (!it) return;
  const e = ease((t - it.desde - 1.5) / .35); if (e <= 0) return;
  const nn = String(it.n).padStart(2, "0"), tot = String(R.total_itens || 15).padStart(2, "0");
  g.save(); g.globalAlpha = e; g.translate((1 - e) * -40, 0);
  const x = 50, y = 70, h = 72;
  g.fillStyle = ROSA; g.beginPath(); g.roundRect(x, y - h / 2, 110, h, 16); g.fill();
  contorno(nn, x + 55, y + 3, 52, BR, "center", 0);
  const tt = it.tit.toUpperCase(), ts = fit(tt, 40, 900, "Oswald", 700); g.font = `700 ${ts}px Oswald`; const tw = g.measureText(tt).width;
  g.fillStyle = "rgba(0,0,0,.72)"; g.beginPath(); g.roundRect(x + 122, y - h / 2, tw + 48, h, 16); g.fill();
  g.fillStyle = BR; g.textAlign = "left"; g.textBaseline = "middle"; g.fillText(tt, x + 146, y + 2);
  // bolinhas de progresso
  const n = R.total_itens || 15, px = x, py = y + 66;
  for (let j = 1; j <= n; j++) { g.fillStyle = j < it.n ? AM : j === it.n ? ROSA : "rgba(255,255,255,.35)"; g.beginPath(); g.arc(px + 8 + (j - 1) * 26, py, j === it.n ? 9 : 7, 0, Math.PI * 2); g.fill(); }
  g.font = "700 26px Oswald"; g.fillStyle = BR; g.textAlign = "left"; g.fillText(`${nn}/${tot}`, px + 8 + n * 26, py + 1);
  g.restore();
}

// número grande na entrada do item (1,8 s)
function numero(t) {
  const i = cenaEm(t), it = ITEM[i]; if (!it || !R.cenas[i].item) return;
  const d = t - it.desde; if (d > 1.9) return;
  const ent = back(d / .45), sai = 1 - ease((d - 1.45) / .4), a = Math.min(clamp(d / .15), sai);
  g.save(); g.globalAlpha = a * .55; g.fillStyle = "#000"; g.fillRect(0, 0, W, H); g.globalAlpha = a;
  g.translate(W / 2, H / 2 - 60); g.scale(.6 + .4 * ent, .6 + .4 * ent);
  contorno("#" + it.n, 0, -30, 300, AM, "center", 26);
  const tt = it.tit.toUpperCase(); contorno(tt, 0, 190, fit(tt, 92, 1600), BR, "center", 16);
  g.restore();
}

// título da abertura (cena logo depois da abertura) e tela final
function titulo(t) {
  const i = cenaEm(t), c = R.cenas[i];
  if (i === 1 || (i === 0 && false)) {
    const e = back((t - ini(i)) / .5); g.save(); g.globalAlpha = clamp((t - ini(i)) / .2);
    g.fillStyle = "rgba(0,0,0,.5)"; g.fillRect(0, 0, W, H);
    g.translate(W / 2, H / 2 - 90); g.scale(.7 + .3 * e, .7 + .3 * e);
    const p = R.titulo.split(" "), l1 = p.slice(0, 2).join(" "), l2 = p.slice(2).join(" ");
    contorno(l1, 0, -110, fit(l1, 210, 1700), AM, "center", 24);
    contorno(l2, 0, 60, fit(l2, 120, 1700), BR, "center", 18);
    g.font = "700 64px Oswald"; const sw = g.measureText(R.sub.toUpperCase()).width + 70;
    g.fillStyle = ROSA; g.beginPath(); g.roundRect(-sw / 2, 150, sw, 92, 46); g.fill(); g.fillStyle = BR; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(R.sub.toUpperCase(), 0, 198);
    g.restore();
  }
  if (c.fim) {
    const d = t - ini(i), e = back(d / .5); g.save(); g.globalAlpha = clamp(d / .25);
    g.fillStyle = "rgba(0,0,0,.45)"; g.fillRect(0, 0, W, H); g.translate(W / 2, 400);
    contorno("QUAL VOCÊ NÃO SABIA?", 0, -80, 120, AM, "center", 18);
    contorno("comenta aqui embaixo", 0, 50, 64, BR, "center", 12);
    const pulso = 1 + .04 * Math.sin(d * 6); g.translate(0, 210); g.scale(e * pulso, e * pulso);
    g.fillStyle = "#e62117"; g.beginPath(); g.roundRect(-260, -60, 520, 120, 24); g.fill();
    g.font = "700 64px Oswald"; g.fillStyle = BR; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("INSCREVA-SE", 0, 4);
    g.restore();
  }
}

// quadros de comparação / destaque (no meio da tela)
function card(t) {
  const i = cenaEm(t), c = R.cenas[i].card; if (!c) return;
  const a0 = ini(i), b0 = fimC(i), kk = ease((t - a0 - .25) / .3); if (kk <= 0) return;
  const cx = W / 2, cy = 450, pw = 1200, ph = c.solo ? 330 : 470;
  g.save(); g.globalAlpha = kk; g.translate(cx, cy + (1 - kk) * 40);
  g.fillStyle = "rgba(0,0,0,.68)"; g.beginPath(); g.roundRect(-pw / 2, -ph / 2, pw, ph, 40); g.fill(); g.lineWidth = 6; g.strokeStyle = ROSA; g.stroke();
  const ts = fit(c.tit || "", 50, 1100, "Oswald", 700); g.font = "700 " + ts + "px Oswald"; g.fillStyle = BR; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(c.tit || "", 0, -ph / 2 + 55);
  if (c.solo) { contorno(c.solo[0] || "", 0, -5, fit(c.solo[0] || "", 104, 1120), AM, "center", 14); if (c.solo[1]) contorno(c.solo[1], 0, 95, fit(c.solo[1], 56, 1100), BR, "center", 10); g.restore(); return; }
  const kb = ease((t - (a0 + (b0 - a0) * .4)) / .3), side = (x, lab, val, sub, al) => {
    g.globalAlpha = al; g.font = "500 42px Oswald"; g.fillStyle = "rgba(255,255,255,.75)"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(lab || "", x, -100);
    contorno(val || "", x, 15, fit(val || "", 130, 440), AM, "center", 16);
    if (sub) { g.font = "500 38px Oswald"; g.fillStyle = "rgba(255,255,255,.85)"; g.textAlign = "center"; g.fillText(sub, x, 130); } };
  side(-310, c.la, c.a, c.sa, kk); side(310, c.lb, c.b, c.sb, kb * kk);
  g.globalAlpha = kk; g.strokeStyle = ROSA; g.lineWidth = 12; g.lineCap = "round"; g.lineJoin = "round"; g.beginPath(); g.moveTo(-34, 15); g.lineTo(26, 15); g.stroke(); g.beginPath(); g.moveTo(8, -11); g.lineTo(34, 15); g.lineTo(8, 41); g.stroke();
  g.restore();
}

// legenda palavra por palavra (embaixo, 4 palavras por vez)
const DISP = { seis: "6", cinco: "5" };
const GRUPOS = []; for (const cn of CENAS) for (let i = 0; i < cn.palavras.length; i += 4) GRUPOS.push({ ws: cn.palavras.slice(i, i + 4), fim: (cn.palavras[i + 4] || { t: cn.fim + .15 }).t });
function legenda(t) {
  const i = cenaEm(t); if (R.cenas[i].fim) return;
  const gr = GRUPOS.find((x) => t >= x.ws[0].t && t < x.fim); if (!gr) return;
  const ws = gr.ws.map((p) => (DISP[norm(p.w)] || p.w).toUpperCase().replace(/[.,!?;:]+$/, "")); let tam = 76; g.font = `900 ${tam}px Nunito`; let lw = ws.map((w) => g.measureText(w).width), esp = 22;
  const larg = () => lw.reduce((a, b) => a + b, 0) + esp * (ws.length - 1); if (larg() > 1600) { tam = Math.floor(tam * 1600 / larg()); g.font = `900 ${tam}px Nunito`; lw = ws.map((w) => g.measureText(w).width); }
  let x = W / 2 - larg() / 2; const kk = ease((t - gr.ws[0].t) / .1), y = 960 + (1 - kk) * 14;
  ws.forEach((w, j) => { const ativa = t >= gr.ws[j].t && (j === ws.length - 1 || t < gr.ws[j + 1].t);
    g.textAlign = "left"; g.textBaseline = "middle"; g.lineWidth = 13; g.lineJoin = "round"; g.strokeStyle = "#000"; g.globalAlpha = kk; g.strokeText(w, x, y); g.fillStyle = ativa ? AM : BR; g.fillText(w, x, y); g.globalAlpha = 1; x += lw[j] + esp; });
}
window.renderFrame = async (t) => { await fundo(t); card(t); faixa(t); titulo(t); numero(t); legenda(t); selo(); };
await document.fonts.load("900 40px Nunito"); await document.fonts.load("700 40px Oswald"); await document.fonts.load("500 40px Oswald"); await document.fonts.ready;
await window.renderFrame(0); window.pronto = true;
</script>
</body></html>
