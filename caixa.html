<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import { iniciar } from "/kit3d.js";
const K = await iniciar("caixa", { fundo: 0x9cc8ea, seed: 7373 });
const { THREE, scene, add, grupo, mat, vidro, brilho, V, sprite, fluxo, tex, grade, texRuido, texMadeira, rotulo, prog, lin, pulse, entre, frac, clamp, C, F, P, T, rnd } = K;

// ---------- casa em corte ----------
add(new THREE.BoxGeometry(30, 4, 8), mat(0xffffff, { map: texRuido("#8a6a44", 40, 6) }), 0, -2, -1);
add(new THREE.PlaneGeometry(30, 8), mat(0xffffff, { map: texRuido("#6aa84a", 40, 10) }), 0, .001, -5).rotation.x = -Math.PI / 2;
add(new THREE.BoxGeometry(7, .1, 3), mat(0xffffff, { map: grade("#e8e2d8", "#c8c0b0", 64, 6) }), 0, .05, 0);
add(new THREE.BoxGeometry(7, 3, .1), mat(0xf2ead8), 0, 1.5, -1.5);
for (const x of [3.5]) add(new THREE.BoxGeometry(.12, 3, 3), mat(0xe8dcc4), x, 1.5, 0);
add(new THREE.BoxGeometry(7.2, .12, 3), mat(0xbcb4a4), 0, 3.0, 0);
add(new THREE.BoxGeometry(2.2, 2.6, .05), mat(0xffffff, { map: grade("#eef6fa", "#c8d8e0", 32, 4) }), 1.8, 1.4, -1.44);
// chuveiro + torneira
add(new THREE.CylinderGeometry(.2, .12, .12, 20), mat(0xdddddd, { metalness: .8, roughness: .2 }), 1.8, 2.3, -.2);
const espalha = Array.from({ length: 50 }, () => ({ s: sprite(0x5ab0ff), f: rnd(), a: rnd() * 6.28, r: rnd() }));
// rua
add(new THREE.BoxGeometry(4, .05, 3), mat(0x555555), -6, .02, 0);
// canos
const tubo = (pts, r = .06, cor = 0xdddddd) => { const c = new THREE.CurvePath(); for (let i = 0; i < pts.length - 1; i++) c.add(new THREE.LineCurve3(pts[i], pts[i + 1])); const m = add(new THREE.TubeGeometry(c, 120, r, 8), mat(cor, { transparent: true, opacity: .4, depthWrite: false })); m.curva = c; return m; };
const Z = -.2;
const direto = tubo([V(-7, .15, Z), V(-3.2, .15, Z), V(-3.2, 2.85, Z), V(1.8, 2.85, Z), V(1.8, 2.35, Z)]);
const fDireto = fluxo(direto.curva, 40, 0x3a8cff);
// caixa d'água (origem no fundo)
const caixa = grupo(-1.6, .1, 0);
const RC = .75, HC = 1.1;
add(new THREE.CylinderGeometry(RC, RC * .85, HC, 40, 1, true), new THREE.MeshPhysicalMaterial({ color: 0x3a6ad0, transparent: true, opacity: .35, side: THREE.DoubleSide, depthWrite: false }), 0, HC / 2, 0, caixa);
add(new THREE.CircleGeometry(RC * .85, 40), mat(0x2a4a9a), 0, .01, 0, caixa).rotation.x = -Math.PI / 2;
const aguaC = add(new THREE.CylinderGeometry(RC * .97, RC * .85, 1, 40), new THREE.MeshPhysicalMaterial({ color: 0x3a9cff, transparent: true, opacity: .6, roughness: .1 }), 0, .5, 0, caixa);
const tampa = add(new THREE.CylinderGeometry(RC * 1.05, RC * 1.05, .1, 40), mat(0x2a4a9a), 0, HC + .05, 0, caixa);
const boia = grupo(-RC + .15, HC - .1, 0, caixa);
const braco = add(new THREE.CylinderGeometry(.015, .015, .5, 6), mat(0x888888), .25, 0, 0, boia); braco.rotation.z = Math.PI / 2;
const bola = add(new THREE.SphereGeometry(.11, 16, 12), mat(0xff7a3a), .5, 0, 0, boia);
const sujeira = Array.from({ length: 30 }, () => ({ s: sprite(0x6a4a2a, caixa), x: (rnd() - .5) * 1.1, z: (rnd() - .5) * 1.1, y: rnd() }));
const saidaMarca = add(new THREE.RingGeometry(.09, .13, 24), brilho(0x3aff7a), RC * .9 + .01, .15, 0, caixa); saidaMarca.rotation.y = Math.PI / 2;
const registro = grupo(RC + .35, .15, 0, caixa); add(new THREE.TorusGeometry(.1, .025, 6, 16), mat(0xff3a3a), 0, .14, 0, registro).rotation.x = Math.PI / 2; add(new THREE.CylinderGeometry(.015, .015, .14, 6), mat(0x888888), 0, .07, 0, registro);
const base = add(new THREE.BoxGeometry(1.9, .14, 1.9), mat(0x8a8a8a), 0, -.07, 0, caixa);
const mosquitos = Array.from({ length: 6 }, () => ({ s: sprite(0x111111), f: rnd() }));
// canos com a caixa no chão (cena 3) e no alto (cena 4+)
const entraChao = tubo([V(-7, .15, Z), V(-3.0, .15, Z), V(-3.0, 1.15, Z), V(-2.35, 1.15, Z)]);
const fEntraChao = fluxo(entraChao.curva, 24, 0x3a8cff);
const sobeFalha = fluxo(new THREE.CatmullRomCurve3([V(-.85, .3, Z), V(-.2, .3, Z), V(-.2, 1.6, Z), V(-.2, .5, Z)]), 14, 0x3a8cff);
const YT = 3.06 + .14;
const entraAlto = tubo([V(-7, .15, Z), V(-3.0, .15, Z), V(-3.0, YT + HC + .05, Z), V(-2.35, YT + HC + .05, Z), V(-2.35, YT + HC - .1, Z)]);
const saiAlto = tubo([V(-1.6 + RC * .9, YT + .15, Z), V(-.2, YT + .15, Z), V(-.2, 2.85, Z), V(1.8, 2.85, Z), V(1.8, 2.35, Z)]);
const fEntraAlto = fluxo(entraAlto.curva, 40, 0x3a8cff), fSaiAlto = fluxo(saiAlto.curva, 30, 0x3a8cff);
const ladrao = tubo([V(-1.6 - RC * .9, YT + HC - .2, .25), V(-3.8, YT + HC - .2, .25), V(-3.8, .1, .25)], .05, 0xff9a3a);
const fLadrao = fluxo(ladrao.curva, 18, 0x3a8cff);
const transborda = Array.from({ length: 30 }, () => ({ s: sprite(0x3a9cff), f: rnd(), a: rnd() * 6.28 }));
// peso (seta)
const seta = add(new THREE.ConeGeometry(.18, .4, 16), brilho(0xffd23a), 0, 0, 0); seta.rotation.x = Math.PI;

// ---------- câmera ----------
K.camera_({
  casa: [V(-.6, 2.4, 15), V(-.6, 1.8, 0)], rua: [V(-3.6, 2.4, 11), V(-2.4, 1.3, 0)], chuveiro: [V(1.4, 2, 6.5), V(1.6, 1.6, -.4)],
  chao: [V(-1, 1.6, 8.5), V(-1.2, .9, 0)], alto: [V(-.8, 4.2, 15), V(-.8, 2.6, 0)], tanque: [V(-1.0, 4.8, 7.4), V(-1.7, 3.8, 0)],
  ladrao: [V(-1.8, 4.2, 8), V(-2.6, 3.0, 0)], fim: [V(.8, 5.5, 14), V(-1, 3, 0)],
}, [
  [0, "rua"], [F(1), "rua"], [C(2), "casa"], [P(2, "fiozinho") - .5, "chuveiro"], [F(2), "chuveiro"],
  [C(3), "chao"], [F(3), "chao"], [C(4), "alto"], [F(4), "alto"],
  [C(5), "tanque"], [F(5), "tanque"], [C(6), "ladrao"], [F(6), "ladrao"],
  [C(7), "tanque"], [F(7), "tanque"], [C(8), "alto"], [T, "fim"],
]);

K.pronto((t) => {
  const em = (a, b) => entre(t, a, b);
  // fase 1: direto da rua
  const fase1 = t < C(3);
  direto.visible = fase1;
  const cortou = em(P(2, "corta") - .1, P(2, "noite") - .2);
  const fraco = em(P(2, "junto") - .2, C(3));
  fDireto.atualiza(t, fase1 && t > P(1, "torneira") - .3 && !cortou, .45, fraco ? .06 : .15, em(P(2, "pressao") - .2, P(2, "junto") - .2) ? (frac(t * 2) < .5 ? 1 : .2) : 1);
  // caixa: no chão (cena 3) e sobe (cena 4)
  const aparece = prog(t, P(3, "caixa") - .4, P(3, "caixa") + .3);
  caixa.visible = t > P(3, "caixa") - .4; caixa.scale.setScalar(Math.max(.01, aparece));
  const vaiAlto = prog(t, P(4, "alto") - .6, P(4, "alto") + .8);
  const extra = .9 * prog(t, P(4, "alta") - .4, P(4, "alta") + .4) * (t < C(5) ? 1 : 0);
  caixa.position.set(-1.6, .1 + (YT - .1 + extra) * vaiAlto, 0);
  base.visible = t > P(8, "base") - .3;
  entraChao.visible = em(C(3), P(4, "alto") - .3);
  fEntraChao.atualiza(t, em(P(3, "guardar") - .3, P(4, "alto") - .3), .35, .14);
  sobeFalha.atualiza(t, em(P(3, "sobe") - .3, F(3)), .45, .08);
  const alto = t > P(4, "alto") + .8;
  entraAlto.visible = saiAlto.visible = alto; saiAlto.position.y = extra; entraAlto.scale.y = 1;
  // nível da água
  let nivel = .2 + .5 * prog(t, P(3, "guardar"), F(3));
  if (t > C(5)) nivel = .7 + .32 * prog(t, C(5), P(5, "transborda"));
  if (em(P(5, "boia") - .2, C(6))) nivel = .85;
  if (em(C(6), C(7))) nivel = .85 + .07 * prog(t, P(6, "quebrar") - .2, P(6, "ladrao"));
  if (t > C(7)) nivel = .8;
  aguaC.scale.y = HC * nivel; aguaC.position.y = HC * nivel / 2;
  // entrada fecha com a boia
  const fechou = (t > P(5, "fecha") - .1 && t < C(6)) || t > C(7);
  const quebrou = em(P(6, "quebrar") - .1, C(7));
  fEntraAlto.atualiza(t, alto && !fechou, .4, .15);
  const banho = (alto && t < C(5)) || t > C(8);
  fSaiAlto.atualiza(t, banho, .5 + .3 * (extra / .9), .15 + .04 * (extra / .9));
  for (const e of espalha) { const k = frac(t * 1.4 + e.f); e.s.position.set(1.8 + Math.cos(e.a) * e.r * .4 * k, 2.25 - k * 2, -.2 + Math.sin(e.a) * e.r * .4 * k); e.s.scale.setScalar(.06); e.s.material.opacity = (fase1 && !cortou && t > P(1, "torneira") && !(fraco && e.f > .25)) || banho ? .9 * (1 - k * .5) : 0; }
  transborda.forEach((p) => { const k = frac(t * 1.2 + p.f); p.s.position.set(caixa.position.x + Math.cos(p.a) * RC, caixa.position.y + HC - k * 1.4, Math.sin(p.a) * RC); p.s.scale.setScalar(.08); p.s.material.opacity = em(P(5, "transborda") - .2, P(5, "boia") - .2) ? 1 - k : 0; });
  // boia
  boia.visible = t > P(5, "boia") - .4;
  boia.position.y = HC * nivel - .02 - .05;
  boia.rotation.z = quebrou ? -.9 : -.15 + .15 * prog(t, P(5, "sobe", 2) - .3, P(5, "fecha"));
  bola.material.color.set(quebrou ? 0x777777 : 0xff7a3a);
  fLadrao.atualiza(t, em(P(6, "excesso") - .4, C(7)), .5, .14);
  ladrao.visible = t > P(6, "ladrao") - .4;
  // sujeira, mosquito, tampa, saída alta
  sujeira.forEach((p) => { p.s.position.set(p.x * .9, .05 + p.y * .7 * (1 - prog(t, P(7, "sujeira") - .2, P(7, "saida"))), p.z * .9); p.s.scale.setScalar(.07); p.s.material.opacity = em(P(7, "sujeira") - .3, F(7)) ? .9 : 0; });
  const tampou = prog(t, P(7, "tampa") - .4, P(7, "tampa") + .2);
  tampa.visible = t < C(5) - 50 || t > P(7, "tampa") - .4; tampa.position.y = HC + .05 + .8 * (1 - tampou);
  mosquitos.forEach((m, i) => { m.s.position.set(caixa.position.x + Math.sin(t * 3 + i) * .5, caixa.position.y + HC + .3 + Math.cos(t * 4 + i * 2) * .2, Math.sin(t * 2 + i) * .4); m.s.scale.setScalar(.09); m.s.material.opacity = em(P(7, "mosquito") - .2, P(7, "tampa")) ? 1 : 0; });
  saidaMarca.visible = em(P(7, "saida") - .2, F(7));
  registro.visible = t > P(8, "registro") - .3;
  seta.visible = em(P(4, "peso") - .3, P(4, "alta") - .3); seta.position.set(-.2, 2.9 + frac(t * 1.5) * .6 * -1 + .6, Z + .3);
  K.cartoes(t, [
    [P(2, "corta") - .2, P(2, "noite") - .2, "SEM ÁGUA", "#ff4a3a"],
    [P(2, "fiozinho") - .5, F(2), "SÓ UM FIOZINHO", "#ff4a3a"],
    [P(3, "chao") - .3, F(3), "NÃO SOBE", "#ff4a3a"],
    [P(4, "peso") - .3, P(4, "alta") - .3, "A GRAVIDADE EMPURRA", "#ffd23a"],
    [P(4, "alta") - .3, F(4), "10 M = 1 BAR", "#3aff7a"],
    [P(5, "transborda") - .2, P(5, "boia") - .3, "TRANSBORDOU", "#ff4a3a"],
    [P(5, "fecha") - .3, F(5), "BOIA FECHA", "#3aff7a"],
    [P(6, "ladrao") - .3, F(6), "LADRÃO", "#ff9a3a"],
    [P(7, "mosquito") - .3, P(7, "tampa") - .2, "DENGUE", "#ff4a3a"],
    [P(7, "saida") - .3, F(7), "SAÍDA ACIMA DO FUNDO", "#3aff7a"],
    [P(8, "mil") - .3, F(8) - 2, "1.000 L = 1 TONELADA", "#ffd23a"],
  ]);
});
</script>
</body></html>
