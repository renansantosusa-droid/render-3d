// Gêmeas do Litoral (paródia) — Cap.1 (@avenidabrasiliaa)

function quartinhoQ(t) { K.parede(0, CHAO, "#a8a090", "#8a8274"); K.pisoMadeira(CHAO, "#6a4a30", 1); K.rodape(CHAO, "#c8c0b0"); rr(560, CHAO - 260, 480, 200, 20, "#7a6a8a"); rr(560, CHAO - 300, 160, 70, 24, "#efe8de"); rect(120, 300, 2, 260, "#333"); circ(121, 580, 30, "#ffe8a0"); K.glow(121, 600, 520, "rgba(255,220,150,A)", .45); tinta("#0a1030", .3); }

function escadaMansao(t) { K.mansao(CHAO, t); for (let i = 0; i < 10; i++) { rr(560 + i * 50, CHAO - 80 - i * 70, 520, 24, 4, "#efe2c4"); rect(560 + i * 50, CHAO - 56 - i * 70, 520, 46, "#e2d2b0"); } g.strokeStyle = "#c8a040"; g.lineWidth = 8; g.beginPath(); g.moveTo(560, CHAO - 200); g.lineTo(1060, CHAO - 900); g.stroke(); }
function fachada(t) {

  rr(700, 900, 220, 350, 4, "#6a4a30");

  for (let x = 10; x < W; x += 70) rect(x, 1180, 12, 420, "#2a2a2a"); rect(0, 1180, W, 16, "#2a2a2a"); rect(0, 1440, W, 12, "#2a2a2a");
  for (let x = 46; x < W; x += 70) circ(x - 30, 1176, 9, "#c8a040");
}
function mala(x, y, s = 1, rot = 0) { g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s); rr(-60, -150, 120, 150, 14, "#8a4a2a"); rect(-60, -110, 120, 8, "#6a3a1a"); g.strokeStyle = "#3a2010"; g.lineWidth = 10; g.beginPath(); g.arc(0, -150, 26, Math.PI, 0); g.stroke(); g.restore(); }
function avental(x, y, s) { g.save(); g.translate(x, y); g.scale(s, s); rr(-42, -330, 84, 170, 12, "#e0a83a"); rr(-26, -370, 52, 46, 8, "#e0a83a"); rect(-50, -300, 100, 8, "#c08a2a"); g.restore(); }

function jantar(t, cic, cam, raspa = 0) {
  K.parede(0, CHAO, "#e6d6b8", "#d4c2a0"); K.quadro(380, 300, 320, 220, K.fotoFamilia, "#c8a040"); K.pisoMadeira(CHAO, "#7a5236"); K.rodape(CHAO);
  pessoa(300, CHAO + 40, 1.08, { ...CICLONE, roupa: "#5a7ab0", calca: "#5a7ab0", sentado: true, olhar: .6, ...cic });
  pessoa(780, CHAO + 40, 1.08, { ...CAMILA, roupa: "#1a1a1a", sentado: true, olhar: -.6, ...cam });

}
// ---------- apoio comum dos episódios 2D (entra antes do renderFrame) ----------
const fundo = (c) => { g.fillStyle = c; g.fillRect(0, 0, W, H); };
const um = (o, s = 2.3, x = W / 2, dy = 260) => { g.save(); g.translate(x, 1900 + 330 * s - 400 - dy); g.scale(s, s); pessoa(0, 0, 1, o); g.restore(); };
const par = (a, b, s = 1.9, xa = 330, xb = 760, dy = 280) => { um(a, s, xa, dy); um(b, s, xb, dy); };

function papel(titulo, linhas, k = 1, y = 900, rot = -.04) { g.save(); g.translate(W / 2, y); g.rotate(rot); g.scale(.85 + .15 * k, .85 + .15 * k); rr(-330, -400, 660, 800, 8, "#fdfbf6"); txt(titulo, 0, -330, 34, "#333", 800, "center", "Nunito"); rect(-290, -290, 580, 3, "#ccc"); linhas.forEach((l, i) => { if (typeof l === "string") txt(l, -280, -220 + i * 90, 34, "#222", 700, "left", "Nunito"); else rect(-280, -230 + i * 90, l, 16, "#c8c8c8"); }); g.restore(); }
function cardFinal(t, perg, a, b, rod, sub, tam = 46, fundoCor = "#0e0f14") { rect(0, 0, W, H, fundoCor); K.glow(W / 2, 700, 600, "rgba(214,69,58,A)", .2); const al = prog(t, FALA + .3, FALA + .8); g.globalAlpha = al; let ts = 92; g.font = `700 ${ts}px Oswald`; while (g.measureText(perg).width > 980) { ts -= 4; g.font = `700 ${ts}px Oswald`; } txt(perg, W / 2, 700, ts, "#fff"); rr(110, 820, 410, 116, 58, "#d6453a"); txt(a, 315, 880, tam, "#fff"); rr(560, 820, 410, 116, 58, "#4fae5a"); txt(b, 765, 880, tam, "#fff"); txt("COMENTA 👇", W / 2, 1040, 46, "#e0a83a"); txt(sub, W / 2, 1110, 34, "#bbb", 500); txt(rod, W / 2, 1500, 26, "#666", 500); g.globalAlpha = 1; }
function hudFases(t, fases) { if (t > FALA + .3) return; let h = fases[0]; for (const x of fases) if (t >= x[0]) h = x; K.hud(t, h[1], h[2], h[3]); }

const RUTE = { sexo: "f", cabelo: "#5a3a1a", roupa: "#fbfbfb", calca: "#fbfbfb", pele: "#e8b48a" };
const MARCOS = { sexo: "m", cabelo: "#1a1410", roupa: "#1a1a22", calca: "#1a1a22", pele: "#d39a72" };

function igreja(t, porta = 0) {
  g.fillStyle = "#efe4cc"; g.fillRect(0, 0, W, H); for (const x of [120, 960]) rr(x - 40, 200, 80, 1300, 6, "#e2d2b0");

  rect(W / 2 - 6, 330, 12, 200, "#fff8e0"); rect(W / 2 - 60, 390, 120, 12, "#fff8e0"); K.glow(W / 2, 600, 500, "rgba(255,240,200,A)", .35);

  for (let i = 0; i < 3; i++) { rr(40, CHAO + 120 + i * 150, 300, 40, 6, "#6a4a2a"); rr(W - 340, CHAO + 120 + i * 150, 300, 40, 6, "#6a4a2a"); }

window.renderFrame = (t) => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);

  } else if (t < C(5)) { // CENA 4: regra 1
