  s.scale.set(alt * (w + 12) / (h + 12), alt, 1); s.renderOrder = 10; s.userData.base = s.scale.clone(); scene.add(s); return s;
}
const escalaSprite = (s, k) => { s.visible = k > .001; const f = Math.max(.001, k) * camera.position.distanceTo(s.position) / 9; s.scale.set(s.userData.base.x * f, s.userData.base.y * f, 1); };

// ---------- Reels "20 mil casas": as casas nascem em onda, comparações de cidades e as cidades vazias (pino vermelho) ----------
const N = DADOS.casas.length;
const POS = DADOS.casas.map(([lon, lat, dest]) => { const [a, b] = emTerra(lon, lat, dest ? .14 : .08); return [X(a), Z(b), dest ? .13 : .075]; });
const corpoGeo = new THREE.BoxGeometry(1, .82, .9); corpoGeo.translate(0, .41, 0);
const telGeo = new THREE.ConeGeometry(.84, .6, 4); telGeo.rotateY(Math.PI / 4); telGeo.translate(0, 1.12, 0);
const corpos = new THREE.InstancedMesh(corpoGeo, new THREE.MeshStandardMaterial({ color: 0xfffaf0, roughness: .7 }), N);
const telhados = new THREE.InstancedMesh(telGeo, new THREE.MeshStandardMaterial({ roughness: .6 }), N);
corpos.castShadow = telhados.castShadow = true;
const CORES = [0xe4573a, 0x2b59c3, 0xffb020, 0x8e5cd9, 0xff6fa8, 0x18a39a, 0xff7a45].map((c) => new THREE.Color(c));
for (let i = 0; i < N; i++) telhados.setColorAt(i, CORES[i % CORES.length]);
scene.add(corpos, telhados);
const ROT = DADOS.casas.map((_, i) => (i * 2.399) % (Math.PI / 2) - Math.PI / 4);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v3 = new THREE.Vector3(), s3 = new THREE.Vector3(), eixoY = new THREE.Vector3(0, 1, 0);

// ---------- tempos ----------
const CID = DADOS.cidades; // 0 Macapá 1 Chapecó 2 Salvador 3 Rio Grande 4 Manaus 5 Fortaleza 6 Rio de Janeiro 7 Pará de Minas 8 Bonito 9 Bujari 10 Porto Walter
const T_UMA = P(1, "Turma") - .05, T_OLHA = P(1, "já"), T_CASAS = P(1, "em") + .1;
const ordem = [...Array(N).keys()].sort((a, b) => DADOS.casas[a][3] - DADOS.casas[b][3]);
const QUANDO = new Float32Array(N); ordem.forEach((i, k) => QUANDO[i] = k === 0 ? T_UMA : T_OLHA + (T_CASAS - T_OLHA) * (k / N));
const TS = ordem.map((i) => DADOS.casas[i][3]);
const T_UNICO = P(2, "É") - .1;
const T_SAL = P(3, "Salvador") - .25;
const T_MAN = P(4, "Manaus") - .25, T_FOR = P(4, "Fortaleza") - .25, T_RJ = P(4, "Rio", 3) - .25;
const T_PARA = P(5, "Pará") - .2, T_HAB = P(5, "habitantes"), T_ZERO5 = P(5, "nenhuma") - .05;
const T_ZERO6 = P(6, "zero") - .05, T_ACRE = P(6, "Acre") - .2, T_BUJ = P(6, "Bujari") - .15, T_PW = P(6, "Porto") - .15;
const T_PINS = P(7, "mil") - .1, T_TUA = P(7, "A") - .05, T_SEGUE = P(7, "Segue") - .05;

// ---------- tomadas ----------
const pc = (c) => [X(c.lon), Z(c.lat)], pll = (lon, lat) => [X(lon), Z(lat)];
const S = (a, alvo, de, ate) => ({ a, alvo, de, ate });
const SHOTS = [
  S(0, pll(-53, -15.5), [58, -6, 62], [54, 0, 60]),
  S(C(2), pll(-51.9, 1.6), [17, -8, 48], [13, 4, 44]),
  S(C(3), pc(CID[1]), [9.5, -12, 42], [7.5, 4, 38]),
  S(T_SAL, pc(CID[2]), [9.5, 12, 42], [7.5, -2, 38]),
  S(C(4), pc(CID[3]), [12, -10, 42], [9.5, 6, 38]),
  S(T_MAN, pc(CID[4]), [10, 8, 42], [8, -4, 38]),
  S(T_FOR, pc(CID[5]), [10, -8, 42], [8, 4, 38]),
  S(T_RJ, pc(CID[6]), [10, 6, 42], [8, -4, 38]),
  S(C(5), pll(-50, -15), [34, -2, 55], [26, 4, 50]),
  S(T_PARA, pc(CID[7]), [9.5, 12, 47], [6.2, 0, 40]),
  S(C(6), pc(CID[8]), [9.5, -10, 47], [6.2, 4, 40]),
  S(T_ACRE, pll(-70.3, -9.1), [20, 0, 50], [17, 6, 46]),
  S(T_BUJ, pc(CID[9]), [7.5, 8, 44], [6.4, 2, 41]),
  S(T_PW, pc(CID[10]), [7.5, -8, 44], [6.4, -2, 41]),
  S(C(7), pll(-53, -15.5), [58, -4, 60], [50, 4, 56]),
];
SHOTS.forEach((s, i) => s.b = i + 1 < SHOTS.length ? SHOTS[i + 1].a : FIM);
const alvo = new THREE.Vector3();
function moverCamera(t) {
  const i = SHOTS.findLastIndex((s) => t >= s.a), s = SHOTS[Math.max(0, i)];
  const k = ease(clamp((t - s.a) / (s.b - s.a), 0, 1)), [d, yaw, el] = s.de.map((x, j) => x + (s.ate[j] - x) * k);
  const yr = yaw * Math.PI / 180, er = el * Math.PI / 180;
  alvo.set(s.alvo[0], ALT, s.alvo[1]);
  camera.position.set(alvo.x + d * Math.sin(yr) * Math.cos(er), alvo.y + d * Math.sin(er), alvo.z + d * Math.cos(yr) * Math.cos(er));
  if (d < 12) camera.lookAt(alvo.x, alvo.y, alvo.z - 1.1); else camera.lookAt(alvo);
  return { i, dt: t - s.a };
}

// ---------- etiquetas com os @ reais (cidades com gente) ----------
const JAN = [[C(2) + .3, C(3)], [C(3), T_SAL], [T_SAL, C(4)], [C(4), T_MAN], [T_MAN, T_FOR], [T_FOR, T_RJ], [T_RJ, C(5)]]; // janela de cada cidade g=0..6
const LBL = DADOS.labels;
for (const l of LBL) {
  const [x, z, e] = POS[l.i];
  l.s = etiqueta(l.u, { bg: "#ffd23f", alt: .36 });
  l.s.position.set(x, ALT + e * 1.75 + .1 + l.n * .6, z);
  l.vezes = [JAN[l.g]];
}

// ---------- o lugar vazio: anel vermelho + pino + nome da cidade ----------
const anelMat = new THREE.MeshBasicMaterial({ color: 0xff4b3e, transparent: true, depthWrite: false, side: THREE.DoubleSide });
const anel = new THREE.Mesh(new THREE.RingGeometry(.2, .26, 48), anelMat); anel.rotation.x = -Math.PI / 2;
const anel2 = new THREE.Mesh(new THREE.RingGeometry(.2, .23, 48), anelMat.clone()); anel2.rotation.x = -Math.PI / 2;
const chao = new THREE.Mesh(new THREE.CircleGeometry(.2, 48), new THREE.MeshBasicMaterial({ color: 0xff4b3e, transparent: true, opacity: .22, depthWrite: false })); chao.rotation.x = -Math.PI / 2;
scene.add(anel, anel2, chao);
const pinoMat = new THREE.MeshStandardMaterial({ color: 0xff4b3e, emissive: 0xff2010, emissiveIntensity: .35, roughness: .4 });
const pinoF = new THREE.Group();
const cab = new THREE.Mesh(new THREE.SphereGeometry(.1, 20, 16), pinoMat); cab.position.y = .3;
const ponta = new THREE.Mesh(new THREE.ConeGeometry(.075, .24, 16), pinoMat); ponta.rotation.x = Math.PI; ponta.position.y = .13;
cab.castShadow = ponta.castShadow = true; pinoF.add(cab, ponta); scene.add(pinoF);
const NOMES = CID.map((c, i) => i >= 7 ? etiqueta(c.nome.toUpperCase(), { alt: .3 }) : null);
// cidade vazia em foco: [início, fim, índice]
const FOCO = [[T_PARA, C(6), 7], [C(6), T_ACRE, 8], [T_BUJ, T_PW, 9], [T_PW, C(7), 10]];

// ---------- as +1.700 cidades vazias (pinos vermelhos) ----------
const NV = DADOS.vazias.length;
const VP = DADOS.vazias.map(([lon, lat]) => [X(lon), Z(lat)]);
const pinoGeo = new THREE.CylinderGeometry(.5, .5, .25, 10); pinoGeo.translate(0, .125, 0);
const pinos = new THREE.InstancedMesh(pinoGeo, new THREE.MeshStandardMaterial({ color: 0xff4b3e, emissive: 0xff2010, emissiveIntensity: .35, roughness: .5 }), NV);
scene.add(pinos);
const QV = VP.map((_, i) => T_PINS + 1.2 * Math.pow(i / NV, .6));

// ---------- textos na tela ----------
const mk = (id, cls = "") => { const el = document.createElement("div"); el.id = id; el.className = "ov " + cls; document.body.appendChild(el); return el; };
const flash = document.createElement("div"); flash.id = "flash"; document.body.appendChild(flash);
const elMarca = mk("marca"); elMarca.innerHTML = "A TURMA DO <b>BRASIL</b>";
const elChip = mk("chip"), elCont = mk("cont");
const elCta = mk("cta"); elCta.innerHTML = '<div class="l1">COMENTA TUA CIDADE<br>+ ESTADO</div><div class="l2">pra tua casa entrar no mapa 👇</div>';
const elSeta = mk("seta"); const elLeg = mk("legenda");
const fmt = (n) => n.toLocaleString("pt-BR");
const nome = (c) => c.nome.toUpperCase() + " · " + c.uf;
const PL = DADOS.placar;
const CHIPS = [
  [0, T_UMA, "20 MIL<br>CASAS! 🎉"],
  [C(2), T_UNICO, "AMAPÁ<small>16 de 16 cidades ✅</small>"],
  [T_UNICO, C(3), "ÚNICO ESTADO<br>COMPLETO 🏆"],
  [C(3), T_SAL, `CHAPECÓ (SC)<small>${CID[1].casas} casas</small>`],
  [T_SAL, C(4), `SALVADOR (BA)<small>só ${CID[2].casas} casas</small>`],
  [C(4), T_MAN, `RIO GRANDE (RS)<small>${CID[3].casas} casas 🏆</small>`],
  [T_MAN, T_FOR, `MANAUS (AM)<small>${CID[4].casas} casas</small>`],
  [T_FOR, T_RJ, `FORTALEZA (CE)<small>${CID[5].casas} casas</small>`],
  [T_RJ, C(5), `RIO DE JANEIRO<small>${CID[6].casas} casas</small>`],
  [C(5), T_PARA, "AGORA, AS<br>QUE FALTAM 👀"],
  [T_PARA, C(6), nome(CID[7])],
  [C(6), T_ACRE, nome(CID[8])],
  [T_ACRE, T_BUJ, "ACRE<small>faltam só 2 cidades</small>"],
  [T_BUJ, T_PW, nome(CID[9])],
  [T_PW, C(7), nome(CID[10])],
  [T_PINS, T_TUA, `${fmt(DADOS.nVazias)} CIDADES<small>sem nenhuma casa 😱</small>`],
  [T_TUA, T_SEGUE, "A TUA JÁ TEM? 👀"],
];
const PALAVRAS = TEMPOS.cenas.flatMap((c) => c.palavras);
const DESTAQUE = new Set(["vinte", "mil", "casas", "turma", "brasil", "tres", "oitocentas", "cidades", "amapa", "dezesseis", "unico", "estado", "completo", "chapeco", "salvador", "noventa", "cinquenta", "rio", "grande", "trezentas", "manaus", "fortaleza", "janeiro", "para", "minas", "habitantes", "nenhuma", "bonito", "zero", "acre", "bujari", "porto", "walter", "setecentas", "ninguem", "tua", "segue", "comenta", "cidade"]);
const esc = (el, k, centro = true) => el.style.transform = (centro ? "translateX(-50%) " : "") + "scale(" + k + ")";
// contador: casas (cena 1) · habitantes que viram "0 CASAS" (Pará de Minas, Bonito)
const FASES = [{ ini: T_PARA, hab: T_HAB, zero: T_ZERO5, fim: C(6), c: CID[7] }, { ini: C(6), hab: T_ZERO6 - .1, zero: T_ZERO6, fim: T_ACRE, c: CID[8] }];
function textos(t) {
  esc(elMarca, 1 + .06 * pulse(t, P(1, "Turma") - .1, .5));
  const kn = clamp((t - T_OLHA) / (T_CASAS - T_OLHA), 0, 1), nv = entre(t, T_UMA, C(2)), idx = Math.min(N - 1, Math.round(kn * (N - 1)));
  const fase = FASES.find((f) => entre(t, f.ini, f.fim));
  elCont.style.opacity = nv || fase ? 1 : 0;
  if (nv) {
    const dt = new Date((TS[idx] - 3 * 3600) * 1e3), dia = String(dt.getUTCDate()).padStart(2, "0"), hr = String(dt.getUTCHours()).padStart(2, "0");
    elCont.className = "ov";
    elCont.innerHTML = fmt(kn >= 1 ? PL.casas : t < T_OLHA ? 1 : Math.max(1, Math.round((idx + 1) * PL.casas / N))) + "<small>" + (kn >= 1 ? "CASAS · " + fmt(PL.cidades) + " CIDADES" : "CASAS · dia " + dia + "/11, " + hr + "h") + "</small>";
    elCont.style.transform = "translateX(-50%) translateY(190px)";
  } else if (fase) {
    if (t >= fase.zero) { elCont.className = "ov zero"; elCont.innerHTML = "0 CASAS<small>nenhuma ainda 😱</small>"; elCont.style.transform = "translateX(-50%) translateY(190px) scale(" + (.7 + .3 * pop(t, fase.zero, .3)) + ")"; }
    else { elCont.className = "ov"; elCont.innerHTML = fmt(Math.round(fase.c.pop * prog(t, fase.ini + .15, fase.hab))) + "<small>HABITANTES</small>"; elCont.style.transform = "translateX(-50%) translateY(190px)"; }
  }
  const c = CHIPS.find(([a, b]) => entre(t, a, b));
  if (c) { elChip.innerHTML = c[2]; elChip.className = "ov amarelo"; elChip.style.opacity = 1; elChip.style.fontSize = c[2].startsWith("20 MIL") ? "130px" : !c[2].includes("<") && c[2].length > 20 ? "58px" : "70px"; esc(elChip, .55 + .45 * prog(t, c[0], c[0] + .16) + .12 * pulse(t, c[0] + .08, .3)); }
  else elChip.style.opacity = 0;
  const kc = prog(t, T_SEGUE, T_SEGUE + .25);
  elCta.style.opacity = kc; esc(elCta, .6 + .4 * kc + .04 * Math.sin(t * 9) * kc, false);
  elSeta.style.opacity = kc; elSeta.style.transform = "translateY(" + (18 * Math.abs(Math.sin(t * 5))) + "px)";
  let atual = null; for (const p of PALAVRAS) if (t >= p.t) atual = p;
  if (!atual || t > T_SEGUE || (c && norm(c[2]).startsWith(norm(atual.w)))) { elLeg.textContent = ""; return; }
  elLeg.textContent = atual.w.toUpperCase(); elLeg.className = "ov" + (DESTAQUE.has(norm(atual.w)) ? " am" : "");
  esc(elLeg, .8 + .2 * prog(t, atual.t, atual.t + .09), false);
}

function quadro(t) {
  const cam = moverCamera(t);
  texMar.offset.set(t * .01, t * .006);
  const fd = clamp(camera.position.distanceTo(alvo) / 8, 1, 3);
  for (let i = 0; i < N; i++) {
    const [x, z, e] = POS[i], k = Math.max(.0001, clamp(pop(t, QUANDO[i], .35), 0, 1.3) * e * fd);
    m4.compose(v3.set(x, ALT, z), q.setFromAxisAngle(eixoY, ROT[i]), s3.setScalar(k)); corpos.setMatrixAt(i, m4); telhados.setMatrixAt(i, m4);
  }
  corpos.instanceMatrix.needsUpdate = telhados.instanceMatrix.needsUpdate = true;
  for (const l of LBL) { const v = l.vezes.find(([a, b]) => entre(t, a, b)); escalaSprite(l.s, v ? pop(t, v[0] + .08) : 0); }
  // pinos das cidades vazias
  const vp = t >= T_PINS;
  for (let i = 0; i < NV; i++) { const k = vp ? clamp(pop(t, QV[i], .3), 0, 1.3) : 0, r = .11 * k * fd; m4.compose(v3.set(VP[i][0], ALT, VP[i][1]), q.identity(), s3.set(Math.max(1e-4, r), Math.max(1e-4, r * (1 + .4 * Math.sin(t * 6 + i))), Math.max(1e-4, r))); pinos.setMatrixAt(i, m4); }
  pinos.instanceMatrix.needsUpdate = true;
  // anel + pino + nome da cidade vazia em foco
  const f = FOCO.find(([a, b]) => entre(t, a, b));
  anel.visible = anel2.visible = chao.visible = pinoF.visible = !!f;
  NOMES.forEach((n, i) => { if (n) escalaSprite(n, f && f[2] === i ? pop(t, f[0] + .1) : 0); });
  if (f) {
    const [cx, cz] = pc(CID[f[2]]), k = pop(t, f[0] + .05, .4), sc = Math.max(.001, k);
    anel.position.set(cx, ALT + .01, cz); anel.scale.setScalar(sc * (1 + .08 * Math.sin(t * 7)));
    const w = ((t - f[0]) * 1.2) % 1; anel2.position.set(cx, ALT + .012, cz); anel2.scale.setScalar(sc * (1 + w * 1.6)); anel2.material.opacity = .9 * (1 - w);
    chao.position.set(cx, ALT + .008, cz); chao.scale.setScalar(sc);
    pinoF.position.set(cx, ALT + .03 * Math.abs(Math.sin(t * 4)), cz); pinoF.scale.setScalar(Math.max(.001, pop(t, f[0] + .15, .4)));
    NOMES[f[2]].position.set(cx, ALT + .78, cz);
  }
  flash.style.opacity = cam.i > 0 ? .35 * clamp(1 - cam.dt / .12, 0, 1) : 0;
  renderer.render(scene, camera);
  textos(t);
}
window.renderFrame = quadro;
quadro(0);
window.pronto = true;

</script>
</body></html>
