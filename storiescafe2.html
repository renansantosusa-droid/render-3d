  <div class="fala viu" id="viu"><b>Viu só?</b>Com os materiais certos e aprendendo o processo, montar uma foto ímã pode ser muito mais simples do que você imagina!</div>

  <div class="fala perg" id="perg">Você sabe<br><span class="rosa">vender</span><br>uma foto ímã?</div>
</div>
<script>
const $ = (i) => document.getElementById(i);
const lim = (x) => Math.max(0, Math.min(1, x));
const sai = (t, a, d) => { const x = lim((t - a) / d); return 1 - Math.pow(1 - x, 3); };
const vai = (t, a, d) => { const x = lim((t - a) / d); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const mola = (t, a, d) => { const x = lim((t - a) / d); const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const janela = (t, a, b, f) => Math.min(sai(t, a, f), 1 - sai(t, b - f, f));
const ALVO = { x: 540, y: 470 };   // centro, em coordenadas da arte
const IDS = ["a1","a2","a3","a4","a5"];
window.renderFrame = (t) => {
  const some = 1 - sai(t, 10.0, 0.5);           // tudo some antes da pergunta
  // 1) círculo completo, depois some (as peças continuam e voam)
  $('tudo').style.opacity = 1 - sai(t, 0.9, 0.5);
  // 2) peças voam pro centro, uma atrás da outra, e se fundem
  IDS.forEach((id, i) => {
    const el = $(id), cx = +el.dataset.cx, cy = +el.dataset.cy;
    const a = 1.0 + i * 0.22, k = vai(t, a, 0.9);
    const s = 1 - 0.35 * k;
    el.style.transformOrigin = cx + 'px ' + cy + 'px';
    el.style.transform = 'translate(' + (ALVO.x - cx) * k + 'px,' + (ALVO.y - cy) * k + 'px) scale(' + s + ') rotate(' + (k * (i % 2 ? 8 : -8)) + 'deg)';
    el.style.opacity = t < 2.85 ? 1 : 1 - sai(t, 2.85, 0.25);
  });
  // 3) foto ímã pronta nasce no centro, grande
  const pr = $('pronta'), pop = t < 2.9 ? 0 : mola(t, 2.9, 0.6);
  pr.style.transformOrigin = '201px 450px';
  const flut = Math.sin(t * 2.2) * 6 * lim((t - 3.6) / 0.5);
  pr.style.transform = 'translate(' + (ALVO.x - 201) + 'px,' + (ALVO.y - 450 + flut) + 'px) scale(' + (2.5 * pop) + ')';
  pr.style.opacity = lim((t - 2.9) / 0.12) * some;
  // 4) textos
  $('viu').style.opacity = janela(t, 3.5, 7.7, 0.4);
