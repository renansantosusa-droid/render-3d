<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Oswald:wght@500;700&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#12042e}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// GTÁ SABENDO? / PLANTAO (17/11/2026): "GTA 6 libera amanha: o que voce precisa saber". Tudo em canvas 2D, sem imagem e sem arte da Rockstar.
// Molde: ferramentas/animacoes-3d/anulacao.html (copia adaptada, paleta Vice City).
const NOME = "GTÁ SABENDO?", ARROBA = "@gtasabendo"; // troca de nome: so aqui
const W = 1080, H = 1920, g = document.getElementById("c").getContext("2d");
const T = await (await fetch("/gtasabendo1/tempos.json")).json();
const CENAS = T.cenas;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (k) => 1 - Math.pow(1 - clamp(k), 3);
const back = (k) => { k = clamp(k); const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const P = (c, w, k = 0) => { const cn = CENAS[c - 1]; const l = cn.palavras.filter((p) => norm(p.w) === norm(w)); return (l[k] || l[0] || { t: cn.ini + .2 }).t; };
const ap = (t, t0, d = .35) => ease((t - t0) / d);
const AM = "#ffd23a", ROSA = "#ff2d78", ROXO = "#7b2ff7", AZUL = "#1fb6ff", BR = "#ffffff", CINZA = "#b9a9d6", ESC = "#1a0838", VERDE = "#2fe08a", VM = "#ff4d4d";

const rr = (x, y, w, h, r, c) => { g.fillStyle = c; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
const circ = (x, y, r, c) => { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill(); };
function txt(s, x, y, tam, cor, { peso = 700, fonte = "Oswald", al = "center", contorno = 0, sombra = false } = {}) {
  g.font = `${peso} ${tam}px ${fonte}`; g.textAlign = al; g.textBaseline = "middle";
  if (sombra) { g.fillStyle = "rgba(0,0,0,.5)"; g.fillText(s, x + 4, y + 6); }
  if (contorno) { g.lineWidth = contorno; g.strokeStyle = "#000"; g.lineJoin = "round"; g.strokeText(s, x, y); }
  g.fillStyle = cor; g.fillText(s, x, y);
}
function pilula(s, x, y, tam, fundo, cor = "#000", al = "center") {
  g.font = `700 ${tam}px Oswald`; const w = g.measureText(s).width + tam * 1.1, h = tam * 1.55;
  const x0 = al === "center" ? x - w / 2 : x; rr(x0, y - h / 2, w, h, h / 2, fundo); txt(s, x0 + w / 2, y + 2, tam, cor);
  return w;
}
function pop(k, x, y, f) { if (k <= 0) return; g.save(); g.globalAlpha = clamp(k * 1.6); g.translate(x, y); const s = back(k); g.scale(s, s); g.translate(-x, -y); f(); g.restore(); }
function carimbo(s, x, y, k, cor = VM, giro = -.12, tam = 92) {
  if (k <= 0) return; g.save(); g.translate(x, y); g.rotate(giro); const s2 = 1 + 1.4 * (1 - ease(k)); g.scale(s2, s2); g.globalAlpha = clamp(k * 2);
  g.font = `700 ${tam}px Oswald`; const w = g.measureText(s).width + 60, h = tam * 1.4;
  g.fillStyle = "rgba(26,8,56,.7)"; g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 18); g.fill();
  g.lineWidth = 10; g.strokeStyle = cor; g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 18); g.stroke(); txt(s, 0, 4, tam, cor); g.restore();
}
const painel = (x, y, w, h, borda = ROXO) => { rr(x, y, w, h, 34, "rgba(26,8,56,.86)"); g.lineWidth = 5; g.strokeStyle = borda; g.beginPath(); g.roundRect(x, y, w, h, 34); g.stroke(); };

// ---------- icones ----------
function relogio(x, y, r, horas, brilho = ROSA) {
  circ(x, y, r + 20, "rgba(255,45,120,.18)"); circ(x, y, r, "#f4f1ea"); circ(x, y, r - 14, "#ffffff");
  g.strokeStyle = "#1a0838"; for (let i = 0; i < 60; i++) { const a = i / 60 * 6.2832, l = i % 5 ? 14 : 34; g.lineWidth = i % 5 ? 3 : 8; g.beginPath(); g.moveTo(x + Math.sin(a) * (r - 22), y - Math.cos(a) * (r - 22)); g.lineTo(x + Math.sin(a) * (r - 22 - l), y - Math.cos(a) * (r - 22 - l)); g.stroke(); }
  const ah = (horas % 12) / 12 * 6.2832, am = (horas % 1) * 6.2832;
  g.lineCap = "round"; g.strokeStyle = "#1a0838"; g.lineWidth = r * .07; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.sin(ah) * r * .5, y - Math.cos(ah) * r * .5); g.stroke();
  g.lineWidth = r * .045; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.sin(am) * r * .74, y - Math.cos(am) * r * .74); g.stroke();
  circ(x, y, r * .07, brilho);
}
function check(x, y, r, cor = VERDE) { circ(x, y, r, cor); g.strokeStyle = "#0b3a22"; g.lineWidth = r * .22; g.lineCap = "round"; g.lineJoin = "round"; g.beginPath(); g.moveTo(x - r * .45, y); g.lineTo(x - r * .1, y + r * .36); g.lineTo(x + r * .5, y - r * .34); g.stroke(); }
function xis(x, y, r, cor = VM) { circ(x, y, r, cor); g.strokeStyle = "#fff"; g.lineWidth = r * .22; g.lineCap = "round"; g.beginPath(); g.moveTo(x - r * .4, y - r * .4); g.lineTo(x + r * .4, y + r * .4); g.moveTo(x + r * .4, y - r * .4); g.lineTo(x - r * .4, y + r * .4); g.stroke(); }
function silhueta(x, y, s, cor) { g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = cor; g.beginPath(); g.arc(0, -70, 52, 0, 6.2832); g.fill(); g.beginPath(); g.moveTo(-120, 110); g.quadraticCurveTo(-120, -10, 0, -10); g.quadraticCurveTo(120, -10, 120, 110); g.closePath(); g.fill(); g.restore(); }
function raio(x, y, s, cor) { g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = cor; g.beginPath(); g.moveTo(14, -90); g.lineTo(-52, 12); g.lineTo(-8, 12); g.lineTo(-24, 90); g.lineTo(54, -22); g.lineTo(8, -22); g.closePath(); g.fill(); g.restore(); }
function ondas(x, y, t, cor) { circ(x, y, 18, cor); g.strokeStyle = cor; g.lineWidth = 9; g.lineCap = "round"; for (let i = 1; i <= 3; i++) { g.globalAlpha = .35 + .65 * (((t * 1.5) + i * .33) % 1 < .5 ? 1 : .5); g.beginPath(); g.arc(x, y, 18 + i * 28, -.9, .9); g.stroke(); g.beginPath(); g.arc(x, y, 18 + i * 28, Math.PI - .9, Math.PI + .9); g.stroke(); } g.globalAlpha = 1; }
function gatilho(x, y, cor, pres) { g.save(); g.translate(x, y); rr(-70, -80, 140, 170, 30, "#2b1856"); rr(-52, -64 + pres * 22, 104, 90 - pres * 22, 22, cor); rr(-40, 40, 80, 14, 7, "rgba(255,255,255,.35)"); g.restore(); }
function dig(x, y, d, cor) { return d; }

// ---------- fundo Vice City ----------
function fundo(t) {
  const gr = g.createLinearGradient(0, 0, 0, 1280); gr.addColorStop(0, "#12042e"); gr.addColorStop(.55, "#3b0f6e"); gr.addColorStop(.9, "#c2236f"); gr.addColorStop(1, "#ff6a3d");
  g.fillStyle = gr; g.fillRect(0, 0, W, 1280);
  // sol com listras
  const sy = 1010 + Math.sin(t * .6) * 6; g.save(); g.beginPath(); g.arc(W / 2, sy, 330, 0, 6.2832); g.clip();
  const sg = g.createLinearGradient(0, sy - 330, 0, sy + 330); sg.addColorStop(0, "#ffd23a"); sg.addColorStop(.55, "#ff6a3d"); sg.addColorStop(1, "#ff2d78"); g.fillStyle = sg; g.fillRect(0, sy - 330, W, 660);
  g.fillStyle = "#3b0f6e"; for (let i = 0; i < 7; i++) { const yy = sy + 20 + i * 44, hh = 5 + i * 3.5; g.globalAlpha = .9; g.fillRect(0, yy + ((t * 10) % 44) * 0, W, hh); } g.globalAlpha = 1; g.restore();
  // palmeiras (silhueta) nas laterais
  const palma = (x, base, alt, inc) => { g.save(); g.translate(x, base); g.rotate(inc); g.fillStyle = "#12042e"; g.beginPath(); g.moveTo(-9, 0); g.lineTo(-5, -alt); g.lineTo(5, -alt); g.lineTo(9, 0); g.fill(); g.strokeStyle = "#12042e"; g.lineWidth = 9; g.lineCap = "round";
    for (let i = 0; i < 7; i++) { const a = -Math.PI * .95 + i * (Math.PI * .9 / 6) - Math.PI * .02; g.beginPath(); g.moveTo(0, -alt); g.quadraticCurveTo(Math.cos(a) * 80, -alt + Math.sin(a) * 90 - 20, Math.cos(a) * 150, -alt + Math.sin(a) * 40 + 70); g.stroke(); } g.restore(); };
  palma(70, 1290, 470, .05); palma(160, 1290, 330, -.03); palma(1010, 1290, 520, -.05); palma(925, 1290, 360, .04);
  // chao em grade
  const ch = g.createLinearGradient(0, 1280, 0, H); ch.addColorStop(0, "#2a0a52"); ch.addColorStop(1, "#0e0224"); g.fillStyle = ch; g.fillRect(0, 1280, W, H - 1280);
  g.strokeStyle = "rgba(31,182,255,.55)"; g.lineWidth = 3;
  for (let i = -12; i <= 12; i++) { g.beginPath(); g.moveTo(W / 2 + i * 22, 1280); g.lineTo(W / 2 + i * 190, H); g.stroke(); }
  const off = (t * .9) % 1; for (let i = 0; i < 9; i++) { const k = (i + off) / 9, y = 1280 + Math.pow(k, 2.2) * (H - 1280); g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.fillStyle = ROSA; g.globalAlpha = .9; g.fillRect(0, 1278, W, 5); g.globalAlpha = 1;
  const v = g.createRadialGradient(W / 2, H * .45, H * .25, W / 2, H * .5, H * .85); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.5)"); g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// ---------- cenas ----------
const CENA = [
  null,
  (t) => { // 1: gancho com contador
    const t0 = CENAS[0].ini, k = ease((t - t0) / 2.8);
    const tot = Math.round(86399 * (1 - k)); const hh = String(Math.floor(tot / 3600)).padStart(2, "0"), mm = String(Math.floor(tot % 3600 / 60)).padStart(2, "0"), ss = String(tot % 60).padStart(2, "0");
    const pulso = k >= 1 ? 1 + Math.sin((t - t0 - 2.8) * 9) * .03 : 1;
    pop(ap(t, t0 + .05), W / 2, 420, () => pilula("FALTA POUCO", W / 2, 420, 54, ROSA, BR));
    pop(ap(t, CENAS[0].ini + .1), W / 2, 590, () => txt("GTA 6", W / 2, 590, 230, BR, { contorno: 14, sombra: true }));
    g.save(); g.translate(W / 2, 900); g.scale(pulso, pulso);
    rr(-450, -150, 900, 300, 40, "rgba(18,4,46,.88)"); g.lineWidth = 6; g.strokeStyle = AZUL; g.beginPath(); g.roundRect(-450, -150, 900, 300, 40); g.stroke();
    g.shadowColor = AZUL; g.shadowBlur = 36; txt(`${hh}:${mm}:${ss}`, 0, 6, 210, k >= 1 ? ROSA : BR, { fonte: "Oswald", peso: 700 }); g.shadowBlur = 0; g.restore();
    txt("HORAS  MIN  SEG", W / 2, 1090, 36, CINZA, { peso: 500 });
    pop(ap(t, P(1, "ninguem") - .1), W / 2, 1200, () => pilula("QUASE NINGUÉM TÁ FALANDO", W / 2, 1200, 56, AM));
  },
  (t) => { // 2: horario
    const t0 = P(2, "meianoite") - .2, k = ease((t - t0) / 1.6);
    pop(ap(t, CENAS[1].ini + .1), W / 2, 330, () => pilula("HORÁRIO NO BRASIL", W / 2, 330, 54, AZUL, "#06243a"));
    pop(ap(t, CENAS[1].ini + .15), W / 2, 640, () => relogio(W / 2, 640, 230, 11.8 + .2 * k));
    pop(ap(t, P(2, "dezenove") - .15), W / 2, 960, () => { txt("19/11", W / 2, 940, 190, AM, { contorno: 12, sombra: true }); });
    pop(ap(t, P(2, "dezenove") + .2), W / 2, 1070, () => pilula("0H · HORÁRIO DE BRASÍLIA", W / 2, 1075, 46, ROSA, BR));
    const kv = ap(t, P(2, "virada") - .1);
    pop(ap(t, P(2, "quarta") - .15), 310, 1200, () => pilula("QUARTA 18", 310, 1200, 52, "#3a2468", BR));
    if (kv > 0) { g.globalAlpha = kv; g.strokeStyle = BR; g.lineWidth = 10; g.lineCap = "round"; g.beginPath(); g.moveTo(480, 1200); g.lineTo(600, 1200); g.moveTo(570, 1172); g.lineTo(602, 1200); g.lineTo(570, 1228); g.stroke(); g.globalAlpha = 1; }
    pop(ap(t, P(2, "quinta") - .15), 790, 1200, () => pilula("QUINTA 19", 790, 1200, 52, AM));
  },
  (t) => { // 3: pre-load
    const kb = ease((t - (P(3, "com") - .1)) / 1.7);
    pop(ap(t, CENAS[2].ini + .1), W / 2, 380, () => { pilula("PRÉ-LOAD LIBERADO", W / 2 - 40, 380, 58, VERDE, "#06301c"); });
    pop(ap(t, P(3, "liberado") - .2), 830, 380, () => check(850, 380, 40));
    if (ap(t, CENAS[2].ini + .25) > 0) { g.globalAlpha = ap(t, CENAS[2].ini + .25); } painel(90, 520, 900, 220, AZUL);
    rr(130, 600, 820, 70, 35, "#2b1856"); const gb = g.createLinearGradient(130, 0, 950, 0); gb.addColorStop(0, AZUL); gb.addColorStop(1, ROSA);
    if (kb > 0) rr(130, 600, Math.max(70, 820 * kb), 70, 35, gb);
    txt(Math.round(212 * kb) + " GB", W / 2, 560, 60, BR, { contorno: 6 }); g.globalAlpha = 1;
    pop(ap(t, P(3, "duzentos") - .2), W / 2, 960, () => { txt("ATÉ", W / 2, 840, 70, CINZA, { contorno: 6 }); txt("212 GB", W / 2, 990, 250, AM, { contorno: 14, sombra: true }); });
    pop(ap(t, P(3, "confere") - .1), W / 2, 1210, () => pilula("CONFERE O ESPAÇO NO CONSOLE", W / 2, 1210, 52, ROSA, BR));
  },
  (t) => { // 4: plataformas
    pop(ap(t, CENAS[3].ini + .05), W / 2, 330, () => pilula("PLATAFORMAS", W / 2, 330, 54, ROXO, BR));
    const card = (y, nome, sub, borda) => { painel(110, y, 860, 220, borda); txt(nome, 190, y + 90, 96, BR, { al: "left", contorno: 6 }); txt(sub, 190, y + 168, 42, CINZA, { al: "left", peso: 500 }); };
    pop(ap(t, P(4, "PlayStation") - .1), W / 2, 530, () => { card(430, "PS5", "PLAYSTATION 5", AZUL); check(880, 540, 52); });
    pop(ap(t, P(4, "Xbox") - .1), W / 2, 790, () => { card(690, "XBOX", "SERIES X | S", VERDE); check(880, 800, 52); });
    pop(ap(t, P(4, "PC") - .1), W / 2, 1050, () => { card(950, "PC", "SEM ANÚNCIO DA ROCKSTAR", VM); xis(880, 1060, 52); });
    carimbo("SEM DATA", W / 2 + 120, 1340, ap(t, P(4, "anunciou") - .1, .35), VM, -.1, 80);
  },
  (t) => { // 5: preco
    pop(ap(t, CENAS[4].ini + .05), W / 2, 330, () => pilula("PREÇO NO BRASIL", W / 2, 330, 54, AZUL, "#06243a"));
    const cartao = (y, nome, valor, t0, cor) => { const k = ease((t - t0) / .9); painel(110, y, 860, 330, cor); txt(nome, W / 2, y + 70, 64, cor, { contorno: 6 }); const v = (valor * k).toFixed(2).replace(".", ","); txt("R$ " + v, W / 2, y + 200, 150, BR, { contorno: 10, sombra: true }); };
    pop(ap(t, CENAS[4].ini + .15), W / 2, 600, () => cartao(440, "STANDARD", 449.9, P(5, "Standard"), AM));
    pop(ap(t, P(5, "Ultimate") - .2), W / 2, 1050, () => cartao(880, "ULTIMATE", 549.9, P(5, "Ultimate"), ROSA));
    pop(ap(t, P(5, "Ultimate") + .6), W / 2, 1290, () => pilula("+ R$ 100", W / 2, 1290, 48, "#3a2468", BR));
  },
  (t) => { // 6: opiniao
    pop(ap(t, CENAS[5].ini + .05), W / 2, 330, () => pilula("NOSSA OPINIÃO", W / 2, 330, 58, AM));
    pop(ap(t, P(6, "preco") - .3), W / 2, 700, () => { painel(100, 450, 880, 460, ROSA); txt("COM ESSE PREÇO,", W / 2, 540, 74, BR, { contorno: 6 }); txt("VALE ESPERAR", W / 2, 660, 112, AM, { contorno: 8 }); txt("AS PRIMEIRAS ANÁLISES", W / 2, 790, 62, BR, { contorno: 6 }); });
    pop(ap(t, P(6, "analises") - .1), W / 2, 1100, () => { for (let i = 0; i < 5; i++) { g.save(); g.translate(250 + i * 145, 1100); g.rotate(Math.sin(t * 3 + i) * .08); g.fillStyle = i < 4 ? AM : "#4a3278"; g.beginPath(); for (let j = 0; j < 10; j++) { const r = j % 2 ? 26 : 62, a = -Math.PI / 2 + j * Math.PI / 5; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); g.fill(); g.restore(); } });
    pop(ap(t, P(6, "comprar") - .1), W / 2, 1230, () => txt("ANTES DE COMPRAR", W / 2, 1230, 60, BR, { contorno: 8 }));
  },
  (t) => { // 7: Lucia e Jason em Leonida
    pop(ap(t, CENAS[6].ini + .1), W / 2, 330, () => pilula("OS PERSONAGENS", W / 2, 330, 54, ROXO, BR));
    pop(ap(t, P(7, "Lucia") - .3), 300, 640, () => { painel(100, 380, 400, 560, ROSA); silhueta(300, 700, 1.7, ROSA); txt("LUCIA", 300, 880, 64, BR, { contorno: 6 }); });
    pop(ap(t, P(7, "Jason") - .3), 780, 640, () => { painel(580, 380, 400, 560, AZUL); silhueta(780, 700, 1.7, AZUL); txt("JASON", 780, 880, 64, BR, { contorno: 6 }); });
    pop(ap(t, P(7, "Leonida") - .2), W / 2, 1090, () => { painel(100, 990, 880, 150, AM); circ(200, 1058, 30, ROSA); g.fillStyle = ROSA; g.beginPath(); g.moveTo(172, 1074); g.lineTo(228, 1074); g.lineTo(200, 1112); g.fill(); circ(200, 1058, 11, ESC); txt("ESTADO DE LEONIDA", 630, 1066, 66, AM, { contorno: 6 }); });
    pop(ap(t, P(7, "Vice") - .2), W / 2, 1250, () => pilula("ONDE FICA VICE CITY", W / 2, 1250, 56, ROSA, BR));
  },
  (t) => { // 8: PS5
    pop(ap(t, CENAS[7].ini + .05), W / 2, 330, () => pilula("NO PS5 · SONY PROMETE", W / 2, 330, 54, AZUL, "#06243a"));
    const lin = (y, titulo, sub) => { painel(100, y, 880, 250, ROXO); txt(titulo, 600, y + 95, 66, BR, { contorno: 6 }); txt(sub, 600, y + 175, 44, AM, { peso: 500 }); };
    pop(ap(t, P(8, "gatilho") - .2), W / 2, 560, () => { lin(430, "GATILHO", "ADAPTATIVO"); gatilho(220, 555, ROSA, (Math.sin(t * 5) + 1) / 2); });
    pop(ap(t, P(8, "som") - .2), W / 2, 850, () => { lin(720, "SOM EM 3D", "ÁUDIO IMERSIVO"); ondas(190, 845, t, AZUL); });
    pop(ap(t, P(8, "carregamento") - .2), W / 2, 1140, () => { lin(1010, "CARREGAMENTO", "QUASE INSTANTÂNEO"); raio(220, 1135, 1.1, AM); });
  },
  (t) => { // 9: live
    pop(ap(t, CENAS[8].ini + .05), W / 2, 330, () => { const b = (Math.sin(t * 6) + 1) / 2; circ(250, 330, 20 + b * 4, VM); pilula("AO VIVO NO YOUTUBE", W / 2 + 30, 330, 54, VM, BR); });
    pop(ap(t, P(9, "vinte") - .2), W / 2, 700, () => { txt("24", W / 2 - 120, 700, 330, AM, { contorno: 16, sombra: true }); txt("HORAS", W / 2 + 230, 740, 100, BR, { contorno: 10 }); });
    pop(ap(t, P(9, "live") - .1), W / 2, 960, () => { rr(W / 2 - 100, 920, 200, 140, 38, VM); g.fillStyle = "#fff"; g.beginPath(); g.moveTo(W / 2 - 22, 960); g.lineTo(W / 2 + 40, 990); g.lineTo(W / 2 - 22, 1020); g.fill(); });
    const kc = ap(t, P(9, "trinta") - .5, 1.2);
    for (let i = 0; i < 30; i++) { const col = i % 10, lin = Math.floor(i / 10), d = clamp(kc * 1.4 - i / 40); if (d > 0) { g.save(); g.globalAlpha = clamp(d * 3); circ(165 + col * 83, 1150 + lin * 80, 29 * back(d), [ROSA, AZUL, AM, ROXO][i % 4]); g.restore(); } }
    pop(ap(t, P(9, "criadores") - .2), W / 2, 1400, () => pilula("MAIS DE 30 CRIADORES", W / 2, 1400, 52, BR, ESC));
  },
  (t) => { // 10: NBA 2K
    pop(ap(t, CENAS[9].ini + .05), W / 2, 330, () => pilula("PISTA NO NBA 2K27", W / 2, 330, 54, ROXO, BR));
    pop(ap(t, P(10, "crossover") - .5), W / 2, 760, () => { rr(W / 2 - 200, 440, 400, 620, 36, "#2b1856"); rr(W / 2 - 160, 490, 320, 280, 18, "#0b0220"); txt("2K27", W / 2, 580, 120, AZUL, { contorno: 4 }); txt("×", W / 2, 690, 100, ROSA); txt("?", W / 2, 740, 100, AM);
      for (let i = 0; i < 3; i++) circ(W / 2 - 80 + i * 80, 880, 28, [ROSA, AZUL, AM][i]); rr(W / 2 - 120, 960, 240, 40, 10, "#12042e"); });
    carimbo("NÃO CONFIRMADO", W / 2, 1200, ap(t, P(10, "confirmacao") - .15, .35), VM, -.1, 84);
  },
  (t) => { // 11: CTA
    const b = Math.sin(t * 6) * 16;
    pop(ap(t, CENAS[10].ini + .02), W / 2, 520, () => txt("SEGUE", W / 2, 520, 220, BR, { contorno: 14, sombra: true }));
    pop(ap(t, P(11, "Sabendo") - .15), W / 2, 740, () => { g.shadowColor = ROSA; g.shadowBlur = 40; txt(NOME, W / 2, 740, 140, BR, { contorno: 12 }); g.shadowBlur = 0; });
    pop(ap(t, P(11, "virada") - .1), W / 2, 960, () => pilula("NA VIRADA TEM", W / 2, 960, 54, AM));
    pop(ap(t, P(11, "melhores") - .15), W / 2, 1090, () => { txt("OS MELHORES MOMENTOS", W / 2, 1090, 76, BR, { contorno: 8 }); txt("DO LANÇAMENTO", W / 2, 1180, 76, AM, { contorno: 8 }); });
    g.fillStyle = AM; g.beginPath(); g.moveTo(W / 2 - 55, 1290 + b); g.lineTo(W / 2 + 55, 1290 + b); g.lineTo(W / 2, 1360 + b); g.fill();
  },
];

// legenda: grupos de 3 palavras, palavra falada em amarelo (numeros em digito)
const DISP = { seis: "6", cinco: "5", dois: "2" };
const GRUPOS = []; for (const cn of CENAS) for (let i = 0; i < cn.palavras.length; i += 3) GRUPOS.push({ ws: cn.palavras.slice(i, i + 3), fim: (cn.palavras[i + 3] || { t: cn.fim + .15 }).t });
function legenda(t) {
  const gr = GRUPOS.find((x) => t >= x.ws[0].t && t < x.fim); if (!gr) return;
  const ws = gr.ws.map((p) => (DISP[norm(p.w)] || p.w).toUpperCase().replace(/[.,!?;:]+$/, "")); let tam = 76; g.font = `900 ${tam}px Nunito`; let lw = ws.map((w) => g.measureText(w).width), esp = 22;
  const larg = () => lw.reduce((a, b) => a + b, 0) + esp * (ws.length - 1); if (larg() > 940) { tam = Math.floor(tam * 940 / larg()); g.font = `900 ${tam}px Nunito`; lw = ws.map((w) => g.measureText(w).width); esp = 18; }
  const tot = larg(); let x = W / 2 - tot / 2;
  const k = ease((t - gr.ws[0].t) / .12), y = 1560 + (1 - k) * 20;
  ws.forEach((w, i) => { const ativa = t >= gr.ws[i].t && (i === ws.length - 1 || t < gr.ws[i + 1].t);
    g.textAlign = "left"; g.textBaseline = "middle"; g.lineWidth = 12; g.lineJoin = "round"; g.strokeStyle = "#000"; g.globalAlpha = k; g.strokeText(w, x, y); g.fillStyle = ativa ? AM : BR; g.fillText(w, x, y); g.globalAlpha = 1; x += lw[i] + esp; });
}

function moldura(t) {
  rr(0, 92, W, 190, 0, "rgba(18,4,46,.55)");
  pilula(NOME, 70, 170, 46, ROSA, BR, "left");
  const pk = (Math.sin(t * 5) + 1) / 2; circ(520, 172, 11 + pk * 3, VM); txt("PLANTÃO", 548, 172, 44, BR, { al: "left" });
  txt("17/11", 1010, 172, 36, AM, { al: "right" });
  rr(70, 230, 940, 9, 4, "rgba(255,255,255,.18)"); const gb = g.createLinearGradient(70, 0, 1010, 0); gb.addColorStop(0, ROSA); gb.addColorStop(.5, ROXO); gb.addColorStop(1, AZUL);
  rr(70, 230, Math.max(9, 940 * clamp(t / T.total)), 9, 4, gb);
  txt(ARROBA, W / 2, 1810, 40, "rgba(255,255,255,.85)", { peso: 500 });
}

window.renderFrame = (t) => {
  fundo(t);
  let c = 1; for (let i = 0; i < CENAS.length; i++) if (t >= CENAS[i].ini - .1) c = i + 1;
  const k = ease((t - (CENAS[c - 1].ini - .1)) / .3);
  g.save(); g.globalAlpha = c === 1 ? 1 : k; g.translate(0, (1 - k) * 40 * (c === 1 ? 0 : 1)); CENA[c](t, c); g.restore();
  moldura(t); legenda(t);
};
await document.fonts.load("700 40px Oswald"); await document.fonts.load("500 40px Oswald"); await document.fonts.load("900 40px Nunito"); await document.fonts.ready;
window.renderFrame(0); window.pronto = true;
</script>
