function ceuNoite(t) { const gr = g.createLinearGradient(0, 0, 0, 1100); gr.addColorStop(0, "#070a18"); gr.addColorStop(1, "#1a2038"); g.fillStyle = gr; g.fillRect(0, 0, W, H); for (let i = 0; i < 60; i++) circ((i * 137) % W, (i * 71) % 700, 2, `rgba(255,255,255,${.3 + .3 * Math.sin(t * 2 + i)})`); }

  for (let r = 0; r < 4; r++) { rect(520, 560 + r * 200, 540, 18, luz ? "#8a8478" : "#1e1f26"); for (let c = 0; c < 9; c++) rr(530 + c * 58, 470 + r * 200, 48, 88, 4, luz ? ["#d6453a", "#e0a83a", "#3a8ad6", "#4fae5a", "#a85ad6"][(r + c) % 5] : "#191a22"); }

  rr(x - 24, y - 24, w + 48, h + 48, 18, "#18191e"); rect(x, y, w, h, "#05070a"); if (liga <= 0) return;

  g.globalCompositeOperation = "saturation"; g.fillStyle = "#808080"; g.fillRect(x, y, w, h); g.globalCompositeOperation = "multiply"; g.fillStyle = "#9fe0b0"; g.fillRect(x, y, w, h); g.globalCompositeOperation = "source-over";
  for (let i = 0; i < h; i += 6) rect(x, y + i, w, 2, "rgba(0,0,0,.18)"); g.restore(); g.globalAlpha = 1;

function camCena(n, t) { // o que cada câmera mostra (desenhado em 1080x1920 e encolhido)
  ceuNoite(t); chaoPosto(1200); cobertura(t, 1);
  if (n === 1) { bomba(380, 1350, 1, 1.3); for (let i = 0; i < 3; i++) zumbi(200 + i * 300 + Math.sin(t + i) * 60, 1700, 1.5, t, i); }
  if (n === 2) { lojaFachada(540, 1500, 1.3, 1); for (let i = 0; i < 5; i++) zumbi(150 + i * 200, 1800, 1.3, t, i); }
  if (n === 3) { bomba(300, 1300, 3, 1.3); K.carro(640, 1250, "#7a7a80", 1.5); g.fillStyle = "rgba(0,0,0,.75)"; g.fillRect(300, 1250, 680, 90); circ(560, 1290, 40, "#d9a47c"); g.fillStyle = "#2a1a10"; g.beginPath(); g.arc(560, 1280, 41, Math.PI, 0); g.fill(); for (const ex of [-15, 15]) { circ(560 + ex, 1290, 8, "#fff"); circ(560 + ex, 1291, 4, "#111"); } rr(610, 1300, 90, 22, 10, "#d9a47c"); zumbi(150 + Math.sin(t * .7) * 40, 1800, 1.3, t, 2); }

function palavraGrande(s, t, a0, y = 420, cor = "#ffd23a") { if (t < a0) return; const k = clamp((t - a0) / .18, 0, 1), sc = .6 + .4 * ease(k) + .06 * Math.sin(Math.min(1, (t - a0) / .35) * Math.PI);

  g.lineWidth = 34; g.strokeStyle = "#2a1a08"; g.strokeText(s, 0, 14); g.fillStyle = "#2a1a08"; g.fillText(s, 0, 14); g.lineWidth = 22; g.strokeStyle = "#3a2410"; g.strokeText(s, 0, 0); g.fillStyle = cor; g.fillText(s, 0, 0); g.restore(); }
function chip(s, x, y, a = 1) { if (a <= 0) return; g.save(); TELA(); x = SW / 2; y = 70; g.globalAlpha = a; g.font = "800 34px Nunito"; const w = g.measureText(s).width + 70; rr(x - w / 2, y - 30, w, 60, 30, "#fff"); circ(x - w / 2 + 28, y, 8, "#e23a2a"); txt(s, x + 12, y + 1, 34, "#1d2129", 800, "center", "Nunito"); g.restore(); }

  g.save(); TELA(); g.translate(SW / 2, SH - 150); g.scale(.85 + .15 * k, .85 + .15 * k); g.font = "900 92px Nunito"; g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round"; g.lineWidth = 18; g.strokeStyle = "rgba(0,0,0,.9)"; const s = w.charAt(0).toUpperCase() + w.slice(1); g.strokeText(s, 0, 0); g.fillStyle = DESTAQUE[norm(w)] || "#fff"; g.fillText(s, 0, 0); g.restore(); }

  g.save(); g.translate(x, y); g.scale(s, s); const w = 40 * abre;
  if (w > 1) { g.fillStyle = "#b8322a"; g.fillRect(-w, -352, 2 * w, 182); g.fillStyle = "rgba(0,0,0,.3)"; g.fillRect(-w - 5, -352, 7, 182); g.fillRect(w - 2, -352, 7, 182); }

  g.restore(); }

function exterior(t, falante = 0) { ceuNoite(t); chaoPosto(1200); cobertura(t, 0); lojaFachada(170, 1300, .55, 0); bomba(820, 1380, 3, .75); K.carro(560, 1440, "#7a7a80", .9); altoFalante(1010, 1330, .8, falante, t); g.fillStyle = "rgba(10,14,30,.25)"; g.fillRect(0, 0, W, H); }

  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); ceuNoite(t); rect(x, y + h * .72, w, h, "#22242a");
